<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AXF CONTROL · 운영 관리</title>
<!-- 외부 리소스를 쓰지 않는다. Pretendard 가 기기에 있으면 쓰고, 없으면 맑은 고딕으로 떨어진다.
     이 파일은 public 저장소에 올라간다. 관리코드·백엔드 비밀값을 절대 적지 않는다. -->
<style>
/* v3.95 콘솔 톤 (사용자 지정 260919 · 총무전용공간 관리자맵 레퍼런스)
   연회색 바탕 + 흰 카드(12px · 옅은 테두리) · 주 색은 네이비 하나(활성 탭 · 주 버튼 · 제목)
   상태색은 채도를 낮춘 초록 · 앰버 · 적갈 · 현대해상 오렌지는 주의 배지에만 쓴다.
   참가자 앱의 「파랑 금지」(design.md)는 앱 셸 규칙이다. 운영 콘솔은 이 레퍼런스를 따른다.
   글자는 6단계만 쓴다: 28 숫자 · 22 페이지 제목 · 16 카드 제목 · 14 본문 · 13 보조 · 12 캡션 */
:root{
  --bg:#F2F4F7; --sf:#FFFFFF; --soft:#F9FAFB;
  --line:#E5E7EB; --line2:#EFF0F3; --line3:#D1D5DB;
  --tx:#14171F; --tx2:#4B5060; --tx3:#80848F;
  --navy:#00205B; --navy8:#0D2461; --navy1:#DFE3EF; --navy05:#EEF0F7;
  --ok:#1E7B4F; --ok-bg:#EAF5EF; --ok-bd:#CFE6D9;
  --warn:#8A5A12; --warn-bg:#FFF6E3; --warn-bd:#F3DFB3;
  --bad:#A63A34; --bad-bg:#FBF0EF; --bad-bd:#EFD3D0;
  --brand:#FF7E31;
  --fs-kpi:28px; --fs-h1:22px; --fs-h2:16px; --fs-b:14px; --fs-s:13px; --fs-c:12px;
  --r:12px; --r-s:8px;
  --sh-lg:0 12px 28px rgba(8,24,74,.14),0 4px 8px rgba(8,24,74,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  font-size:var(--fs-b);line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.n,td.n,.num{font-variant-numeric:tabular-nums}
b,strong{font-weight:700}

/* ── 상단바 · 가로 탭 한 줄 · 활성 탭은 네이비로 채운다 ── */
header.top{position:sticky;top:0;z-index:30;height:60px;background:var(--sf);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 24px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;flex-shrink:0}
.brand b{font-size:var(--fs-h2);font-weight:800;color:var(--navy);letter-spacing:.01em}
.brand span{font-size:var(--fs-c);color:var(--tx3);font-weight:600}
nav.tabs{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{padding:7px 12px;border-radius:var(--r-s);font-weight:600;color:var(--tx3);white-space:nowrap;flex-shrink:0}
nav.tabs button:hover{background:var(--bg);color:var(--tx)}
nav.tabs button.on{background:var(--navy);color:#fff}
.tbadge{display:inline-block;margin-left:6px;min-width:18px;padding:0 6px;border-radius:99px;background:var(--brand);color:#fff;
  font-size:var(--fs-c);font-weight:800;font-style:normal;line-height:18px;text-align:center}
nav.tabs button.on .tbadge{background:#fff;color:var(--navy)}
.hr{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;white-space:nowrap;font-size:var(--fs-s);color:var(--tx3)}
.hr b{color:var(--tx2)}
.role{font-size:var(--fs-c);font-weight:700;color:var(--navy);background:var(--navy05);border:1px solid var(--navy1);border-radius:99px;padding:2px 10px}

/* ── 버튼 · 주(네이비) · 보조(흰 테두리) · 위험(적갈) · 고스트 · sm ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r-s);
  font-weight:600;background:var(--sf);color:var(--tx2);border:1px solid var(--line3);white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--tx3);color:var(--tx)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy8);border-color:var(--navy8)}
.btn.danger{color:var(--bad);border-color:var(--bad-bd);background:var(--sf)}
.btn.danger:hover{background:var(--bad-bg);border-color:var(--bad)}
.btn.danger.fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--tx3)}
.btn.ghost:hover{background:var(--bg);color:var(--tx)}
.btn.sm{padding:5px 10px;font-size:var(--fs-s)}
.btn:disabled{opacity:.45;cursor:default}

/* ── 페이지 뼈대 · 제목 + 한 줄 설명 → 서브탭 칩 → 툴바 → 본문 ── */
main{padding:24px 24px 72px;max-width:1480px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:var(--fs-h1);font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.3}
.ph p{font-size:var(--fs-s);color:var(--tx3);margin-top:4px}
.ph .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fchip{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);
  background:var(--sf);font-size:var(--fs-s);font-weight:600;color:var(--tx2)}
.fchip:hover{border-color:var(--tx3);color:var(--tx)}
.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.fchip .cnt{font-size:var(--fs-c);font-weight:800;border-radius:99px;padding:0 7px;background:var(--navy05);color:var(--navy);font-variant-numeric:tabular-nums}
.fchip.on .cnt{background:rgba(255,255,255,.2);color:#fff}
.fchip.zero .cnt{background:var(--line2);color:var(--tx3)}
.fchip .sep{color:var(--tx3)}
.chips .arrow{align-self:center;color:var(--line3);font-size:var(--fs-s)}
.chips .gap{width:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .cnt{font-size:var(--fs-s);color:var(--tx3)}
.toolbar .cnt b{color:var(--tx)}
.toolbar .sp{flex:1}
.in{height:36px;padding:0 12px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--sf);min-width:220px;color:var(--tx)}
.in::placeholder{color:var(--tx3)}
.in:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy05)}
select.in{min-width:130px;padding-right:8px}
textarea.in{height:auto;min-height:72px;padding:9px 12px;resize:vertical;width:100%}
.in.sm{height:30px;min-width:0;padding:0 8px;font-size:var(--fs-s)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-c);font-weight:600;color:var(--tx2)}

/* ── 카드 ── */
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:16px}
.card:first-child{margin-top:0}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ch h2{font-size:var(--fs-h2);font-weight:700;color:var(--tx)}
.ch .sub{font-size:var(--fs-s);color:var(--tx3)}
.ch .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.grid{display:grid;gap:16px;margin-top:16px}
.grid>.card{margin-top:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g57{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
@media(max-width:1100px){.g2,.g3,.g57{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){header.top{height:auto;flex-wrap:wrap;padding:10px 16px;gap:8px}nav.tabs{order:3;width:100%}.hr{flex-wrap:wrap;margin-left:0}main{padding:16px 16px 60px}.ph .r{margin-left:0}.card .pp-sum{grid-template-columns:minmax(0,1fr)}.card .slots{grid-template-columns:minmax(0,1fr)}}

/* KPI 타일 · 큰 숫자 + 라벨 + 보조 한 줄 */
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi .l{font-size:var(--fs-s);color:var(--tx2);font-weight:600}
.kpi .v{font-size:var(--fs-kpi);font-weight:800;line-height:1.15;margin-top:6px;color:var(--tx);font-variant-numeric:tabular-nums}
.kpi .v em{font-style:normal;font-size:var(--fs-s);font-weight:600;color:var(--tx3);margin-left:4px}
.kpi .x{font-size:var(--fs-c);color:var(--tx3);margin-top:4px}
.kpi.link{cursor:pointer}.kpi.link:hover{border-color:var(--navy)}
.kpi .bar{margin-top:10px}

/* 막대 · 네이비 채움, 트랙은 옅은 네이비 */
.bar{height:8px;border-radius:99px;background:var(--navy05);overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:99px}
.bar.over i{background:var(--bad)}

/* 표 */
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-s)}
table.tb{width:100%;border-collapse:collapse;background:var(--sf)}
table.tb th{text-align:left;font-size:var(--fs-c);color:var(--tx3);font-weight:600;padding:9px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.tb td{padding:10px 12px;vertical-align:middle;border-bottom:1px solid var(--line2)}
table.tb tr:last-child td{border-bottom:0}
table.tb tbody tr:hover td,table.tb tr.hv:hover td{background:var(--soft)}
table.tb tr.click{cursor:pointer}
table.tb tr.sel td{background:var(--navy05)}
table.tb tr.flash td{animation:fl 1.2s ease-out}
@keyframes fl{from{background:#FFF6E3}to{background:transparent}}
table.tb.plain{border:0}
.tdr,th.tdr{text-align:right;white-space:nowrap}
.tdc{text-align:center}
td .who2{font-weight:700;color:var(--tx)}
td .who2 small,.who2 small{display:block;font-size:var(--fs-c);color:var(--tx3);font-weight:500}
.scrolly{max-height:460px;overflow:auto}
.ck{width:16px;height:16px;accent-color:var(--navy);cursor:pointer;vertical-align:middle}
td.ckc,th.ckc{width:40px;text-align:center;padding-left:14px;padding-right:0}
.acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:nowrap}
.bartb td{border:0;padding:6px 0}
.bartb td.l{width:190px;white-space:nowrap;padding-right:12px;font-size:var(--fs-s)}
.bartb td.v{width:88px;text-align:right;font-size:var(--fs-s);font-variant-numeric:tabular-nums;padding-left:12px}

/* 상태 배지 · 알약 */
.tag{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:var(--fs-c);font-weight:700;border-radius:99px;padding:2px 10px;
  color:var(--navy);background:var(--navy05);border:1px solid var(--navy1)}
.tag.pri{color:#fff;background:var(--navy);border-color:var(--navy)}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-bd)}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
.tag.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-bd)}
.tag.off{color:var(--tx3);background:var(--soft);border-color:var(--line)}
.tag.brand{color:#fff;background:var(--brand);border-color:var(--brand)}
.cap{font-size:var(--fs-c);color:var(--tx3)}
.src{font-size:var(--fs-c);color:var(--tx3)}
.muted{color:var(--tx2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.empty{padding:28px;text-align:center;font-size:var(--fs-s);color:var(--tx3);background:var(--soft);border:1px dashed var(--line3);border-radius:var(--r-s)}
.note{font-size:var(--fs-s);color:var(--tx2);background:var(--soft);border:1px solid var(--line2);border-radius:var(--r-s);padding:10px 12px}
.note.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
.note b{color:var(--tx)}

/* 운영 메모 · 긴 설명은 접어 둔다 */
details.memo{margin-top:16px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--soft)}
details.memo summary{cursor:pointer;list-style:none;padding:10px 14px;font-size:var(--fs-s);font-weight:700;color:var(--tx2);display:flex;align-items:center;gap:8px}
details.memo summary::-webkit-details-marker{display:none}
details.memo summary::before{content:"";width:6px;height:6px;border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);transform:rotate(-45deg);transition:transform .15s}
details.memo[open] summary::before{transform:rotate(45deg)}
details.memo .mb{padding:0 14px 12px 28px;font-size:var(--fs-s);color:var(--tx2);line-height:1.7}
details.memo .mb p+p{margin-top:6px}
details.memo .mb ol{padding-left:18px}

/* 흐름 (신청 → 승인 → 체크인 → 완료) */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .fs{flex:1;min-width:84px;padding:10px 12px;border:1px solid var(--line);background:var(--sf);cursor:pointer}
.flow .fs+.st{border-left:0}
.flow .fs:first-child{border-radius:var(--r-s) 0 0 var(--r-s)}
.flow .fs.last{border-radius:0 var(--r-s) var(--r-s) 0}
.flow .fs.end{border-radius:var(--r-s);margin-left:8px;border-left:1px solid var(--line);background:var(--soft)}
.flow .fs:hover{border-color:var(--navy)}
.flow .fs .l{font-size:var(--fs-c);color:var(--tx3);font-weight:600}
.flow .fs .v{font-size:var(--fs-h1);font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums;line-height:1.2}
.flow .fs.hot .v{color:var(--navy)}

/* 지금 처리할 일 */
.todo{display:flex;flex-direction:column}
.todo .it{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line2)}
.todo .it:first-child{border-top:0}
.todo .it .v{font-size:var(--fs-h1);font-weight:800;text-align:right;font-variant-numeric:tabular-nums;color:var(--navy)}
.todo .it.zero .v{color:var(--line3)}
.todo .it .t{font-weight:700}
.todo .it .d{font-size:var(--fs-c);color:var(--tx3)}
.todo .it.zero .t{color:var(--tx3);font-weight:600}

/* 개인 스탬프 패널 · 왼쪽 목록 · 오른쪽 8칸 */
.sp{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1000px){.sp{grid-template-columns:minmax(0,1fr)}.sp .lnb{position:static}.sp .lnb ul{max-height:260px}}
.lnb{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:12px;position:sticky;top:76px}
.lnb .in{width:100%;min-width:0}
.lnb .cap{padding:8px 4px 6px}
.lnb ul{list-style:none;max-height:calc(100vh - 230px);overflow:auto;display:flex;flex-direction:column;gap:2px}
.lnb li button{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);text-align:left}
.lnb li button:hover{background:var(--bg)}
.lnb li button.on{background:var(--navy);color:#fff}
.lnb li .nm{font-weight:700;font-size:var(--fs-s)}
.lnb li .em{font-size:var(--fs-c);color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnb li button.on .em{color:#C9D2EA}
.lnb li .c{margin-left:auto;font-size:var(--fs-c);font-weight:700;color:var(--tx3);font-variant-numeric:tabular-nums;flex-shrink:0}
.lnb li button.on .c{color:#fff}
.pp-h{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.pp-h .nm{font-size:var(--fs-h1);font-weight:800;color:var(--navy);line-height:1.2}
.pp-h .em{font-size:var(--fs-s);color:var(--tx3);margin-top:4px}
.pp-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.pp-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.pp-sum>div{border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px}
.pp-sum .l{font-size:var(--fs-c);color:var(--tx3);font-weight:600}
.pp-sum .v{font-size:var(--fs-h1);font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.pp-sum .v em{font-style:normal;font-size:var(--fs-s);color:var(--tx3);font-weight:600;margin-left:3px}
.pp-sum .x{font-size:var(--fs-c);color:var(--tx2);margin-top:2px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
@media(max-width:1280px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{border:1px solid var(--line);border-radius:var(--r-s);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:148px;background:var(--sf)}
.slot.got{border-color:var(--navy1);background:var(--navy05)}
.slot .no{font-size:var(--fs-c);font-weight:800;color:var(--tx3);font-variant-numeric:tabular-nums}
.slot.got .no{color:var(--navy)}
.slot .nm{font-weight:700}
.slot .via{font-size:var(--fs-c);color:var(--tx2);min-height:18px}
.slot .ft{margin-top:auto;display:flex;align-items:center;gap:8px}
.slot .ft .btn{margin-left:auto}
.stamps{display:flex;gap:3px;flex-wrap:nowrap}
.st{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;background:var(--sf);border:1px solid var(--line);color:var(--line3);font-variant-numeric:tabular-nums}
.st.got{background:var(--navy);border-color:var(--navy);color:#fff}
.st.old{background:var(--soft);color:var(--tx3);text-decoration:line-through}

/* 선택 일괄 처리 바 */
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;background:var(--navy05);border:1px solid var(--navy1);border-radius:var(--r-s)}
.bulk .c{font-size:var(--fs-s);color:var(--tx2);margin-right:auto}
.bulk .c b{color:var(--navy)}

/* 잠금 화면 */
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:80}
#lock .box{width:min(400px,90vw);background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:32px 28px;text-align:center}
#lock .box b{display:block;color:var(--navy);font-size:var(--fs-h1);font-weight:800}
#lock .box p{color:var(--tx2);margin:6px 0 18px;font-size:var(--fs-s)}
#lock input{width:100%;text-align:center;font-size:var(--fs-h2);letter-spacing:.2em;height:44px}
#lock .err{color:var(--bad);font-size:var(--fs-c);min-height:18px;margin-top:8px}

/* 확인 창 · 제목 · 설명 · 대상 · 영향 · 오른쪽 버튼 */
.overlay{position:fixed;inset:0;background:rgba(8,24,74,.42);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:72px 16px;overflow:auto}
.overlay.on{display:flex}
.ocard{background:var(--sf);border-radius:var(--r);width:min(500px,100%);padding:24px;box-shadow:var(--sh-lg)}
.ocard.wide{width:min(640px,100%)}
.ot{font-size:var(--fs-h2);font-weight:800;color:var(--navy);margin-bottom:6px}
.os{font-size:var(--fs-s);color:var(--tx2);line-height:1.65}
.os b{color:var(--tx)}
.who{margin-top:14px;padding:12px 14px;background:var(--soft);border:1px solid var(--line2);border-radius:var(--r-s);font-size:var(--fs-b);font-weight:700}
.who span{display:block;font-size:var(--fs-c);font-weight:500;color:var(--tx3);margin-top:2px}
.imp{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.imp div{display:flex;justify-content:space-between;gap:12px;padding:8px 14px;font-size:var(--fs-s);border-top:1px solid var(--line2)}
.imp div:first-child{border-top:0}
.imp div span{color:var(--tx3)}
.imp div b{font-variant-numeric:tabular-nums}
.imp div.chg b{color:var(--navy)}
.imp div.loss b{color:var(--bad)}
.oa{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.oa .btn{padding:9px 18px}
.guide{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.guide .gs{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;background:var(--soft);border:1px solid var(--line2);border-radius:var(--r-s)}
.guide .gn{flex-shrink:0;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--navy);color:#fff;font-size:var(--fs-c);font-weight:800}
.guide .gt{font-size:var(--fs-s);line-height:1.65;color:var(--tx2)}
.guide .gt b{color:var(--navy)}

/* 상세 패널 (오른쪽 서랍) */
#drwBg{position:fixed;inset:0;background:rgba(8,24,74,.18);z-index:50;display:none}
#drw{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--sf);border-left:1px solid var(--line);z-index:55;
  box-shadow:var(--sh-lg);transform:translateX(105%);transition:transform .18s ease-out;display:flex;flex-direction:column}
#drw.on{transform:none}
#drwBg.on{display:block}
#drw .dh{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
#drw .dh .nm{font-size:var(--fs-h1);font-weight:800;color:var(--navy);line-height:1.2}
#drw .dh .em{font-size:var(--fs-s);color:var(--tx3);margin-top:4px}
#drw .dh .x{margin-left:auto}
#drw .db{padding:18px 22px 28px;overflow:auto;flex:1}
#drw h3{font-size:var(--fs-s);font-weight:800;color:var(--tx2);margin:18px 0 8px}
#drw h3:first-child{margin-top:0}
.steps{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.steps span{font-size:var(--fs-c);font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--tx3);border:1px solid var(--line)}
.steps span.done{color:var(--navy);background:var(--navy05);border-color:var(--navy1)}
.steps span.cur{color:#fff;background:var(--navy);border-color:var(--navy)}
.steps i{font-style:normal;color:var(--line3)}
.hist{list-style:none;display:flex;flex-direction:column}
.hist li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line2);font-size:var(--fs-s)}
.hist li:first-child{border-top:0}
.hist li .t{color:var(--tx3);width:72px;flex-shrink:0;font-variant-numeric:tabular-nums}

/* 알림 · 되돌리기 버튼을 품는다 */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);background:var(--tx);color:#fff;
  padding:10px 12px 10px 18px;border-radius:var(--r-s);font-size:var(--fs-s);font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:90;display:flex;gap:14px;align-items:center;max-width:min(640px,92vw);box-shadow:var(--sh-lg)}
#toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{color:#FFD27A;font-weight:800;padding:4px 8px;border-radius:6px}
#toast button:hover{background:rgba(255,255,255,.12)}
#toast .tt{padding-right:6px}
.err-banner{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-bd);border-radius:var(--r-s);padding:10px 14px;font-size:var(--fs-s);margin-bottom:16px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--navy1);border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.drop{display:block;margin-top:12px;border:1.5px dashed var(--line3);border-radius:var(--r-s);padding:22px;text-align:center;cursor:pointer;background:var(--soft)}
.drop:hover{border-color:var(--navy)}
</style>

<body>

</div>
<script>
/* ══════════════════ 0. 설정 ══════════════════ */
/* 백엔드 URL 은 비밀이 아니다(앱 소스에도 있다). 관리코드는 파일에 두지 않는다. */
var BE = "https://script.google.com/macros/s/AKfycbwjCaSSUnQ7W1lrM8T426Cn_LgKs_UhI0Qi5XRVk-_eF-oD55-Wwjsot0DkPJCX9JqMBA/exec";

var TABS = [

  { id:"acct",  n:"계정", d:"로그인한 사람과 비밀번호 분실 요청을 처리합니다." },
  { id:"stamp", n:"스탬프", d:"사번이나 이름으로 한 사람을 골라 스탬프를 부여하거나 취소합니다." },
  { id:"apply", n:"신청", d:"상담 승인 · 커피챗 매칭 · 강의신청 · 사전 신청 명단을 처리합니다." },
  { id:"survey", n:"설문", d:"오늘 한 판 설문 집계입니다. 답은 이름 없이 저장되어 사람 단위 조회는 없습니다." },
  { id:"typing", n:"게임", d:"AX 올림픽 환산 기준 · 게임별 전원 기록 · 1F 현장 타자왕전과 닉네임을 관리합니다." },
  { id:"notice", n:"공지", d:"참가자 앱 LED 띠와 실시간 안내에 나가는 공지를 발송하고 중지합니다." },
  { id:"photo", n:"포토부스", d:"AI 포토부스 원격 대기열을 호출하고 완료 처리합니다." },
  { id:"art", n:"사생대회", d:"본선 공개 작품을 관리합니다. 좋아요 1인 3표이고 앱에는 작가가 나오지 않습니다." }
];
/* 앱 STAMPS 와 맞춘다 · v3.33 8칸(계단 st · 설문 sv 추가), v3.39 보상은 7개에서 끝. 번호는 콘솔 표 머리용 약칭일 뿐 앱에는 없다.
   폐기된 ID 는 옛 로그에 남아 있을 수 있어 표기만 한다(서버 stamp_people 는 old 로 따로 준다). */
var STAMP_META = {
  p1:{ no:"01", n:"1F 전시" }, p2:{ no:"02", n:"부스 체험" }, p3:{ no:"03", n:"프로그램 참여" },
  p4:{ no:"04", n:"미니게임" }, p5:{ no:"05", n:"아이디어" }, p7:{ no:"06", n:"QR 퀴즈" },

  p6:{ no:"", n:"포토부스", old:1 }, p8:{ no:"", n:"미니게임", old:1 }, p9:{ no:"", n:"계단(구)", old:1 }
};
var STAMP_ORDER = ["p1","p2","p3","p4","p5","p7","st","sv"];
/* v3.95 담당자 부여 = 현장 QR 3종 + 계단 · 담당자 취소 = 같은 4종 (서버 REVOKE_IDS 와 같게 둔다)
   앱 자동 3종(04·05·06)과 설문(08)은 앱 안의 행동이라 부여하지 않고, 취소하면 다시 받을 길이 없어 취소도 막는다. */
var GRANT_IDS = ["p1","p2","p3","st"];
var REVOKE_IDS = ["p1","p2","p3","st"];
/* 백엔드 SESS_META · SESS_CAP 과 같은 id */
var SESS_NAME = {
  /* v3.31b · 17F 오전은 자유 참석(옛 신청 기록 표시용) · 오후 파트너사 강연은 신청제(사전 신청 + 앱 신청) */
  key:"17F 기조연설 (자유 참석)", road:"17F 내부 강연 (자유 참석)", l1:"17F AWS 강연 (13:30)", l2:"17F MS 강연 (15:10)",
  fld:"세션 A · 영업·보상 현장", ta:"세션 B · 통계 현황 리포팅", tb:"세션 C · 외부자료 리서치", aws:"세션 D · 바이브 코딩 (AWS)", ms1:"세션 E · 1회차 13:30 (MS)", ms2:"세션 E · 2회차 15:00 (MS)",
  photo:"AI 포토부스", kring:"키링 DIY (260917 폐기)"
};
/* 상담 상태 · 시트 드롭다운과 같은 목록 */
var RESV_STATUS = ["신청","승인","체크인","완료","노쇼","취소"];
var CC_STATUS = ["대기","매칭","참석","완료","취소"];
/* v3.31b · 10F 실습형 세션은 사전 신청(앱 밖) · 신청 현황에서 제외 (출석은 앱 운영자 스캔 집계) */
var TEN_SESS = ["fld","ta","tb","aws","ms1","ms2"];
var PRE_SESS = ["l1","l2"];

/* ══════════════════ 1. 공통 ══════════════════ */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
/* onclick 안에 넣는 문자열 · 사번·ID 는 영숫자라 그 밖의 글자는 버린다 */
function jq(s){ return String(s==null?"":s).replace(/[^0-9A-Za-z_\-.:가-힣]/g,""); }
function el(id){ return document.getElementById(id); }
function key(){ try{ return sessionStorage.getItem("axf_adm_key")||""; }catch(e){ return window.__k||""; } }
function setKey(v){ try{ sessionStorage.setItem("axf_adm_key",v); }catch(e){ window.__k=v; } }
function normE(v){ return String(v==null?"":v).replace(/\s/g,"").toUpperCase().replace(/^0+(?=.)/,""); }
function nowHMS(){ var d=new Date(); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2); }
/* 알림 · o.undo 가 있으면 「되돌리기」 버튼을 몇 초 동안 띄운다 */
function toast(m,o){
  o=o||{}; var t=el("toast"), u=el("toastU");
  el("toastT").textContent=m; t.className="on";
  if(o.undo){ u.style.display=""; u.onclick=function(){ u.style.display="none"; t.className=""; o.undo(); }; } else { u.style.display="none"; u.onclick=null; }
  clearTimeout(t._t); t._t=setTimeout(function(){ t.className=""; u.style.display="none"; }, o.ms||(o.undo?7000:2400));
}
/* 확인 창. 브라우저 confirm() 과 달리 대상(이름·사번)을 크게 보여 주고, 처리 중에는 버튼을 잠근다.
   onOk 가 없으면 안내 전용(확인 버튼 하나). 배경 클릭·Esc 로 닫히되 처리 중에는 안 닫힌다.
   x = 대상 아래에 붙는 영향 표 · danger = 확인 버튼을 적갈로 */
var DLG={ onOk:null };
function dialog(o){
  DLG.onOk=o.onOk||null;
  el("dlgT").textContent=o.t||""; el("dlgS").innerHTML=o.s||"";
  el("dlgWho").innerHTML=o.who||""; el("dlgWho").style.display=o.who?"":"none";
  el("dlgX").innerHTML=o.x||"";
  el("dlgCard").className="ocard"+(o.wide?" wide":"");
  var ok=el("dlgOk"); ok.textContent=o.ok||"확인"; ok.disabled=false; ok.className="btn "+(o.danger?"danger fill":"pri");
  el("dlgCancel").style.display=o.onOk?"":"none";
  el("dlg").className="overlay on";
  setTimeout(function(){ ok.focus(); },30);
}
function dlgBusy(){ return el("dlgOk").disabled; }
function dlgClose(){ if(dlgBusy()) return; el("dlg").className="overlay"; DLG.onOk=null; }
function dlgForce(){ el("dlgOk").disabled=false; dlgClose(); }
function dlgGo(){
  if(!DLG.onOk){ dlgClose(); return; }
  var ok=el("dlgOk"); ok.disabled=true; ok.innerHTML='<span class="spin" style="border-color:rgba(255,255,255,.4);border-top-color:#fff"></span>처리 중';
  var fn=DLG.onOk; DLG.onOk=null; fn();
}
el("dlg").addEventListener("click",function(e){ if(e.target===el("dlg")) dlgClose(); });
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape") return;
  if(el("dlg").className.indexOf("on")>=0) dlgClose(); else if(ST.drw) drwClose();
});
function imp(rows){ return '<div class="imp">'+rows.map(function(r){ return '<div class="'+(r[2]||"")+'"><span>'+esc(r[0])+'</span><b>'+r[1]+'</b></div>'; }).join("")+'</div>'; }
function hhmm(s){ s=String(s||""); var m=s.match(/(\d{1,2}):(\d{2})/); return m?(("0"+m[1]).slice(-2)+":"+m[2]):s; }
function short(ts){ ts=String(ts||""); var m=ts.match(/(\d{2}):(\d{2}):?\d{0,2}$/); var d=ts.match(/(\d{2})-(\d{2}) /); return (d?d[1]+"/"+d[2]+" ":"")+(m?m[1]+":"+m[2]:ts); }
function pct(a,b){ return b>0?Math.min(100,Math.round(a/b*100)):0; }

/* 뼈대 조각 · 모든 메뉴가 같은 것을 쓴다 */
function ph(title, desc, right){ return '<div class="ph"><div><h1>'+esc(title)+'</h1>'+(desc?'<p>'+desc+'</p>':'')+'</div>'+(right?'<div class="r">'+right+'</div>':'')+'</div>'; }
function tabHead(right){ var t=TABS.filter(function(x){return x.id===ST.tab;})[0]||{}; return ph(t.n||"", esc(t.d||""), right); }
function chips(list, cur, fn){
  return '<div class="chips">'+list.map(function(c){
    if(c==="|") return '<span class="gap"></span>';
    if(c===">") return '<span class="arrow">›</span>';
    var has=c.c!=null;
    return '<button class="fchip'+(cur===c.v?" on":"")+(has&&!c.c?" zero":"")+'" onclick="'+fn+'(\''+jq(c.v)+'\')">'+esc(c.n)+(has?'<span class="cnt">'+c.c+'</span>':'')+'</button>';
  }).join("")+'</div>';
}
function card(title, sub, body, right, cls){
  return '<div class="card'+(cls?" "+cls:"")+'">'+(title?'<div class="ch"><h2>'+esc(title)+'</h2>'+(sub?'<span class="sub">'+sub+'</span>':'')+(right?'<div class="r">'+right+'</div>':'')+'</div>':'')+body+'</div>';
}
function memo(body, title){ return '<details class="memo"><summary>'+esc(title||"운영 메모")+'</summary><div class="mb">'+body+'</div></details>'; }
function searchBox(ph0){ return '<input class="in" placeholder="'+esc(ph0)+'" value="'+esc(ST.q)+'" oninput="setQ(this.value)">'; }
function kpi(l,v,u,x,click){ return '<div class="kpi'+(click?" link":"")+'"'+(click?' onclick="'+click+'"':'')+'><div class="l">'+esc(l)+'</div><div class="v">'+v+(u?'<em>'+esc(u)+'</em>':'')+'</div>'+(x?'<div class="x">'+x+'</div>':'')+'</div>'; }
function tag(s, cls){ return '<span class="tag'+(cls?" "+cls:"")+'">'+esc(s)+'</span>'; }
var RESV_TAG={ "신청":"warn","승인":"","체크인":"pri","완료":"ok","노쇼":"bad","취소":"off" };
var CC_TAG={ "대기":"warn","매칭":"","참석":"pri","완료":"ok","취소":"off" };
function emptyRow(n, msg){ return '<tr><td colspan="'+n+'"><div class="empty">'+esc(msg)+'</div></td></tr>'; }

/* JSONP · 백엔드가 callback 파라미터를 지원한다. GitHub Pages 에서 GAS 로 fetch 는 CORS 리다이렉트에 걸린다. */
var _cbN=0;
function call(action, params, done, fail){
  var name="__axf"+(++_cbN), sc=document.createElement("script"), q=[];
  params=params||{}; params.action=action; params.callback=name; params._=Date.now();
  if(!("key" in params)) params.key=key();
  for(var k in params) if(params[k]!=null) q.push(encodeURIComponent(k)+"="+encodeURIComponent(params[k]));
  var timer=setTimeout(function(){ cleanup(); fail&&fail({ok:false,reason:"timeout"}); },15000);
  function cleanup(){ clearTimeout(timer); try{delete window[name];}catch(e){window[name]=undefined;} if(sc.parentNode) sc.parentNode.removeChild(sc); }
  window[name]=function(res){ cleanup(); if(res&&res.ok===false&&res.reason==="auth"){ lock("관리코드가 맞지 않습니다. 다시 입력하세요."); return; } done&&done(res); };
  sc.onerror=function(){ cleanup(); fail&&fail({ok:false,reason:"network"}); };
  sc.src=BE+"?"+q.join("&");
  document.head.appendChild(sc);
}
function callAll(list, done){
  var out={}, left=list.length, err=null;
  if(!left) return done(out,null);
  list.forEach(function(it){
    call(it.a, it.p||{}, function(r){ out[it.k]=r; if(!--left) done(out,err); },
      function(e){ err=err||e; out[it.k]=null; if(!--left) done(out,err); });
  });

/* 여러 건을 차례로 보낸다(동시 3건) · 한 건 끝날 때마다 onEach 로 그 행만 고친다 */
function runOps(items, onEach, onDone){
  var i=0, live=0, okN=0, bad=[], total=items.length;
  if(!total) return onDone(0,[]);
  function next(){
    while(live<3&&i<total){
      (function(it){ live++;
        it.run(function(ok,res){ live--; if(ok) okN++; else bad.push({it:it,res:res}); onEach&&onEach(it,ok,res);
          if(total>2) el("toastT").textContent="처리 중 "+(okN+bad.length)+" / "+total;
          if(okN+bad.length===total) onDone(okN,bad); else next(); });
      })(items[i++]);
    }
  }
  if(total>2) toast("처리 중 0 / "+total,{ms:60000});
  next();
}

}
function barRow(label, n, max, right, over){ return '<tr><td class="l">'+label+'</td><td><div class="bar'+(over?" over":"")+'"><i style="width:'+pct(n,max)+'%"></i></div></td><td class="v">'+right+'</td></tr>'; }

/* ══════════════════ 4. 대시보드 ══════════════════

  var pw=(((ST.data.pwreq||{}).rows)||[]).filter(function(r){ return r.status==="대기"; }).length;

    kpi("추첨 응모권",tickets,"장",hasTk?'자격 기준 · 번호 발급 '+issued+'장':'4개 1장 · 5개 2장 · 6개 3장 · 7개 4장')+
    kpi("참여 기록",(st.wall||0).toLocaleString(),"건","스탬프 · 아이디어 · 게임 · 룰렛 전체")+
  '</div>';

  var todo=[
    { v:pw, t:"비밀번호 분실 요청", d:"본인 확인 후 초기화", go:"go('acct')" },
    { v:rvBy["신청"]||0, t:"상담 승인 대기", d:"1F DAP존 · 신청 상태", go:"goTo('apply','resv','신청')" },
    { v:rvBy["승인"]||0, t:"상담 체크인 대기", d:"승인됐고 아직 오지 않음", go:"goTo('apply','resv','승인')" },
    { v:ccBy["대기"]||0, t:"커피챗 매칭 대기", d:"18F 라운지 · 회차와 테이블 배정", go:"goTo('apply','cchat','대기')" },
    { v:ph0.length, t:"포토부스 대기", d:"호출할 번호표", go:"go('photo')" },
    { v:over.length, t:"정원 초과 강연", d:over.length?over.map(function(id){return SESS_NAME[id]||id;}).join(" · "):"17F 오후 강연 · 사전 신청 포함", go:"goTo('apply','sess')" }
  ];
  todo.sort(function(a,b){ return (b.v?1:0)-(a.v?1:0); });
  var hot=todo.filter(function(x){return x.v;}).length;
  h+='<div class="grid g57">'+
    card("지금 처리할 일", hot?hot+'건 유형 대기':'대기 없음', '<div class="todo">'+todo.map(function(x){
      return '<div class="it'+(x.v?"":" zero")+'"><div class="v">'+x.v+'</div><div><div class="t">'+esc(x.t)+'</div><div class="d">'+esc(x.d)+'</div></div>'+
        '<button class="btn sm '+(x.v?"pri":"ghost")+'" onclick="'+x.go+'">'+(x.v?"처리하기":"보기")+'</button></div>'; }).join("")+'</div>');
  /* 상담 · 커피챗 흐름 · 칸을 누르면 신청 탭 그 필터로 */

      endList.map(function(s){ return '<div class="fs end" onclick="goTo(\'apply\',\''+sub0+'\',\''+s+'\')"><div class="l">'+esc(s)+'</div><div class="v">'+(by[s]||0)+'</div></div>'; }).join("")+'</div>';
  }

    '<table class="tb plain bartb">'+sessIds.map(function(id){ var p0=PRE_SESS.indexOf(id)>=0?(pre[id]||0):0, n=(sessN[id]||0)+p0, cap=ss.cap[id]||0; return barRow('<b>'+esc(SESS_NAME[id]||id)+'</b>', n, cap, n+' / '+cap, n>cap); }).join("")+'</table>'+
    '<p class="cap mt8">정원 초과는 적갈 막대로 표시됩니다.</p>');
  h+='<div>'+card("상담 흐름","1F DAP존 · 전체 "+rv.length+"건 · 칸을 누르면 그 상태 목록으로",flow(["신청","승인","체크인","완료"],rvBy,["노쇼","취소"],"resv"))+
    card("커피챗 흐름","18F 라운지 · 전체 "+cc.length+"명",flow(["대기","매칭","참석","완료"],ccBy,["취소"],"cchat"))+capCard+'</div></div>';
  h+='<div class="grid g2">'+card("스탬프 보유 분포","참여 기록이 있는 사람 "+sp.length+"명",
    '<table class="tb plain bartb">'+dist.map(function(c,i){ var rw=i>=3?(i===3?"룰렛":i<=7?"응모 "+(i-3)+"장":"응모 4장"):""; return barRow('<b class="n">'+i+'개</b>'+(rw?' <span class="cap">'+rw+'</span>':''), c, mx, c+'명'); }).join("")+'</table>'+
    '<p class="cap mt8">가입만 하고 아무것도 안 한 사람은 0개에 들어가지 않습니다.</p>');
  var dm=(st.depts&&st.depts.length)?st.depts[0].n:1;
  h+=card("부문별 참여 기록","참여 기록 행 수 기준 · 상위 12",(st.depts&&st.depts.length)?'<table class="tb plain bartb">'+st.depts.slice(0,12).map(function(d){ return barRow(esc(d.d), d.n, dm, d.n.toLocaleString()); }).join("")+'</table>':'<div class="empty">아직 기록이 없습니다.</div>')+'</div>';
  return h;
}

/* ══════════════════ 5. 계정 ══════════════════ */
function viewAcct(){

  var shown=rows.filter(function(r){ return match(r,["emp","name","dept"]); });
  var byDept={}; rows.forEach(function(r){ byDept[r.dept||"(미상)"]=(byDept[r.dept||"(미상)"]||0)+1; });
  /* pw===false 만 「초기화 대기」. 필드가 없으면(옛 백엔드) 등록으로 본다. */
  var waiting=rows.filter(function(r){ return r.pw===false; }).length, roster=(ST.data.acct||{}).roster||0;
  var h=tabHead();
  h+='<div class="kpis">'+kpi("가입 계정",rows.length,"명")+kpi("명부",roster,"명","가입률 "+pct(rows.length,roster)+"%")+kpi("부문 수",Object.keys(byDept).length,"개")+kpi("비밀번호 초기화 대기",waiting,"명",waiting?"본인이 앱에서 새 비밀번호를 넣으면 풀립니다":"")+'</div>';

  var body='<div class="toolbar">'+searchBox("사번 · 이름 · 부문 검색")+'<span class="cnt"><b>'+shown.length+'</b> / '+rows.length+'명</span></div>';
  body+='<div class="wrap scrolly" style="max-height:620px"><table class="tb"><tr><th>사번</th><th>이름</th><th>부문</th><th>가입</th><th>최근 접속</th><th>비밀번호</th><th class="tdr">처리</th></tr>'+
    shown.slice(0,500).map(function(r){ var wait=r.pw===false;
      return '<tr class="hv"><td class="n">'+esc(r.emp)+'</td><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.dept)+'</td><td class="n cap">'+esc(short(r.joined))+'</td><td class="n">'+esc(short(r.last))+'</td>'+
        '<td>'+(wait?tag("초기화 대기","warn"):tag("사용 중","off"))+'</td>'+
        '<td class="tdr">'+(wait?'<span class="cap">새 비밀번호 입력 대기</span>':'<button class="btn sm" data-emp="'+esc(r.emp)+'" data-name="'+esc(r.name)+'" onclick="pwReset(this)">비밀번호 초기화</button>')+'</td></tr>'; }).join("")+
    (shown.length>500?'<tr><td colspan="7" class="cap">500명까지만 표시합니다. 검색으로 좁혀 주세요.</td></tr>':'')+(!shown.length?emptyRow(7,"해당하는 계정이 없습니다."):'')+'</table></div>';
  body+=memo('<p>최근 접속 = 앱을 마지막으로 연 시각입니다(v3.83부터 앱 사용 중에도 갱신 · 약 10분 간격). 그 전 기록은 마지막 비밀번호 입력 시각입니다.</p><p>비밀번호 초기화는 지금 비밀번호를 지우고, 본인이 앱에서 다음에 입력하는 4자리를 새 비밀번호로 등록합니다. 스탬프·신청 기록은 그대로입니다. 운영 로그에 남습니다.</p>');
  h+=card("가입 계정","최근 접속 순",body);
  h+=card("부문별 가입","",'<div class="row">'+Object.keys(byDept).sort(function(a,b){return byDept[b]-byDept[a];}).map(function(d){ return '<span class="tag off">'+esc(d)+' <b class="n">'+byDept[d]+'</b></span>'; }).join("")+'</div>');
  return h;

/* ── v3.88 비밀번호 분실 요청 (앱 → 운영 데스크) ──────────────────────────────
 * 앱에서 사번·이름만 보낸 요청이 여기에 쌓인다. 데스크에서 「본인 확인」을 하고 초기화를 누르면
 * 서버가 비번해시를 비우고(기존 acct_pwreset 과 같은 경로) 요청을 처리로 표시한다. 잘못된 요청은 취소.
 * 처리자 이름은 이 브라우저에 기억해 두고 함께 보낸다(누가 처리했는지 남기기 위함). */
function viewPwReq(){
  var d=ST.data.pwreq||{}, rows=(d.rows||[]);
  var wait=rows.filter(function(r){ return r.status==="대기"; });
  var done=rows.filter(function(r){ return r.status!=="대기"; }).slice(0,20);
  var body='<div class="note warn">사원증이나 얼굴로 <b>본인 확인을 먼저</b> 한 뒤 초기화하세요. 앱에서 온 요청일 뿐, 본인 확인은 데스크에서 합니다.</div>'+
    '<div class="wrap mt12"><table class="tb"><tr><th>요청 시각</th><th>사번</th><th>이름</th><th>계정</th><th class="tdr">처리</th></tr>'+
    (wait.length?wait.map(function(r){
      return '<tr class="hv"><td class="n cap">'+esc(short(r.ts))+'</td><td class="n">'+esc(r.emp)+'</td><td><b>'+esc(r.name)+'</b></td>'+
        '<td>'+(r.joined?(r.pwSet?tag("사용 중","ok"):tag("이미 초기화됨","warn")):tag("가입 전","off"))+'</td>'+
        '<td><div class="acts"><button class="btn sm pri" data-row="'+r.row+'" data-emp="'+esc(r.emp)+'" data-name="'+esc(r.name)+'" onclick="pwReqDone(this)">본인 확인 후 초기화</button>'+
        '<button class="btn sm danger" data-row="'+r.row+'" data-name="'+esc(r.name)+'" onclick="pwReqCancel(this)">요청 취소</button></div></td></tr>';
    }).join(""):emptyRow(5,"대기 중인 요청이 없습니다."))+'</table></div>';
  if(done.length){
    body+=memo('<div class="wrap"><table class="tb"><tr><th>요청</th><th>사번</th><th>이름</th><th>상태</th><th>처리 시각</th><th>처리자</th></tr>'+
      done.map(function(r){ return '<tr><td class="n cap">'+esc(short(r.ts))+'</td><td class="n">'+esc(r.emp)+'</td><td>'+esc(r.name)+'</td>'+
        '<td>'+(r.status==="처리"?tag("처리","ok"):tag("취소","off"))+'</td>'+
        '<td class="n cap">'+esc(short(r.doneAt))+'</td><td>'+esc(r.by||"-")+'</td></tr>'; }).join("")+'</table></div>', "최근 처리 내역 "+done.length+"건");
  }
  return card("비밀번호 분실 요청", wait.length?'<span class="tag brand">대기 '+wait.length+'건</span>':'대기 없음', body, byBox()+'<button class="btn sm" onclick="load(true)">새로고침</button>');
}

/* 비밀번호 초기화 · acct_pwreset. 서버는 행을 남기고 비번해시만 비운다. 다음 로그인의 4자리가 새 비밀번호가 된다. */

/* ══════════════════ 6. 스탬프 ══════════════════
 * 서브탭 · 개인 발급·취소(기본) | 전체 현황 | 현장 운영(룰렛 소진 · 인쇄용 QR) */
function viewStamp(){

    '<p>담당자 취소(v3.95)도 같은 4종만 됩니다. 기록을 지우지 않고 참여 기록에 「담당자 취소」 행을 남깁니다. 취소 뒤에는 QR 이나 부여로 다시 받을 수 있습니다. 앱 자동 3종과 설문은 한 번 적립되면 서버가 재적립을 막아서 취소하면 다시 받을 길이 없어 막아 두었습니다.</p>'+
    '<p>보상과 부딪치는 취소는 서버가 거부합니다. 룰렛을 이미 돌렸는데 3개 미만이 되는 경우, 이미 발급된 응모권 장수가 취소 뒤 자격보다 많아지는 경우입니다(응모권 번호는 되돌리지 않는 원장). 이때는 경품 담당과 먼저 정리합니다.</p>'+

/* 한 사람 · 계정 목록과 스탬프 집계를 사번으로 합친다(스탬프가 0개인 사람도 찾을 수 있어야 부여한다) */
function spPeople(){
  var by={}, out=[];
  ((ST.data.stamp||{}).rows||[]).forEach(function(r){ var k=normE(r.emp); by[k]=r; out.push(r); });
  ((ST.data.acct||{}).rows||[]).forEach(function(a){ var k=normE(a.emp); if(!by[k]){ var r={ emp:a.emp, name:a.name, dept:a.dept, stamps:[], via:{}, n:0, roulette:false, tk:0, last:"", noRec:true }; by[k]=r; out.push(r); } });
  return { by:by, list:out };
}
function spSel(emp){ ST.sp.emp=emp; render(); }
function spQ(v){ ST.sp.q=v; render(); }
function viewStampOne(){
  var P=spPeople(), q=ST.sp.q.trim().toLowerCase(), list=P.list;

  else list=list.filter(function(r){ return !r.noRec; }).sort(function(a,b){ return (b.last||"")<(a.last||"")?-1:1; });
  var cur=ST.sp.emp?P.by[normE(ST.sp.emp)]:null;
  var h='<div class="sp"><div class="lnb"><input class="in" placeholder="사번 · 이름 · 부문으로 찾기" value="'+esc(ST.sp.q)+'" oninput="spQ(this.value)">'+
    '<div class="cap">'+(q?'검색 결과 '+list.length+'명':'최근 기록 순 · 스탬프 0개인 사람은 검색으로 찾습니다')+'</div><ul>'+
    list.slice(0,80).map(function(r){ var on=cur&&normE(cur.emp)===normE(r.emp);
      return '<li><button class="'+(on?"on":"")+'" onclick="spSel(\''+jq(r.emp)+'\')"><div style="min-width:0"><div class="nm">'+esc(r.name||"(이름 없음)")+'</div><div class="em">'+esc(r.emp)+(r.dept?' · '+esc(r.dept):'')+'</div></div><span class="c">'+r.n+' / 8</span></button></li>'; }).join("")+
    (list.length>80?'<li class="cap" style="padding:8px">80명까지 표시 · 검색으로 좁혀 주세요</li>':'')+(!list.length?'<li class="cap" style="padding:8px">찾는 사람이 없습니다. 가입 전인 사람은 스탬프를 받을 수 없습니다.</li>':'')+'</ul></div>';
  h+='<div>'+(cur?spPanel(cur):'<div class="card"><div class="empty">왼쪽에서 사번이나 이름으로 한 사람을 고르세요.<br>8칸 상태를 보고 바로 부여하거나 취소할 수 있습니다.</div></div>')+'</div></div>';
  return h;
}
function spVia(r, id){
  var v=(r.via||{})[id];

  var s=v.v||(GRANT_IDS.indexOf(id)<0?"앱 자동 적립":"기록");
  return s+(v.t?' · '+hhmm(v.t):'');
}

    '<div><div class="l">룰렛</div><div class="v" style="font-size:var(--fs-h2);margin-top:6px">'+(r.roulette?tag("사용함","off"):rw.roulette?tag("돌릴 수 있음","pri"):tag("3개부터","off"))+'</div><div class="x">1인 1회 · 1F 이벤트존</div></div>'+
    '<div><div class="l">응모권</div><div class="v">'+rw.tickets+'<em>장 자격</em></div><div class="x">번호 발급 '+tk+'장'+(tk<rw.tickets?' · 앱이 다음 동기화에 발급':'')+'</div></div></div>';
  h+='<div class="slots">'+STAMP_ORDER.map(function(id){
    var m=STAMP_META[id], got=(r.stamps||[]).indexOf(id)>=0, canG=GRANT_IDS.indexOf(id)>=0, canR=REVOKE_IDS.indexOf(id)>=0;

      :(canG?'<button class="btn sm pri" onclick="stGrant(\''+jq(r.emp)+'\',\''+id+'\')">부여</button>':'<span class="cap">앱에서 자동 적립</span>');
    return '<div class="slot'+(got?" got":"")+'"><div class="no">'+m.no+'</div><div class="nm">'+esc(m.n)+'</div><div class="via">'+esc(spVia(r,id))+'</div>'+
      '<div class="ft">'+(got?tag("획득","pri"):tag("미획득","off"))+act+'</div></div>'; }).join("")+'</div>';
  if(r.old&&r.old.length) h+='<p class="cap mt12">폐기된 옛 항목 기록: '+r.old.map(function(id){ return esc((STAMP_META[id]||{n:id}).n); }).join(" · ")+' (개수에 안 들어감)</p>';
  var hs=HIST[normE(r.emp)]||[];
  if(hs.length||r.rv) h+='<h2 style="font-size:var(--fs-s);font-weight:800;color:var(--tx2);margin:18px 0 6px">처리 기록</h2>'+(r.rv?'<p class="cap">서버에 담당자 취소 기록 '+r.rv+'건</p>':'')+
    (hs.length?'<ul class="hist">'+hs.map(function(x){ return '<li><span class="t">'+esc(x.t)+'</span><span>'+esc(x.x)+'</span></li>'; }).join("")+'</ul>':'');
  return h+'</div>';

/* 보상 변화 줄 · 확인 창 「영향」 */
function rwImpact(n0, n1, extra){
  var a=reward(n0), b=reward(n1), out=[["스탬프", n0+"개 → "+n1+"개", "chg"]];
  if(a.roulette!==b.roulette) out.push(["룰렛 자격", b.roulette?"생김":"없어짐", b.roulette?"chg":"loss"]);
  else out.push(["룰렛 자격", a.roulette?"그대로 (있음)":"그대로 (없음)"]);
  if(a.tickets!==b.tickets) out.push(["응모권 자격", a.tickets+"장 → "+b.tickets+"장", b.tickets>a.tickets?"chg":"loss"]);
  else out.push(["응모권 자격", "그대로 ("+a.tickets+"장)"]);
  return out.concat(extra||[]);
}
function spRow(emp){ return spPeople().by[normE(emp)]; }
/* 서버 응답의 목록으로 그 사람 행만 고친다(표 전체를 다시 받지 않는다) */
function spApply(emp, stamps, id, via){
  var d=ST.data.stamp=ST.data.stamp||{rows:[]}, k=normE(emp), r=null;
  for(var i=0;i<d.rows.length;i++) if(normE(d.rows[i].emp)===k){ r=d.rows[i]; break; }
  if(!r){ var b=spRow(emp)||{emp:emp,name:"",dept:""}; r={ emp:b.emp, name:b.name, dept:b.dept, stamps:[], via:{}, n:0, roulette:false, tk:0, rv:0, last:"" }; d.rows.unshift(r); }
  r.stamps=(stamps||[]).filter(function(x){ return STAMP_ORDER.indexOf(x)>=0; }); r.n=r.stamps.length; r.via=r.via||{};
  if(via) r.via[id]={ v:via, t:nowHMS() }; else delete r.via[id];
  r.last=r.last||"";
}
function stGrant(emp, id, quiet){
  var r=spRow(emp)||{emp:emp,n:0}, m=STAMP_META[id], n0=r.n||0;
  function doIt(){
    call("stamp_grant",{emp:emp,id:id},function(res){
      dlgForce();
      if(res&&res.ok){
        if(res.dup){ toast("이미 있는 스탬프입니다 · "+m.no+" "+m.n); load(); return; }
        spApply(emp, res.stamps, id, "담당자 부여"); hist(emp, m.no+" "+m.n+" 부여"); render();
        toast((quiet?"되돌렸습니다 · ":"부여했습니다 · ")+(r.name||emp)+" · "+m.no+" "+m.n, quiet?{}:{ undo:function(){ stRevokeGo(emp,id,true); } });
      } else toast("부여 실패: "+(res&&res.reason==="noid"?"부여할 수 없는 항목입니다":why(res)));
    },function(){ dlgForce(); toast("서버 응답 없음"); });
  }
  if(quiet) return doIt();
  dialog({ t:"스탬프를 부여할까요?", s:"참여 기록에 <b>「담당자 부여」</b>로 남습니다. 참가자 앱에는 다음 동기화에 반영됩니다.",
    who:esc(r.name||emp)+'<span>사번 '+esc(emp)+' · '+m.no+' '+esc(m.n)+'</span>', x:imp(rwImpact(n0, n0+1)), ok:"부여", onOk:doIt });
}
/* 취소 · 먼저 dry=1 로 서버 판정과 영향을 받아 확인 창에 보여 준다 */
function stRevoke(emp, id){
  var r=spRow(emp)||{emp:emp}, m=STAMP_META[id];
  toast("취소할 수 있는지 확인 중",{ms:8000});
  call("stamp_revoke",{emp:emp,id:id,dry:1},function(d){
    el("toast").className="";
    d=d||{};
    var who=esc(r.name||emp)+'<span>사번 '+esc(emp)+' · '+m.no+' '+esc(m.n)+' · '+esc(spVia(r,id)||"")+'</span>';
    if(!d.ok){
      var msg=d.reason==="roulette"?"이 사람은 <b>룰렛을 이미 돌렸습니다</b>. 취소하면 3개 미만이 되어 이미 받은 경품과 맞지 않습니다. 경품 담당과 먼저 정리하세요."
        :d.reason==="tickets"?"<b>응모권 번호가 이미 "+d.tickets+"장 발급</b>되었습니다. 취소하면 자격이 "+d.ticketsAfter+"장이 되는데, 응모권 번호는 되돌리지 않는 원장이라 취소를 막습니다."
        :d.reason==="nostamp"?"서버 기록에 이 스탬프가 없습니다. 화면이 오래되었을 수 있습니다. 새로고침 해 주세요."
        :d.reason==="noid"?"이 항목은 담당자 취소 대상이 아닙니다(앱 자동 적립·설문).":"확인 실패: "+esc(why(d));
      dialog({ t:"취소할 수 없습니다", s:msg, who:who, x:d.n!=null?imp(rwImpact(d.n, d.nAfter)):"", ok:"확인" });
      if(d.reason==="nostamp") load();
      return;
    }
    dialog({ t:"스탬프를 취소할까요?", s:"기록을 지우지 않고 참여 기록에 <b>「담당자 취소」</b> 행을 남깁니다. 취소 뒤에도 QR 이나 부여로 다시 받을 수 있습니다.",
      who:who, x:imp(rwImpact(d.n, d.nAfter, [["응모권 번호 발급", d.tickets+"장 (그대로)"],["룰렛 사용", d.roulette?"사용함":"안 함"]])), ok:"취소 처리", danger:true,
      onOk:function(){ stRevokeGo(emp,id,false); } });
  },function(){ toast("서버 응답 없음"); });
}
function stRevokeGo(emp, id, quiet){
  var r=spRow(emp)||{emp:emp}, m=STAMP_META[id];

      spApply(emp, res.stamps, id, null); var rr=spRow(emp); if(rr) rr.rv=(rr.rv||0)+1;
      hist(emp, m.no+" "+m.n+" 취소"); render();
      toast((quiet?"되돌렸습니다 · ":"취소했습니다 · ")+(r.name||emp)+" · "+m.no+" "+m.n, quiet?{}:{ undo:function(){ stGrant(emp,id,true); } });
    } else toast("취소 실패: "+(res&&res.reason==="roulette"?"룰렛을 이미 돌렸습니다":res&&res.reason==="tickets"?"응모권이 이미 발급되었습니다":why(res)));

}

function resvDo(ids, status, opt){

  var skip=ids.length-rows.length;
  function go0(){
    dlgForce();
    var prev={}; rows.forEach(function(r){ prev[r.id]=r.status; });
    var items=rows.map(function(r){ var target=opt.undo?opt.undo[r.id]:status;
      r.status=target; ovrSet("resv:"+r.id,{status:target});

    render();

      if(!ok){ it.r.status=prev[it.r.id]; delete ST.ovr["resv:"+it.r.id]; }
      else { hist(it.r.emp, "상담 "+hhmm(it.r.slot)+" "+(opt.undo?"되돌림 → ":"")+it.r.status+(res.stamp&&!res.stamp.dup?" · 스탬프 03 적립":"")); if(!opt.undo) delete ST.sel["r:"+it.r.id]; }
    }, function(okN,bad){

      var who=rows.length===1?rows[0].name+" · ":"";

      var undoIds=items.filter(function(it){ return bad.every(function(b){ return b.it!==it; }); }).map(function(it){ return it.r.id; });

function ccMatch(emps, bulk){

  var miss=plan.filter(function(p){ return !p.round||!p.table; });
  if(miss.length){ toast(bulk?"일괄 매칭할 회차 시간과 테이블을 넣어 주세요":"회차 시간과 테이블을 넣어 주세요"); return; }
  function go0(){
    dlgForce();
    var items=plan.map(function(p){ p.r.status="매칭"; p.r.round=p.round; p.r.table=p.table; ovrSet("cc:"+normE(p.r.emp),{status:"매칭",table:p.table});
      return { p:p, run:op("cchat_set",{emp:p.r.emp,round:p.round,table:p.table}) }; });
    render();

      var p=it.p;

      else { hist(p.r.emp, "커피챗 매칭 "+p.round+" · "+p.table); delete ST.draft[normE(p.r.emp)]; delete ST.sel["c:"+normE(p.r.emp)]; }
    }, function(okN,bad){
      render();
      var good=items.filter(function(it){ return bad.every(function(b){ return b.it!==it; }); }).map(function(it){ return it.p; });
      toast((rows.length===1?rows[0].name+" · "+plan[0].round+" · "+plan[0].table:"매칭 "+okN+"명")+(bad.length?" · 실패 "+bad.length+"명":""), good.length?{ undo:function(){ ccRestore(good); } }:{});

/* 되돌리기 · 이전이 대기면 cchat_status 대기(회차·테이블 비움), 이전이 매칭이면 옛 회차·테이블로 cchat_set 또는 cchat_status 매칭 */
function ccRestore(plans){
  var items=plans.map(function(p){ var r=p.r, pv=p.prev;
    var run=pv.status==="대기"?op("cchat_status",{emp:r.emp,status:"대기"}):(pv.round&&pv.table&&(hhmm(r.round)!==pv.round||r.table!==pv.table))?op("cchat_set",{emp:r.emp,round:pv.round,table:pv.table}):op("cchat_status",{emp:r.emp,status:pv.status});
    r.status=pv.status; r.round=pv.status==="대기"?"":pv.round; r.table=pv.status==="대기"?"":pv.table; ovrSet("cc:"+normE(r.emp),{status:pv.status});
    return { r:r, run:run }; });
  render();
  runOps(items, function(it,ok){ if(ok) hist(it.r.emp,"커피챗 되돌림 → "+it.r.status); }, function(okN,bad){ if(bad.length) load(); else render(); toast(bad.length?"되돌리기 실패 "+bad.length+"건 · 목록을 다시 받았습니다":"되돌렸습니다 · "+okN+"건"); });

function ccDo(emps, status){

  function go0(){
    dlgForce();

    var items=plan.map(function(p){ p.r.status=status; ovrSet("cc:"+normE(p.r.emp),{status:status}); return { p:p, run:op("cchat_status",{emp:p.r.emp,status:status}) }; });
    render();
    runOps(items, function(it,ok,res){ var p=it.p;
      if(!ok){ p.r.status=p.prev.status; delete ST.ovr["cc:"+normE(p.r.emp)]; }
      else { hist(p.r.emp,"커피챗 "+status+(res.stamp&&!res.stamp.dup?" · 스탬프 03 적립":"")); delete ST.sel["c:"+normE(p.r.emp)]; }
    }, function(okN,bad){
      render();
      var good=items.filter(function(it){ return bad.every(function(b){ return b.it!==it; }); }).map(function(it){ return it.p; });
      toast((rows.length===1?rows[0].name+" · "+status:status+" "+okN+"명")+(bad.length?" · 실패 "+bad.length+"명 ("+why(bad[0].res)+")":""), (status==="취소"&&good.length)?{ undo:function(){ ccRestore(good); } }:{});
    });
  }
  if(status!=="취소") return go0();
  dialog({ t:(rows.length>1?rows.length+"명의 ":"")+"커피챗 신청을 취소할까요?", s:"참가자 앱에 취소로 뜹니다. 처리 뒤 7초 동안 알림의 <b>되돌리기</b>로 이전 상태(대기 또는 매칭)로 돌릴 수 있습니다.",
    who:rows.length===1?esc(rows[0].name)+'<span>사번 '+esc(rows[0].emp)+' · 지금 '+esc(rows[0].status)+'</span>':namesOf(rows), ok:"취소 처리", danger:true, onOk:go0 });

 * 전송은 JSONP(GET) URL 한계 때문에 20행씩 청크 · 서버는 마지막 청크가 와서 전부 모였을 때만 한 번에 교체한다. */
var PRE={ file:"", rows:null, errs:[], warn:[], busy:false, pct:0 };

function preSidOf(v){
  var raw=String(v||"").trim().toLowerCase(), t=raw.replace(/\s/g,"");
  if(t==="l1"||/aws/.test(t)||/아마존/.test(t)) return "l1";
  if(t==="l2"||/(^|[^a-z])ms([^a-z]|$)/.test(raw)||/microsoft|마이크로소프트/.test(t)) return "l2";
  return "";
}
function preHeadKey(v){
  var t=String(v||"").replace(/\s/g,"").toLowerCase();
  if(/^(세션|세션id|세션명|강연|강연명|session|sid)$/.test(t)) return "sid";
  if(/^(사번|직원번호|사원번호|임직원번호|emp|empid|employeeid)$/.test(t)) return "emp";
  if(/^(이름|성명|name)$/.test(t)) return "name";
  if(/^(부문|부서|소속|dept|department)$/.test(t)) return "dept";
  return "";
}

function prePick(inp){ var f=inp.files&&inp.files[0]; inp.value=""; if(f) preRead(f); }
function preRead(f){
  var name=f.name||"", ext=(name.split(".").pop()||"").toLowerCase();
  if(ext==="xls"){ toast("옛 .xls 형식은 읽지 못합니다. 엑셀에서 .xlsx 로 다른 이름 저장 후 올려 주세요"); return; }
  if(ext!=="xlsx"&&ext!=="csv"){ toast(".xlsx 또는 .csv 파일만 올릴 수 있습니다"); return; }

    p.then(function(grid){ preCheck(grid); render(); }).catch(function(err){ PRE.file=""; toast("파일을 읽지 못했습니다: "+(err&&err.message||"형식 오류")); render(); });

/* 한국어 윈도 엑셀의 CSV 는 CP949 일 수 있다 · UTF-8 로 먼저 읽고 깨지면 EUC-KR */
function decodeText(buf){
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf).replace(/^\uFEFF/,""); }
  catch(e){ return new TextDecoder("euc-kr").decode(buf); }
}
function csvParse(t){
  var rows=[], row=[], cur="", q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&t[i+1]==="\n") i++; row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=c;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
/* xlsx = zip · 첫 번째 시트만 읽는다 */
function xlsxRows(buf){
  if(typeof DecompressionStream==="undefined") return Promise.reject(new Error("이 브라우저는 xlsx 압축 해제를 지원하지 않습니다. CSV 로 저장해 올려 주세요"));
  var u=new Uint8Array(buf), dv=new DataView(buf), eocd=-1;
  for(var i=u.length-22;i>=0&&i>u.length-66000;i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) return Promise.reject(new Error("xlsx 파일이 아닙니다"));
  var n=dv.getUint16(eocd+10,true), off=dv.getUint32(eocd+16,true), ent={};
  var td=new TextDecoder("utf-8");
  for(var k=0;k<n;k++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    var meth=dv.getUint16(off+10,true), csz=dv.getUint32(off+20,true), fnl=dv.getUint16(off+28,true), exl=dv.getUint16(off+30,true), cml=dv.getUint16(off+32,true), loc=dv.getUint32(off+42,true);
    ent[td.decode(u.subarray(off+46,off+46+fnl))]={ meth:meth, csz:csz, loc:loc };
    off+=46+fnl+exl+cml;
  }
  function file(nm){
    var e=ent[nm]; if(!e) return Promise.resolve(null);
    var lfn=dv.getUint16(e.loc+26,true), lex=dv.getUint16(e.loc+28,true), start=e.loc+30+lfn+lex, data=u.subarray(start,start+e.csz);
    if(e.meth===0) return Promise.resolve(td.decode(data));
    if(e.meth!==8) return Promise.reject(new Error("지원하지 않는 압축 방식"));
    var ds=new DecompressionStream("deflate-raw");
    return new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer().then(function(b){ return td.decode(b); });
  }
  var sheetName=Object.keys(ent).filter(function(x){ return /^xl\/worksheets\/sheet\d+\.xml$/.test(x); }).sort()[0];
  if(!sheetName) return Promise.reject(new Error("시트를 찾지 못했습니다"));
  return Promise.all([file("xl/sharedStrings.xml"), file(sheetName)]).then(function(r){
    var dp=new DOMParser(), ss=[];
    if(r[0]){ var sd=dp.parseFromString(r[0],"application/xml"); var si=sd.getElementsByTagName("si");
      for(var a=0;a<si.length;a++){ var ts=si[a].getElementsByTagName("t"), str=""; for(var b=0;b<ts.length;b++) str+=ts[b].textContent; ss.push(str); } }
    var wd=dp.parseFromString(r[1],"application/xml"), out=[], rws=wd.getElementsByTagName("row");
    for(var ri=0;ri<rws.length;ri++){
      var cs=rws[ri].getElementsByTagName("c"), line=[];
      for(var ci=0;ci<cs.length;ci++){
        var ref=cs[ci].getAttribute("r")||"", col=0, m=ref.match(/^[A-Z]+/);
        if(m) for(var z=0;z<m[0].length;z++) col=col*26+(m[0].charCodeAt(z)-64);
        col=col?col-1:line.length;
        var tp=cs[ci].getAttribute("t"), vEl=cs[ci].getElementsByTagName("v")[0], val="";
        if(tp==="s") val=vEl?(ss[+vEl.textContent]||""):"";
        else if(tp==="inlineStr"){ var it=cs[ci].getElementsByTagName("t"); for(var y=0;y<it.length;y++) val+=it[y].textContent; }
        else val=vEl?vEl.textContent:"";
        while(line.length<col) line.push("");
        line[col]=val;
      }
      out.push(line);
    }
    return out;
  });
}
/* 검증 · 오류 행은 반영에서 제외 대상, 경고는 반영 가능 */
function preCheck(grid){
  grid=(grid||[]).filter(function(r){ return r&&r.some(function(c){ return String(c||"").trim()!==""; }); });
  if(!grid.length){ PRE.rows=[]; PRE.errs=[{line:0,msg:"빈 파일입니다"}]; return; }
  var head=grid[0].map(preHeadKey), ix={};
  head.forEach(function(k,i){ if(k&&!(k in ix)) ix[k]=i; });
  PRE.errs=[]; PRE.warn=[]; PRE.rows=[];
  if(!("sid" in ix)||!("emp" in ix)){ PRE.errs.push({line:1,msg:"첫 행에 「세션」「사번」 열이 필요합니다"}); return; }
  var seen={};
  for(var i=1;i<grid.length;i++){
    var r=grid[i], rawS=String(r[ix.sid]||"").trim(), emp=String(r[ix.emp]||"").trim().replace(/\.0$/,"");
    var sid=preSidOf(rawS), line=i+1, msg="";
    if(!sid) msg="알 수 없는 세션 「"+rawS+"」";
    else if(!emp) msg="사번이 비어 있음";
    else if(!/^[A-Za-z0-9]+$/.test(emp)) msg="사번 형식 이상 「"+emp+"」";
    else { var key=sid+"|"+emp.replace(/^0+(?=.)/,"").toUpperCase(); if(seen[key]) msg="같은 세션 사번 중복 ("+seen[key]+"행과 같음)"; else seen[key]=line; }
    var row={ line:line, sid:sid, emp:emp, name:"name" in ix?String(r[ix.name]||"").trim():"", dept:"dept" in ix?String(r[ix.dept]||"").trim():"", err:msg };
    if(msg) PRE.errs.push({line:line,msg:msg});
    PRE.rows.push(row);
  }
}
function preSummary(){

function preSend(good, sids){

        return barRow('<b>'+esc(nm)+'</b>', q.counts[k], tot, q.counts[k]+' · '+pct(q.counts[k],tot)+'%'); }).join("")+'</table>'+

/* ══════════════════ 7-5. 포토부스 원격 대기열 (v3.21 B) · photo_list 조회 · q_call·q_skip·q_done ══════════════════ */

    rows.map(function(r){ var k=jq(r.emp);
      return '<tr class="hv"><td class="n"><b>'+r.no+'</b></td><td><div class="who2">'+esc(r.name||"")+'<small class="n">'+esc(r.emp)+'</small></div></td>'+
        '<td>'+(r.status==="call"?tag("호출 중","pri"):tag("대기","warn"))+'</td>'+
        '<td class="n tdr">'+r.ahead+'</td><td class="n">'+esc(r.eta||"")+'</td>'+
        '<td>'+(r.status==="call"?'<div class="acts"><button class="btn sm danger" onclick="photoAct(\'skip\',\''+k+'\','+r.no+')">건너뛰기</button><button class="btn sm pri" onclick="photoAct(\'done\',\''+k+'\','+r.no+')">완료</button></div>':'<div class="acts"><span class="cap">-</span></div>')+'</td></tr>'; }).join("")+

}

/* v3.80 타자 기록은 「버틴 시간」(1/100초) · 표에는 초로 보여 준다 */
function tySec(v){ return v ? (Number(v)/100).toFixed(1)+"초" : "-"; }
/* ── v3.84 게임별 통계 (사용자 요청 260918 「타자 말고 다른 게임도 통계」 · 「상위 10이 아니라 전원」) ──────────
 * 기록은 서버 game_stats 한 번으로 받는다. 네 종목 모두 참여 인원·플레이 횟수·최고·중간값 + 전원 명단.
 * 기록 방향이 종목마다 다르다: 팡 = 완주 시간(짧을수록), 점프·소나기 = 버틴 시간(길수록), 기억력 = 점수.
 * 숫자마다 단위를 붙인다(초/점). 운영 전용 화면이라 실명·사번을 함께 보여 준다 · 부문은 어디에도 넣지 않는다. */
var GST_NAME={ pang:"AX 팡", jump:"ME to WE 점프", tetris:"테트리스", word:"ME to WE 기억력" };
var GST_DIR={ pang:"완주 시간 · 짧을수록 좋음", jump:"버틴 시간 · 길수록 좋음", tetris:"버틴 시간 · 길수록 좋음", word:"걸린 시간 · 짧을수록 좋음" };
var GQ={};
function gstFmt(v,unit){ return unit==="cs" ? (Number(v||0)/100).toFixed(1)+"초" : unit==="ln" ? Number(v||0).toLocaleString()+"줄" : Number(v||0).toLocaleString()+"점"; }
function gstMatch(r,q){ if(!q) return true; return (r.nick||"").toLowerCase().indexOf(q)>=0 || (r.name||"").toLowerCase().indexOf(q)>=0 || String(r.emp||"").indexOf(q)>=0; }
function gstRowsHtml(g){
  var G=((ST.data.gstats||{}).games||{})[g]; if(!G) return '<tr><td colspan="8" class="cap">불러오는 중</td></tr>';
  var q=(GQ[g]||"").trim().toLowerCase();
  var rows=G.rows.filter(function(r){ return gstMatch(r,q); });
  if(!rows.length) return '<tr><td colspan="8" class="cap">'+(G.rows.length?"검색 결과가 없습니다.":"아직 기록이 없습니다.")+'</td></tr>';
  return rows.map(function(r){
    return '<tr><td class="n">'+r.rank+'</td><td><b>'+esc(r.nick||"(닉네임 없음)")+'</b>'+(r.hidden?' <span class="tag off">숨김</span>':'')+'</td>'+
      '<td>'+esc(r.name||"-")+'</td><td class="n">'+esc(r.emp)+'</td>'+
      '<td class="n tdr">'+gstFmt(r.best,G.unit)+'</td><td class="n tdr">'+r.pts+'점</td>'+
      '<td class="n tdr">'+r.plays+'회</td><td class="n src">'+esc(short(r.last))+'</td></tr>';
  }).join("");
}
function gstSearch(g,v){
  GQ[g]=v;
  var t=el("gtb_"+g); if(t) t.innerHTML=gstRowsHtml(g);
  var c=el("gcnt_"+g), G=((ST.data.gstats||{}).games||{})[g];
  if(c&&G){ var q=(v||"").trim().toLowerCase(); c.textContent=G.rows.filter(function(r){ return gstMatch(r,q); }).length+" / "+G.rows.length+"명"; }
}
function csvq(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function csvDl(name,text){
  var blob=new Blob(["\ufeff"+text],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },400);
}
function gstCsv(g){
  var G=((ST.data.gstats||{}).games||{})[g];
  if(!G||!G.rows.length){ toast("내보낼 기록이 없습니다"); return; }
  var head=["순위","닉네임","이름","사번",(G.unit==="cs"?"최고기록(초)":G.unit==="ln"?"최고기록(줄)":"최고점수"),"환산점수","플레이횟수","마지막기록"];
  var lines=[head.join(",")].concat(G.rows.map(function(r){
    return [r.rank,csvq(r.nick),csvq(r.name),csvq(r.emp),(G.unit==="cs"?(r.best/100).toFixed(1):r.best),r.pts,r.plays,csvq(r.last)].join(",");
  }));
  csvDl(GST_NAME[g]+"_전체기록.csv",lines.join("\n"));
  toast("CSV를 내려받았습니다");
}
function olyCsv(){
  var O=(ST.data.gstats||{}).oly, ev=(ST.data.gstats||{}).events||[];
  if(!O||!O.rows.length){ toast("내보낼 기록이 없습니다"); return; }
  var head=["순위","닉네임","이름","사번"].concat(ev.map(function(g){ return GST_NAME[g]+"(환산)"; })).concat(["총점","완주종목","완주시각"]);
  var lines=[head.join(",")].concat(O.rows.map(function(r){
    return [r.rank,csvq(r.nick),csvq(r.name),csvq(r.emp)].concat(ev.map(function(g){ return r.ev[g]?r.ev[g].pts:""; })).concat([r.total,r.done,csvq(r.doneAt)]).join(",");
  }));
  csvDl("AX올림픽_전체기록.csv",lines.join("\n"));
  toast("CSV를 내려받았습니다");
}
/* v3.50 AX 올림픽 · 종목별 목표 점수(환산 100점 기준) · 종합 상위 10(실명) · v3.50d 부문 표시 삭제 */
var OLY_NAME={ pang:"AX 팡", jump:"ME to WE 점프", tetris:"테트리스", word:"ME to WE 기억력" };
/* ── v3.92 AX 올림픽 환산 기준 · 종목마다 보통(= 50점)·최상(= 90점) 기록 두 개 (1/100초) ──
 * 점수 = 100 / (1 + 9^(−z)) · z = ln(기록/보통) / ln(최상/보통) · 0.1 ~ 99.9 (0점·100점에 닿지 않는다)
 * 팡·기억력은 짧을수록 좋아서 최상 < 보통, 점프·테트리스는 길수록 좋아서 최상 > 보통 · 서버가 방향까지 검사한다. */
var OLY_LOWER={ pang:1, word:1 };
var OLY_DIR={ pang:"완주 시간 · 짧을수록", jump:"버틴 시간 · 길수록", tetris:"버틴 시간 · 길수록", word:"걸린 시간 · 짧을수록" };
function olyPtsC(rec,b){ if(!(rec>0)||!b||!(b.mid>0)||!(b.top>0)||b.mid===b.top) return 0; var z=Math.log(rec/b.mid)/Math.log(b.top/b.mid); return Math.max(0.1,Math.min(99.9,Math.round(1000/(1+Math.pow(9,-z)))/10)); }
function secC(cs){ return (Number(cs||0)/100).toFixed(1)+"초"; }
/* 입력칸을 바꾸면 그 종목의 미리보기 한 줄을 다시 그린다 · 저장 전 확인용 */
function olyPrev(g){
  var mid=Number((el("olyM_"+g)||{}).value), top=Number((el("olyT_"+g)||{}).value), p=el("olyP_"+g); if(!p) return;
  var ok=mid>0&&top>0&&mid!==top&&(OLY_LOWER[g]?top<mid:top>mid);
  if(!ok){ p.textContent=OLY_LOWER[g]?"최상 < 보통이어야 합니다":"최상 > 보통이어야 합니다"; p.style.color="var(--bad)"; return; }
  var b={mid:mid,top:top}, far=Math.round(mid*Math.pow(top/mid,2)), low=Math.round(mid*mid/top);
  p.style.color="";
  p.textContent=secC(low)+" = "+olyPtsC(low,b)+"점 · "+secC(mid)+" = 50점 · "+secC(top)+" = 90점 · "+secC(far)+" = "+olyPtsC(far,b)+"점";
}
function olySave(){
  var d=ST.data.olyr||{}, base={}, bad="";
  (d.events||[]).forEach(function(g){
    var mid=Number((el("olyM_"+g)||{}).value), top=Number((el("olyT_"+g)||{}).value);
    if(!(mid>0)||!(top>0)||Math.round(mid)!==mid||Math.round(top)!==top||mid===top||(OLY_LOWER[g]?top>=mid:top<=mid)) bad=g;
    base[g]={mid:mid,top:top};
  });
  if(bad){ toast("기준을 확인해 주세요 · "+(OLY_NAME[bad]||bad)+" ("+(OLY_LOWER[bad]?"최상 < 보통":"최상 > 보통")+" · 1 이상 정수)"); return; }
  call("oly_cfg",{base:JSON.stringify(base)},function(r){ if(r&&r.ok){ toast("환산 기준을 저장했습니다"); load(); } else toast("실패: "+(r&&r.reason||"")+(r&&r.game?" · "+(OLY_NAME[r.game]||r.game):"")); },function(){ toast("서버 응답 없음"); });
}
