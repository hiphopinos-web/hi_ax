<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AXF CONTROL · 운영 관리</title>
<!-- 외부 리소스를 쓰지 않는다. Pretendard 가 기기에 있으면 쓰고, 없으면 맑은 고딕으로 떨어진다.
     이 파일은 public 저장소에 올라간다. 관리코드·백엔드 비밀값을 절대 적지 않는다. -->
<style>
/* v3.95 콘솔 톤 (사용자 지정 260919 · 총무전용공간 관리자맵 레퍼런스)
   연회색 바탕 + 흰 카드(12px · 옅은 테두리) · 주 색은 네이비 하나(활성 탭 · 주 버튼 · 제목)
   상태색은 채도를 낮춘 초록 · 앰버 · 적갈 · 현대해상 오렌지는 주의 배지에만 쓴다.
   참가자 앱의 「파랑 금지」(design.md)는 앱 셸 규칙이다. 운영 콘솔은 이 레퍼런스를 따른다.
   글자는 6단계만 쓴다: 28 숫자 · 22 페이지 제목 · 16 카드 제목 · 14 본문 · 13 보조 · 12 캡션 */
:root{
  --bg:#F2F4F7; --sf:#FFFFFF; --soft:#F9FAFB;
  --line:#E5E7EB; --line2:#EFF0F3; --line3:#D1D5DB;
  --tx:#14171F; --tx2:#4B5060; --tx3:#80848F;
  --navy:#00205B; --navy8:#0D2461; --navy1:#DFE3EF; --navy05:#EEF0F7;
  --ok:#1E7B4F; --ok-bg:#EAF5EF; --ok-bd:#CFE6D9;
  --warn:#8A5A12; --warn-bg:#FFF6E3; --warn-bd:#F3DFB3;
  --bad:#A63A34; --bad-bg:#FBF0EF; --bad-bd:#EFD3D0;
  --brand:#FF7E31;
  --fs-kpi:28px; --fs-h1:22px; --fs-h2:16px; --fs-b:14px; --fs-s:13px; --fs-c:12px;
  --r:12px; --r-s:8px;
  --sh-lg:0 12px 28px rgba(8,24,74,.14),0 4px 8px rgba(8,24,74,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  font-size:var(--fs-b);line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.n,td.n,.num{font-variant-numeric:tabular-nums}
b,strong{font-weight:700}

/* ── 상단바 · 가로 탭 한 줄 · 활성 탭은 네이비로 채운다 ── */
header.top{position:sticky;top:0;z-index:30;height:60px;background:var(--sf);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 24px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;flex-shrink:0}
.brand b{font-size:var(--fs-h2);font-weight:800;color:var(--navy);letter-spacing:.01em}
.brand span{font-size:var(--fs-c);color:var(--tx3);font-weight:600}
nav.tabs{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{padding:7px 12px;border-radius:var(--r-s);font-weight:600;color:var(--tx3);white-space:nowrap;flex-shrink:0}
nav.tabs button:hover{background:var(--bg);color:var(--tx)}
nav.tabs button.on{background:var(--navy);color:#fff}
.tbadge{display:inline-block;margin-left:6px;min-width:18px;padding:0 6px;border-radius:99px;background:var(--brand);color:#fff;
  font-size:var(--fs-c);font-weight:800;font-style:normal;line-height:18px;text-align:center}
nav.tabs button.on .tbadge{background:#fff;color:var(--navy)}
.hr{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;white-space:nowrap;font-size:var(--fs-s);color:var(--tx3)}
.hr b{color:var(--tx2)}
.role{font-size:var(--fs-c);font-weight:700;color:var(--navy);background:var(--navy05);border:1px solid var(--navy1);border-radius:99px;padding:2px 10px}

/* ── 버튼 · 주(네이비) · 보조(흰 테두리) · 위험(적갈) · 고스트 · sm ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r-s);
  font-weight:600;background:var(--sf);color:var(--tx2);border:1px solid var(--line3);white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--tx3);color:var(--tx)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy8);border-color:var(--navy8)}
.btn.danger{color:var(--bad);border-color:var(--bad-bd);background:var(--sf)}
.btn.danger:hover{background:var(--bad-bg);border-color:var(--bad)}
.btn.danger.fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--tx3)}
.btn.ghost:hover{background:var(--bg);color:var(--tx)}
.btn.sm{padding:5px 10px;font-size:var(--fs-s)}
.btn:disabled{opacity:.45;cursor:default}

/* ── 페이지 뼈대 · 제목 + 한 줄 설명 → 서브탭 칩 → 툴바 → 본문 ── */
main{padding:24px 24px 72px;max-width:1480px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:var(--fs-h1);font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.3}
.ph p{font-size:var(--fs-s);color:var(--tx3);margin-top:4px}
.ph .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fchip{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);
  background:var(--sf);font-size:var(--fs-s);font-weight:600;color:var(--tx2)}
.fchip:hover{border-color:var(--tx3);color:var(--tx)}
.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.fchip .cnt{font-size:var(--fs-c);font-weight:800;border-radius:99px;padding:0 7px;background:var(--navy05);color:var(--navy);font-variant-numeric:tabular-nums}
.fchip.on .cnt{background:rgba(255,255,255,.2);color:#fff}
.fchip.zero .cnt{background:var(--line2);color:var(--tx3)}
.fchip .sep{color:var(--tx3)}
.chips .arrow{align-self:center;color:var(--line3);font-size:var(--fs-s)}
.chips .gap{width:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .cnt{font-size:var(--fs-s);color:var(--tx3)}
.toolbar .cnt b{color:var(--tx)}
.toolbar .sp{flex:1}
.in{height:36px;padding:0 12px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--sf);min-width:220px;color:var(--tx)}
.in::placeholder{color:var(--tx3)}
.in:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy05)}
select.in{min-width:130px;padding-right:8px}
textarea.in{height:auto;min-height:72px;padding:9px 12px;resize:vertical;width:100%}
.in.sm{height:30px;min-width:0;padding:0 8px;font-size:var(--fs-s)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-c);font-weight:600;color:var(--tx2)}

/* ── 카드 ── */
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:16px}
.card:first-child{margin-top:0}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ch h2{font-size:var(--fs-h2);font-weight:700;color:var(--tx)}
.ch .sub{font-size:var(--fs-s);color:var(--tx3)}
.ch .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.grid{display:grid;gap:16px;margin-top:16px}
.grid>.card{margin-top:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g57{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
@media(max-width:1100px){.g2,.g3,.g57{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){header.top{height:auto;flex-wrap:wrap;padding:10px 16px;gap:8px}nav.tabs{order:3;width:100%}.hr{flex-wrap:wrap;margin-left:0}main{padding:16px 16px 60px}.ph .r{margin-left:0}.card .pp-sum{grid-template-columns:minmax(0,1fr)}.card .slots{grid-template-columns:minmax(0,1fr)}}

/* KPI 타일 · 큰 숫자 + 라벨 + 보조 한 줄 */
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi .l{font-size:var(--fs-s);color:var(--tx2);font-weight:600}
.kpi .v{font-size:var(--fs-kpi);font-weight:800;line-height:1.15;margin-top:6px;color:var(--tx);font-variant-numeric:tabular-nums}
.kpi .v em{font-style:normal;font-size:var(--fs-s);font-weight:600;color:var(--tx3);margin-left:4px}
.kpi .x{font-size:var(--fs-c);color:var(--tx3);margin-top:4px}
.kpi.link{cursor:pointer}.kpi.link:hover{border-color:var(--navy)}
.kpi .bar{margin-top:10px}

/* 막대 · 네이비 채움, 트랙은 옅은 네이비 */
.bar{height:8px;border-radius:99px;background:var(--navy05);overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:99px}
.bar.over i{background:var(--bad)}

/* 표 */
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-s)}
table.tb{width:100%;border-collapse:collapse;background:var(--sf)}
table.tb th{text-align:left;font-size:var(--fs-c);color:var(--tx3);font-weight:600;padding:9px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.tb td{padding:10px 12px;vertical-align:middle;border-bottom:1px solid var(--line2)}
table.tb tr:last-child td{border-bottom:0}
table.tb tbody tr:hover td,table.tb tr.hv:hover td{background:var(--soft)}
table.tb tr.click{cursor:pointer}
table.tb tr.sel td{background:var(--navy05)}
table.tb tr.flash td{animation:fl 1.2s ease-out}
@keyframes fl{from{background:#FFF6E3}to{background:transparent}}
table.tb.plain{border:0}
.tdr,th.tdr{text-align:right;white-space:nowrap}
.tdc{text-align:center}
td .who2{font-weight:700;color:var(--tx)}
td .who2 small,.who2 small{display:block;font-size:var(--fs-c);color:var(--tx3);font-weight:500}
.scrolly{max-height:460px;overflow:auto}
.ck{width:16px;height:16px;accent-color:var(--navy);cursor:pointer;vertical-align:middle}
td.ckc,th.ckc{width:40px;text-align:center;padding-left:14px;padding-right:0}
.acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:nowrap}
.bartb td{border:0;padding:6px 0}
.bartb td.l{width:190px;white-space:nowrap;padding-right:12px;font-size:var(--fs-s)}
.bartb td.v{width:88px;text-align:right;font-size:var(--fs-s);font-variant-numeric:tabular-nums;padding-left:12px}

/* 상태 배지 · 알약 */
.tag{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:var(--fs-c);font-weight:700;border-radius:99px;padding:2px 10px;
  color:var(--navy);background:var(--navy05);border:1px solid var(--navy1)}
.tag.pri{color:#fff;background:var(--navy);border-color:var(--navy)}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-bd)}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
.tag.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-bd)}
.tag.off{color:var(--tx3);background:var(--soft);border-color:var(--line)}
.tag.brand{color:#fff;background:var(--brand);border-color:var(--brand)}
.cap{font-size:var(--fs-c);color:var(--tx3)}
.src{font-size:var(--fs-c);color:var(--tx3)}
.muted{color:var(--tx2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.empty{padding:28px;text-align:center;font-size:var(--fs-s);color:var(--tx3);background:var(--soft);border:1px dashed var(--line3);border-radius:var(--r-s)}
.note{font-size:var(--fs-s);color:var(--tx2);background:var(--soft);border:1px solid var(--line2);border-radius:var(--r-s);padding:10px 12px}
.note.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
.note b{color:var(--tx)}

/* 운영 메모 · 긴 설명은 접어 둔다 */
details.memo{margin-top:16px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--soft)}
details.memo summary{cursor:pointer;list-style:none;padding:10px 14px;font-size:var(--fs-s);font-weight:700;color:var(--tx2);display:flex;align-items:center;gap:8px}
details.memo summary::-webkit-details-marker{display:none}
details.memo summary::before{content:"";width:6px;height:6px;border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);transform:rotate(-45deg);transition:transform .15s}
details.memo[open] summary::before{transform:rotate(45deg)}
details.memo .mb{padding:0 14px 12px 28px;font-size:var(--fs-s);color:var(--tx2);line-height:1.7}
details.memo .mb p+p{margin-top:6px}
details.memo .mb ol{padding-left:18px}

/* 흐름 (신청 → 승인 → 체크인 → 완료) */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .fs{flex:1;min-width:84px;padding:10px 12px;border:1px solid var(--line);background:var(--sf);cursor:pointer}
.flow .fs+.st{border-left:0}
.flow .fs:first-child{border-radius:var(--r-s) 0 0 var(--r-s)}
.flow .fs.last{border-radius:0 var(--r-s) var(--r-s) 0}
.flow .fs.end{border-radius:var(--r-s);margin-left:8px;border-left:1px solid var(--line);background:var(--soft)}
.flow .fs:hover{border-color:var(--navy)}
.flow .fs .l{font-size:var(--fs-c);color:var(--tx3);font-weight:600}
.flow .fs .v{font-size:var(--fs-h1);font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums;line-height:1.2}
.flow .fs.hot .v{color:var(--navy)}

/* 지금 처리할 일 */
.todo{display:flex;flex-direction:column}
.todo .it{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line2)}
.todo .it:first-child{border-top:0}
.todo .it .v{font-size:var(--fs-h1);font-weight:800;text-align:right;font-variant-numeric:tabular-nums;color:var(--navy)}
.todo .it.zero .v{color:var(--line3)}
.todo .it .t{font-weight:700}
.todo .it .d{font-size:var(--fs-c);color:var(--tx3)}
.todo .it.zero .t{color:var(--tx3);font-weight:600}

/* 개인 스탬프 패널 · 왼쪽 목록 · 오른쪽 8칸 */
.sp{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1000px){.sp{grid-template-columns:minmax(0,1fr)}.sp .lnb{position:static}.sp .lnb ul{max-height:260px}}
.lnb{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:12px;position:sticky;top:76px}
.lnb .in{width:100%;min-width:0}
.lnb .cap{padding:8px 4px 6px}
.lnb ul{list-style:none;max-height:calc(100vh - 230px);overflow:auto;display:flex;flex-direction:column;gap:2px}
.lnb li button{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);text-align:left}
.lnb li button:hover{background:var(--bg)}
.lnb li button.on{background:var(--navy);color:#fff}
.lnb li .nm{font-weight:700;font-size:var(--fs-s)}
.lnb li .em{font-size:var(--fs-c);color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnb li button.on .em{color:#C9D2EA}
.lnb li .c{margin-left:auto;font-size:var(--fs-c);font-weight:700;color:var(--tx3);font-variant-numeric:tabular-nums;flex-shrink:0}
.lnb li button.on .c{color:#fff}
.pp-h{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.pp-h .nm{font-size:var(--fs-h1);font-weight:800;color:var(--navy);line-height:1.2}
.pp-h .em{font-size:var(--fs-s);color:var(--tx3);margin-top:4px}
.pp-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.pp-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.pp-sum>div{border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px}
.pp-sum .l{font-size:var(--fs-c);color:var(--tx3);font-weight:600}
.pp-sum .v{font-size:var(--fs-h1);font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.pp-sum .v em{font-style:normal;font-size:var(--fs-s);color:var(--tx3);font-weight:600;margin-left:3px}
.pp-sum .x{font-size:var(--fs-c);color:var(--tx2);margin-top:2px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
@media(max-width:1280px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{border:1px solid var(--line);border-radius:var(--r-s);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:148px;background:var(--sf)}
.slot.got{border-color:var(--navy1);background:var(--navy05)}
.slot .no{font-size:var(--fs-c);font-weight:800;color:var(--tx3);font-variant-numeric:tabular-nums}
.slot.got .no{color:var(--navy)}
.slot .nm{font-weight:700}
.slot .via{font-size:var(--fs-c);color:var(--tx2);min-height:18px}
.slot .ft{margin-top:auto;display:flex;align-items:center;gap:8px}
.slot .ft .btn{margin-left:auto}
.stamps{display:flex;gap:3px;flex-wrap:nowrap}
.st{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;background:var(--sf);border:1px solid var(--line);color:var(--line3);font-variant-numeric:tabular-nums}
.st.got{background:var(--navy);border-color:var(--navy);color:#fff}
.st.old{background:var(--soft);color:var(--tx3);text-decoration:line-through}

/* 선택 일괄 처리 바 */
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;background:var(--navy05);border:1px solid var(--navy1);border-radius:var(--r-s)}
.bulk .c{font-size:var(--fs-s);color:var(--tx2);margin-right:auto}
.bulk .c b{color:var(--navy)}

/* 잠금 화면 */
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:80}
#lock .box{width:min(400px,90vw);background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:32px 28px;text-align:center}
#lock .box b{display:block;color:var(--navy);font-size:var(--fs-h1);font-weight:800}
#lock .box p{color:var(--tx2);margin:6px 0 18px;font-size:var(--fs-s)}
#lock input{width:100%;text-align:center;font-size:var(--fs-h2);letter-spacing:.2em;height:44px}
#lock .err{color:var(--bad);font-size:var(--fs-c);min-height:18px;margin-top:8px}

/* 확인 창 · 제목 · 설명 · 대상 · 영향 · 오른쪽 버튼 */
.overlay{position:fixed;inset:0;background:rgba(8,24,74,.42);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:72px 16px;overflow:auto}
.overlay.on{display:flex}
.ocard{background:var(--sf);border-radius:var(--r);width:min(500px,100%);padding:24px;box-shadow:var(--sh-lg)}
.ocard.wide{width:min(640px,100%)}
.ot{font-size:var(--fs-h2);font-weight:800;color:var(--navy);margin-bottom:6px}
.os{font-size:var(--fs-s);color:var(--tx2);line-height:1.65}
.os b{color:var(--tx)}
.who{margin-top:14px;padding:12px 14px;background:var(--soft);border:1px solid var(--line2);border-radius:var(--r-s);font-size:var(--fs-b);font-weight:700}
.who span{display:block;font-size:var(--fs-c);font-weight:500;color:var(--tx3);margin-top:2px}
.imp{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.imp div{display:flex;justify-content:space-between;gap:12px;padding:8px 14px;font-size:var(--fs-s);border-top:1px solid var(--line2)}
.imp div:first-child{border-top:0}
.imp div span{color:var(--tx3)}
.imp div b{font-variant-numeric:tabular-nums}
.imp div.chg b{color:var(--navy)}
.imp div.loss b{color:var(--bad)}
.oa{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.oa .btn{padding:9px 18px}
.guide{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.guide .gs{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;background:var(--soft);border:1px solid var(--line2);border-radius:var(--r-s)}
.guide .gn{flex-shrink:0;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--navy);color:#fff;font-size:var(--fs-c);font-weight:800}
.guide .gt{font-size:var(--fs-s);line-height:1.65;color:var(--tx2)}
.guide .gt b{color:var(--navy)}

/* 상세 패널 (오른쪽 서랍) */
#drwBg{position:fixed;inset:0;background:rgba(8,24,74,.18);z-index:50;display:none}
#drw{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--sf);border-left:1px solid var(--line);z-index:55;
  box-shadow:var(--sh-lg);transform:translateX(105%);transition:transform .18s ease-out;display:flex;flex-direction:column}
#drw.on{transform:none}
#drwBg.on{display:block}
#drw .dh{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
#drw .dh .nm{font-size:var(--fs-h1);font-weight:800;color:var(--navy);line-height:1.2}
#drw .dh .em{font-size:var(--fs-s);color:var(--tx3);margin-top:4px}
#drw .dh .x{margin-left:auto}
#drw .db{padding:18px 22px 28px;overflow:auto;flex:1}
#drw h3{font-size:var(--fs-s);font-weight:800;color:var(--tx2);margin:18px 0 8px}
#drw h3:first-child{margin-top:0}
.steps{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.steps span{font-size:var(--fs-c);font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--tx3);border:1px solid var(--line)}
.steps span.done{color:var(--navy);background:var(--navy05);border-color:var(--navy1)}
.steps span.cur{color:#fff;background:var(--navy);border-color:var(--navy)}
.steps i{font-style:normal;color:var(--line3)}
.hist{list-style:none;display:flex;flex-direction:column}
.hist li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line2);font-size:var(--fs-s)}
.hist li:first-child{border-top:0}
.hist li .t{color:var(--tx3);width:72px;flex-shrink:0;font-variant-numeric:tabular-nums}

/* 알림 · 되돌리기 버튼을 품는다 */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);background:var(--tx);color:#fff;
  padding:10px 12px 10px 18px;border-radius:var(--r-s);font-size:var(--fs-s);font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:90;display:flex;gap:14px;align-items:center;max-width:min(640px,92vw);box-shadow:var(--sh-lg)}
#toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{color:#FFD27A;font-weight:800;padding:4px 8px;border-radius:6px}
#toast button:hover{background:rgba(255,255,255,.12)}
#toast .tt{padding-right:6px}
.olyev{border-top:1px solid var(--line2);padding:16px 0 8px}
.olyev:first-of-type{border-top:0;padding-top:4px}
.olyh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.olyh b{font-size:var(--fs-h2)}
.olyf{display:flex;flex-wrap:wrap;gap:12px 16px}
.olysub{font-size:var(--fs-c);font-weight:700;color:var(--tx2);margin:14px 0 8px}
.olysub:first-child{margin-top:0}
.olyfl{width:156px}
.tb tr.dim td{color:var(--tx3)}
.tb td.oxq{min-width:260px;max-width:420px;white-space:normal}
.olyfl .in{min-width:0;width:100%}
.olyfl .h{font-weight:400;color:var(--tx3);line-height:1.4}
.olyfl .e{color:var(--bad);line-height:1.4}
.in.bad{border-color:var(--bad);background:var(--bad-bg)}
.in:disabled{background:var(--soft);color:var(--tx3)}
.olypv{margin-top:12px;max-width:760px}
.olypv td,.olypv th{padding:7px 12px}
.olypv .chg{color:var(--navy)}
tr.olytop td{border-top:1px solid var(--line)}
.btn.xp{padding:4px 8px;color:var(--tx2);font-variant-numeric:tabular-nums}
.btn.xp i{width:6px;height:6px;border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);transform:rotate(45deg);margin:-3px 0 0 4px;transition:transform .15s}
.btn.xp.on{background:var(--navy05);color:var(--navy)}
.btn.xp.on i{transform:rotate(-135deg);margin-top:3px}
tr.brkrow td{background:var(--soft)}
table.brk{max-width:640px}
table.brk td{padding:5px 12px;border-bottom:1px solid var(--line2)}
table.brk tr.tot td{border-bottom:0;border-top:1px solid var(--line3)}
.err-banner{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-bd);border-radius:var(--r-s);padding:10px 14px;font-size:var(--fs-s);margin-bottom:16px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--navy1);border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.drop{display:block;margin-top:12px;border:1.5px dashed var(--line3);border-radius:var(--r-s);padding:22px;text-align:center;cursor:pointer;background:var(--soft)}
.drop:hover{border-color:var(--navy)}
/* ── v4.13 타자왕전 · 콘솔 진행 화면 ── */
.rcode{font-size:var(--fs-kpi);font-weight:800;letter-spacing:.18em;color:var(--navy);font-variant-numeric:tabular-nums}
.rlink{min-width:0;width:100%;font-size:var(--fs-c);color:var(--tx2)}
.rbar{height:8px;border-radius:99px;background:var(--navy05);overflow:hidden;min-width:120px}
.rbar i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .9s linear}
/* ── v4.20 타자왕전 · 큰 화면 (사이니지 세계 · design.md §0~§5 · 블랙 스테이지 + 어두운 도트 격자 + Vibrant Orange)
   크기는 1920 폭 기준 비율(vw) · 경기 중에는 선수마다 요약 카드 한 장(1 · 2 · 4분할) · 연보라(#E6CCFF)는 「오늘 1등」 라벨에만 찍는다 ── */
#rtv{position:fixed;inset:0;z-index:58;background:#000;color:#fff;display:none;overflow:hidden;letter-spacing:-.01em;cursor:default}
#rtv.on{display:block}
#rtv canvas{position:absolute;inset:0;width:100%;height:100%}
#rtv .in0{position:absolute;inset:0;padding:2.6vw 3.4vw;display:flex;flex-direction:column}
#rtv .n{font-variant-numeric:tabular-nums}
#rtv .hd{display:flex;align-items:baseline;gap:1.6vw}
#rtv .hd .b{font-size:2.1vw;font-weight:600;color:#FF7E31}
#rtv .hd .t{font-size:1.25vw;font-weight:600;color:rgba(255,255,255,.72)}
#rtv .hd .r{margin-left:auto;display:flex;align-items:baseline;gap:.8vw;font-size:1.25vw;color:rgba(255,255,255,.72);font-weight:600}
#rtv .hd .r b{font-size:3.6vw;font-weight:700;color:#FF7E31;line-height:1}
#rtv .bd{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
#rtv .ey{font-size:1.5vw;font-weight:600;color:#FF963E}
#rtv .hl{font-size:5.4vw;font-weight:700;line-height:1.15;color:#FF7E31;margin-top:.6vw}
#rtv .sb{font-size:1.7vw;color:rgba(255,255,255,.72);margin-top:1vw}
#rtv .seats{display:grid;gap:1.4vw;margin-top:3vw}
#rtv .seat{border-radius:1.6vw;background:rgba(255,255,255,.07);padding:2vw 2.2vw;min-height:13vw;display:flex;flex-direction:column;justify-content:space-between}
#rtv .seat .no{font-size:1.4vw;font-weight:600;color:rgba(255,255,255,.48)}
#rtv .seat .nm{font-size:3.2vw;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rtv .seat.empty .nm{color:rgba(255,255,255,.28);font-weight:500}
#rtv .seat.on .no{color:#FF963E}
#rtv .cd{font-size:24vw;font-weight:700;line-height:1;color:#FF7E31;text-align:center}
#rtv .cdn{display:flex;justify-content:center;gap:3vw;font-size:2vw;font-weight:700;color:rgba(255,255,255,.72);margin-top:2vw}
/* 경기 중 · 요약 카드 격자 (v4.20 · 1분할 · 2분할 · 4분할) */
#rtv .grid{flex:1;display:grid;gap:1.6vw;min-height:0}
#rtv .grid.g1{grid-template-columns:1.55fr 1fr}
#rtv .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
#rtv .grid.g4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
#rtv .pl{position:relative;border-radius:1.8vw;background:rgba(255,255,255,.07);padding:2vw 2.4vw;display:flex;flex-direction:column;justify-content:center;gap:.6vw;min-height:0;overflow:hidden;border:.25vw solid transparent}
#rtv .pl.lead{border-color:#FF7E31;background:rgba(255,126,49,.16)}
#rtv .pl.fin{background:rgba(255,255,255,.04)}
#rtv .pl.empty{align-items:center;justify-content:center;background:rgba(255,255,255,.03)}
#rtv .pl.empty .nm{font-size:1.8vw;color:rgba(255,255,255,.28);font-weight:500}
#rtv .pl.best{background:rgba(230,204,255,.08)}
#rtv .pl.best .no{color:#E6CCFF}
#rtv .pl.best .sc{color:#E6CCFF}
#rtv .pl .pt{display:flex;align-items:baseline;gap:1vw}
#rtv .pl .no{font-size:1.3vw;font-weight:600;color:rgba(255,255,255,.48)}
#rtv .pl .rk{margin-left:auto;font-size:1.9vw;font-weight:700;color:#FF963E}
#rtv .pl .nm{font-size:2.6vw;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rtv .pl .sc{font-size:7vw;font-weight:700;line-height:1;color:#FF7E31}
#rtv .pl.solo .sc,#rtv .grid.g1 .sc{font-size:9vw}
#rtv .grid.g4 .sc{font-size:5.4vw}
#rtv .pl .hh{display:flex;gap:.6vw;margin-top:.3vw}
#rtv .pl .hh i{width:1.5vw;height:1.5vw;border-radius:.3vw;background:#3A3A3A;display:block}
#rtv .pl .hh i.on{background:#FF7E31}
#rtv .pl .sub{font-size:1.4vw;font-weight:600;color:rgba(255,255,255,.6)}
#rtv .pl .badge{position:absolute;right:1.6vw;bottom:1.4vw;font-size:1.2vw;font-weight:700;color:rgba(255,255,255,.48)}
#rtv .pl .badge:empty{display:none}
#rtv .res{display:flex;flex-direction:column;gap:1vw;margin-top:2.4vw}
#rtv .rr{display:grid;grid-template-columns:7vw minmax(0,1fr) 14vw 11vw 10vw;gap:1.4vw;align-items:center;padding:1.3vw 2vw;border-radius:1.4vw;background:rgba(255,255,255,.07)}
#rtv .rr.w{background:rgba(255,126,49,.2)}
#rtv .rr .rk{font-size:3.2vw;font-weight:700;color:#FF7E31}
#rtv .rr .nm{font-size:2.8vw;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rtv .rr .c{text-align:right;font-size:2.4vw;font-weight:700}
#rtv .rr .c small{display:block;font-size:1vw;color:rgba(255,255,255,.48);font-weight:600}
#rtv .pod{display:flex;align-items:flex-end;justify-content:center;gap:2vw;margin-top:2vw;flex:1}
#rtv .pc{width:22vw;display:flex;flex-direction:column;align-items:center;text-align:center}
#rtv .pc .nm{font-size:3vw;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rtv .pc .rc{font-size:1.4vw;color:rgba(255,255,255,.72);margin:.4vw 0 1.2vw;font-weight:600}
#rtv .pc .blk{width:100%;border-radius:1.6vw 1.6vw 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:1.6vw;font-size:5vw;font-weight:700;color:#000}
#rtv .pc.p1 .blk{height:34vh;background:#FF7E31}
#rtv .pc.p2 .blk{height:26vh;background:#FF963E}
#rtv .pc.p3 .blk{height:20vh;background:#FFB284}
#rtv .pc.p1 .nm{font-size:3.8vw;color:#FF7E31}
#rtv .ctl{position:absolute;right:1.6vw;bottom:1.4vw;display:flex;gap:8px;opacity:0;transition:opacity .25s}
#rtv.ui .ctl{opacity:1}
#rtv .ctl button{padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.6);color:rgba(255,255,255,.85);font-size:13px;font-weight:600}
#rtv .ctl button:hover{border-color:#FF7E31;color:#fff}
#rtv .ctl button:disabled{opacity:.35;cursor:default}
#rtv .ctl .k{font-size:11px;color:rgba(255,255,255,.45);margin-left:4px}
/* ── v4.16 아이디어 · Wall QR 퀴즈 문항 편집 ── */
td.itx{min-width:280px;max-width:520px;white-space:normal;line-height:1.55}
.ilist{list-style:none;display:flex;flex-direction:column}
.ilist li{padding:10px 0;border-top:1px solid var(--line2)}
.ilist li:first-child{border-top:0;padding-top:0}
.ilist .it{color:var(--tx);line-height:1.55}
.ilist .im{font-size:var(--fs-c);color:var(--tx3);margin-top:4px}
.wqset{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:12px;margin-bottom:4px}
.wqset .in{min-width:0;width:100%}
.wqq{border:1px solid var(--line);border-radius:var(--r-s);padding:14px;margin-top:12px;background:var(--sf)}
.wqh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.wqh .sp{flex:1}
.wqq>textarea.in{min-height:56px}
.wqq>.wqcnt{display:block;margin-top:2px}
.wqos{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.wqos>.btn{align-self:flex-start;margin-top:4px}
.wqo{display:grid;grid-template-columns:auto minmax(0,1fr) 64px auto;gap:8px;align-items:center;padding:4px 8px;border-radius:var(--r-s)}
.wqo.on{background:var(--navy05)}
.wqo .in{min-width:0;width:100%}
.wqcnt{font-size:var(--fs-c);color:var(--tx3);font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.wqcnt.over{color:var(--bad);font-weight:700}
.wqbar{position:sticky;top:60px;z-index:5;background:var(--sf);padding:8px 0;border-bottom:1px solid var(--line2)}
@media(max-width:900px){.wqset{grid-template-columns:minmax(0,1fr)}.wqo{grid-template-columns:auto minmax(0,1fr) auto}.wqo .wqcnt{display:none}}
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <b>AXF CONTROL</b>
    <p>운영 관리 콘솔입니다. 관리코드를 입력하세요.</p>
    <input id="key" class="in" type="password" inputmode="numeric" autocomplete="off" placeholder="관리코드">
    <div class="err" id="lockErr"></div>
    <button class="btn pri" style="width:100%;margin-top:8px;height:44px" onclick="unlock()">들어가기</button>
    <p class="src" style="margin:14px 0 0">코드는 이 브라우저 탭이 열려 있는 동안만 기억합니다. 탭을 닫으면 다시 입력합니다.</p>
  </div>
</div>

<header class="top">
  <div class="brand"><b>AXF CONTROL</b><span>운영 관리</span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="hr">
    <button class="btn sm ghost" onclick="guide()">사용 안내</button>
    <span class="role">관리자</span>
    <span id="stamp" class="cap">·</span>
    <button class="btn sm" onclick="refresh()">새로고침</button>
    <button class="btn sm ghost" onclick="lock()">잠금</button>
  </div>
</header>
<main id="view"></main>
<div id="drwBg" onclick="drwClose()"></div>
<aside id="drw" aria-label="상세"></aside>
<div id="rtv" aria-label="타자왕전 TV 화면"><canvas id="rtvCv"></canvas><div class="in0" id="rtvIn"></div></div>
<div id="toast"><span class="tt" id="toastT"></span><button id="toastU" style="display:none">되돌리기</button></div>
<div id="dlg" class="overlay" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <div class="ocard" id="dlgCard">
    <div class="ot" id="dlgT"></div>
    <div class="os" id="dlgS"></div>
    <div class="who" id="dlgWho"></div>
    <div id="dlgX"></div>
    <div class="oa"><button class="btn" id="dlgCancel" onclick="dlgClose()">닫기</button><button class="btn pri" id="dlgOk" onclick="dlgGo()">확인</button></div>
  </div>
</div>
<script>
/* ══════════════════ 0. 설정 ══════════════════ */
/* 백엔드 URL 은 비밀이 아니다(앱 소스에도 있다). 관리코드는 파일에 두지 않는다. */
var BE = "https://script.google.com/macros/s/AKfycbwjCaSSUnQ7W1lrM8T426Cn_LgKs_UhI0Qi5XRVk-_eF-oD55-Wwjsot0DkPJCX9JqMBA/exec";
/* v4.10 (260922) 참가자 앱과 같은 서버에 부담을 주지 않게 30초 자동 폴링을 5분으로 늦춘다.
   화면(탭)마다 필요한 액션만 메모리 캐시(§1-1)에 5분 동안 담아 둔다. 그 안에서는 탭을 옮겨도 서버를 다시 부르지 않는다. */
var POLL_MS = 300000;
var CACHE_MS = 300000;
/* 메뉴마다 같은 뼈대: 제목 + 한 줄 설명(d) → 서브탭 칩 → 툴바 → 본문 */
var TABS = [
  { id:"dash",  n:"대시보드", d:"지금 처리할 일과 오늘의 숫자를 한 화면에 봅니다." },
  { id:"acct",  n:"계정", d:"로그인한 사람과 비밀번호 분실 요청을 처리합니다." },
  { id:"stamp", n:"스탬프", d:"사번이나 이름으로 한 사람을 골라 스탬프를 부여하거나 취소합니다." },

function goTo(t, sub, filt){ if(sub) ST.subs[t]=sub; go(t); if(filt){ ST.filt=filt; render(); } }
function sub(){ return ST.subs[ST.tab]; }
function renderTabs(){
  /* v3.88 계정 탭에 비밀번호 요청 대기 수를 배지로 (데스크가 놓치지 않게) */
  var wait=pwWait();
  el("tabs").innerHTML=TABS.map(function(t){ var b=(t.id==="acct"&&wait)?'<em class="tbadge">'+wait+'</em>':''; return '<button class="'+(ST.tab===t.id?"on":"")+'" onclick="go(\''+t.id+'\')">'+esc(t.n)+b+'</button>'; }).join("");
}
/* 수동 새로고침 · 지금 화면에 필요한 것만 캐시를 무시하고 강제로 다시 받는다. 연타 방지로 10초에 한 번만 서버를 부른다. */
var _lastManual=0;
function refresh(){
  var t=Date.now();
  if(t-_lastManual<10000){ toast("잠시 뒤에 다시 눌러 주세요"); return; }
  _lastManual=t;
  load(true,{force:true});
}
var _poll=null;
/* 5분마다 지금 보는 화면(탭)에 필요한 액션만 다시 받는다. 캐시가 아직 5분 안이면 실제 서버 호출 없이 그대로 끝난다.
   탭이 가려져 있으면(document.hidden) 쉬고, 다시 보일 때 한 번 확인한다. */
function schedule(){ clearTimeout(_poll); _poll=setTimeout(function(){ if(!document.hidden && key()) load(); else schedule(); },POLL_MS); }
document.addEventListener("visibilitychange",function(){ if(!document.hidden&&key()) load(); });

/* v4.16 서브탭에서만 쓰는 액션 · 그 서브탭을 열 때만 부른다(함수면 지금 고른 값으로 만든다 · 담당 명단은 프로그램마다 다른 요청) */
var SUBNEED={
  "stamp:ops":[{k:"slist",a:"stamp_list"}],
  "stamp:wq":[{k:"wq",a:"wq_get"}],
  "apply:roster":function(){ return [{k:"ros_"+ROS.prog,a:"staff_roster",p:{prog:ROS.prog}}]; }
};
function needOf(t){ var x=SUBNEED[t+":"+(ST.subs[t]||"")]; return NEED[t].concat(typeof x==="function"?x():(x||[])); }
/* v4.11 (사용자 승인 260922) 비밀번호 요청 배지 · 계정 탭 배지와 대시보드 「지금 처리할 일」은 대기 건수만 있으면 된다.
   목록(pw_req_list)은 계정 탭만 받고, 다른 탭은 5분 자동 업데이트 때 건수만 주는 pw_req_count 하나를 더 부른다(캐시 규칙 같음).
   목록을 받으면 그 대기 수로 건수 캐시도 고쳐 둔다. 다른 탭으로 옮겨도 5분 전 건수가 방금 처리한 결과를 덮지 않게. */
var PWC={k:"pwc",a:"pw_req_count"};
function pwWait(){ return ST.pwN||0; }
function pwTake(out){
  if(out.pwreq){ var n=((out.pwreq.rows)||[]).filter(function(r){ return r.status==="대기"; }).length;
    ST.pwN=n; _cache[sig_(PWC.a,{})]={ data:{ ok:true, waiting:n }, at:Date.now() }; }
  else if(out.pwc&&out.pwc.ok) ST.pwN=Number(out.pwc.waiting)||0;
}
/* 탭을 빨리 바꾸면 앞선 요청이 뒤에 도착한다. 최신 요청만 화면에 반영한다. */
ST.seq=0;
/* opts.only = 이 탭의 NEED 중 이 키들만 받는다(처리 직후 그 액션만 다시 받을 때 씀 · reload() 참고).
   opts.force = 캐시를 무시하고 반드시 서버를 부른다(수동 새로고침). 둘 다 없으면 탭 전체를 캐시에 맡겨 필요한 만큼만 서버를 부른다. */
function load(manual, opts){
  if(!key()) return;
  opts=opts||{};
  var need=opts.only?needOf(ST.tab).filter(function(it){ return opts.only.indexOf(it.k)>=0; }):needOf(ST.tab);
  if(!opts.only&&!need.some(function(it){ return it.k==="pwreq"; })) need=need.concat([PWC]);
  if(!need.length) return;
  var seq=++ST.seq;
  ST.busy=true; stampTick();
  callAllCached(need, !!opts.force, function(out,err){
    if(seq!==ST.seq){ for(var k0 in out) if(out[k0]) ST.data[k0]=out[k0]; pwTake(out); applyOvr(); return; }   /* 데이터는 챙기고 화면은 안 건드린다 */
    ST.busy=false;
    for(var k in out) if(out[k]) ST.data[k]=out[k];
    pwTake(out);
    applyOvr();
    ST.at=new Date(); ST.err=err;
    stampTick();
    renderTabs(); render(); schedule();
    if(manual&&!err) toast("갱신했습니다");
  });
}
/* 처리(부여·취소·승인·발송 등) 뒤에 쓴다. 탭 전체를 다시 받지 않고 그 처리로 바뀐 액션만 강제로 새로 받는다. */
function reload(keys){ load(false,{only:keys,force:true}); }
/* 헤더의 「마지막 업데이트 n분 전」 · 네트워크 없이 문구만 다시 그린다(15초마다 틱) */
function stampTick(){
  var s=el("stamp"); if(!s) return;
  if(ST.busy){ s.innerHTML='<span class="spin"></span>불러오는 중'; return; }
  if(ST.err){ s.innerHTML='<span style="color:var(--bad)">일부 실패</span>'; return; }
  if(!ST.at){ s.textContent="·"; return; }
  var m=Math.floor((Date.now()-ST.at.getTime())/60000);
  s.textContent=m<1?"방금 업데이트":m+"분 전 업데이트";
}
setInterval(function(){ if(!ST.busy) stampTick(); },15000);
/* 처리 직후 20초 동안은 방금 바꾼 값을 서버 목록 위에 덮는다.
   그 사이 도착한 폴링 응답이 처리 전 값일 수 있어서다(시트 쓰기와 읽기 사이의 틈). 서버 값이 같아지면 덮기를 멈춘다. */
function ovrSet(k, patch){ ST.ovr[k]={ p:patch, exp:Date.now()+20000 }; }
function applyOvr(){
  var now=Date.now();
  function ap(list, keyOf){ (list||[]).forEach(function(r){ var k=keyOf(r), o=ST.ovr[k]; if(!o) return;
    if(o.exp<now){ delete ST.ovr[k]; return; }
    var same=true; for(var f in o.p) if(String(r[f])!==String(o.p[f])) same=false;
    if(same) delete ST.ovr[k]; else for(var f2 in o.p) r[f2]=o.p[f2]; }); }
  ap((ST.data.resv||{}).rows, function(r){ return "resv:"+r.id; });
  ap((ST.data.cchat||{}).rows, function(r){ return "cc:"+normE(r.emp); });
  ap((ST.data.sess||{}).rows, function(r){ return "ss:"+normE(r.emp)+":"+r.sid; });
}

/* 값을 고칠 때 있던 자리를 지킨다. 화면을 통째로 다시 그리므로 스크롤·포커스를 직접 되돌린다. */
function render(){
  var v=el("view"), top=window.scrollY, ae=document.activeElement, fIdx=-1, selS=null, selE=null;
  if(ae&&v.contains(ae)&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)){ var fl=v.querySelectorAll("input,select,textarea"); for(var i=0;i<fl.length;i++) if(fl[i]===ae){fIdx=i;break;} try{ selS=ae.selectionStart; selE=ae.selectionEnd; }catch(e){} }
  var h="";
  /* 아직 안 받은 탭은 빈 표 대신 「불러오는 중」을 보인다. 빈 표는 「신청이 없다」로 읽힌다. */
  var missing=needOf(ST.tab).filter(function(it){ return !ST.data[it.k]; });
  if(missing.length&&ST.busy){
    h=tabHead()+'<div class="card"><p class="muted"><span class="spin"></span>서버에서 불러오는 중입니다. 보통 2~5초 걸립니다.</p></div>';
  } else {
    try{ h=ST.tab==="dash"?viewDash():ST.tab==="acct"?viewAcct():ST.tab==="stamp"?viewStamp():ST.tab==="notice"?viewNotice():ST.tab==="survey"?viewSurvey():ST.tab==="typing"?viewTyping():ST.tab==="photo"?viewPhoto():ST.tab==="art"?viewArt():ST.tab==="race"?viewRace():ST.tab==="idea"?viewIdea():viewApply(); }
    catch(e){ h='<div class="err-banner">화면을 그리는 중 오류가 났습니다: '+esc(e.message)+'</div>'; }
  }
  if(ST.err) h='<div class="err-banner">일부 데이터를 못 받았습니다('+esc(ST.err.reason||"")+'). 새로고침을 눌러 주세요. 표시된 값은 마지막으로 받은 것입니다.</div>'+h;
  v.innerHTML=h;
  if(fIdx>=0){ var f2=v.querySelectorAll("input,select,textarea"); if(f2[fIdx]){ try{f2[fIdx].focus({preventScroll:true});}catch(e){f2[fIdx].focus();} try{ if(selS!=null) f2[fIdx].setSelectionRange(selS,selE); }catch(e){} } }
  window.scrollTo(0,top);
  renderDrawer();
}
function setQ(v){ ST.q=v; render(); }
function setFilt(v){ ST.filt=v; ST.sel={}; render(); }
function setSub(v){ ST.subs[ST.tab]=v; ST.q=""; ST.filt=""; ST.sel={}; drwClose(true); load(); render(); }
function match(row, fields){ if(!ST.q) return true; var q=ST.q.toLowerCase(); return fields.some(function(f){ return String(row[f]||"").toLowerCase().indexOf(q)>=0; }); }

/* ── 상세 패널 (오른쪽 서랍) ── */
function drwOpen(kind, k){ ST.drw={ kind:kind, k:k }; renderDrawer(); }
function drwClose(silent){ ST.drw=null; el("drw").className=""; el("drwBg").className=""; if(!silent) render(); }
function renderDrawer(){
  var d=ST.drw, box=el("drw");
  if(!d){ box.className=""; el("drwBg").className=""; return; }
  var h=d.kind==="resv"?drwResv(d.k):d.kind==="cc"?drwCchat(d.k):d.kind==="ss"?drwSess(d.k):"";
  if(!h){ ST.drw=null; box.className=""; el("drwBg").className=""; return; }
  var keep=box.querySelector("textarea"), memoV=keep&&keep===document.activeElement?keep.value:null;
  var sc=(box.querySelector(".db")||{}).scrollTop||0;
  box.innerHTML=h; box.className="on"; el("drwBg").className="on";
  if(memoV!=null){ var t=box.querySelector("textarea"); if(t){ t.value=memoV; t.focus(); } }
  var db=box.querySelector(".db"); if(db) db.scrollTop=sc;
}
function drwHead(name, sub0){ return '<div class="dh"><div><div class="nm">'+esc(name||"-")+'</div><div class="em">'+sub0+'</div></div><button class="btn sm ghost x" onclick="drwClose()">닫기</button></div>'; }
/* 한 사람의 신청 이력 · 신청 탭이 이미 받은 네 목록에서 모은다 */
function personHist(emp){
  var e=normE(emp), out=[];
  ((ST.data.resv||{}).rows||[]).forEach(function(r){ if(normE(r.emp)===e) out.push(["상담 "+hhmm(r.slot), r.status, short(r.ts)]); });
  ((ST.data.cchat||{}).rows||[]).forEach(function(r){ if(normE(r.emp)===e) out.push(["커피챗"+(r.tag?" · "+r.tag:""), r.status, short(r.ts)]); });
  ((ST.data.sess||{}).rows||[]).forEach(function(r){ if(normE(r.emp)===e) out.push([SESS_NAME[r.sid]||r.sid, r.status, short(r.ts)]); });
  var h='<h3>신청 기록</h3>'+(out.length?'<ul class="hist">'+out.map(function(x){ return '<li><span class="t">'+esc(x[2])+'</span><span style="flex:1">'+esc(x[0])+'</span>'+tag(x[1], RESV_TAG[x[1]]||CC_TAG[x[1]]||"off")+'</li>'; }).join("")+'</ul>':'<p class="cap">없음</p>');
  var hs=HIST[e]||[];
  h+='<h3>이 콘솔에서 한 처리</h3>'+(hs.length?'<ul class="hist">'+hs.map(function(x){ return '<li><span class="t">'+esc(x.t)+'</span><span>'+esc(x.x)+'</span></li>'; }).join("")+'</ul>':'<p class="cap">아직 없음 · 서버 기록은 시트가 정본입니다</p>');
  return h;
}

/* 보상 변화 줄 · 확인 창 「영향」 */
function rwImpact(n0, n1, extra){
  var a=reward(n0), b=reward(n1), out=[["스탬프", n0+"개 → "+n1+"개", "chg"]];
  if(a.roulette!==b.roulette) out.push(["룰렛 자격", b.roulette?"생김":"없어짐", b.roulette?"chg":"loss"]);
  else out.push(["룰렛 자격", a.roulette?"그대로 (있음)":"그대로 (없음)"]);
  if(a.tickets!==b.tickets) out.push(["응모권 자격", a.tickets+"장 → "+b.tickets+"장", b.tickets>a.tickets?"chg":"loss"]);
  else out.push(["응모권 자격", "그대로 ("+a.tickets+"장)"]);
  return out.concat(extra||[]);
}
function spRow(emp){ return spPeople().by[normE(emp)]; }
/* 서버 응답의 목록으로 그 사람 행만 고친다(표 전체를 다시 받지 않는다) */
function spApply(emp, stamps, id, via){
  var d=ST.data.stamp=ST.data.stamp||{rows:[]}, k=normE(emp), r=null;
  for(var i=0;i<d.rows.length;i++) if(normE(d.rows[i].emp)===k){ r=d.rows[i]; break; }
  if(!r){ var b=spRow(emp)||{emp:emp,name:"",dept:""}; r={ emp:b.emp, name:b.name, dept:b.dept, stamps:[], via:{}, n:0, roulette:false, tk:0, rv:0, last:"" }; d.rows.unshift(r); }
  r.stamps=(stamps||[]).filter(function(x){ return STAMP_ORDER.indexOf(x)>=0; }); r.n=r.stamps.length; r.via=r.via||{};
  if(via) r.via[id]={ v:via, t:nowHMS() }; else delete r.via[id];
  r.last=r.last||"";
}
function stGrant(emp, id, quiet){

function resvDo(ids, status, opt){

  var skip=ids.length-rows.length;

    dlgForce();
    var prev={}; rows.forEach(function(r){ prev[r.id]=r.status; });
    var items=rows.map(function(r){ var target=opt.undo?opt.undo[r.id]:status;

      else { hist(it.r.emp, "상담 "+hhmm(it.r.slot)+" "+(opt.undo?"되돌림 → ":"")+it.r.status+(res.stamp&&!res.stamp.dup?" · 스탬프 03 적립":"")); if(!opt.undo) delete ST.sel["r:"+it.r.id]; }
    }, function(okN,bad){

      var undoIds=items.filter(function(it){ return bad.every(function(b){ return b.it!==it; }); }).map(function(it){ return it.r.id; });

    who:rows.length===1?esc(rows[0].name)+'<span>사번 '+esc(rows[0].emp)+' · 슬롯 '+esc(hhmm(rows[0].slot))+' · 지금 '+esc(rows[0].status)+'</span>':namesOf(rows),

function preCheck(grid){

  if(!grid.length){ PRE.rows=[]; PRE.errs=[{line:0,msg:"빈 파일입니다"}]; return; }
  var head=grid[0].map(preHeadKey), ix={};
  head.forEach(function(k,i){ if(k&&!(k in ix)) ix[k]=i; });
  PRE.errs=[]; PRE.warn=[]; PRE.rows=[];
  if(!("sid" in ix)||!("emp" in ix)){ PRE.errs.push({line:1,msg:"첫 행에 「세션」「사번」 열이 필요합니다"}); return; }
  var seen={};
  for(var i=1;i<grid.length;i++){
    var r=grid[i], rawS=String(r[ix.sid]||"").trim(), emp=String(r[ix.emp]||"").trim().replace(/\.0$/,"");
    var sid=preSidOf(rawS), line=i+1, msg="";
    if(!sid) msg="알 수 없는 세션 「"+rawS+"」";
    else if(!emp) msg="사번이 비어 있음";
    else if(!/^[A-Za-z0-9]+$/.test(emp)) msg="사번 형식 이상 「"+emp+"」";
    else { var key=sid+"|"+emp.replace(/^0+(?=.)/,"").toUpperCase(); if(seen[key]) msg="같은 세션 사번 중복 ("+seen[key]+"행과 같음)"; else seen[key]=line; }
    var row={ line:line, sid:sid, emp:emp, name:"name" in ix?String(r[ix.name]||"").trim():"", dept:"dept" in ix?String(r[ix.dept]||"").trim():"", err:msg };
    if(msg) PRE.errs.push({line:line,msg:msg});
    PRE.rows.push(row);
  }
}
function preSummary(){
  var by={}; (PRE.rows||[]).forEach(function(r){ if(!r.err) by[r.sid]=(by[r.sid]||0)+1; });
  return by;
}
function preApply(){
  var good=(PRE.rows||[]).filter(function(r){ return !r.err; }), by=preSummary(), S2=(ST.data.pre||{}).sess||{};
  var sids=PRE_SESS.filter(function(id){ return by[id]; });
  if(!good.length||PRE.busy) return;
  dialog({ t:"사전 신청 명단을 교체할까요?", s:"올린 파일에 있는 세션의 명단을 통째로 바꿉니다."+(PRE.errs.length?" 오류 "+PRE.errs.length+"행은 제외합니다.":""),
    who:sids.map(function(id){ return esc(SESS_NAME[id])+" · 기존 "+((S2[id]||{}).list||0)+"명 → 새 "+by[id]+"명"; }).join("<br>"), ok:"교체",
    onOk:function(){ dlgForce(); preSend(good, sids); } });
}
function preSend(good, sids){
  var up="u"+Date.now().toString(36)+Math.random().toString(36).slice(2,8), chunks=[];
  for(var i=0;i<good.length;i+=PRE_CHUNK) chunks.push(good.slice(i,i+PRE_CHUNK).map(function(r){ return [r.sid,r.emp,r.name,r.dept]; }));
  PRE.busy=true; PRE.pct=0; render();
  var k=0;
  (function next(){
    call("pre_upload",{ up:up, i:k, n:chunks.length, sids:sids.join(","), rows:JSON.stringify(chunks[k]) },function(r){
      if(!r||!r.ok){ PRE.busy=false; render(); toast("반영 실패 ("+(r&&r.reason||"")+") · 기존 명단은 그대로입니다"); return; }
      k++; PRE.pct=Math.round(k/chunks.length*100); render();
      if(k<chunks.length) return next();
      var msg=Object.keys(r.change||{}).map(function(id){ return (SESS_NAME[id]||id)+" "+r.change[id].before+"→"+r.change[id].after+"명"; }).join(" · ");
      preReset(); toast("반영 완료 · "+msg); reload(["pre"]);
    },function(e){ PRE.busy=false; render(); toast("서버 응답 없음 · 기존 명단은 그대로입니다. 다시 반영하세요"); });
  })();
}

/* 서버 olyScore_ 와 같은 식 · 미리보기·구성 펼침용(순위의 정본은 서버 계산) */
function olyScoreC(game,p,rule){
  var R=rule[game], n=function(k){ return Number(p&&p[k])||0; }, s=0, i;
  if(!R) return 0;
  if(game==="pang") s=n("fin")>0?Math.round(1000*Math.pow(R.base*100/n("fin"),R.pow)):0;
  else if(game==="jump") s=n("obs")*R.obs+n("coin")*R.coin+n("fact")*R.fact;
  else if(game==="tetris"){ var ln=n("lines"); s=Math.min(n("blk"),R.blockMax)*R.block+Math.min(ln,R.lineFull)*R.line+Math.max(0,ln-R.lineFull)*R.lineAfter+n("c2")*R.multi[2]+n("c3")*R.multi[3]+n("c4")*R.multi[4]; }
  else if(game==="word"){ for(i=0;i<R.tiers.length;i++) s+=n("j"+i)*R.tiers[i][1]; s+=n("j"+R.tiers.length)*R.base+n("cl")*R.clean-n("wr")*R.wrong; }
  else if(game==="ox") s=p&&p.sim?oxSim(p.sim,R).pts:n("c1")*R.base[0]+n("c2")*R.base[1]+n("c3")*R.base[2]+n("sp")+n("cb")+n("fb")+n("gb")-n("pn")+n("arr");
  return Math.max(0,Math.min(rule.cap,s));
}
/* v4.11 AI O/X 미리보기 · 서버 oxTally_ 와 같은 식으로 가상의 한 판을 센다(황금 자리 없음).
   ex = { pat:"OOOX" (O 정답 · X 오답 · P 판자, 되풀이), t: 한 문제에 쓰는 시간(1/100초) } · 한도보다 오래 걸리면 낙하로 센다.
   기록 행의 구성 펼침은 제출된 구성 요소 합(c1~c3 × 기본 + 속도 + 연속 + 피버 + 황금 − 감점)으로 보인다. */
/* v4.12 유리다리 · 줄 시간 rowT 가 첫 줄 → 마지막 줄로 짧아지고, 여유 lead(1/100줄)가 줄 시간 동안 100 줄어든다 · 한도 = lead × 줄 시간
   한도 안에 못 답하면 낙하(−pen · 목숨 −1) · 목숨 0 · 줄을 다 건넘(도착 보너스) · 시간 끝에서 멈춘다 · 연출 시간은 서버 OX_STEP 과 같다 */
var OX_STEP_C={ hop:50, plank:80, fall:170 };
function oxRowTC(R,i){ var N=R.per[0]+R.per[1]+R.per[2]; return Math.round(R.rowT[0]+(R.rowT[1]-R.rowT[0])*Math.min(i,N-1)/Math.max(1,N-1)); }
function oxSim(ex,R){
  var T={n:0,c1:0,c2:0,c3:0,wr:0,hs:0,fl:0,pa:0,sp:0,cb:0,fb:0,gb:0,gc:0,pn:0,hp:0,mx:0,used:0,life:R.lives,arr:0,pts:0,end:""}, run=0, fever=0, dl=R.sec, tot=R.per[0]+R.per[1]+R.per[2], lead=R.lead[0];
  for(var i=0;;i++){
    var rt=oxRowTC(R,i), lim=Math.ceil(lead*rt/100);
    T.end=T.life<=0?"life":T.n>=tot?"arrive":T.used>=dl?"time":"";
    if(T.end) break;
    var c=ex.pat.charAt(i%ex.pat.length), lv=T.n<R.per[0]?1:T.n<R.per[0]+R.per[1]?2:3, t=ex.t;
    if(c==="P"&&T.pa>=R.pass) c="O";
    if(t>=lim){ c="T"; t=lim; }
    if(t>=dl-T.used){ T.end="time"; break; }
    T.n++;
    if(c==="P") T.pa++;
    else if(c==="O"){
      var sp=Math.round(R.speed*Math.max(0,Math.min(1,(R.limit-t)/(R.limit-R.full)))), cb=R.combo*Math.min(run,R.comboMax), raw=R.base[lv-1]+sp+cb, mul=fever>0?R.feverMul:1;
      T["c"+lv]++; T.sp+=sp; T.cb+=cb; T.pts+=raw*mul; T.fb+=raw*(mul-1);
      if(fever>0) fever--;
      run++; if(run>T.mx) T.mx=run;
      if(run%R.feverAt===0) fever=R.feverLen;
      if(run%R.bonusAt===0){ T.hp++; dl+=R.bonusSec; }
    } else { var pn=R.pen*(c!=="T"&&t<R.hasty?2:1); T.pn+=pn; T.pts-=pn; T.life--; if(c==="T") T.fl++; else { T.wr++; if(t<R.hasty) T.hs++; } run=0; fever=0; }
    T.used+=t+(c==="P"?OX_STEP_C.plank:c==="O"?OX_STEP_C.hop:OX_STEP_C.fall);
    lead=Math.min(R.lead[2],Math.max(R.lead[1],lead-Math.round(t*100/rt)+100));
  }
  if(T.end==="arrive"){ T.arr=R.arrive+T.life*R.lifeBonus+Math.floor(Math.max(0,dl-T.used)/100)*R.secBonus; T.pts+=T.arr; }
  return T;
}
/* 팡 · 상한에 닿는 완주 시간(초) */
function olyPangCapSec(R,cap){ return R.base*Math.pow(1000/cap,1/R.pow); }

  if(g==="ox") return "유리다리 "+(P.per[0]+P.per[1]+P.per[2])+"줄 · "+(P.sec/100)+"초 · 목숨 "+P.lives+" · 기본 "+P.base.join("/")+" · 속도 +"+P.speed+" · 연속 +"+P.combo+" · 오답·낙하 −"+P.pen+" · 피버 ×"+P.feverMul+" · 황금 ×"+P.goldMul+" · 도착 "+P.arrive+" + 목숨×"+P.lifeBonus+" + 초×"+P.secBonus;

/* 대표 카운터 중앙값 한 줄 (서버 keyField: 팡 fin · 점프 obs · 테트리스 lines · 기억력 wr) */

/* 구성 요소 → [항목, 계산, 점수] · 점수 null = 참고 값(점수 아님) */
function olyBreak(g,p,rule){
  var R=rule[g], n=function(k){ return Number(p&&p[k])||0; }, o=[];
  if(!R) return o;
  if(g==="pang"){
    o.push([R.goal+"칸 완주 "+csS(n("fin")), "1000 × ("+R.base+" ÷ "+(n("fin")/100).toFixed(1)+")^"+R.pow, n("fin")>0?Math.round(1000*Math.pow(R.base*100/n("fin"),R.pow)):0]);
    o.push(["터뜨린 칸 · 바꾼 수 · 튕긴 수", n("tiles")+"칸 · "+n("moves")+"수 · "+n("bad")+"수", null]);
  } else if(g==="jump"){
    o.push(["넘은 장애물", n("obs")+"개 × "+R.obs, n("obs")*R.obs]);
    o.push(["코인", n("coin")+"개 × "+R.coin, n("coin")*R.coin]);
    o.push(["AI 상식", n("fact")+"개 × "+R.fact, n("fact")*R.fact]);
    o.push(["부딪힘 · 버틴 시간", n("hits")+"번 · "+csS(n("surv")), null]);
  } else if(g==="tetris"){
    var ln=n("lines"), bk=Math.min(n("blk"),R.blockMax);
    o.push(["놓은 블록", bk+"개 × "+R.block+(n("blk")>R.blockMax?" (놓은 "+n("blk")+"개 중 "+R.blockMax+"개까지)":""), bk*R.block]);
    o.push(["지운 줄", Math.min(ln,R.lineFull)+"줄 × "+R.line, Math.min(ln,R.lineFull)*R.line]);
    if(ln>R.lineFull) o.push([(R.lineFull+1)+"번째 줄부터", (ln-R.lineFull)+"줄 × "+R.lineAfter, (ln-R.lineFull)*R.lineAfter]);
    [2,3,4].forEach(function(k){ o.push([k+"줄 동시 보너스", n("c"+k)+"번 × "+R.multi[k], n("c"+k)*R.multi[k]]); });
    o.push(["1줄 삭제 · 레벨 · 버틴 시간", n("c1")+"번 · "+n("lv")+" · "+csS(n("surv")), null]);
  } else if(g==="word"){
    R.tiers.forEach(function(t,i){ o.push([OLY_TIER[i]+" ("+(t[0]/100)+"초 안)", n("j"+i)+"칸 × "+t[1], n("j"+i)*t[1]]); });

    o.push(["오답 감점", n("wr")+"번 × −"+R.wrong, -n("wr")*R.wrong]);
    o.push(["무오답 라운드", n("cl")+"번 × "+R.clean, n("cl")*R.clean]);
    o.push(["떠올린 시간", csS(n("used")), null]);
  } else if(g==="ox"){
    [1,2,3].forEach(function(lv){ o.push([lv+"단계 정답", n("c"+lv)+"개 × "+R.base[lv-1], n("c"+lv)*R.base[lv-1]]); });
    o.push(["속도 점수", "제출된 합", n("sp")]);
    o.push(["연속 점수", "최대 연속 "+n("mx"), n("cb")]);
    o.push(["피버 추가", "×"+R.feverMul+" 구간", n("fb")]);
    o.push(["황금 추가", n("gc")+"번 × "+R.goldMul, n("gb")]);
    o.push(["오답·낙하 감점", "오답 "+n("wr")+"번 (성급 "+n("hs")+"번 2배) · 낙하 "+n("fl")+"번", -n("pn")]);
    o.push(["도착 보너스", n("arr")?R.arrive+" + 남은 목숨 "+n("life")+" × "+R.lifeBonus+" + 남은 초 × "+R.secBonus:"도착 못 함", n("arr")]);
    o.push(["건넌 줄 · 판자 · 시간 추가 · 남은 목숨", n("n")+"줄 · "+n("pa")+"번 · +"+n("hp")+"번 · "+n("life")+"개", null]);

  }

  return o;
}

function gstMatch(r,q){ if(!q) return true; return (r.nick||"").toLowerCase().indexOf(q)>=0 || (r.name||"").toLowerCase().indexOf(q)>=0 || String(r.emp||"").indexOf(q)>=0; }

function olyDraft(){
  var S=(ST.data.olyr||{}).rule, R=JSON.parse(JSON.stringify(S)), err={}, rerr="";
  OLY_F.forEach(function(f,i){
    var s=olyRaw(i,S).trim(), v=Number(s), m="";
    if(s===""||!isFinite(v)) m="숫자를 넣어 주세요";
    else if(f.cs||f.sc){ var c=Math.round(v*100); if(Math.abs(v*100-c)>1e-6) m="0.01"+f.u+" 단위까지"; else if(c<f.lo||c>f.hi) m=(f.lo/100)+"~"+(f.hi/100)+f.u; else v=c; }
    else if(f.i&&Math.round(v)!==v) m="정수만";
    else if(v<f.lo||v>f.hi) m=f.lo+"~"+n0(f.hi)+" 사이";
    if(m) err[i]=m; else olySetP(R,olyObj(f),v);
  });
  for(var t=1;t<4;t++) if(!(R.word.tiers[t][0]>R.word.tiers[t-1][0])){ rerr="기억력 · 등급 시간은 번개 < 빠름 < 좋음 < 보통 순으로 길어야 합니다"; break; }

function oxRuleErrs(X,room){
  var e=[], sec=function(v){ return (v/100)+"초"; }, row=function(v){ return (v/100)+"줄"; };
  if(!(X.full<X.limit)) e.push("AI O/X · 속도 만점 시간("+sec(X.full)+")은 속도 0 시간("+sec(X.limit)+")보다 짧아야 합니다");
  if(X.rowT[1]>X.rowT[0]) e.push("AI O/X · 줄 내려오는 시간 끝("+sec(X.rowT[1])+")이 처음("+sec(X.rowT[0])+")보다 깁니다. 다리는 뒤로 갈수록 같거나 빨라져야 합니다");
  if(X.lead[1]>X.lead[0]) e.push("AI O/X · 여유 줄 최소("+row(X.lead[1])+")가 시작("+row(X.lead[0])+")보다 큽니다. 최소 ≤ 시작이어야 합니다");
  if(X.lead[0]>X.lead[2]) e.push("AI O/X · 여유 줄 시작("+row(X.lead[0])+")이 최대("+row(X.lead[2])+")보다 큽니다. 시작 ≤ 최대여야 합니다");
  if(X.lead[1]*X.rowT[1]<20000) e.push("AI O/X · 가장 짧은 읽을 시간이 "+(X.lead[1]*X.rowT[1]/10000).toFixed(2)+"초입니다(여유 줄 최소 "+row(X.lead[1])+" × 줄 시간 끝 "+sec(X.rowT[1])+"). 2초 이상이 되게 둘 중 하나를 늘려 주세요");
  if(room) for(var d=0;d<3;d++) if(X.per[d]>room[d]){ e.push("AI O/X · "+(d+1)+"단계 줄 수 "+X.per[d]+"줄이 켜진 문항 "+room[d]+"개(짝은 하나로 셈)보다 많습니다"); break; }
  return e;

/* ── 9-4. 부스 QR · 인쇄용 코드 · 인쇄 원본은 QR 테스트/qr_mother.py 가 만든다(브랜드 도안 + 인식 검증) ──
 * 콘솔은 서버 코드를 보여 주고 codes.json 을 내려준다. 그 파일을 QR 테스트/ 에 넣고 qr_mother.py 를 돌리면 out/light · out/dark 에 실제 코드판이 나온다.
 * (260922 확인: 지금 out/ 의 p1~p3 는 codes.json 에 부스 코드가 없어 견본 코드 AXSSAMPLE 로 만든 것이다 · 인쇄 금지) */
function boothRows(){ return ((ST.data.slist||{}).rows||[]).slice().sort(function(a,b){ return (a.id<b.id?-1:1); }); }
function qrCodesJson(){
  var out={};
  boothRows().forEach(function(r){ if(STAMP_META[r.id]&&!STAMP_META[r.id].old) out[r.id]=r.code; });
  ((ST.data.stair||{}).rows||[]).forEach(function(r){ out["st"+("0"+r.fl).slice(-2)+"-"+r.r]=r.code; });
  return out;
}
function qrCodesDl(){
  var o=qrCodesJson(), n=Object.keys(o).length;
  if(!n){ toast("받은 코드가 없습니다"); return; }
  var blob=new Blob([JSON.stringify(o,null,1)+"\n"],{type:"application/json"}), a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="codes.json"; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },400);
  toast("codes.json · 코드 "+n+"개");
}
function boothCard(){
  var d=ST.data.slist, rows=boothRows();
  if(!d) return card("부스 QR","인쇄용 · 스탬프 01 · 02 · 03",'<p class="muted"><span class="spin"></span>코드를 불러오는 중입니다.</p>');
  var cur=rows.filter(function(r){ return STAMP_META[r.id]&&!STAMP_META[r.id].old; }), old=rows.filter(function(r){ return !(STAMP_META[r.id]&&!STAMP_META[r.id].old); });
  return card("부스 QR","인쇄용 · 스탬프 01 · 02 · 03 · 코드를 바꾸면 다시 인쇄",
    (cur.length?'<div class="wrap"><table class="tb"><tr><th>스탬프</th><th>지점</th><th>운영 시간</th><th>코드</th><th>QR 내용</th><th>인쇄 파일</th><th>상태</th></tr>'+cur.map(function(r){
      return '<tr><td>'+tag("스탬프 "+STAMP_META[r.id].no)+'</td><td style="white-space:nowrap"><b>'+esc(r.name)+'</b></td><td class="n" style="white-space:nowrap">'+esc(hhmm(r.s))+' ~ '+esc(hhmm(r.e))+'</td><td class="n"><b>'+esc(r.code)+'</b></td>'+
        '<td class="n cap">'+esc(appBase())+'#s='+esc(r.code)+'</td><td class="n cap">'+esc(r.id)+'.png</td><td>'+(r.on?tag("운영","ok"):tag("꺼짐","off"))+'</td></tr>'; }).join("")+'</table></div>'
      :'<div class="empty">설치된 부스 지점이 없습니다. 백엔드 stamp_install 로 만듭니다.</div>')+
    (old.length?'<p class="cap mt8">옛 지점 '+old.map(function(r){ return esc(r.id+" "+r.name)+(r.on?" (운영 중)":" (꺼짐)"); }).join(" · ")+' · 인쇄하지 않습니다.</p>':'')+
    '<div class="row mt12"><button class="btn pri" onclick="qrCodesDl()">codes.json 내려받기 (부스 + 계단)</button><span class="cap">인쇄 원본을 만드는 파일입니다. 아래 운영 메모의 순서대로 씁니다.</span></div>'+
    memo('<ol><li><b>codes.json 내려받기</b>를 눌러 받은 파일로 <code>QR 테스트/codes.json</code>을 바꿉니다(부스 3곳 + 계단 36곳의 지금 서버 코드).</li>'+
      '<li><code>QR 테스트</code> 폴더에서 <code>python qr_mother.py</code>를 돌립니다. 모든 QR을 다시 만들고 인식 검증까지 합니다(실패가 있으면 종료코드 1).</li>'+
      '<li><code>QR 테스트/out/light</code>(흰 벽) 또는 <code>/dark</code>(어두운 곳)의 <b>p1.png · p2.png · p3.png</b>를 인쇄합니다. 라벨에 「견본」이 보이면 인쇄하지 않습니다.</li>'+
      '<li>붙인 뒤 폰 기본 카메라로 한 번 찍어 이 표의 코드로 적립되는지 확인합니다.</li></ol>'+
      '<p>260922 기준 <code>QR 테스트/out</code>의 p1~p3은 부스 코드 없이 만든 <b>견본(AXSSAMPLE)</b>입니다. 반드시 위 순서로 다시 만듭니다. 코드 전면 교체(stamp_rotate)를 하면 인쇄물도 다시 뽑습니다.</p>'));
}

/* ══════════════════ 8. 시작 ══════════════════ */
renderTabs();
if(key()){ el("lock").style.display="none"; load(); render(); } else lock();
</script>
