<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AXF CONTROL · 운영 관리</title>
<!-- 외부 리소스를 쓰지 않는다. Pretendard 가 기기에 있으면 쓰고, 없으면 맑은 고딕으로 떨어진다.
     이 파일은 public 저장소에 올라간다. 관리코드·백엔드 비밀값을 절대 적지 않는다. -->
<style>
/* design.md v29 · 흰 바탕 + 연주황(O10) 무보더 카드 · 텍스트 무채색 · 오렌지는 CTA 1개와 브랜드 문구 */
:root{
  --bg:#FFFFFF; --card:#FFEBE0; --card2:#FFF6F0; --line:#FFD8C1;
  --o100:#FF7E31; --o50:#FFBF98; --o25:#FFD8C1; --o10:#FFEBE0; --o5:#FFF6F0;
  --tx:#111111; --tx2:#555555; --tx3:#8A8A8A; --faint:#B5B5B5;
  --ok:#1FA45B; --bad:#E5484D;
  --r:20px; --rs:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.n{font-variant-numeric:tabular-nums}

/* 헤더 */
header{display:flex;align-items:center;gap:18px;padding:14px 24px;position:sticky;top:0;background:var(--bg);z-index:5}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{color:var(--o100);font-size:19px;font-weight:800;letter-spacing:.02em}
.brand span{color:var(--tx3);font-size:12.5px;font-weight:600}
nav.tabs{display:flex;gap:4px;margin-left:8px}
nav.tabs button{padding:8px 14px;border-radius:999px;font-weight:600;color:var(--tx2)}
nav.tabs button.on{background:var(--o10);color:var(--tx)}
.hr{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--tx3);font-size:12.5px}
.hr b{color:var(--tx);font-weight:700}
.btn{padding:8px 14px;border-radius:999px;font-weight:700;background:var(--o10);color:var(--tx)}
.btn.pri{background:var(--o100);color:#fff}
.btn.ghost{background:transparent;color:var(--tx2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}

main{padding:6px 24px 60px;max-width:1440px;margin:0 auto}
h1{font-size:22px;font-weight:700;margin:14px 0 4px}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--tx3);margin-top:2px}
h2{font-size:15px;font-weight:700;margin-bottom:10px}
.card{background:var(--card);border-radius:var(--r);padding:18px 20px;margin-top:14px}
.card.soft{background:var(--card2)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1000px){.g4,.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}header{flex-wrap:wrap}nav.tabs{order:3;width:100%;margin:6px 0 0}}

/* KPI */
.kpi{background:var(--card);border-radius:var(--r);padding:16px 18px}
.kpi .l{font-size:12px;color:var(--tx3);font-weight:600}
.kpi .v{font-size:28px;font-weight:800;line-height:1.1;margin-top:4px}
.kpi .v em{font-style:normal;font-size:13px;font-weight:600;color:var(--tx3);margin-left:4px}
.kpi .x{font-size:12px;color:var(--tx2);margin-top:6px}

/* 게이지 · 채움 O100, 트랙은 흰색(카드가 O10 이라) */
.bar{height:8px;border-radius:99px;background:#fff;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--o100);border-radius:99px}
.bar.over i{background:var(--bad)}

/* 표 */
table.tb{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border-radius:var(--rs);overflow:hidden}
table.tb th{text-align:left;font-size:11.5px;color:var(--tx3);font-weight:600;padding:9px 10px;background:var(--card2)}
table.tb td{padding:9px 10px;vertical-align:middle;border-top:1px solid var(--o5)}
table.tb tr:hover td{background:var(--o5)}
.wrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--o10);color:var(--tx)}
.pill.on{background:var(--o100);color:#fff}
.pill.off{background:#F1F1F1;color:var(--tx3)}
.pill.ok{background:#E6F6EC;color:#177A44}
.pill.bad{background:#FDE8E9;color:#B4272B}
.src{font-size:11.5px;color:var(--tx3)}
.muted{color:var(--tx2)}
.faint{color:var(--faint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.in{padding:9px 12px;border-radius:var(--rs);border:0;background:#fff;min-width:200px}
.in:focus{outline:2px solid var(--o50)}
select.in{min-width:120px}
.note{font-size:12.5px;color:var(--tx2);padding-left:10px;border-left:2px solid var(--o25)}
.mt12{margin-top:12px}.mt6{margin-top:6px}
.stamps{display:flex;gap:4px;flex-wrap:wrap}
.st{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;background:#fff;color:var(--faint)}
.st.got{background:var(--o100);color:#fff}
.st.old{background:#EEE;color:var(--faint);text-decoration:line-through}

/* 잠금 화면 */
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
#lock .box{width:min(380px,90vw);background:var(--card);border-radius:var(--r);padding:28px 26px;text-align:center}
#lock .box b{display:block;color:var(--o100);font-size:24px;font-weight:800}
#lock .box p{color:var(--tx2);margin:6px 0 18px;font-size:13.5px}
#lock input{width:100%;text-align:center;font-size:20px;letter-spacing:.2em;padding:12px}
#lock .err{color:var(--bad);font-size:12.5px;min-height:18px;margin-top:8px}

/* 확인 창 · 총무전용공간 관리자맵의 overlay 문법(어두운 배경, 위쪽에 뜨는 카드, 제목·설명·대상·오른쪽 버튼)을
   콘솔 토큰으로 옮겼다. 잠금 화면(50)보다 아래, 표(0)보다 위. */
.overlay{position:fixed;inset:0;background:rgba(17,17,17,.45);z-index:40;display:none;align-items:flex-start;justify-content:center;padding:72px 16px;overflow:auto}
.overlay.on{display:flex}
.ocard{background:#fff;border-radius:var(--r);width:min(480px,100%);padding:24px 26px;box-shadow:0 12px 28px rgba(0,0,0,.14)}
.ot{font-size:16px;font-weight:800;margin-bottom:4px}
.os{font-size:13px;color:var(--tx2);line-height:1.6}
.os b{color:var(--tx)}
.who{margin-top:14px;padding:12px 14px;background:var(--o5);border-radius:var(--rs);font-size:15px;font-weight:700}
.who span{display:block;font-size:12.5px;font-weight:600;color:var(--tx2);margin-top:2px}
.oa{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.oa .btn{padding:9px 16px}
.tdr{text-align:right;white-space:nowrap}

/* 알림 */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--tx);color:#fff;
  padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#toast.on{opacity:1}
.err-banner{background:#FDE8E9;color:#B4272B;border-radius:var(--rs);padding:10px 14px;font-size:13px;margin-top:12px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--o25);border-top-color:var(--o100);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="lock">
  <div class="box">
    <b>AXF CONTROL</b>
    <p>운영 관리 콘솔입니다. 관리코드를 입력하세요.</p>
    <input id="key" class="in" type="password" inputmode="numeric" autocomplete="off" placeholder="관리코드">
    <div class="err" id="lockErr"></div>
    <button class="btn pri" style="width:100%;margin-top:8px;padding:12px" onclick="unlock()">들어가기</button>
    <p class="src" style="margin:14px 0 0">코드는 이 브라우저 탭이 열려 있는 동안만 기억합니다. 탭을 닫으면 다시 입력합니다.</p>
  </div>
</div>

<header>
  <div class="brand"><b>AXF CONTROL</b><span>운영 관리</span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="hr">
    <span id="stamp">·</span>
    <button class="btn sm" onclick="refresh()">새로고침</button>
    <button class="btn sm ghost" onclick="lock()">잠금</button>
  </div>
</header>
<main id="view"></main>
<div id="toast"></div>
<div id="dlg" class="overlay" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <div class="ocard">
    <div class="ot" id="dlgT"></div>
    <div class="os" id="dlgS"></div>
    <div class="who" id="dlgWho"></div>
    <div class="oa"><button class="btn" id="dlgCancel" onclick="dlgClose()">취소</button><button class="btn pri" id="dlgOk" onclick="dlgGo()">확인</button></div>
  </div>
</div>

<script>
/* ══════════════════ 0. 설정 ══════════════════ */
/* 백엔드 URL 은 비밀이 아니다(앱 소스에도 있다). 관리코드는 파일에 두지 않는다. */
var BE = "https://script.google.com/macros/s/AKfycbwjCaSSUnQ7W1lrM8T426Cn_LgKs_UhI0Qi5XRVk-_eF-oD55-Wwjsot0DkPJCX9JqMBA/exec";
var POLL_MS = 30000;
var TABS = [
  { id:"dash",  n:"대시보드" },
  { id:"acct",  n:"계정" },
  { id:"stamp", n:"스탬프" },
  { id:"apply", n:"신청" },
  { id:"survey", n:"설문" },
  { id:"notice", n:"공지" },
  { id:"photo", n:"포토부스" }
];
/* 앱 STAMPS 와 맞춘다 · v3.33 8칸(계단 st · 설문 sv 추가), v3.39 보상은 7개에서 끝. 번호는 콘솔 표 머리용 약칭일 뿐 앱에는 없다.
   폐기된 ID 는 옛 로그에 남아 있을 수 있어 표기만 한다(서버 stamp_people 는 old 로 따로 준다). */
var STAMP_META = {
  p1:{ no:"01", n:"1F 전시" }, p2:{ no:"02", n:"부스 체험" }, p3:{ no:"03", n:"17F 강의" },
  p4:{ no:"04", n:"라이브 챌린지" }, p5:{ no:"05", n:"아이디어" }, p7:{ no:"06", n:"QR 퀴즈" },
  st:{ no:"07", n:"계단 이용" }, sv:{ no:"08", n:"오늘 한 판 설문" },
  p6:{ no:"", n:"포토부스", old:1 }, p8:{ no:"", n:"미니게임", old:1 }, p9:{ no:"", n:"계단(구)", old:1 }
};
var STAMP_ORDER = ["p1","p2","p3","p4","p5","p7","st","sv"];
/* 백엔드 SESS_META · SESS_CAP 과 같은 id */
var SESS_NAME = {
  /* v3.31b · 17F 오전은 자유 참석(옛 신청 기록 표시용) · 오후 파트너사 강연은 신청제(사전 신청 + 앱 신청) */
  key:"17F 기조연설 (자유 참석)", road:"17F 내부 강연 (자유 참석)", l1:"17F AWS 강연 (13:30)", l2:"17F MS 강연 (15:10)",
  fld:"세션 A · 영업·보상 현장", ta:"세션 B · 통계 현황 리포팅", tb:"세션 C · 외부자료 리서치", aws:"세션 D · 바이브 코딩 (AWS)", ms1:"세션 E · 1회차 13:30 (MS)", ms2:"세션 E · 2회차 15:00 (MS)",
  photo:"AI 포토부스", kring:"키링 DIY (260917 폐기)"
};
/* 상담 상태 · 시트 드롭다운과 같은 목록 */
var RESV_STATUS = ["신청","승인","체크인","완료","노쇼","취소"];
/* v3.31b · 10F 실습형 세션은 사전 신청(앱 밖) · 신청 현황에서 제외 (출석은 앱 운영자 스캔 집계) */
var TEN_SESS = ["fld","ta","tb","aws","ms1","ms2"];
var PRE_SESS = ["l1","l2"];

/* ══════════════════ 1. 공통 ══════════════════ */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function el(id){ return document.getElementById(id); }
function key(){ try{ return sessionStorage.getItem("axf_adm_key")||""; }catch(e){ return window.__k||""; } }
function setKey(v){ try{ sessionStorage.setItem("axf_adm_key",v); }catch(e){ window.__k=v; } }
function toast(m){ var t=el("toast"); t.textContent=m; t.className="on"; clearTimeout(t._t); t._t=setTimeout(function(){t.className="";},2200); }
/* 확인 창. 브라우저 confirm() 과 달리 대상(이름·사번)을 크게 보여 주고, 처리 중에는 버튼을 잠근다.
   onOk 가 없으면 안내 전용(확인 버튼 하나). 배경 클릭·Esc 로 닫히되 처리 중에는 안 닫힌다. */
var DLG={ onOk:null };
function dialog(o){
  DLG.onOk=o.onOk||null;
  el("dlgT").textContent=o.t||""; el("dlgS").innerHTML=o.s||"";
  el("dlgWho").innerHTML=o.who||""; el("dlgWho").style.display=o.who?"":"none";
  var ok=el("dlgOk"); ok.textContent=o.ok||"확인"; ok.disabled=false;
  el("dlgCancel").style.display=o.onOk?"":"none";
  el("dlg").className="overlay on";
  setTimeout(function(){ ok.focus(); },30);
}
function dlgBusy(){ return el("dlgOk").disabled; }
function dlgClose(){ if(dlgBusy()) return; el("dlg").className="overlay"; DLG.onOk=null; }
function dlgGo(){
  if(!DLG.onOk){ dlgClose(); return; }
  var ok=el("dlgOk"); ok.disabled=true; ok.innerHTML='<span class="spin" style="border-color:rgba(255,255,255,.4);border-top-color:#fff"></span>처리 중';
  var fn=DLG.onOk; DLG.onOk=null; fn();
}
el("dlg").addEventListener("click",function(e){ if(e.target===el("dlg")) dlgClose(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&el("dlg").className.indexOf("on")>=0) dlgClose(); });
function hhmm(s){ s=String(s||""); var m=s.match(/(\d{1,2}):(\d{2})/); return m?(("0"+m[1]).slice(-2)+":"+m[2]):s; }
function short(ts){ ts=String(ts||""); var m=ts.match(/(\d{2}):(\d{2}):?\d{0,2}$/); var d=ts.match(/(\d{2})-(\d{2}) /); return (d?d[1]+"/"+d[2]+" ":"")+(m?m[1]+":"+m[2]:ts); }
function pct(a,b){ return b>0?Math.min(100,Math.round(a/b*100)):0; }

/* JSONP · 백엔드가 callback 파라미터를 지원한다. GitHub Pages 에서 GAS 로 fetch 는 CORS 리다이렉트에 걸린다. */
var _cbN=0;
function call(action, params, done, fail){
  var name="__axf"+(++_cbN), sc=document.createElement("script"), q=[];
  params=params||{}; params.action=action; params.callback=name; params._=Date.now();
  if(!("key" in params)) params.key=key();
  for(var k in params) if(params[k]!=null) q.push(encodeURIComponent(k)+"="+encodeURIComponent(params[k]));
  var timer=setTimeout(function(){ cleanup(); fail&&fail({ok:false,reason:"timeout"}); },15000);
  function cleanup(){ clearTimeout(timer); try{delete window[name];}catch(e){window[name]=undefined;} if(sc.parentNode) sc.parentNode.removeChild(sc); }
  window[name]=function(res){ cleanup(); if(res&&res.ok===false&&res.reason==="auth"){ lock("관리코드가 맞지 않습니다. 다시 입력하세요."); return; } done&&done(res); };
  sc.onerror=function(){ cleanup(); fail&&fail({ok:false,reason:"network"}); };
  sc.src=BE+"?"+q.join("&");
  document.head.appendChild(sc);
}
function callAll(list, done){
  var out={}, left=list.length, err=null;
  if(!left) return done(out,null);
  list.forEach(function(it){
    call(it.a, it.p||{}, function(r){ out[it.k]=r; if(!--left) done(out,err); },
      function(e){ err=err||e; out[it.k]=null; if(!--left) done(out,err); });
  });
}

/* ══════════════════ 2. 잠금 ══════════════════ */
function lock(msg){ setKey(""); el("lock").style.display="flex"; el("lockErr").textContent=msg||""; el("key").value=""; setTimeout(function(){el("key").focus();},50); }
function unlock(){
  var v=el("key").value.trim(); if(!v){ el("lockErr").textContent="코드를 입력하세요."; return; }
  el("lockErr").innerHTML='<span class="spin"></span>확인 중';
  call("admin_check",{key:v},function(r){
    if(r&&r.ok&&r.role==="admin"){ setKey(v); el("lock").style.display="none"; el("lockErr").textContent=""; go(ST.tab); }
    else if(r&&r.ok&&r.role==="grade"){ el("lockErr").textContent="등급코드입니다. 이 콘솔은 관리코드가 필요합니다."; }
    else el("lockErr").textContent="관리코드가 맞지 않습니다.";
  },function(){ el("lockErr").textContent="서버에 연결할 수 없습니다. 네트워크를 확인하세요."; });
}
el("key").addEventListener("keydown",function(e){ if(e.key==="Enter") unlock(); });

/* ══════════════════ 3. 라우팅 · 폴링 ══════════════════ */
var ST={ tab:"dash", sub:"resv", q:"", filt:"", data:{}, busy:false, at:null };
/* 탭을 바꾸면 먼저 갖고 있는 데이터로 즉시 그리고, 그 다음 서버에서 받아 다시 그린다.
   안 그러면 응답이 올 때까지(1~3초) 이전 탭 내용이 새 탭 이름 아래 그대로 보인다. */
/* load() 를 먼저 불러 busy 를 세운 뒤 그린다. 반대로 하면 첫 진입에 「가입 계정 0명」처럼 0 으로 그려진다. */
function go(t){ ST.tab=t; ST.q=""; ST.filt=""; renderTabs(); window.scrollTo(0,0); load(); render(); }
function renderTabs(){
  el("tabs").innerHTML=TABS.map(function(t){ return '<button class="'+(ST.tab===t.id?"on":"")+'" onclick="go(\''+t.id+'\')">'+esc(t.n)+'</button>'; }).join("");
}
function refresh(){ load(true); }
var _poll=null;
function schedule(){ clearTimeout(_poll); _poll=setTimeout(function(){ if(!document.hidden && key()) load(); else schedule(); },POLL_MS); }
document.addEventListener("visibilitychange",function(){ if(!document.hidden&&key()) load(); });

/* 탭별로 필요한 액션만 부른다 */
var NEED={
  dash:[{k:"stats",a:"stats"},{k:"acct",a:"acct_list"},{k:"stamp",a:"stamp_people"},{k:"resv",a:"resv_list"},{k:"cchat",a:"cchat_list"},{k:"sess",a:"sess_list"}],
  acct:[{k:"acct",a:"acct_list"}],
  stamp:[{k:"stamp",a:"stamp_people"},{k:"stair",a:"stair_list"},{k:"sy",a:"sync",p:{emp:""}}],
  apply:[{k:"resv",a:"resv_list"},{k:"cchat",a:"cchat_list"},{k:"sess",a:"sess_list"},{k:"pre",a:"pre_list"}],

};
/* 탭을 빨리 바꾸면 앞선 요청이 뒤에 도착한다. 최신 요청만 화면에 반영한다. */
ST.seq=0;
function load(manual){
  if(!key()) return;
  var seq=++ST.seq;
  ST.busy=true; el("stamp").innerHTML='<span class="spin"></span>불러오는 중';
  callAll(NEED[ST.tab],function(out,err){
    if(seq!==ST.seq){ for(var k0 in out) if(out[k0]) ST.data[k0]=out[k0]; return; }   /* 데이터는 챙기고 화면은 안 건드린다 */
    ST.busy=false;
    for(var k in out) if(out[k]) ST.data[k]=out[k];
    ST.at=new Date(); ST.err=err;
    el("stamp").innerHTML=err?'<span style="color:var(--bad)">일부 실패</span>':'갱신 <b class="n">'+("0"+ST.at.getHours()).slice(-2)+":"+("0"+ST.at.getMinutes()).slice(-2)+":"+("0"+ST.at.getSeconds()).slice(-2)+'</b>';
    render(); schedule();
    if(manual&&!err) toast("갱신했습니다");
  });
}

/* 값을 고칠 때 있던 자리를 지킨다. 화면을 통째로 다시 그리므로 스크롤·포커스를 직접 되돌린다. */
function render(){
  var v=el("view"), top=window.scrollY, ae=document.activeElement, fIdx=-1;
  if(ae&&v.contains(ae)&&/^(INPUT|SELECT)$/.test(ae.tagName)){ var fl=v.querySelectorAll("input,select"); for(var i=0;i<fl.length;i++) if(fl[i]===ae){fIdx=i;break;} }
  var h="";
  /* 아직 안 받은 탭은 빈 표 대신 「불러오는 중」을 보인다. 빈 표는 「신청이 없다」로 읽힌다. */
  var missing=NEED[ST.tab].filter(function(it){ return !ST.data[it.k]; });
  if(missing.length&&ST.busy){
    h='<h1>'+esc((TABS.filter(function(t){return t.id===ST.tab;})[0]||{}).n||"")+'</h1><div class="card"><p class="muted"><span class="spin"></span>서버에서 불러오는 중입니다. 보통 2~5초 걸립니다.</p></div>';
  } else {
    try{ h=ST.tab==="dash"?viewDash():ST.tab==="acct"?viewAcct():ST.tab==="stamp"?viewStamp():ST.tab==="notice"?viewNotice():ST.tab==="survey"?viewSurvey():ST.tab==="photo"?viewPhoto():viewApply(); }
    catch(e){ h='<div class="err-banner">화면을 그리는 중 오류가 났습니다: '+esc(e.message)+'</div>'; }
  }
  if(ST.err) h='<div class="err-banner">일부 데이터를 못 받았습니다('+esc(ST.err.reason||"")+'). 새로고침을 눌러 주세요. 표시된 값은 마지막으로 받은 것입니다.</div>'+h;
  v.innerHTML=h;
  if(fIdx>=0){ var f2=v.querySelectorAll("input,select"); if(f2[fIdx]){ try{f2[fIdx].focus({preventScroll:true});}catch(e){f2[fIdx].focus();} } }
  window.scrollTo(0,top);
}
function setQ(v){ ST.q=v; render(); }
function setFilt(v){ ST.filt=v; render(); }
function setSub(v){ ST.sub=v; ST.q=""; ST.filt=""; render(); }
function match(row, fields){ if(!ST.q) return true; var q=ST.q.toLowerCase(); return fields.some(function(f){ return String(row[f]||"").toLowerCase().indexOf(q)>=0; }); }

/* 스탬프 개수 → 보상 (260909 확정 · v3.39 · 3개 룰렛 1회 · 4/5/6/7개 응모권 1/2/3/4장) */
function reward(n){ n=Math.min(7,n); return { roulette:n>=3, tickets: n>=7?4:n>=6?3:n>=5?2:n>=4?1:0 }; }
function stampCells(ids){
  return '<div class="stamps">'+STAMP_ORDER.map(function(id){ var got=ids.indexOf(id)>=0; return '<span class="st'+(got?" got":"")+'" title="'+esc(STAMP_META[id].n)+'">'+STAMP_META[id].no+'</span>'; }).join("")+
    ids.filter(function(id){return STAMP_ORDER.indexOf(id)<0;}).map(function(id){ var m=STAMP_META[id]||{n:id}; return '<span class="st old" title="'+esc(m.n)+' · 폐기된 항목">'+esc(id.replace("p",""))+'</span>'; }).join("")+'</div>';
}
function kpi(l,v,u,x){ return '<div class="kpi"><div class="l">'+esc(l)+'</div><div class="v n">'+v+(u?'<em>'+esc(u)+'</em>':'')+'</div>'+(x?'<div class="x">'+x+'</div>':'')+'</div>'; }

  h+='<div class="grid g2"><div class="card"><h2>상담 (1F DAP존)</h2><div class="row">'+RESV_STATUS.map(function(s){ return '<span class="pill'+(s==="승인"||s==="체크인"?" on":s==="취소"||s==="노쇼"?" off":"")+'">'+esc(s)+' <b class="n">'+(rvBy[s]||0)+'</b></span>'; }).join("")+'</div>'+

/* PIN 초기화 · acct_pwreset. 서버는 행을 남기고 비번해시만 비운다. 다음 로그인의 4자리가 새 PIN 이 된다. */
function pwReset(btn){

    s:"지금 PIN은 지워지고, <b>본인이 앱에서 다음에 입력하는 4자리가 새 PIN</b>으로 등록됩니다. 스탬프·신청 기록은 그대로이고, 운영 로그에 남습니다.",

        } else { el("dlgOk").disabled=false; dlgClose(); toast("실패: "+(r&&r.reason==="notfound"?"계정에 없는 사번입니다":(r&&r.reason)||"")); }
      },function(){ el("dlgOk").disabled=false; dlgClose(); toast("서버 응답 없음"); });
    }});
}

/* v3.33·v3.34 운영 · 룰렛 소진 안내 스위치 + 계단 지점 코드(인쇄용) */

/* ══════════════════ 7-3b. 사전 신청 명단 (v3.31b) ══════════════════
 * 엑셀(.xlsx) · CSV 를 브라우저 안에서만 읽는다. 의존성 없음: xlsx 는 zip 이라 중앙 디렉터리를 읽고
 * DecompressionStream("deflate-raw") 로 시트 XML 만 풀어 DOMParser 로 읽는다. .xls(구 바이너리)는 다른 이름으로 저장 안내.
 * 파일·파싱 결과는 메모리(PRE)에만 두고 저장소(localStorage 등)·콘솔 로그에 남기지 않는다. 반영이 끝나면 비운다.
 * 전송은 JSONP(GET) URL 한계 때문에 20행씩 청크 · 서버는 마지막 청크가 와서 전부 모였을 때만 한 번에 교체한다. */
var PRE={ file:"", rows:null, errs:[], warn:[], busy:false, pct:0 };
var PRE_CHUNK=20;
function preSidOf(v){
  var raw=String(v||"").trim().toLowerCase(), t=raw.replace(/\s/g,"");
  if(t==="l1"||/aws/.test(t)||/아마존/.test(t)) return "l1";
  if(t==="l2"||/(^|[^a-z])ms([^a-z]|$)/.test(raw)||/microsoft|마이크로소프트/.test(t)) return "l2";
  return "";
}
function preHeadKey(v){
  var t=String(v||"").replace(/\s/g,"").toLowerCase();
  if(/^(세션|세션id|세션명|강연|강연명|session|sid)$/.test(t)) return "sid";
  if(/^(사번|직원번호|사원번호|임직원번호|emp|empid|employeeid)$/.test(t)) return "emp";
  if(/^(이름|성명|name)$/.test(t)) return "name";
  if(/^(부문|부서|소속|dept|department)$/.test(t)) return "dept";
  return "";
}
function preTemplate(){
  var csv="\uFEFF세션,사번,이름,부문\r\nAWS,000000,홍길동,예시부문\r\nMS,000001,김예시,예시부문\r\n";
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="사전신청_양식.csv"; a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
}
function preReset(){ PRE={ file:"", rows:null, errs:[], warn:[], busy:false, pct:0 }; render(); }
function preDrop(e){ e.preventDefault(); var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) preRead(f); }
function prePick(inp){ var f=inp.files&&inp.files[0]; inp.value=""; if(f) preRead(f); }
function preRead(f){
  var name=f.name||"", ext=(name.split(".").pop()||"").toLowerCase();
  if(ext==="xls"){ toast("옛 .xls 형식은 읽지 못합니다. 엑셀에서 .xlsx 로 다른 이름 저장 후 올려 주세요"); return; }
  if(ext!=="xlsx"&&ext!=="csv"){ toast(".xlsx 또는 .csv 파일만 올릴 수 있습니다"); return; }
  PRE.file=name; PRE.rows=null; render();
  var fr=new FileReader();
  fr.onload=function(){
    var p=ext==="csv"?Promise.resolve(csvParse(decodeText(fr.result))):xlsxRows(fr.result);
    p.then(function(grid){ preCheck(grid); render(); }).catch(function(err){ PRE.file=""; toast("파일을 읽지 못했습니다: "+(err&&err.message||"형식 오류")); render(); });
  };
  fr.readAsArrayBuffer(f);
}
/* 한국어 윈도 엑셀의 CSV 는 CP949 일 수 있다 · UTF-8 로 먼저 읽고 깨지면 EUC-KR */
function decodeText(buf){
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf).replace(/^\uFEFF/,""); }
  catch(e){ return new TextDecoder("euc-kr").decode(buf); }
}
function csvParse(t){
  var rows=[], row=[], cur="", q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&t[i+1]==="\n") i++; row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=c;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
/* xlsx = zip · 첫 번째 시트만 읽는다 */
function xlsxRows(buf){

function noticeSendGo(t,b){

    if(r&&r.ok){ toast("발송했습니다 · "+t); load(); } else toast("발송 실패: "+(r&&r.reason||""));
  },function(){ toast("서버 응답 없음"); });
}
function noticeSend(){
  var t=(el("ntT").value||"").trim(), b=(el("ntB").value||"").trim();
  if(!t){ toast("제목을 입력하세요"); el("ntT").focus(); return; }
  dialog({ t:"공지를 발송할까요?", s:"모든 참가자 기기의 LED 띠·실시간 안내에 나갑니다.", who:"<b>"+esc(t)+"</b><br>"+esc(b), ok:"발송",
    onOk:function(){ dlgClose(); noticeSendGo(t,b); } });
}
function noticeTpl(i){
  var t=NOTICE_TPL[i]; if(!t) return;
  dialog({ t:"템플릿을 발송할까요?", s:"모든 참가자 기기에 나갑니다.", who:"<b>"+esc(t[0])+"</b><br>"+esc(t[1]), ok:"발송",
    onOk:function(){ dlgClose(); noticeSendGo(t[0],t[1]); } });
}
function noticeStopC(id){
  dialog({ t:"공지를 중지할까요?", s:"서버 송출을 멈추고, 다음 동기화 때 전 기기 화면에서 사라집니다.", ok:"중지",
    onOk:function(){ dlgClose();
      call("notice_clear",{id:id},function(r){
        if(r&&r.ok){ toast("공지를 중지했습니다"); load(); } else toast("중지 실패: "+(r&&r.reason||""));
      },function(){ toast("서버 응답 없음"); });
    } });
}

/* ══════════════════ 7-5. 포토부스 원격 대기열 (v3.21 B) · photo_list 조회 · q_call·q_skip·q_done ══════════════════ */
function viewPhoto(){
  var d=(ST.data.photo&&ST.data.photo.ok)?ST.data.photo:{rows:[],pub:{}}, rows=d.rows||[], pub=d.pub||{};
  var h='<h1>포토부스 대기열</h1>';
  /* v3.38 번호표 발급 시간 제한 폐기 · 상태(발급 중·점심·발급 시간 아님) 칸 삭제 */
  h+='<div class="grid g3" style="margin-top:14px">'+
    '<div class="kpi"><div class="l">대기</div><div class="v n">'+rows.length+'<em>팀</em></div></div>'+
    '<div class="kpi"><div class="l">호출 중</div><div class="v n">'+(pub.serving?pub.serving+'<em>번</em>':'-')+'</div></div>'+
    '<div class="kpi"><div class="l">예상 소요</div><div class="v n">'+(rows.length*(pub.min||3))+'<em>분</em></div></div></div>';
  h+='<div class="card"><div class="tools"><button class="btn pri" onclick="photoAct(\'call\')">다음 번호 호출</button>'+
    '<span class="src">호출 후 10분 안에 오지 않으면 건너뛰기, 도착하면 완료</span></div>';
  h+='<div class="wrap"><table class="tb"><tr><th>번호</th><th>사번</th><th>이름</th><th>상태</th><th>앞 팀</th><th>예상 입장</th><th style="min-width:180px">처리</th></tr>'+
    rows.map(function(r){ var k=esc(r.emp).replace(/'/g,"");
      return '<tr><td class="n"><b>'+r.no+'</b></td><td class="n">'+esc(r.emp)+'</td><td>'+esc(r.name||"")+'</td>'+
        '<td><span class="pill'+(r.status==="call"?" on":"")+'">'+(r.status==="call"?"호출 중":"대기")+'</span></td>'+
        '<td class="n">'+r.ahead+'</td><td class="n">'+esc(r.eta||"")+'</td>'+
        '<td>'+(r.status==="call"?'<div class="row" style="gap:6px"><button class="btn sm" onclick="photoAct(\'skip\',\''+k+'\','+r.no+')">건너뛰기</button><button class="btn sm pri" onclick="photoAct(\'done\',\''+k+'\','+r.no+')">완료</button></div>':'<span class="src">-</span>')+'</td></tr>'; }).join("")+
    (!rows.length?'<tr><td colspan="7" class="src">대기 중인 번호가 없습니다.</td></tr>':'')+'</table></div>';
  h+='<p class="note mt12">참가자는 앱에서 번호를 받고 자리에서 기다립니다. 앞 2팀이 되면 앱에 「곧 차례예요」가 뜨고, 호출하면 「지금 입장하세요」가 뜹니다. 번호표 발급은 시간 제한이 없습니다.</p></div>';
  return h;
}
function photoAct(act, emp, no){
  var go=function(){
    var p={spot:"q_photo"}; if(emp) p.emp=emp;
    call(act==="call"?"q_call":act==="skip"?"q_skip":"q_done", p, function(r){
      if(r&&r.ok){ toast((r.no?r.no+"번 · ":"")+(act==="call"?"호출했습니다":act==="skip"?"건너뛰었습니다":"완료 처리했습니다")); load(); }
      else toast(r&&r.reason==="empty"?"대기 중인 번호가 없습니다":"실패: "+(r&&r.reason||""));
    },function(){ toast("서버 응답 없음"); });
  };
  if(act==="skip") dialog({ t:"건너뛸까요?", s:"호출 후 10분 안에 오지 않은 번호를 건너뜁니다. 참가자는 앱에서 다시 줄을 설 수 있습니다.", who:"<b>"+no+"번</b> · "+esc(emp), ok:"건너뛰기", onOk:function(){ dlgClose(); go(); } });
  else go();
}

/* ══════════════════ 8. 시작 ══════════════════ */
renderTabs();
if(key()){ el("lock").style.display="none"; load(); render(); } else lock();
</script>
