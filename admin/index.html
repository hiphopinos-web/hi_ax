<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AXF CONTROL · 운영 관리</title>
<!-- 외부 리소스를 쓰지 않는다. Pretendard 가 기기에 있으면 쓰고, 없으면 맑은 고딕으로 떨어진다.
     이 파일은 public 저장소에 올라간다. 관리코드·백엔드 비밀값을 절대 적지 않는다. -->
<style>
/* v3.95 콘솔 톤 (사용자 지정 260919 · 총무전용공간 관리자맵 레퍼런스)
   연회색 바탕 + 흰 카드(12px · 옅은 테두리) · 주 색은 네이비 하나(활성 탭 · 주 버튼 · 제목)
   상태색은 채도를 낮춘 초록 · 앰버 · 적갈 · 현대해상 오렌지는 주의 배지에만 쓴다.
   참가자 앱의 「파랑 금지」(design.md)는 앱 셸 규칙이다. 운영 콘솔은 이 레퍼런스를 따른다.
   261003 UI 정돈(디자인 시안/콘솔 UI 정돈/규칙.md · 색은 이 팔레트 그대로)
   글자 5단계: 28 숫자 · 20 페이지 제목 · 16 카드 제목 · 14 본문 · 12 보조 · 읽어야 하는 보조 글은 --tx2, --tx3 은 placeholder · 비활성 · 꺾쇠만
   버튼 3종(주 · 보조 · 위험) × 높이 2가지(36 · 28) · 상태 배지 = 모서리 6 · 알약(99)은 누르는 칩만 · 간격은 4 · 8 · 12 · 16 · 24 · 32 */
:root{
  --bg:#F2F4F7; --sf:#FFFFFF; --soft:#F9FAFB;
  --line:#E5E7EB; --line2:#EFF0F3; --line3:#D1D5DB;
  --tx:#14171F; --tx2:#4B5060; --tx3:#80848F;
  --navy:#00205B; --navy8:#0D2461; --navy1:#DFE3EF; --navy05:#EEF0F7;
  --ok:#1E7B4F; --ok-bg:#EAF5EF; --ok-bd:#CFE6D9;
  --warn:#8A5A12; --warn-bg:#FFF6E3; --warn-bd:#F3DFB3;
  --bad:#A63A34; --bad-bg:#FBF0EF; --bad-bd:#EFD3D0;
  --brand:#FF7E31;
  --fs-kpi:28px; --fs-h1:20px; --fs-h2:16px; --fs-b:14px; --fs-s:12px; --fs-c:12px;   /* 261003 UI 정돈 · 글자 5단계(28 · 20 · 16 · 14 · 12) · 13 은 12 로 합쳤다 · 굵기 400 · 600 · 700 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;   /* 간격 8px 격자 */
  --h-ctl:36px; --h-sm:28px;   /* 버튼 · 입력 높이 2가지 */
  --r:12px; --r-s:8px; --r-xs:6px;
  --w-page:1280px; --w-form:720px; --w-aside:320px; --w-text:720px;   /* 261003 너비 · 콘텐츠 최대 1280 · 폼 열 720 · 보조 열 320 · 글 줄 최대 720 */
  --w-in-s:96px; --w-in-m:200px; --w-in-l:320px;   /* 입력 폭 · 기본은 그 열 전체 · 짧은 값만 96(숫자 · 시각 · 수량) · 200(사번 · 날짜 · 고르기) · 320(찾기 · 한 줄 주소) */
  --sh-lg:0 12px 28px rgba(8,24,74,.14),0 4px 8px rgba(8,24,74,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{scrollbar-gutter:stable}   /* 261003 너비 · 스크롤 막대 유무로 왼쪽 선이 7px 흔들리지 않게 */
body{background:var(--bg);color:var(--tx);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  font-size:var(--fs-b);line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.n,td.n,.num{font-variant-numeric:tabular-nums}
b,strong{font-weight:700}

/* ── 상단바 56 · 브랜드 | 메뉴 7개(밑줄 선택) | 서버 상태 한 줄 · 새로고침 · 계정(사용 안내 · 권한 · 잠금) ── */
header.top{position:sticky;top:0;z-index:30;height:56px;background:var(--sf);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:24px;padding:0 24px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;flex-shrink:0}
.brand b{font-size:var(--fs-h2);font-weight:700;color:var(--navy);letter-spacing:.01em}
.brand span{font-size:var(--fs-c);color:var(--tx2);font-weight:600}
nav.tabs{display:flex;gap:4px;align-self:stretch;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{position:relative;display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:600;color:var(--tx2);white-space:nowrap;flex-shrink:0}
nav.tabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--navy);border-radius:2px}
@media (max-width:1599px){ nav.tabs button{padding:0 8px} nav.tabs button.on::after{left:8px;right:8px} }   /* v4.75 예약 메뉴가 늘어 1440 폭에서 마지막 탭(포토부스)이 가려지던 것 · v4.76 알림 메뉴가 늘어 8 → 7 · 261003 「공지·푸시」 이름이 길어져 1599 이하 5(1440 · 1536 폭에서 끝 탭이 가려지던 것) */
@media (max-width:1365px){ nav.tabs button{padding:0 4px} nav.tabs button.on::after{left:4px;right:4px} }   /* v4.27 접속 메뉴가 늘어 1280 폭에서 마지막 탭이 잘리던 것 */
nav.tabs button:hover{color:var(--tx)}
nav.tabs button.on{color:var(--navy)}
.tbadge{display:inline-block;min-width:18px;padding:0 4px;border-radius:99px;background:var(--brand);color:#fff;
  font-size:var(--fs-c);font-weight:700;font-style:normal;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.hr{margin-left:auto;display:flex;align-items:center;gap:12px;flex-shrink:0;white-space:nowrap;font-size:var(--fs-s);color:var(--tx2)}
.hr b{color:var(--tx2)}
.live{display:flex;align-items:center;gap:8px;font-size:var(--fs-s);color:var(--tx2);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line3);flex-shrink:0;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.acct-w{position:relative}
.acct{display:flex;align-items:center;gap:8px;height:var(--h-sm);padding:0 12px;border:1px solid var(--line3);border-radius:var(--r-s);background:var(--sf);font-size:var(--fs-s);font-weight:600;color:var(--tx2)}
.acct:hover{border-color:var(--tx3)}
.acct b{color:var(--navy)}
.acct i{width:6px;height:6px;border-right:1.5px solid var(--tx3);border-bottom:1.5px solid var(--tx3);transform:rotate(45deg);margin:-4px 0 0 2px}
.acct-m{position:absolute;right:0;top:calc(100% + 4px);min-width:176px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r-s);box-shadow:var(--sh-lg);padding:4px;z-index:40;display:flex;flex-direction:column}
.acct-m[hidden]{display:none}
.acct-m button{text-align:left;padding:8px 12px;border-radius:var(--r-xs);font-weight:600;color:var(--tx)}
.acct-m button:hover{background:var(--soft)}
.acct-m .sep{height:1px;background:var(--line2);margin:4px 0}
.role{font-size:var(--fs-c);font-weight:700;color:var(--navy)}

/* ── 버튼 3종 × 2크기 · 주(네이비 채움) · 보조(흰 바탕 + --line3) · 위험(흰 바탕 + 적갈 글자) · 높이 36 · 28(.sm) · 확인 창 안 최종 위험만 채움(.danger.fill) ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h-ctl);padding:0 16px;border-radius:var(--r-s);
  font-weight:600;background:var(--sf);color:var(--tx);border:1px solid var(--line3);white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--tx3)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy8);border-color:var(--navy8)}
.btn.danger{color:var(--bad);border-color:var(--bad-bd);background:var(--sf)}
.btn.danger:hover{background:var(--bad-bg);border-color:var(--bad)}
.btn.danger.fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:var(--h-sm);padding:0 12px;font-size:var(--fs-s)}
.lnk{color:var(--navy);font-weight:600;font-size:var(--fs-s);cursor:pointer}
.lnk:hover{text-decoration:underline}
.btn:disabled{opacity:.45;cursor:default}

/* ── 페이지 뼈대 · 제목줄(제목 20 + 한 줄 설명 14 | 오른쪽 주 행동) → 2단 탭(밑줄) → 3단(분할 선택) → 본문 ── */
main{padding:24px 24px 80px;max-width:calc(var(--w-page) + 48px);margin:0 auto}
@media(min-width:721px){header.top{padding:0 max(24px,calc((100% - var(--w-page))/2))}}   /* 261003 너비 · 상단바 안쪽도 본문과 같은 왼쪽 · 오른쪽 선(1280 ~ 1920 실측 · 메뉴 가려짐 0) */
/* 261003 너비 · 페이지 유형 3가지(#view data-pt) · form = 입력 · 발송형(본문 열 720 · 보조 열 320 고정) · list = 표 · 목록형(1280) · dash = 대시보드(12열) */
#view[data-pt="form"]>:not(.ph):not(.hv-l2):not(.hv-l3){max-width:var(--w-form)}
#view[data-pt="form"]:has(>.lay-fa,>.sp)>:not(.ph):not(.hv-l2):not(.hv-l3){max-width:calc(var(--w-form) + var(--w-aside) + 24px)}
.ph p,details.memo .mb>p,details.memo .mb>ol,.card>p.cap,.card>.cap,.card>p,.empty{max-width:var(--w-text)}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:var(--fs-h1);font-weight:700;color:var(--navy);letter-spacing:-.02em;line-height:1.3}
.ph p{font-size:var(--fs-b);color:var(--tx2);margin-top:4px}
.ph .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
/* 거르기 칩 1종 · 알약 28 · 선택 = 옅은 네이비 바탕 + 네이비 테두리 · 개수는 같은 줄 숫자 */
.fchip{display:inline-flex;align-items:center;gap:8px;height:var(--h-sm);padding:0 12px;border-radius:99px;border:1px solid var(--line);
  background:var(--sf);font-size:var(--fs-s);font-weight:600;color:var(--tx2)}
.fchip:hover{border-color:var(--tx3);color:var(--tx)}
.fchip.on{background:var(--navy05);border-color:var(--navy);color:var(--navy)}
.fchip .cnt{font-size:var(--fs-c);font-weight:600;color:inherit;font-variant-numeric:tabular-nums}
.fchip.zero .cnt{color:var(--tx3)}
.fchip .sep{color:var(--tx2)}
.chips .arrow{align-self:center;color:var(--line3);font-size:var(--fs-s)}
.chips .gap{width:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .cnt{font-size:var(--fs-s);color:var(--tx2)}
.toolbar .cnt b{color:var(--tx)}
.toolbar .sp{flex:1}
.in{height:var(--h-ctl);padding:0 12px;border-radius:var(--r-s);border:1px solid var(--line3);background:var(--sf);width:var(--w-in-l);max-width:100%;min-width:0;color:var(--tx)}
.in::placeholder{color:var(--tx3)}
.in:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy05)}
select.in{width:var(--w-in-m);padding-right:8px}
textarea.in{height:auto;min-height:72px;padding:8px 12px;resize:vertical;width:100%}
.in.sm{height:var(--h-sm);padding:0 8px;font-size:var(--fs-s)}
:where(.fld.fw,.fgrid) .in,:where(.fld.fw,.fgrid) select.in,:where(.ns-f)>.in,:where(.ns-f)>select.in{width:100%}   /* 폼 열 안 = 열 전체(기본) · 아래 짧은 폭 클래스가 이긴다 */
.in.w-s{width:var(--w-in-s)}.in.w-m{width:var(--w-in-m)}.in.w-l{width:var(--w-in-l)}.in.w-f{width:100%}
.grow{flex:1 1 0;min-width:0}.in.grow{width:auto}
.fld{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-c);font-weight:600;color:var(--tx2)}
.fld>.cap{font-weight:400}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.fgrid .fw{grid-column:1/-1}
.fgrid{max-width:var(--w-form)}   /* 261003 너비 · 표 · 목록형 화면 안의 입력 묶음도 폼 열(720) 안에서 끝난다 */
.row.nw{flex-wrap:nowrap}
.dz-h{margin:24px 0 4px;padding-top:16px;border-top:1px solid var(--line);font-size:var(--fs-s);font-weight:700;color:var(--bad)}

/* ── 카드 ── */
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-top:16px}
.card:first-child{margin-top:0}
.ch{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;min-height:var(--h-sm)}
.ch h2{font-size:var(--fs-h2);font-weight:700;color:var(--tx)}
.ch .sub{font-size:var(--fs-s);color:var(--tx2)}
.ch .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.grid{display:grid;gap:16px;margin-top:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.grid>*{grid-column:span 12}
.grid>.card{margin-top:0}
.grid.g2>*{grid-column:span 6}
.grid.g3>*{grid-column:span 4}
.grid.g57>:nth-child(odd){grid-column:span 5}.grid.g57>:nth-child(even){grid-column:span 7}
.kpis{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis:has(>.kpi:nth-child(3):last-child),.kpis:has(>.kpi:nth-child(5):last-child),.kpis:has(>.kpi:nth-child(6):last-child){grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis:has(>.kpi:nth-child(2):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis:has(>.kpi:only-child){grid-template-columns:repeat(4,minmax(0,1fr))}   /* 261003 너비 · KPI 는 12열 격자의 3 · 4 · 6칸 · 혼자 남는 줄이 없게 3열(3 · 5 · 6개) */
@media(max-width:720px){header.top{height:auto;flex-wrap:wrap;padding:0;gap:0}.brand{padding:12px 16px}.brand span{display:none}.hr{padding-right:16px;gap:8px}.live .tx,.acct .ae{display:none}
  nav.tabs{order:3;width:100%;height:44px;border-top:1px solid var(--line2);padding:0 4px;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
  main{padding:16px 16px 96px}.card{padding:16px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{padding:12px}.kpi .v{font-size:var(--fs-h1)}.ph .r{margin-left:0}.card .pp-sum{grid-template-columns:minmax(0,1fr)}.card .slots{grid-template-columns:minmax(0,1fr)}}

/* KPI 타일 · 큰 숫자 + 라벨 + 보조 한 줄 */
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px}
.kpi .l{font-size:var(--fs-s);color:var(--tx2);font-weight:600}
.kpi .v{font-size:var(--fs-kpi);font-weight:700;line-height:1.15;margin-top:8px;color:var(--tx);font-variant-numeric:tabular-nums}
.kpi .v em{font-style:normal;font-size:var(--fs-s);font-weight:600;color:var(--tx2);margin-left:4px}
.kpi .x{font-size:var(--fs-c);color:var(--tx2);margin-top:4px}
.kpi.link{cursor:pointer}.kpi.link:hover{border-color:var(--navy)}
.kpi .bar{margin-top:12px}

/* 막대 · 네이비 채움, 트랙은 옅은 네이비 */
.bar{height:8px;border-radius:99px;background:var(--navy05);overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:99px}
.bar.over i{background:var(--bad)}
/* v4.27 접속 · 경로별 비율 한 줄(누적 막대) + 범례 */
.vstk{display:flex;height:14px;border-radius:99px;background:var(--navy05);overflow:hidden;margin:4px 0 12px}
.vstk i{display:block;height:100%}
.vleg{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:var(--fs-s);color:var(--tx2);margin-bottom:12px}
.vleg span{display:inline-flex;align-items:center;gap:8px}
.vleg i{display:inline-block;width:10px;height:10px;border-radius:3px}

/* 표 */
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-s)}
table.tb{width:100%;border-collapse:collapse;background:var(--sf)}
table.tb th{text-align:left;font-size:var(--fs-c);color:var(--tx2);font-weight:600;height:36px;padding:0 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.tb td{height:48px;padding:8px 12px;vertical-align:middle;border-bottom:1px solid var(--line2)}
table.tb tr:last-child td{border-bottom:0}
table.tb tbody tr:hover td,table.tb tr.hv:hover td{background:var(--soft)}
table.tb tr.click{cursor:pointer}
table.tb tr.sel td{background:var(--navy05)}
table.tb tr.flash td{animation:fl 1.2s ease-out}
@keyframes fl{from{background:var(--warn-bg)}to{background:transparent}}
table.tb.plain{border:0}
.tdr,th.tdr{text-align:right;white-space:nowrap}
.tdc{text-align:center}
td .who2{font-weight:700;color:var(--tx)}
td .who2 small,.who2 small{display:block;font-size:var(--fs-c);color:var(--tx2);font-weight:400}
.scrolly{max-height:460px;overflow:auto}
.wrap.scrolly{max-height:none!important}   /* 261003 UI 정돈 6단계 · 표 안 세로 스크롤 대신 20줄 + 「더 보기」(moreRows) */
.more-rows{margin-top:8px}
.ck{width:16px;height:16px;accent-color:var(--navy);cursor:pointer;vertical-align:middle}
td.ckc,th.ckc{width:40px;text-align:center;padding-left:16px;padding-right:0}
.acts{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:nowrap}
.bartb td{border:0;padding:8px 0}
.bartb td.l{width:190px;white-space:nowrap;padding-right:12px;font-size:var(--fs-s)}
.bartb td.v{width:88px;text-align:right;font-size:var(--fs-s);font-variant-numeric:tabular-nums;padding-left:12px}

/* 상태 배지 1종 · 모서리 6 · 높이 22 · 12/600 · 기본 회색 · ok · warn · bad · 진행(pri = 옅은 네이비) · 누르는 칩(알약)과 모양을 나눈다 */
.tag{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:var(--fs-c);font-weight:600;border-radius:var(--r-xs);height:22px;padding:0 8px;line-height:1;
  color:var(--tx2);background:var(--soft);border:1px solid var(--line)}
.tag.pri{color:var(--navy);background:var(--navy05);border-color:var(--navy1)}
.tag.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-bd)}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
.tag.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-bd)}
.tag.off{color:var(--tx2);background:var(--soft);border-color:var(--line)}
.tag.brand{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
.cap{font-size:var(--fs-c);color:var(--tx2)}
.src{font-size:var(--fs-c);color:var(--tx2)}
.muted{color:var(--tx2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
/* 빈 상태 1종 · 한 줄 14/400 --tx2 · 상자 없음 */
.empty{padding:12px 0;font-size:var(--fs-b);color:var(--tx2)}
td .empty{padding:4px 0}
/* 알림 띠 1종 · 정보(흰) · 주의(warn) · 위험(bad) · 오른쪽 버튼 1개까지 · 옛 안내 상자(note · pv · 추첨 · 보류 · 오류 · 거절)도 같은 모양 */
.band,.note{display:block;font-size:var(--fs-b);color:var(--tx2);background:var(--sf);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 16px;line-height:1.6}
.band{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.band .r{margin-left:auto;display:flex;gap:8px}
.band b,.note b{color:var(--tx)}
.band.warn,.note.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
.band.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-bd)}
.band.warn b,.band.bad b{color:inherit}
.bands{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
/* 불러오는 중 1종 · 회색 줄 3개(뼈대) · 글자 없음 */
.skel{display:flex;flex-direction:column;gap:12px;padding:4px 0}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line2),var(--soft),var(--line2));background-size:200% 100%;animation:sk 1.2s linear infinite}
.skel i:nth-child(2){width:72%}.skel i:nth-child(3){width:48%}
@keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}

/* 운영 메모 · 긴 설명은 접어 둔다 */
details.memo{margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
details.memo summary{cursor:pointer;list-style:none;font-size:var(--fs-s);font-weight:600;color:var(--tx2);display:flex;align-items:center;gap:8px}
details.memo summary::-webkit-details-marker{display:none}
details.memo summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--tx3);border-bottom:1.5px solid var(--tx3);transform:rotate(-45deg);transition:transform .15s}
details.memo[open] summary::before{transform:rotate(45deg)}
details.memo .mb{padding:8px 0 0 16px;font-size:var(--fs-b);color:var(--tx2);line-height:1.7}
details.memo .mb p+p{margin-top:8px}
details.memo .mb ol{padding-left:16px}

/* 흐름 (신청 → 승인 → 체크인 → 완료) */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .fs{flex:1;min-width:84px;padding:12px 12px;border:1px solid var(--line);background:var(--sf);cursor:pointer}
.flow .fs+.st{border-left:0}
.flow .fs:first-child{border-radius:var(--r-s) 0 0 var(--r-s)}
.flow .fs.last{border-radius:0 var(--r-s) var(--r-s) 0}
.flow .fs.end{border-radius:var(--r-s);margin-left:8px;border-left:1px solid var(--line);background:var(--soft)}
.flow .fs:hover{border-color:var(--navy)}
.flow .fs .l{font-size:var(--fs-c);color:var(--tx2);font-weight:600}
.flow .fs .v{font-size:var(--fs-h1);font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums;line-height:1.2}
.flow .fs.hot .v{color:var(--navy)}

/* 지금 처리할 일 */
.todo{display:flex;flex-direction:column}
.todo .it{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 4px;border-top:1px solid var(--line2)}
.todo .it:first-child{border-top:0}
.todo .it .v{font-size:var(--fs-h1);font-weight:700;text-align:right;font-variant-numeric:tabular-nums;color:var(--navy)}
.todo .it.zero .v{color:var(--line3)}
.todo .it .t{font-weight:700}
.todo .it .d{font-size:var(--fs-c);color:var(--tx2)}
.todo .it.zero .t{color:var(--tx2);font-weight:400}

/* 개인 스탬프 패널 · 왼쪽 목록 · 오른쪽 8칸 */
.sp{display:grid;grid-template-columns:var(--w-aside) minmax(0,var(--w-form));gap:24px;align-items:start;justify-content:start}
@media(max-width:1000px){.sp{grid-template-columns:minmax(0,1fr)}.sp .lnb{position:static}.sp .lnb ul{max-height:260px}}
.lnb{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:12px;position:sticky;top:76px}
.lnb .in{width:100%;min-width:0}
.lnb .cap{padding:8px 4px 8px}
.lnb ul{list-style:none;max-height:calc(100vh - 230px);overflow:auto;display:flex;flex-direction:column;gap:2px}
.lnb li button{width:100%;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:var(--r-s);text-align:left}
.lnb li button:hover{background:var(--bg)}
.lnb li button.on{background:var(--navy);color:#fff}
.lnb li .nm{font-weight:700;font-size:var(--fs-s)}
.lnb li .em{font-size:var(--fs-c);color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnb li button.on .em{color:var(--navy1)}
.lnb li .c{margin-left:auto;font-size:var(--fs-c);font-weight:700;color:var(--tx2);font-variant-numeric:tabular-nums;flex-shrink:0}
.lnb li button.on .c{color:#fff}
.pp-h{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.pp-h .nm{font-size:var(--fs-h1);font-weight:700;color:var(--navy);line-height:1.2}
.pp-h .em{font-size:var(--fs-s);color:var(--tx2);margin-top:4px}
.pp-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.pp-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.pp-sum>div{border:1px solid var(--line);border-radius:var(--r-s);padding:12px 16px}
.pp-sum .l{font-size:var(--fs-c);color:var(--tx2);font-weight:600}
.pp-sum .v{font-size:var(--fs-h1);font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
/* v5.01 계정 › 한 사람 관리 · 전체 초기화 */
.us-dz{border-color:var(--bad-bd)}
.us-dz .ch h2{color:var(--tx)}
.us-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.us-part{display:flex;gap:12px;align-items:flex-start;padding:12px 12px;border:1px solid var(--line);border-radius:var(--r-s);margin-top:8px;cursor:pointer}
.us-part:hover{background:var(--soft)}
.us-part .ck{margin-top:4px;flex-shrink:0}
.us-part b{display:block;font-size:var(--fs-b)}
.us-part .cap{display:block}
.us-part .n{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.us-cmd{display:block;font-family:Consolas,"D2Coding",monospace;font-size:var(--fs-c);background:var(--soft);border:1px solid var(--line2);border-radius:var(--r-s);padding:8px 12px;margin-top:8px;word-break:break-all;user-select:all}
.pp-sum .v em{font-style:normal;font-size:var(--fs-s);color:var(--tx2);font-weight:600;margin-left:4px}
.pp-sum .x{font-size:var(--fs-c);color:var(--tx2);margin-top:2px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
@media(max-width:1280px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{border:1px solid var(--line);border-radius:var(--r-s);padding:16px;display:flex;flex-direction:column;gap:8px;min-height:148px;background:var(--sf)}
.slot.got{border-color:var(--navy1);background:var(--navy05)}
.slot .no{font-size:var(--fs-c);font-weight:700;color:var(--tx2);font-variant-numeric:tabular-nums}
.slot.got .no{color:var(--navy)}
.slot .nm{font-weight:700}
.slot .via{font-size:var(--fs-c);color:var(--tx2);min-height:18px}
.slot .ft{margin-top:auto;display:flex;align-items:center;gap:8px}
.slot .ft .btn{margin-left:auto}
.stamps{display:flex;gap:4px;flex-wrap:nowrap}
.st{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  font-size:var(--fs-c);font-weight:700;background:var(--sf);border:1px solid var(--line);color:var(--line3);font-variant-numeric:tabular-nums}
.st.got{background:var(--navy);border-color:var(--navy);color:#fff}
.st.old{background:var(--soft);color:var(--tx3);text-decoration:line-through}
.st.half{background:var(--navy05);border-color:var(--navy);color:var(--navy)}
.slot.half{border-color:var(--navy1)}

/* 선택 일괄 처리 바 */
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;margin-bottom:12px;background:var(--navy05);border:1px solid var(--navy1);border-radius:var(--r-s)}
.bulk .c{font-size:var(--fs-s);color:var(--tx2);margin-right:auto}
.bulk .c b{color:var(--navy)}
/* 261003 UI 정돈 5단계 · 줄 끝 더 보기(⋯) · 위험 항목은 메뉴 안 적갈 글자 · 같은 줄에 남은 위험 버튼은 오른쪽 끝 16 띄움 */
.rm{display:inline-flex;order:9}
.more{width:28px;height:28px;border-radius:var(--r-xs);display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);border:1px solid transparent}
.more:hover,.more[aria-expanded="true"]{background:var(--bg);border-color:var(--line)}
.more i,.more i::before,.more i::after{display:block;width:3px;height:3px;border-radius:50%;background:currentColor;position:relative}
.more i::before,.more i::after{content:"";position:absolute;top:0}
.more i::before{left:-6px}.more i::after{left:6px}
.rm-m{position:fixed;z-index:45;min-width:160px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r-s);box-shadow:var(--sh-lg);padding:4px;display:flex;flex-direction:column}
.rm-m[hidden]{display:none}
.rm-i{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:var(--r-xs);font-size:var(--fs-b);font-weight:600;color:var(--tx);white-space:nowrap}
.rm-i:hover:not(:disabled){background:var(--soft)}
.rm-i.bad{color:var(--bad)}
.rm-i.bad:hover:not(:disabled){background:var(--bad-bg)}
.rm-i:disabled{color:var(--tx3);cursor:default}
.bulk .btn.danger,.dz-r,.acts>.btn.danger{margin-left:16px}
.acts>.btn.danger{order:9}
.dz-r{display:inline-flex;gap:8px}

/* 잠금 화면 */
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:80}
#lock .box{width:min(400px,90vw);background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:32px 24px;text-align:center}
#lock .box b{display:block;color:var(--navy);font-size:var(--fs-h1);font-weight:700}
#lock .box p{color:var(--tx2);margin:8px 0 16px;font-size:var(--fs-s)}
#lock input{width:100%;text-align:center;font-size:var(--fs-h2);letter-spacing:.2em;height:44px}
#lock .err{color:var(--bad);font-size:var(--fs-c);min-height:18px;margin-top:8px}
#lock #aemp{letter-spacing:.06em}
/* v4.85 권한 메뉴 · 공용 코드 입력 */
.role.rolebtn{cursor:pointer}
.role.rolebtn:hover{background:var(--navy1)}
.role.rolebtn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.admf{display:grid;gap:12px}
.admf label{display:grid;gap:4px;font-size:var(--fs-c);color:var(--tx2);font-weight:600}
.admf .in{width:100%;min-width:0;letter-spacing:.2em;font-variant-numeric:tabular-nums}
.admh{font-size:var(--fs-c);color:var(--tx2);min-height:18px}
.admh.ok{color:var(--ok)}
.admh.bad{color:var(--bad)}
/* v4.86 슈퍼관리자 본인 확인(PIN) */
.supg{max-width:440px;margin:0;padding:8px 0 4px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.supg .row{flex-wrap:nowrap}
.supg .in.pin{flex:1 1 0;width:0;min-width:0;height:44px;font-size:var(--fs-h1);letter-spacing:.6em;text-align:center;font-variant-numeric:tabular-nums}
.supg .btn{padding:0 24px}
.supg .admh{min-height:20px}
.note.warnl{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd);margin-top:16px}

/* 확인 창 · 제목 · 설명 · 대상 · 영향 · 오른쪽 버튼 */
.overlay{position:fixed;inset:0;background:rgba(8,24,74,.42);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:72px 16px;overflow:auto}
.overlay.on{display:flex}
.ocard{background:var(--sf);border-radius:var(--r);width:min(500px,100%);padding:24px;box-shadow:var(--sh-lg)}
.ocard.wide{width:min(640px,100%)}
.ot{font-size:var(--fs-h2);font-weight:700;color:var(--navy);margin-bottom:8px}
.os{font-size:var(--fs-b);color:var(--tx2);line-height:1.65}
.os b{color:var(--tx)}
.who{margin-top:16px;padding:12px 16px;background:var(--soft);border:1px solid var(--line2);border-radius:var(--r-s);font-size:var(--fs-b);font-weight:700}
.who span{display:block;font-size:var(--fs-c);font-weight:400;color:var(--tx2);margin-top:2px}
.imp{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.imp div{display:flex;justify-content:space-between;gap:12px;padding:8px 16px;font-size:var(--fs-s);border-top:1px solid var(--line2)}
.imp div:first-child{border-top:0}
.imp div span{color:var(--tx2)}
.imp div b{font-variant-numeric:tabular-nums}
.imp div.chg b{color:var(--navy)}
.imp div.loss b{color:var(--bad)}
.oa{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.oa .btn{padding:0 16px}
.guide{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.guide .gs{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;background:var(--soft);border:1px solid var(--line2);border-radius:var(--r-s)}
.guide .gn{flex-shrink:0;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--navy);color:#fff;font-size:var(--fs-c);font-weight:700}
.guide .gt{font-size:var(--fs-s);line-height:1.65;color:var(--tx2)}
.guide .gt b{color:var(--navy)}

/* 상세 패널 (오른쪽 서랍) */
#drwBg{position:fixed;inset:0;background:rgba(8,24,74,.18);z-index:50;display:none}
#drw{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--sf);border-left:1px solid var(--line);z-index:55;
  box-shadow:var(--sh-lg);transform:translateX(105%);transition:transform .18s ease-out;display:flex;flex-direction:column}
#drw.on{transform:none}
#drwBg.on{display:block}
#drw .dh{padding:24px 24px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
#drw .dh .nm{font-size:var(--fs-h1);font-weight:700;color:var(--navy);line-height:1.2}
#drw .dh .em{font-size:var(--fs-s);color:var(--tx2);margin-top:4px}
#drw .dh .x{margin-left:auto}
#drw .db{padding:16px 24px 24px;overflow:auto;flex:1}
#drw h3{font-size:var(--fs-s);font-weight:700;color:var(--tx2);margin:16px 0 8px}
#drw h3:first-child{margin-top:0}
.steps{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.steps span{font-size:var(--fs-c);font-weight:700;padding:4px 12px;border-radius:99px;background:var(--soft);color:var(--tx2);border:1px solid var(--line)}
.steps span.done{color:var(--navy);background:var(--navy05);border-color:var(--navy1)}
.steps span.cur{color:#fff;background:var(--navy);border-color:var(--navy)}
.steps i{font-style:normal;color:var(--line3)}
.hist{list-style:none;display:flex;flex-direction:column}
.hist li{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line2);font-size:var(--fs-s)}
.hist li:first-child{border-top:0}
.hist li .t{color:var(--tx2);width:72px;flex-shrink:0;font-variant-numeric:tabular-nums}

/* 알림 · 되돌리기 버튼을 품는다 */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);background:var(--tx);color:#fff;
  padding:12px 12px 12px 16px;border-radius:var(--r-s);font-size:var(--fs-s);font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:90;display:flex;gap:16px;align-items:center;max-width:min(640px,92vw);box-shadow:var(--sh-lg)}
#toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{color:#fff;font-weight:700;padding:4px 8px;border-radius:6px;text-decoration:underline;text-underline-offset:3px}
#toast button:hover{background:rgba(255,255,255,.12)}
#toast .tt{padding-right:8px}
.olyev{border-top:1px solid var(--line2);padding:16px 0 8px}
.olyev:first-of-type{border-top:0;padding-top:4px}
.olyh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.olyh b{font-size:var(--fs-h2)}
.olyf{display:flex;flex-wrap:wrap;gap:12px 16px}
.olysub{font-size:var(--fs-c);font-weight:700;color:var(--tx2);margin:16px 0 8px}
.olysub:first-child{margin-top:0}
.olyfl{width:var(--w-in-m)}
.tb tr.dim td{color:var(--tx3)}
.tb td.oxq{min-width:260px;max-width:420px;white-space:normal}
.olyfl .in{min-width:0;width:100%}
.olyfl .h{font-weight:400;color:var(--tx2);line-height:1.4}
.olyfl .e{color:var(--bad);line-height:1.4}
.in.bad{border-color:var(--bad);background:var(--bad-bg)}
.in:disabled{background:var(--soft);color:var(--tx3)}
.olypv{margin-top:12px;max-width:760px}
.olypv td,.olypv th{padding:8px 12px}
.olypv .chg{color:var(--navy)}
tr.olytop td{border-top:1px solid var(--line)}
.btn.xp{height:var(--h-sm);padding:0 8px;color:var(--tx2);font-variant-numeric:tabular-nums}
.btn.xp i{width:6px;height:6px;border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);transform:rotate(45deg);margin:-3px 0 0 4px;transition:transform .15s}
.btn.xp.on{background:var(--navy05);color:var(--navy)}
.btn.xp.on i{transform:rotate(-135deg);margin-top:4px}
tr.brkrow td{background:var(--soft)}
table.brk{max-width:640px}
table.brk td{padding:4px 12px;border-bottom:1px solid var(--line2)}
table.brk tr.tot td{border-bottom:0;border-top:1px solid var(--line3)}
/* v4.75 예약 2분 전 배너 · 모든 메뉴 위(헤더 아래 고정) */
#schBan{position:sticky;top:60px;z-index:29;max-width:1480px;margin:0 auto;padding:12px 24px 0;display:flex;flex-direction:column;gap:8px}
#schBan .sbi{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn);border-radius:var(--r-s);padding:12px 16px;font-size:var(--fs-s);box-shadow:var(--sh-lg)}
#schBan .sbi b{color:var(--tx)}
#schBan .sbi span{flex:1}
.tb tr.soon td{background:var(--warn-bg)}
/* v4.76 알림(웹 푸시) · 미리보기 한 줄 · 글자 수 · 확인 창 큰 숫자 · 인원 확인 칸 */
.pv{margin-top:12px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--sf);font-size:var(--fs-b);color:var(--tx2);line-height:1.7}

   미리보기 폰 안의 색은 참가자 앱 토큰(design-handoff tokens.css)과 OS 화면의 근사치다 · 콘솔 셸 색이 아니다 */
.ns-now{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--navy1);background:var(--navy05);border-radius:var(--r);margin-bottom:16px}

.ns-chip.bad{border-color:var(--bad-bd);background:var(--bad-bg)}
.ns-cm{color:var(--tx2);font-size:var(--fs-c);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ns-cs{font-size:var(--fs-c);font-weight:700;color:var(--tx2);padding:0 8px;border-radius:99px;background:var(--line2);white-space:nowrap}

.ns-qw .in{width:100%;min-width:0}
.ns-drop{position:absolute;left:0;right:0;top:40px;z-index:20;background:var(--sf);border:1px solid var(--line3);border-radius:var(--r-s);box-shadow:var(--sh-lg);padding:4px;max-height:340px;overflow:auto}

.ns-rt b{font-size:var(--fs-b);color:var(--tx)}
.ns-rt span{font-size:var(--fs-c);color:var(--tx2);line-height:1.5}

.ns-sum b{color:var(--navy);font-weight:700;font-variant-numeric:tabular-nums;font-size:var(--fs-h2)}
.ns-act{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line2)}
.ns-test{flex:1;min-width:260px;padding:12px 16px;border:1px dashed var(--navy);border-radius:var(--r-s);background:var(--navy05)}
.ns-test>b{color:var(--navy)}
.ns-test .row{gap:8px;margin-top:8px;flex-wrap:wrap}
.ns-tb{font-weight:600}
.ns-go{font-weight:700}

.ns-sbar{position:absolute;top:4px;left:14px;font-size:9px;font-weight:700}

.ns-clk{text-align:center;font-size:40px;font-weight:300;line-height:1;margin-top:6px}
.ns-day{text-align:center;font-size:10px;opacity:.85;margin:4px 0 14px}
.ns-nf{display:flex;gap:7px;background:rgba(245,245,247,.86);color:#111;border-radius:13px;padding:8px}

.ns-ah span{overflow:hidden;text-overflow:ellipsis}
.ns-ah img{width:13px;height:13px;border-radius:50%;flex-shrink:0}
.ns-nb1{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#444}
.ns-app{background:#f2f4f6;color:#191f28}
.ns-hd{font-weight:800;font-size:12px;letter-spacing:.04em;margin:2px 4px 10px}
.ns-card{display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:11px 10px}
.ns-cx{flex:1;min-width:0}
.ns-tag{display:inline-block;font-size:9px;font-weight:600;color:#a63d00;background:#fff1e8;border-radius:6px;padding:1px 6px}

/* v4.78 알림 보류 창 · 프리셋 · 발송 옵션 · 숫자 설정 · 이름은 pz- 로 시작(다른 규칙과 겹치지 않게 · 117-콘솔 겹침 검사) */
.pz-hold{margin-top:16px;display:flex;gap:16px;align-items:center;padding:16px 16px;border-radius:var(--r-s);background:var(--warn-bg);border:1px solid var(--warn-bd)}
.pz-hold.pz-done{background:var(--soft);border-color:var(--line2)}
.pz-n{font-size:var(--fs-kpi);font-weight:700;color:var(--warn);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.pz-t{font-weight:700;color:var(--tx)}
.pz-s{font-size:var(--fs-s);color:var(--tx2);margin-top:2px}
.pz-bar{margin-top:8px;height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.pz-bar i{display:block;height:100%;background:var(--warn);transition:width .2s linear}
.pz-acts{margin-top:16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pz-lab{font-size:var(--fs-c);font-weight:700;color:var(--tx2);margin-top:16px}
.pz-pre{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pz-rule{margin-top:12px;font-size:var(--fs-b);color:var(--tx2);padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--sf)}

.pz-opt label{display:flex;gap:8px;align-items:center;font-weight:700}
.pz-nums{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.pz-nums .in{width:var(--w-in-s)}
@media(max-width:720px){.pz-hold{gap:12px}.pz-acts .btn{flex:1}}
/* v4.79 Outro 럭키드로우 추첨 메뉴 · 이름은 dw- 로 시작(다른 규칙과 겹치지 않게 · 120-콘솔 겹침 검사) */
.dw-set{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:flex-end}
.dw-code{width:var(--w-in-m);font-variant-numeric:tabular-nums;letter-spacing:.04em;text-transform:uppercase}

.dw-no{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
/* v4.81 QR 메뉴 「QR 그림」 · 이름은 qv- 로 시작(다른 규칙과 겹치지 않게 · 121-콘솔 겹침 검사) */
.qv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.qv-it{border:1px solid var(--line2);border-radius:var(--r-s);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--sf)}
.qv-img{width:100%;max-width:200px;aspect-ratio:1/1;align-self:center;image-rendering:pixelated;background:#fff;border:1px solid var(--line2)}
.qv-lb{font-weight:700;margin-top:8px;word-break:keep-all}
.qv-sub{font-size:var(--fs-s);color:var(--tx2)}
.qv-url{font-size:var(--fs-s);color:var(--tx2);word-break:break-all;font-variant-numeric:tabular-nums}
.qv-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.qv-sec{margin-top:16px;border:1px solid var(--line2);border-radius:var(--r-s);padding:12px 16px;background:var(--soft)}
.qv-sec>summary{cursor:pointer;font-weight:700}
.qv-sec .qv-grid{margin-top:12px}
/* v4.82 추첨 › 진행(럭키드로우 원격 진행) · 이름은 dc- 로 시작(다른 규칙과 겹치지 않게 · 122-콘솔 겹침 검사) */
.dc-top{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:16px 0 12px}
.dc-acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.dc-conn{display:inline-flex;align-items:center;font-size:var(--fs-s);font-weight:700;border-radius:99px;padding:4px 12px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.dc-conn.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-bd)}
.dc-conn.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-bd)}
.dc-att{margin-bottom:12px}
.dc-rej{margin-bottom:12px;padding:12px 16px;border:1px solid var(--bad-bd);background:var(--bad-bg);color:var(--bad);border-radius:var(--r-s);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dc-stat{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}
.dc-stat div{background:var(--soft);border:1px solid var(--line2);border-radius:var(--r-s);padding:8px 12px;min-width:0}
.dc-stat span{display:block;font-size:var(--fs-c);color:var(--tx2);font-weight:600}
.dc-stat b{display:block;font-size:var(--fs-h2);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-stat div:first-child b{color:var(--navy)}
.dc-pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dc-b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;padding:8px 12px;border:1px solid var(--line3);border-radius:var(--r);background:var(--sf);color:var(--tx);font-size:var(--fs-h2);font-weight:700;line-height:1.3;text-align:center}
.dc-b em{font-style:normal;font-size:var(--fs-c);font-weight:600;color:var(--tx2)}
.dc-b:hover:not(:disabled){border-color:var(--navy);color:var(--navy)}
.dc-b.go{background:var(--navy);border-color:var(--navy);color:#fff}
.dc-b.go em{color:var(--navy1)}
.dc-b.go:hover:not(:disabled){background:var(--navy8);color:#fff}
.dc-b.arm,.dc-b.arm:hover:not(:disabled){background:var(--bad);border-color:var(--bad);color:#fff}

.dc-b.sm{min-height:36px;flex-direction:row;gap:8px;padding:8px 16px;font-size:var(--fs-b)}
.dc-sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.dc-win{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dc-no{font-size:var(--fs-kpi);font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:.04em;border:1px solid var(--navy1);background:var(--navy05);border-radius:var(--r-s);padding:4px 16px}
.dc-nm{font-size:var(--fs-h1);font-weight:700}
.dc-mc{font-size:var(--fs-h2);line-height:1.7}
@media(max-width:720px){.dc-pad{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* v5.56 진행판 · 무대 순서 띠 + 큰 버튼 하나(= 추첨 화면 Space) */
.dc-steps{display:flex;gap:4px;list-style:none;margin:0 0 16px;padding:0;flex-wrap:wrap}
.dc-steps li{flex:1 1 0;min-width:96px;padding:8px 12px;border-radius:var(--r-s);background:var(--soft);border:1px solid var(--line2);color:var(--tx3);font-size:var(--fs-s);font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dc-now{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.dc-now span{font-size:var(--fs-c);color:var(--tx2);font-weight:600}
.dc-now b{font-size:var(--fs-h1);font-weight:700}
.dc-now .dc-r{font-size:var(--fs-h2);color:var(--navy);font-weight:700;font-variant-numeric:tabular-nums}
.dc-gorow{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.dc-go,.dc-abs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;padding:12px 24px;border-radius:var(--r);text-align:center;line-height:1.25}
.dc-go{flex:1 1 320px;background:var(--navy);border:1px solid var(--navy);color:#fff}
.dc-go b{font-size:var(--fs-kpi);font-weight:700}
.dc-go em,.dc-abs em{font-style:normal;font-size:var(--fs-c);font-weight:600}
.dc-go em{color:var(--navy1)}
.dc-go:hover:not(:disabled){background:var(--navy8)}
.dc-go:disabled{background:var(--soft);border-color:var(--line);color:var(--tx2);cursor:default}
.dc-go:disabled em{color:var(--tx3)}
.dc-abs{flex:0 1 220px;background:var(--sf);border:1px solid var(--bad-bd);color:var(--bad)}
.dc-abs b{font-size:var(--fs-h2);font-weight:700}
.dc-abs em{color:var(--tx2)}
.dc-go.arm,.dc-abs.arm,.dc-go.arm:hover,.dc-abs.arm:hover{background:var(--bad);border-color:var(--bad);color:#fff}
.dc-go.arm em,.dc-abs.arm em{color:#fff}
.dc-abs:disabled{opacity:.35;cursor:default}
.dc-keys td{height:36px}
.grid.g75>:nth-child(odd){grid-column:span 7}.grid.g75>:nth-child(even){grid-column:span 5}
#rtv .grid>*{grid-column:auto}
.g75>div>.card:first-child{margin-top:0}

/* ── v5.03 완주 경품 추첨 · 추첨 › 완주 경품 추첨 · fn- ── */
.fn-step{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.fn-step span{font-size:var(--fs-c);font-weight:700;border-radius:99px;padding:4px 12px;border:1px solid var(--line);color:var(--tx2);background:var(--sf);white-space:nowrap}
.fn-step span.on{color:#fff;background:var(--navy);border-color:var(--navy)}
.fn-step span.done{color:var(--navy);background:var(--navy05);border-color:var(--navy1)}
.fn-rem{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.fn-rem label{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-c);color:var(--tx2);font-weight:600;min-width:0}
.fn-rem .in{width:var(--w-in-s);text-align:right;font-variant-numeric:tabular-nums}
.fn-rem em{font-style:normal;color:var(--tx2);font-weight:400;font-variant-numeric:tabular-nums}
.fn-sum{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:baseline;margin-top:12px;font-size:var(--fs-s);color:var(--tx2)}
.fn-sum b{font-size:var(--fs-h2);color:var(--tx);font-variant-numeric:tabular-nums}
.fn-form{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:flex-end}
.fn-form label{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-c);color:var(--tx2);font-weight:600;min-width:0}
.fn-form .in{min-width:0}
.fn-seed{font-family:Consolas,monospace;font-size:var(--fs-c);word-break:break-all;color:var(--tx2);text-align:right}
.fn-go{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
@media(max-width:720px){.fn-rem{grid-template-columns:repeat(2,minmax(0,1fr))}.fn-form label{flex:1 1 100%}.fn-form .in{width:100%!important}}
.err-banner{margin-bottom:16px}
div.err-banner:not(.bands){background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-bd);border-radius:var(--r-s);padding:12px 16px;font-size:var(--fs-b)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--navy1);border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.drop{display:block;margin-top:12px;border:1.5px dashed var(--line3);border-radius:var(--r-s);padding:24px;text-align:center;cursor:pointer;background:var(--soft)}
.drop:hover{border-color:var(--navy)}
/* ── v4.13 타자왕전 · 콘솔 진행 화면 ── */
.rcode{font-size:var(--fs-kpi);font-weight:700;letter-spacing:.18em;color:var(--navy);font-variant-numeric:tabular-nums}
.rlink{min-width:0;width:100%;font-size:var(--fs-c);color:var(--tx2)}
.rbar{height:8px;border-radius:99px;background:var(--navy05);overflow:hidden;min-width:120px}
.rbar i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .9s linear}
/* ── v4.20 타자왕전 · 큰 화면 (사이니지 세계 · design.md §0~§5 · 블랙 스테이지 + 어두운 도트 격자 + Vibrant Orange)
   크기는 1920 폭 기준 비율(vw) · 경기 중에는 선수마다 요약 카드 한 장(1 · 2 · 4분할) · 연보라(#E6CCFF)는 「오늘 1등」 라벨에만 찍는다 ── */
#rtv{position:fixed;inset:0;z-index:58;background:#000;color:#fff;display:none;overflow:hidden;letter-spacing:-.01em;cursor:default}
#rtv.on{display:block}
#rtv canvas{position:absolute;inset:0;width:100%;height:100%}
#rtv .in0{position:absolute;inset:0;padding:2.6vw 3.4vw;display:flex;flex-direction:column}
#rtv .n{font-variant-numeric:tabular-nums}
#rtv .hd{display:flex;align-items:baseline;gap:1.6vw}
#rtv .hd .b{font-size:2.1vw;font-weight:600;color:#FF7E31}
#rtv .hd .t{font-size:1.25vw;font-weight:600;color:rgba(255,255,255,.72)}
#rtv .hd .r{margin-left:auto;display:flex;align-items:baseline;gap:.8vw;font-size:1.25vw;color:rgba(255,255,255,.72);font-weight:600}
#rtv .hd .r b{font-size:3.6vw;font-weight:700;color:#FF7E31;line-height:1}
#rtv .bd{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
#rtv .ey{font-size:1.5vw;font-weight:600;color:#FF963E}
#rtv .hl{font-size:5.4vw;font-weight:700;line-height:1.15;color:#FF7E31;margin-top:.6vw}
#rtv .sb{font-size:1.7vw;color:rgba(255,255,255,.72);margin-top:1vw}
#rtv .seats{display:grid;gap:1.4vw;margin-top:3vw}
#rtv .seat{border-radius:1.6vw;background:rgba(255,255,255,.07);padding:2vw 2.2vw;min-height:13vw;display:flex;flex-direction:column;justify-content:space-between}
#rtv .seat .no{font-size:1.4vw;font-weight:600;color:rgba(255,255,255,.48)}
#rtv .seat .nm{font-size:3.2vw;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rtv .seat.empty .nm{color:rgba(255,255,255,.28);font-weight:500}
#rtv .seat.on .no{color:#FF963E}
#rtv .cd{font-size:24vw;font-weight:700;line-height:1;color:#FF7E31;text-align:center}
#rtv .cdn{display:flex;justify-content:center;gap:3vw;font-size:2vw;font-weight:700;color:rgba(255,255,255,.72);margin-top:2vw}
/* 경기 중 · 요약 카드 격자 (v4.20 · 1분할 · 2분할 · 4분할) */
#rtv .grid{flex:1;display:grid;gap:1.6vw;min-height:0}
#rtv .grid.g1{grid-template-columns:1.55fr 1fr}
#rtv .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
#rtv .grid.g4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
#rtv .pl{position:relative;border-radius:1.8vw;background:rgba(255,255,255,.07);padding:2vw 2.4vw;display:flex;flex-direction:column;justify-content:center;gap:.6vw;min-height:0;overflow:hidden;border:.25vw solid transparent}
#rtv .pl.lead{border-color:#FF7E31;background:rgba(255,126,49,.16)}
#rtv .pl.fin{background:rgba(255,255,255,.04)}
#rtv .pl.empty{align-items:center;justify-content:center;background:rgba(255,255,255,.03)}
#rtv .pl.empty .nm{font-size:1.8vw;color:rgba(255,255,255,.28);font-weight:500}
#rtv .pl.best{background:rgba(230,204,255,.08)}
#rtv .pl.best .no{color:#E6CCFF}
#rtv .pl.best .sc{color:#E6CCFF}
#rtv .pl .pt{display:flex;align-items:baseline;gap:1vw}
#rtv .pl .no{font-size:1.3vw;font-weight:600;color:rgba(255,255,255,.48)}
#rtv .pl .rk{margin-left:auto;font-size:1.9vw;font-weight:700;color:#FF963E}
#rtv .pl .nm{font-size:2.6vw;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rtv .pl .sc{font-size:7vw;font-weight:700;line-height:1;color:#FF7E31}
#rtv .pl.solo .sc,#rtv .grid.g1 .sc{font-size:9vw}
#rtv .grid.g4 .sc{font-size:5.4vw}
#rtv .pl .hh{display:flex;gap:.6vw;margin-top:.3vw}
#rtv .pl .hh i{width:1.5vw;height:1.5vw;border-radius:.3vw;background:#3A3A3A;display:block}
#rtv .pl .hh i.on{background:#FF7E31}
#rtv .pl .sub{font-size:1.4vw;font-weight:600;color:rgba(255,255,255,.6)}
#rtv .pl .badge{position:absolute;right:1.6vw;bottom:1.4vw;font-size:1.2vw;font-weight:700;color:rgba(255,255,255,.48)}
#rtv .pl .badge:empty{display:none}
#rtv .res{display:flex;flex-direction:column;gap:1vw;margin-top:2.4vw}
#rtv .rr{display:grid;grid-template-columns:7vw minmax(0,1fr) 14vw 11vw 10vw;gap:1.4vw;align-items:center;padding:1.3vw 2vw;border-radius:1.4vw;background:rgba(255,255,255,.07)}
#rtv .rr.w{background:rgba(255,126,49,.2)}
#rtv .rr .rk{font-size:3.2vw;font-weight:700;color:#FF7E31}
#rtv .rr .nm{font-size:2.8vw;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rtv .rr .c{text-align:right;font-size:2.4vw;font-weight:700}
#rtv .rr .c small{display:block;font-size:1vw;color:rgba(255,255,255,.48);font-weight:600}
#rtv .pod{display:flex;align-items:flex-end;justify-content:center;gap:2vw;margin-top:2vw;flex:1}
#rtv .pc{width:22vw;display:flex;flex-direction:column;align-items:center;text-align:center}
#rtv .pc .nm{font-size:3vw;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rtv .pc .rc{font-size:1.4vw;color:rgba(255,255,255,.72);margin:.4vw 0 1.2vw;font-weight:600}
#rtv .pc .blk{width:100%;border-radius:1.6vw 1.6vw 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:1.6vw;font-size:5vw;font-weight:700;color:#000}
#rtv .pc.p1 .blk{height:34vh;background:#FF7E31}
#rtv .pc.p2 .blk{height:26vh;background:#FF963E}
#rtv .pc.p3 .blk{height:20vh;background:#FFB284}
#rtv .pc.p1 .nm{font-size:3.8vw;color:#FF7E31}
#rtv .ctl{position:absolute;right:1.6vw;bottom:1.4vw;display:flex;gap:8px;opacity:0;transition:opacity .25s}
#rtv.ui .ctl{opacity:1}
#rtv .ctl button{padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.6);color:rgba(255,255,255,.85);font-size:13px;font-weight:600}
#rtv .ctl button:hover{border-color:#FF7E31;color:#fff}
#rtv .ctl button:disabled{opacity:.35;cursor:default}
#rtv .ctl .k{font-size:11px;color:rgba(255,255,255,.45);margin-left:4px}
/* ── v4.16 아이디어 ── */
td.itx{min-width:280px;max-width:520px;white-space:normal;line-height:1.55}
.ixt{white-space:pre-wrap;word-break:break-word}   /* 아이디어 3,000자(261003) · 줄바꿈 그대로 · 긴 글은 앞 180자 + 펼치기(ideaTxt) */
button.lnk{background:none;border:0;padding:0;font-family:inherit;white-space:nowrap}
.ilist{list-style:none;display:flex;flex-direction:column}
.ilist li{padding:12px 0;border-top:1px solid var(--line2)}
.ilist li:first-child{border-top:0;padding-top:0}
.ilist .it{color:var(--tx);line-height:1.55}
.ilist .im{font-size:var(--fs-c);color:var(--tx2);margin-top:4px}
/* ── v5.14 위계 개편(261003 사용자 결정 · 디자인 시안/콘솔 위계 개편) · 1단 메뉴 7개 · 서브 칩 · 요소 공통 틀 · 이름은 hv- 로 시작 ── */
/* 261003 UI 정돈 · 2단 = 밑줄 탭(가로 스크롤 · 대기 숫자 배지) · 3단 = 분할 선택(회색 바탕 안 흰 조각) · 칩 모양이 아니다 */
.hv-l2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 24px;overflow-x:auto;scrollbar-width:none}
.hv-l2::-webkit-scrollbar{display:none}
.hv-l2 button{position:relative;display:flex;gap:8px;align-items:center;height:var(--h-ctl);padding:0 12px;font-weight:600;color:var(--tx2);white-space:nowrap;flex-shrink:0}
.hv-l2 button:hover{color:var(--tx)}
.hv-l2 button.on{color:var(--navy)}
.hv-l2 button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--navy)}
.hv-l2 button.lk{color:var(--tx3)}
.hv-l2 button.lk.on{color:var(--navy)}
.seg,.hv-seg{display:inline-flex;flex-wrap:wrap;padding:2px;gap:2px;background:var(--bg);border-radius:var(--r-s)}
.seg button,.hv-seg button{display:inline-flex;align-items:center;gap:4px;height:var(--h-sm);padding:0 12px;border-radius:var(--r-xs);font-size:var(--fs-s);font-weight:600;color:var(--tx2);white-space:nowrap}
.seg button:hover,.hv-seg button:hover{color:var(--tx)}
.seg button.on,.hv-seg button.on{background:var(--sf);color:var(--navy);box-shadow:0 1px 2px rgba(8,24,74,.12)}
.hv-l3{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0 16px}
.hv-l3.top{margin-top:0}
.hv-l3>b{font-size:var(--fs-s);font-weight:600;color:var(--tx2)}
.fchip.lk{color:var(--tx3);background:var(--soft);border-style:dashed}
.fchip.lk.on{background:var(--navy05);color:var(--navy);border-style:solid}
.hv-lk{display:inline-block;width:11px;height:11px;vertical-align:-1px;flex-shrink:0}
.hv-strip{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;font-size:var(--fs-s)}
.hv-strip .sp{flex:1}
.hv-els{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.hv-el{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--sf)}
.hv-el:hover{border-color:var(--navy)}
.hv-el .row{justify-content:space-between;flex-wrap:nowrap}
.hv-el b{font-size:var(--fs-b)}
.hv-el span.m{font-size:var(--fs-c);color:var(--tx2);font-variant-numeric:tabular-nums}
/* 261003 UI 정돈 · 요소 상태 띠 · 본부 요소 표 · 2열 KPI */
.cfg-fx{display:flex;align-items:center;gap:4px;color:var(--tx2)}
.hv-st{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;padding:16px 24px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.hv-st .hv-nums{margin-top:0;gap:8px 24px}
.hv-st .r{margin-left:auto;display:flex;gap:8px}
.hv-st .btn.on{background:var(--navy05);border-color:var(--navy);color:var(--navy)}
.hv-pn{margin:0 0 16px}
.hv-logc{margin-top:16px}
.chev{display:inline-block;width:7px;height:7px;border-right:1.5px solid var(--tx3);border-bottom:1.5px solid var(--tx3);transform:rotate(-45deg)}
.kpis.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis.k2 .kpi{border-radius:var(--r-s)}
.todo .it.zero{padding:8px 4px}.todo .it.zero .v{font-size:var(--fs-h2)}
.hv-ck .lnk{margin-left:auto}
@media(max-width:720px){.hv-st{padding:16px}.hv-st .r{margin-left:0;width:100%}.hv-st .r .btn{flex:1}.hide-m{display:none}}
.hv-fr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hv-fr>.card{margin-top:0}
@media(max-width:1100px){.hv-fr{grid-template-columns:minmax(0,1fr)}}
.hv-nums{display:flex;gap:8px 24px;flex-wrap:wrap;align-items:baseline;margin-top:12px}
.hv-nums div{display:flex;flex-direction:column}
.hv-nums span{font-size:var(--fs-c);color:var(--tx2);font-weight:600}
.hv-nums b{font-size:var(--fs-h2);font-weight:700;font-variant-numeric:tabular-nums}
.hv-log{list-style:none;display:flex;flex-direction:column}
.hv-log li{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line2);font-size:var(--fs-s)}
.hv-log li:first-child{border-top:0}
.hv-log .t{color:var(--tx2);width:76px;flex-shrink:0;font-variant-numeric:tabular-nums}
.hv-ck{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:var(--fs-s);color:var(--tx2)}
.hv-ck i{width:8px;height:8px;border-radius:50%;background:var(--line3);flex-shrink:0}
.hv-ck.ok i{background:var(--ok)}.hv-ck.warn i{background:var(--warn)}
.hv-scr .acts{justify-content:flex-start}
details.hv-dz{border:1px solid var(--line);border-radius:var(--r-s);margin-top:12px;background:var(--sf)}
details.hv-dz>summary{cursor:pointer;list-style:none;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
details.hv-dz>summary::-webkit-details-marker{display:none}
details.hv-dz>summary b{color:var(--tx)}   /* 261003 UI 정돈 · 위험 줄 제목은 검정 · 위험 색은 버튼만 · 등급은 L 표시와 확인 절차로 */
details.hv-dz>div{padding:0 16px 16px}
details.hv-dz.off{border-color:var(--line)}
details.hv-dz.off>summary b{color:var(--tx3)}
.hv-lv{font-size:var(--fs-c);font-weight:700;color:var(--tx2);border:1px solid var(--line3);border-radius:6px;padding:0 8px}
@media(max-width:720px){.hv-strip{padding:12px 12px}.hv-els{grid-template-columns:minmax(0,1fr)}.hr{white-space:normal;gap:8px}.hr #stamp .tx{display:none}}
/* v5.21 경품·재고 · 이름은 iv- 로 시작(다른 규칙과 겹치지 않게) */
.iv-bar{display:flex;align-items:center;gap:8px;min-width:120px}
.iv-bar .bar{flex:1;min-width:56px}
.iv-bar .bar.iv-w i{background:var(--warn)}
.iv-bar b{min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.iv-row{cursor:pointer}
.iv-row:hover td{background:var(--navy05)}
.iv-sub{font-size:var(--fs-c);color:var(--tx2);font-weight:400}
.iv-warn{display:flex;flex-direction:column;gap:8px}
.iv-warn .it{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.iv-form{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:flex-end}
.iv-form .in{width:var(--w-in-s)}
.iv-form .in.w{width:var(--w-in-m)}
.note.iv-nb{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-bd)}
@media(max-width:720px){.iv-form .in,.iv-form .in.w{width:100%}.iv-form .fld{flex:1 1 140px}}
/* 261006 경품·재고 쉬운 판 */
.iv-st .iv-line{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px 24px;font-size:var(--fs-b);font-weight:600;font-variant-numeric:tabular-nums}
.iv-st .iv-line .tag{margin-right:4px}

/* 처리 직후 20초 동안은 방금 바꾼 값을 서버 목록 위에 덮는다.

    if(o.exp<now){ delete ST.ovr[k]; return; }

    if(same) delete ST.ovr[k]; else for(var f2 in o.p) r[f2]=o.p[f2]; }); }

/* 261006 한글 입력(IME) 보호 · 사용자 제보 「가입 계정 검색칸에 이름을 치면 ㅂㅏㄱㅎㅕㄴ… 으로 풀려 들어가고 0 / 55명」
 * 원인 = 입력할 때마다 render() 가 #view 를 innerHTML 로 통째로 바꿔, 조합 중인 입력칸이 새 칸으로 바뀌며 조합이 끊겼다.
 * 고침 ① keepEdit(box, html) · 포커스된 입력칸(과 그 위 조상 줄)은 DOM 에 그대로 두고 나머지(목록 · 숫자 · 다른 칸)만 새것으로 바꾼다.
 *        칸이 바뀌지 않으므로 조합 · 커서 · 포커스가 그대로다. 새 화면에서 같은 칸을 못 찾으면(화면 구조가 바뀜) 예전처럼 통째로 그린다.
 *        render() 와 서랍(renderDrawer)이 모두 이 함수를 쓴다 · 주기 새로 고침이 조합 중에 와도 같다.
 *      ② 조합 중(compositionstart ~ compositionend) 의 입력 이벤트는 바로 넘기지 않고 250ms 모아 한 번 · 조합이 끝나면 바로 한 번 검색한다.
 *        한국어 입력기는 마지막 글자를 계속 조합 중으로 두므로 「끝날 때만」 찾으면 결과가 늦다 · 그래서 조합 중에도 모아서 찾는다. */
var IME={ on:false, pend:null, t:0, pass:0 };
function imeFire(t){ clearTimeout(IME.t); IME.pend=null; if(!t||!document.documentElement.contains(t)) return; IME.pass=1; try{ t.dispatchEvent(new Event("input",{ bubbles:true })); } finally { IME.pass=0; } }
document.addEventListener("compositionstart",function(){ IME.on=true; },true);
document.addEventListener("compositionend",function(e){ IME.on=false; var t=IME.pend; if(t&&t===e.target) imeFire(t); },true);
document.addEventListener("input",function(e){
  if(IME.pass||!(e.isComposing||IME.on)) return;
  var t=e.target; if(!t||!t.getAttribute||!t.getAttribute("oninput")) return;
  e.stopPropagation();   /* 문서 캡처 단계에서 멈춤 = 칸의 oninput(검색 · render)이 조합 중에는 바로 돌지 않는다 */
  IME.pend=t; clearTimeout(IME.t); IME.t=setTimeout(function(){ imeFire(t); },250);
},true);
function keepEditOk(ae){ return !!ae&&(ae.tagName==="TEXTAREA"||(ae.tagName==="INPUT"&&!/^(checkbox|radio|button|submit|reset|file|range|color)$/i.test(ae.type||""))); }
function keepAttr(o,n,leaf){
  [].slice.call(o.attributes).forEach(function(a){ if(!n.hasAttribute(a.name)&&!(leaf&&a.name==="value")) o.removeAttribute(a.name); });
  [].slice.call(n.attributes).forEach(function(a){ if(leaf&&a.name==="value") return; if(o.getAttribute(a.name)!==a.value) o.setAttribute(a.name,a.value); });
}
function keepEdit(box, html){
  var ae=document.activeElement;
  if(!keepEditOk(ae)||!box.contains(ae)){ box.innerHTML=html; return false; }
  var all=box.querySelectorAll("input,select,textarea"), idx=[].indexOf.call(all,ae), tmp=document.createElement("div");
  tmp.innerHTML=html;
  var na=tmp.querySelectorAll("input,select,textarea")[idx];
  if(!na||na.tagName!==ae.tagName||(na.getAttribute("oninput")||"")!==(ae.getAttribute("oninput")||"")||(na.getAttribute("placeholder")||"")!==(ae.getAttribute("placeholder")||"")){ box.innerHTML=html; return false; }
  var oc=[], nc=[], x;
  for(x=ae;x&&x!==box;x=x.parentNode) oc.unshift(x);
  for(x=na;x&&x!==tmp;x=x.parentNode) nc.unshift(x);
  if(oc.length!==nc.length||oc.some(function(o,i){ return o.tagName!==nc[i].tagName; })){ box.innerHTML=html; return false; }
  var op=box, np=tmp;
  for(var j=0;j<oc.length;j++){
    var o=oc[j], n=nc[j], kids=[].slice.call(np.childNodes), k=kids.indexOf(n);
    [].slice.call(op.childNodes).forEach(function(c){ if(c!==o) op.removeChild(c); });
    kids.slice(0,k).forEach(function(c){ op.insertBefore(c,o); });
    kids.slice(k+1).forEach(function(c){ op.appendChild(c); });
    keepAttr(o,n,j===oc.length-1);
    op=o; np=n;
  }
  /* 칸 값 · 조합 중이 아니고 새 화면이 다른 값을 줬으면(예: 찾기 뒤 비우기) 그 값으로 · 커서는 끝 */
  if(ae.tagName==="INPUT"&&!IME.on&&na.hasAttribute("value")&&ae.value!==na.getAttribute("value")) ae.value=na.getAttribute("value");
  return true;
}
/* 값을 고칠 때 있던 자리를 지킨다. 화면을 통째로 다시 그리므로 스크롤·포커스를 직접 되돌린다(입력칸에 포커스가 있으면 keepEdit 가 그 칸을 그대로 둔다). */

  var hs=HIST[e]||[];

/* 스탬프 개수 → 보상 (v4.58 사용자 확정 260929 · 개수는 6개가 한도 · 3개 룰렛 · 4·5·6개 행운권 1·2·3장 · 최대 3장) · 앱·서버와 같은 식

var STAMP_DENOM=6, RAFFLE_MAX=3;

/* v5.68 (사용자 확정 261005) 프로그램 참여(p3) = 2개 · p3h(17F 한쪽만) = 1개 · 서버 stamp_people units · half · 옛 서버(없음)면 모두 1개

function stHalfId(){ return (ST.data.stamp||{}).half||""; }
function stHalfOf(){ var U=stUnitMap(); return Object.keys(U).filter(function(k){ return U[k]>1&&STAMP_ORDER.indexOf(k)>=0; })[0]||""; }   /* 261006 ck(체크인 3개)는 8칸 밖이라 절반 칸 후보에서 뺀다 */   /* 절반이 붙는 칸(p3) */

function stampCells(ids, half){

function logKindN(k){

  if(m){ var s=STAMP_META[m[2]], U=stUnitMap(); return (s?(s.no?s.no+" ":"")+s.n+(U[m[2]]>1?" ("+U[m[2]]+"개)":"")+(s.old?" · 폐기":""):m[2])+(m[1]?" · 취소":""); }

function rwImpact(n0, n1, extra){

  else out.push(["룰렛 자격", a.roulette?"그대로 (있음)":"그대로 (없음)"]);

function resvDo(ids, status, opt){
  opt=opt||{};

  var skip=ids.length-rows.length;
  function go0(){
    dlgForce();
    var prev={}; rows.forEach(function(r){ prev[r.id]=r.status; });

      r.status=target; ovrSet("resv:"+r.id,{status:target});
      return { r:r, run:op("resv_set",{id:r.id,status:target,from:prev[r.id]}) }; });   /* v4.66 from = 이 화면이 본 상태 · 새 서버는 그 사이 바뀌었으면 state 로 거절(두 운영자 동시 처리) · 옛 서버는 읽지 않는다 */
    render();
    runOps(items, function(it,ok,res){
      if(!ok){ it.r.status=(res&&res.reason==="state"&&res.cur)?res.cur:prev[it.r.id]; delete ST.ovr["resv:"+it.r.id]; }
      else { hist(it.r.emp, "상담 "+hhmm(it.r.slot)+" "+(opt.undo?"되돌림 → ":"")+it.r.status+(res.stamp&&!res.stamp.dup?" · 스탬프 적립":"")); if(!opt.undo) delete ST.sel["r:"+it.r.id]; }
    }, function(okN,bad){
      render();
      if(bad.some(function(b){ return b.res&&/^(state|taken|dup)$/.test(b.res.reason); })) reload(["resv"]);
      var who=rows.length===1?rows[0].name+" · ":"";
      var msg=(rows.length===1&&bad.length)?(opt.undo?"되돌리지 못했습니다 · ":"처리하지 못했습니다 · ")+who+why(bad[0].res)
        :opt.undo?"되돌렸습니다 · "+who+okN+"건":who+status+(rows.length>1?" "+okN+"건":"")+(bad.length?" · 실패 "+bad.length+"건 ("+why(bad[0].res)+")":"")+(skip?" · 해당 없음 "+skip+"건 제외":"");
      var undoIds=items.filter(function(it){ return bad.every(function(b){ return b.it!==it; }); }).map(function(it){ return it.r.id; });
      toast(msg, (!opt.undo&&RESV_UNDO[status]&&undoIds.length)?{ undo:function(){ var back={}; undoIds.forEach(function(id){ back[id]=prev[id]; }); resvDo(undoIds, "", { undo:back }); } }:{});
    });
  }
  if(opt.undo||status==="승인"&&rows.length===1||status==="체크인"||status==="완료") return go0();
  var danger=status==="취소"||status==="노쇼";
  dialog({ t:(rows.length>1?rows.length+"건을 ":"")+"「"+status+"」 처리할까요?",
    s:danger?"참가자 앱에 바로 반영됩니다. 처리 뒤 7초 동안 알림의 <b>되돌리기</b>로 이전 상태로 돌릴 수 있습니다."+(skip?"<br>지금 상태에서 "+status+"할 수 없는 "+skip+"건은 빼고 처리합니다.":"")
      :"선택한 신청을 승인합니다. 참가자 앱에 「승인」으로 뜹니다."+(skip?"<br>신청 상태가 아닌 "+skip+"건은 뺍니다.":""),

    ok:(danger?status+" 처리":status)+(rows.length>1?" "+rows.length+"건":""), danger:danger, onOk:go0 });

function pushAsk(o){

    var who=(v.spec&&v.spec.all?"전체":(o.n!=null?o.n:v.n)+"명")+"에게 · "+esc(o.t)+"<span>푸시 "+v.reach+"명"+(v.hold?" · 보내면 "+v.hold+"초 동안 취소 가능":"")+"</span>";
    var xc=(v.recent?'<div class="note warn mt12">'+v.recent+'분 전에 전체급 발송이 있었습니다.</div>':'')+(need?'<label class="pcnt">확인: 푸시 인원 숫자를 직접 넣으세요<input class="in" id="pcCnt" inputmode="numeric" autocomplete="off" placeholder="숫자" oninput="dlgGate()" onkeydown="if(event.key===\'Enter\')dlgGo()"></label>':'');
    dialog({ t:o.head, who:who, s:o.sub||"", x:xc, ok:"보내기", focus:need?"pcCnt":"",
      gate:need?function(){ var c=el("pcCnt"), t=c?c.value.replace(/[\s,]/g,""):""; return /^\d+$/.test(t)&&Number(t)===v.reach; }:null,
      onOk:function(){ o.send(need?v.reach:null, 0); } });

  var x='<div class="pmsg"><div class="t">'+esc(o.t)+'</div>'+(o.b?'<div class="b">'+esc(o.b)+'</div>':'')+'<div class="g">누르면 '+esc(PUSH_GO_N[o.go]||o.go)+' 화면'+(o.extra?' · '+esc(o.extra):'')+(o.opt?' · '+esc(o.opt):'')+'</div></div>'+
    '<div class="pbig"><b>'+v.reach+'</b>명에게 보냅니다<span>· 대상 '+v.n+'명 · 도달 불가 '+v.miss+'명 · 기기 '+v.subs+'대</span></div>'+
    '<p class="cap mt8">'+esc(v.desc)+'</p>'+
    (v.recent?'<div class="note warn mt12">'+v.recent+'분 전에 전체급 발송이 있었습니다.</div>':'')+

    (need?'<label class="pcnt">확인: 도달 인원 숫자를 직접 넣으세요<input class="in" id="pcCnt" inputmode="numeric" autocomplete="off" placeholder="숫자" oninput="dlgGate()" onkeydown="if(event.key===\'Enter\')dlgGo()"></label>':'')+
    (v.big?'<p class="cap mt8">나에게 시험 한 번 하셨나요'+(v.hold?' · 보내면 '+v.hold+'초 동안 취소할 수 있습니다':'')+'</p>':'');   /* v4.78 A11 강제 아님 · A2 보류 */
  dialog({ t:o.head, s:o.sub||"", wide:true, x:x, ok:"보내기", focus:need?"pcCnt":"",
    gate:need?function(){ var c=el("pcCnt"), t=c?c.value.replace(/[\s,]/g,""):""; return /^\d+$/.test(t)&&Number(t)===v.reach; }:null,
    onOk:function(){ o.send(need?v.reach:null, 0); } });

/* 보낸 뒤 · recent = 한 번 더 확인 후 force · confirm = 인원이 바뀜 → 미리보기부터 다시 · 그 밖은 이유 한 줄 */
function pushAfter(r, okFn, resend, cnt, again, pre){
  if(r&&r.ok) return okFn();
  var x=r||{};

  if(x.reason==="confirm"){ toast("그 사이 인원이 바뀌었습니다 · 지금 "+x.reach+"명 · 다시 확인합니다"); return again(); }
  dialog({ t:"보내지 못했습니다", s:(pre||"")+esc(pushWhy(x)) });
}

function rtvGrid(){

  var x=c.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); x.fillStyle="#000"; x.fillRect(0,0,w,h);
  var g=w/64, d=Math.max(2,Math.round(g*0.12)), seed=7;

  for(var yy=g/2; yy<h; yy+=g) for(var xx=g/2; xx<w; xx+=g){ x.fillStyle=rnd()<0.012?"#FF7E31":"#262626"; x.fillRect(Math.round(xx),Math.round(yy),d,d); }
}

/* ── 9-2. 담당 명단 · 1F AX 라운지 · 18F 커피챗 (v4.26 17F 강연은 자유 참석이라 명단 없음) ──

 * 노쇼 표시는 담당표시 시트 한 줄이고 원장(신청 · 상담 · 커피챗 시트)은 그대로다. 좌석 · 슬롯 반환은 각 신청 화면에서. */
var ROS_PROGS=[{v:"dap",n:"1F AX 라운지"},{v:"cchat",n:"18F 커피챗"}];
var ROS={ prog:"dap", f:"all" };

function rosName(p){ var x=ROS_PROGS.filter(function(o){ return o.v===p; })[0]; return x?x.n:p; }

/* 서버 staffMark_ 가 같은 사람의 여러 줄에서 고르는 순서 · 진행 중(신청 · 승인 · 대기 · 매칭) → 입장한 줄(체크인 · 참석) → 나머지 · 같으면 앞 줄 */
function rosRk(r){ var w=r.raw; return w==="신청"||w==="승인"||w==="대기"||w==="매칭"?0:w==="체크인"||w==="참석"?1:2; }
function rosPick(rows, emp){ var e=normE(emp), cur=null; (rows||[]).forEach(function(r){ if(normE(r.emp)===e&&(!cur||rosRk(r)<rosRk(cur))) cur=r; }); return cur; }

/* 261003 카메라 계수 요약 칩(모아 보기 띠) · 카메라가 없거나 옛 서버면 아무것도 없다 · 혼잡 구역 = 빨강(혼잡 제보 칩과 같은 말) · 신호 없음 = 회색 */

/* 261005 현장 확인 요청 · 서버 판단 z[].j = check | calm | 빈값(옛 서버는 없음 = 빈값) · 스태프에게 보이는 신호일 뿐 참가자 앱에는 안 나간다 */
function camJ(x){ var j=x&&x.j; return j==="check"||j==="calm"?j:""; }
