<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AXF CONTROL · 운영 관리</title>
<!-- 261009 콘솔 재설계(디자인 시안/콘솔 재설계 261008/최종 설계안.md) · 새 셸 + 검증된 엔진 이식 + 화면 단위 교체
     옛 콘솔은 admin/legacy.html 로 바이트 그대로 보존(10/26 까지) · 아직 옮기지 않은 화면은 옛 콘솔의 그 항목을 연다
     외부 리소스를 쓰지 않는다. 이 파일은 public 저장소에 올라간다. 관리코드 · 비밀값 · 명단 값을 적지 않는다. -->
<style>
/* 토큰 · 260919 콘솔 톤 · 261008 콘솔 정리 값 그대로(디자인 시안/콘솔 정리 261008/콘솔 디자인 규칙.md)
   연회색 바탕 + 흰 카드(12) · 주 색 네이비 하나 · 오렌지는 대기 배지 · 되돌리기 막대만 · 글자 6단계 28 · 22 · 16 · 14 · 13 · 12 · 숫자 tabular-nums */
:root{
  --bg:#F2F4F7; --sf:#FFFFFF; --soft:#F9FAFB;
  --line:#E5E7EB; --line2:#EFF0F3; --line3:#D1D5DB;
  --tx:#14171F; --tx2:#4B5060; --tx3:#80848F;
  --navy:#00205B; --navy1:#DFE3EF; --navy05:#EEF0F7; --navy-dk:#00163F;
  --ok:#1E7B4F; --ok-bg:#EAF5EF; --ok-bd:#CFE6D9;
  --warn:#8A5A12; --warn-bg:#FFF6E3; --warn-bd:#F3DFB3;
  --bad:#A63A34; --bad-bg:#FBF0EF; --bad-bd:#EFD3D0;
  --brand:#FF7E31;
  --fs-kpi:28px; --fs-h1:22px; --fs-h2:16px; --fs-b:14px; --fs-nav:13px; --fs-c:12px;
  --r:12px; --r-s:8px; --r-xs:6px;
  --w-shell:1440px; --w-lnb:232px; --w-panel:340px; --w-form:720px; --hdr-h:88px;
  --sh-lg:0 12px 28px rgba(8,24,74,.14),0 4px 8px rgba(8,24,74,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-gutter:stable}
body{background:var(--bg);color:var(--tx);font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;font-size:var(--fs-b);line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.n{font-variant-numeric:tabular-nums}
b{font-weight:700}
.cap{font-size:var(--fs-c);color:var(--tx3)}
.muted{color:var(--tx2)}
.hide{display:none!important}
.sp{flex:1}
.fx{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}

/* 잠금 화면 */
#lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#lock .box{width:360px;max-width:100%;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:28px 24px;box-shadow:var(--sh-lg)}
#lock b.t{display:block;font-size:var(--fs-h1);color:var(--navy);margin-bottom:6px}
#lock p{color:var(--tx2);font-size:var(--fs-nav);margin-bottom:14px}
#lock .err{min-height:20px;margin-top:8px;color:var(--bad);font-size:var(--fs-nav)}

/* 머리 · 두 줄(브랜드 40 + 메뉴 48) */
header.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff}
.tb1{height:40px;display:flex;align-items:center;gap:12px;padding:0 max(24px,calc((100% - var(--w-shell))/2));background:var(--navy-dk);border-bottom:1px solid rgba(255,255,255,.08)}
.tb1 .brand{white-space:nowrap;flex-shrink:0}
.tb1 .brand b{font-size:var(--fs-b);letter-spacing:.01em}
.tb1 .brand span{margin-left:8px;color:rgba(255,255,255,.6);font-size:var(--fs-c)}
.tb1 .live{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.72);font-size:var(--fs-c);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);flex:none}
.dot.ok{background:#5FD39A}.dot.bad{background:#FF8A80}.dot.warn{background:#FFC864}
.tb1 .hbtn{border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:2px 12px;font-size:var(--fs-c);color:rgba(255,255,255,.88);white-space:nowrap}
.tb1 .hbtn:hover{border-color:#fff;color:#fff}
.acct-w{position:relative}
.acct-m{position:absolute;right:0;top:calc(100% + 6px);background:var(--sf);color:var(--tx);border:1px solid var(--line);border-radius:var(--r-s);box-shadow:var(--sh-lg);min-width:200px;padding:6px;z-index:40}
.acct-m button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:var(--fs-nav)}
.acct-m button:hover{background:var(--soft)}
.acct-m .who{padding:6px 10px 8px;font-size:var(--fs-c);color:var(--tx3);border-bottom:1px solid var(--line2);margin-bottom:4px}
nav.tabs{height:48px;display:flex;align-items:stretch;gap:4px;padding:0 max(24px,calc((100% - var(--w-shell))/2));overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{position:relative;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:var(--fs-b);font-weight:500;color:rgba(255,255,255,.7);border-radius:8px 8px 0 0;white-space:nowrap;flex-shrink:0}
nav.tabs button svg{width:16px;height:16px;opacity:.8}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.06)}
nav.tabs button.on{color:#fff;font-weight:700;background:rgba(255,255,255,.1)}
nav.tabs button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;background:#fff;border-radius:2px 2px 0 0}
.badge{min-width:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* 셸 · 왼쪽 메뉴 232 + 본문 */
.shell{max-width:calc(var(--w-shell) + 48px);margin:0 auto;padding:20px 24px 96px;display:flex;gap:16px;align-items:flex-start}
aside.lnb{width:var(--w-lnb);flex:none;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:12px;position:sticky;top:calc(var(--hdr-h) + 12px)}
aside.lnb h3{font-size:var(--fs-h2);line-height:1.4;padding:4px 8px 8px}
aside.lnb h4{font-size:var(--fs-c);color:var(--tx3);font-weight:600;padding:10px 8px 4px}
aside.lnb button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:7px 8px;border-radius:var(--r-s);font-size:var(--fs-nav);color:var(--tx2);text-align:left;line-height:1.35}
aside.lnb button:hover{background:var(--soft);color:var(--tx)}
aside.lnb button.on{background:var(--navy05);color:var(--navy);font-weight:700}
aside.lnb .lk{font-size:11px;color:var(--tx3);font-weight:500}
main#view{flex:1;min-width:0}
.shell.solo aside.lnb{display:none}

/* 화면 머리 · 묶음 › 소제목 · 이름 22 · 왜 여기 14 · 오른쪽 단추 */
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
.ph .crumb{font-size:var(--fs-c);color:var(--tx3)}
.ph h1{font-size:var(--fs-h1);line-height:1.3}
.ph p{margin-top:2px;color:var(--tx3);font-size:var(--fs-b)}
.ph .r{display:flex;gap:8px;align-items:center;flex-shrink:0}

/* 단추 · 꼬리표 · 카드 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;height:32px;border-radius:var(--r-s);border:1px solid var(--line3);background:var(--sf);font-size:var(--fs-nav);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--tx3)}
.btn.sm{height:28px;padding:0 10px;font-size:var(--fs-c)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:#0B2D70}
.btn.danger{color:var(--bad);border-color:var(--bad-bd);background:var(--bad-bg)}
.btn.danger.fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;color:var(--tx3);background:transparent}
.btn[disabled],.btn.gated{opacity:.45;cursor:default}
.lnk{font-weight:700;color:var(--navy);text-decoration:underline;text-underline-offset:3px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:99px;font-size:var(--fs-c);font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--tx3);white-space:nowrap;line-height:1.6}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bd)}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-bd)}
.tag.pri{background:var(--navy05);color:var(--navy);border-color:var(--navy1)}
.tag.or{background:var(--brand);border-color:var(--brand);color:#fff}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r)}
.card.pad{padding:16px}
.card .ch{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px}
.card .ch h2{font-size:var(--fs-h2)}
.card .ch .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card .cb0{padding:0 16px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g75{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.band{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--soft);font-size:var(--fs-nav);margin-bottom:12px}
.band.warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn)}
.band.bad{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad)}
.band.pri{background:var(--navy05);border-color:var(--navy1);color:var(--navy)}
.band .r{margin-left:auto;display:flex;gap:8px}
.empty{padding:40px 24px;text-align:center;color:var(--tx3)}
.empty b{display:block;font-size:var(--fs-h2);color:var(--tx);margin-bottom:4px}
.skel{padding:16px}.skel i{display:block;height:14px;border-radius:6px;background:linear-gradient(90deg,var(--line2),var(--soft),var(--line2));margin:10px 0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line3);border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
details.memo{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--sf)}
details.memo summary{cursor:pointer;padding:10px 16px;font-size:var(--fs-nav);font-weight:600;color:var(--tx2)}
details.memo .mb{padding:0 16px 14px;font-size:var(--fs-nav);color:var(--tx2)}
details.memo .mb p{margin-top:6px}
.in{height:32px;border:1px solid var(--line3);border-radius:var(--r-s);padding:0 10px;font-size:var(--fs-nav);background:var(--sf);min-width:0}
.in:focus,textarea:focus,select:focus{outline:2px solid var(--navy1);border-color:var(--navy)}
textarea.in{height:auto;padding:8px 10px;line-height:1.5;resize:vertical;width:100%}
select.in{padding:0 8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-c);color:var(--tx3);font-weight:600}
.seg{display:inline-flex;gap:2px;background:var(--line2);border-radius:var(--r-s);padding:3px;flex-wrap:wrap}
.seg button{padding:4px 12px;border-radius:6px;font-size:var(--fs-nav);font-weight:600;color:var(--tx3);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 2px rgba(8,24,74,.12)}
.seg button .c{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sf);color:var(--tx2);border-radius:99px;padding:3px 12px;font-size:var(--fs-nav);font-weight:600}
.chip .c{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}.chip.on .c{color:rgba(255,255,255,.75)}
.pchip{display:inline-flex;align-items:center;gap:6px;background:var(--navy05);border:1px solid var(--navy1);color:var(--navy);border-radius:99px;padding:2px 10px;font-size:var(--fs-c);font-weight:600}

/* 현황 띠 · 숫자 칸(누르면 거르기) */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:12px;overflow:hidden}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{padding:12px 16px;border-right:1px solid var(--line2);text-align:left;position:relative;display:block;width:100%;min-width:0}
.kpi:last-child{border-right:0}
button.kpi:hover{background:var(--soft)}
.kpi .l{font-size:var(--fs-c);color:var(--tx3)}
.kpi .v{font-size:var(--fs-kpi);font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .v em{font-style:normal;font-size:var(--fs-c);color:var(--tx3);font-weight:500;margin-left:3px}
.kpi .s{font-size:var(--fs-c);color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.on{background:var(--navy05)}
.kpi.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--navy);border-radius:2px 2px 0 0}
.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}

/* 표 · 일괄 막대 · 오른쪽 한 칸 */
.work{display:flex;gap:12px;align-items:flex-start}
.list{flex:1;min-width:0;overflow:hidden}
.bar{min-height:52px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .in{width:230px}
.bar.bulk{background:var(--navy);color:#fff;border-bottom-color:var(--navy)}
.bar.bulk .btn{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
.bar.bulk .btn.hot{background:#fff;color:var(--navy);border-color:#fff}
.bar.bulk .btn.ghost{border-color:transparent;color:rgba(255,255,255,.75)}
.banner{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--navy05);border-bottom:1px solid var(--navy1);font-size:var(--fs-nav);color:var(--navy)}
.banner button{font-weight:700;text-decoration:underline;text-underline-offset:3px;color:var(--navy)}
.scrl{max-height:620px;overflow:auto}
table.tb{width:100%;border-collapse:collapse;table-layout:fixed}
.tb th{height:34px;text-align:left;font-size:var(--fs-c);font-weight:600;color:var(--tx3);background:var(--soft);border-bottom:1px solid var(--line);padding:0 12px;white-space:nowrap;position:sticky;top:0;z-index:1}
.tb td{height:46px;padding:4px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb tr.row{cursor:pointer}
.tb tr.row:hover td{background:var(--soft)}
.tb tr.row.chk td{background:var(--navy05)}
.tb tr.row.cur td{background:var(--navy05)}
.tb tr.row.cur td:first-child{box-shadow:inset 3px 0 0 var(--navy)}
.tb tr.row.new td{background:#F3FAF6}
.tb tr.row.fail td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.tb tr.row.chkme td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.tb .ck{width:44px;padding:0 0 0 14px}
.tb .nm b{font-size:var(--fs-b)}
.tb .nm div{font-size:var(--fs-c);color:var(--tx3);line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.tb td.r,.tb th.r{text-align:right}
.tb td.wrap{white-space:normal}
.tb tr.locked td{color:var(--tx3)}
.tb tr.sub td{height:auto;padding:6px 12px 10px 92px;font-size:var(--fs-c);color:var(--tx2);white-space:normal;background:var(--soft)}
.cbx{width:16px;height:16px;border:1.5px solid var(--line3);border-radius:4px;background:#fff;display:inline-block;vertical-align:middle;position:relative;cursor:pointer}
.cbx.on{background:var(--navy);border-color:var(--navy)}
.cbx.on::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cbx.mid{background:var(--navy);border-color:var(--navy)}
.cbx.mid::after{content:"";position:absolute;left:3px;top:6.2px;width:7.5px;height:2px;background:#fff}
.cbx.off{background:var(--line2);border-color:var(--line);cursor:default}
.foot{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:var(--fs-c);color:var(--tx3)}
.panel{width:var(--w-panel);flex:none;overflow:hidden;position:sticky;top:calc(var(--hdr-h) + 12px)}
.panel .ph2{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.panel .ph2 h2{font-size:var(--fs-h2);line-height:1.35}
.panel .ph2 .x{font-size:20px;line-height:1;color:var(--tx3);padding:0 4px}
.panel .bd{padding:12px 16px 16px;max-height:calc(100vh - var(--hdr-h) - 120px);overflow:auto}
.kv{display:grid;grid-template-columns:84px 1fr;gap:6px 8px;font-size:var(--fs-nav);margin-bottom:12px}
.kv dt{color:var(--tx3)}
.panel h5,.h5{font-size:var(--fs-c);color:var(--tx3);font-weight:600;margin:14px 0 6px}
.mini{list-style:none}
.mini li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:var(--fs-nav);line-height:1.4}
.mini li:last-child{border-bottom:0}
.mini .t{width:42px;flex:none;color:var(--tx3);font-size:var(--fs-c);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pv{border:1px solid var(--line);border-radius:var(--r-s);margin-top:10px;overflow:hidden}
.pv div{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;font-size:var(--fs-nav);border-bottom:1px solid var(--line2)}
.pv div:last-child{border-bottom:0}
.pv .g{color:var(--ok);font-weight:700}.pv .w{color:var(--warn);font-weight:700}.pv .r{color:var(--bad);font-weight:700}
.verb{display:inline-block;min-width:34px;text-align:center;padding:0 7px;border-radius:6px;font-size:var(--fs-c);font-weight:700;margin-right:6px;background:var(--line2);color:var(--tx2)}
.verb.up{background:var(--ok-bg);color:var(--ok)}.verb.dn{background:var(--bad-bg);color:var(--bad)}.verb.use{background:var(--warn-bg);color:var(--warn)}.verb.nav{background:var(--navy05);color:var(--navy)}

/* 스탬프 8칸 */
.st8{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.st8 .c{border:1px solid var(--line);border-radius:var(--r-s);padding:6px 8px;font-size:var(--fs-c);min-height:64px;display:flex;flex-direction:column;gap:2px}
.st8 .c.got{background:var(--navy05);border-color:var(--navy1)}
.st8 .c .no{color:var(--tx3);font-variant-numeric:tabular-nums}
.st8 .c b{font-size:var(--fs-c);line-height:1.3}
.st8 .c button{margin-top:auto;align-self:flex-start;font-size:11px;font-weight:700;color:var(--navy);text-decoration:underline;text-underline-offset:2px}
.st8 .c button.rv{color:var(--bad)}

/* 진행판 */
.stline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;margin-bottom:12px}
.sig{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sig .s{border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;background:var(--sf);text-align:left;width:100%}
.sig .s .h{display:flex;align-items:center;gap:6px;font-size:var(--fs-c);font-weight:700;color:var(--tx2)}
.sig .s .v{font-size:var(--fs-kpi);font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.sig .s .v em{font-style:normal;font-size:var(--fs-c);color:var(--tx3);font-weight:500;margin-left:3px}
.sig .s .x{font-size:var(--fs-c);color:var(--tx3)}
.sig .s.warn{background:var(--warn-bg);border-color:var(--warn-bd)}.sig .s.warn .v{color:var(--warn)}
.sig .s.bad{background:var(--bad-bg);border-color:var(--bad-bd)}.sig .s.bad .v{color:var(--bad)}
.day{display:flex;align-items:flex-start;position:relative;padding:8px 4px 0;overflow-x:auto}
.day .ln{position:absolute;left:12px;right:12px;top:20px;height:2px;background:var(--line)}
.day .sl{flex:1;min-width:58px;text-align:center;position:relative;font-size:11px;color:var(--tx3)}
.day .sl i{display:block;width:12px;height:12px;border-radius:50%;margin:6px auto 4px;background:var(--sf);border:2px solid var(--line3);position:relative;z-index:1}
.day .sl.done i{background:var(--navy);border-color:var(--navy)}
.day .sl.late i{background:var(--warn);border-color:var(--warn)}
.day .sl.now i{width:18px;height:18px;margin-top:3px;border:3px solid var(--navy)}
.day .sl b{display:block;color:var(--tx2);font-size:11px}
.day .sl span{display:block;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo{list-style:none}
.todo li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.todo li:last-child{border-bottom:0}
.todo .bx{width:20px;height:20px;border-radius:5px;border:1.5px dashed var(--line3);flex:none;position:relative}
.todo .bx.ok{background:var(--ok);border:1.5px solid var(--ok)}
.todo .bx.ok::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.todo .bx.bad{border:1.5px solid var(--bad);background:var(--bad-bg)}

.todo .tx{flex:1;min-width:0}

.todo li.late{background:var(--warn-bg);margin:0 -16px;padding:9px 16px}
.slots{list-style:none}
.slots>li{border-bottom:1px solid var(--line2)}
.slots>li>button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 4px;text-align:left}
.slots>li>button .tm{width:48px;font-weight:700;font-variant-numeric:tabular-nums}
.slots>li>button .nm{flex:1;font-weight:600}
.slots>li.cur>button{background:var(--navy05)}

.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.nums .k .v{font-size:var(--fs-kpi);font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.nums .k .v em{font-style:normal;font-size:var(--fs-c);color:var(--tx3);font-weight:500;margin-left:2px}
.nums .k .s{font-size:var(--fs-c);color:var(--tx3)}
.nums .k.w2{grid-column:span 2}
.stk{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line2);margin:8px 0 6px}
.stk i{display:block;height:100%}

/* 앱 접속 범위 단추 */
.scope{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.scope button small{font-size:var(--fs-c);color:var(--tx3);line-height:1.4}

/* 알림 보내기 */
.form{max-width:var(--w-form)}
.form .f{margin-bottom:14px}
.form .fl{font-size:var(--fs-c);font-weight:700;color:var(--tx2);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.cc{font-size:var(--fs-c);color:var(--tx3);font-weight:500;font-variant-numeric:tabular-nums}.cc.over{color:var(--warn)}.cc.max{color:var(--bad)}

/* 알림 · 확인 창 · 본인 확인 */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tx);color:#fff;border-radius:10px;padding:10px 14px;display:none;align-items:center;gap:14px;font-size:var(--fs-nav);box-shadow:0 8px 24px rgba(8,24,74,.25);min-width:320px;max-width:calc(100vw - 32px);overflow:hidden;z-index:80}

#toast .ln{position:absolute;left:0;bottom:0;height:3px;background:var(--brand);width:0}
.overlay{position:fixed;inset:0;background:rgba(10,16,34,.42);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.overlay.on{display:flex}
.ocard{background:var(--sf);border-radius:var(--r);width:440px;max-width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px;box-shadow:var(--sh-lg)}
.ocard.wide{width:600px}
.ocard .ot{font-size:var(--fs-h2);font-weight:700}

.ocard .oa{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

.imp div{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;font-size:var(--fs-nav);border-bottom:1px solid var(--line2)}
.imp div:last-child{border-bottom:0}
.imp .chg b{color:var(--navy)}.imp .loss b{color:var(--bad)}

@media(max-width:1100px){

}

  .ph{flex-direction:column}
  .bar .in{width:100%}
  .tb .hm{display:none}

  .scope{grid-template-columns:minmax(0,1fr)}
}

<body>
<div id="lock">

    <input id="key" class="in" style="width:100%;height:40px;margin-top:8px" type="password" inputmode="numeric" autocomplete="off" placeholder="관리코드" aria-label="관리코드">

</div>
<header class="top">
  <div class="tb1"><div class="brand"><b>AXF CONTROL</b><span id="envTag">운영 관리</span></div><span class="sp"></span>
    <span class="live" id="stamp"><i class="dot"></i><span class="tx">·</span></span>

    <div class="acct-w"><button class="hbtn" id="acctBtn" type="button" aria-haspopup="menu" aria-expanded="false" data-qa="top.acct" onclick="acctMenu()"><span id="roleTag">관리자</span></button>
      <div class="acct-m" id="acctM" role="menu" hidden><div class="who" id="acctWho"></div><button type="button" role="menuitem" data-qa="top.pin" onclick="acctMenu(0);supAsk()">슈퍼관리자 본인 확인(PIN)</button><button type="button" role="menuitem" data-qa="top.legacy" onclick="acctMenu(0);legacyOpen('')">옛 콘솔 열기</button><button type="button" role="menuitem" data-qa="top.lock" onclick="acctMenu(0);lock('잠갔습니다')">잠그기</button></div></div>

<div id="dlg" class="overlay" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <div class="ocard" id="dlgCard">
    <div class="ot" id="dlgT"></div>

    <div class="oa"><button class="btn" id="dlgCancel" data-qa="dlg.cancel" onclick="dlgClose()">닫기</button><button class="btn pri" id="dlgOk" data-qa="dlg.ok" onclick="dlgGo()">확인</button></div>

<script src="../assets/server.js"></script>
<script>
/* ══════════════════ 0. 설정 ══════════════════
 * 서버 주소는 ../assets/server.js 의 AXF_SERVER 한 곳(앱과 같은 파일) · 못 읽었으면 옛 GAS 기본값(읽기 전용 잠금 · moved 로 새 주소를 알려 준다)
 * 관리코드는 파일에 두지 않는다. 이 탭에는 사번(aemp)과 사람 토큰(tok)만 둔다(sessionStorage · 옛 콘솔과 같은 키라 새 탭에서 옛 콘솔을 열면 다시 로그인하지 않는다).
 * 슈퍼관리자 본인 확인 토큰(sp)은 이 화면 메모리에만 둔다(새로 고침 · 잠금 = 다시 묻는다). */
var BE_DEFAULT = "https://script.google.com/macros/s/AKfycbwjCaSSUnQ7W1lrM8T426Cn_LgKs_UhI0Qi5XRVk-_eF-oD55-Wwjsot0DkPJCX9JqMBA/exec";
function beUrlOk(u){ return typeof u==="string" && /^https:\/\/([a-z0-9-]+\.[a-z0-9-]+\.workers\.dev|script\.google\.com\/macros\/s\/[\w-]{20,})\/exec$/.test(u); }
var BE = beUrlOk(typeof AXF_SERVER==="string"?AXF_SERVER:"") ? AXF_SERVER : BE_DEFAULT;
if(typeof AXF_SERVER==="string" && /^http:\/\/127\.0\.0\.1:\d+\/exec$/.test(AXF_SERVER)) BE=AXF_SERVER;   /* 로컬 QA 서버(QA/local.mjs · 127.0.0.1 만) */
function beMoved(res){ if(res&&beUrlOk(res.moved)&&res.moved!==BE){ BE=res.moved; return true; } return false; }
var EVENT_DAY = "2026-10-26";
/* 판정표(최종 설계안 2절) · 코드 상수 · 설정에 노출하지 않는다 */
var UNDO_MS = 7000;      /* 되돌리기 알림 7초 · 그 뒤에는 기록 › 활동 기록에서 되돌린다 */
var BULK_CONFIRM_N = 20; /* 빼기 20명 이상 또는 미리 보기 영향 수 1 이상이면 확인 창 */
var LIST_MAX = 2000;     /* 명단 한 번에 받는 줄 상한(roll_list) */
var ACCT_PAGE_N = 50;    /* 한 사람 찾기 결과 한 번에 50명(acct_page) */
var LEGACY_URL = "legacy.html";

/* ══════════════════ 1. 공통 ══════════════════ */
function loungeName(s){ return String(s).replace(/1F AX LOUNGE 상담/g,"1F AX 라운지").replace(/AX LOUNGE 상담/g,"AX 라운지").replace(/AX LOUNGE/g,"AX 라운지"); }
function esc(s){ return loungeName(String(s==null?"":s)).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
/* onclick 안에 넣는 문자열 · 사번 · ID 는 영숫자라 그 밖의 글자는 버린다 */
function jq(s){ return String(s==null?"":s).replace(/[^0-9A-Za-z_\-.:가-힣]/g,""); }
function el(id){ return document.getElementById(id); }
function aemp(){ try{ return sessionStorage.getItem("axf_adm_emp")||""; }catch(e){ return window.__e||""; } }
function setAemp(v){ try{ sessionStorage.setItem("axf_adm_emp",v||""); }catch(e){ window.__e=v||""; } }
function tok(){ try{ return sessionStorage.getItem("axf_adm_tok")||""; }catch(e){ return window.__t||""; } }
function setTok(v){ try{ sessionStorage.setItem("axf_adm_tok",v||""); }catch(e){ window.__t=v||""; } }
function authed(){ return !!(tok()&&aemp()); }
try{ sessionStorage.removeItem("axf_adm_key"); }catch(e){}
function normE(v){ return String(v==null?"":v).replace(/\s/g,"").toUpperCase().replace(/^0+(?=.)/,""); }
function n0(v){ return v==null||v===""?"-":Number(v).toLocaleString(); }
function hhmm(s){ s=String(s||""); var m=s.match(/(\d{1,2}):(\d{2})/); return m?(("0"+m[1]).slice(-2)+":"+m[2]):s; }
function short(ts){ ts=String(ts||""); var m=ts.match(/(\d{2}):(\d{2})(:\d{2})?$/); var d=ts.match(/^\d{4}-(\d{2})-(\d{2})/); return (d?d[1]+"/"+d[2]+" ":"")+(m?m[1]+":"+m[2]:ts); }
function pct(a,b){ return b>0?Math.min(100,Math.round(a/b*100)):0; }
function tag(s, cls){ return '<span class="tag'+(cls?" "+cls:"")+'">'+esc(s)+'</span>'; }
function lsGet(k, d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function ssGet(k, d){ try{ var v=sessionStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function ssSet(k, v){ try{ sessionStorage.setItem(k, v); }catch(e){} }
function why(r){
  r=r||{};
  return ({ super:"슈퍼관리자만 할 수 있습니다", spin:"슈퍼관리자 본인 확인(PIN)이 필요합니다", locked:"이 연결에서 코드를 여러 번 틀려 잠겼습니다", auth:"관리코드가 바뀌었거나 명단에서 빠졌습니다",
    network:"서버에 연결할 수 없습니다", timeout:"서버 응답이 늦습니다", busy:"서버가 바쁩니다 · 잠시 뒤 다시", console:"콘솔에서만 할 수 있습니다", post:"서버가 POST 를 요구합니다",
    param:"입력 값을 확인합니다", notfound:"찾지 못했습니다", have:"이미 명단에 있습니다", noros:"명부에 없는 사번입니다", none:"명단에 없습니다", state:"그 사이 바뀌었습니다 · 다시 불러옵니다",
    list:"모르는 명단입니다", max:"명단 상한을 넘습니다", self:"슈퍼관리자는 뺄 수 없습니다", word:"서버 확인 값이 맞지 않습니다", expired:"오늘 처리한 것만 되돌립니다", done:"이미 되돌렸습니다",
    moved:"서버가 옮겨졌습니다 · 새로고침", eventday:"행사일에는 할 수 없습니다", ro:"읽기 전용 값입니다" }[r.reason])||
    (/unknown action/.test(String(r.err||""))?"이 서버가 아직 모르는 기능입니다(서버 배포 뒤 씁니다)":(r.err?String(r.err).slice(0,80):(r.reason||"실패")));
}

/* ── 알림 · o.undo 가 있으면 되돌리기 단추 + 줄어드는 막대(7초) ── */
function toast(m, o){
  o=o||{}; var t=el("toast"), u=el("toastU"), ln=el("toastL"), ms=o.ms||(o.undo?UNDO_MS:2600);
  el("toastT").innerHTML=o.html?m:esc(m); t.className="on";
  if(o.undo){ u.style.display=""; u.textContent=o.undoLbl||"되돌리기"; u.onclick=function(){ u.style.display="none"; t.className=""; o.undo(); }; } else { u.style.display="none"; u.onclick=null; }
  ln.style.transition="none"; ln.style.width=o.undo?"100%":"0"; void ln.offsetWidth;
  if(o.undo){ ln.style.transition="width "+ms+"ms linear"; ln.style.width="0"; }
  clearTimeout(t._t); t._t=setTimeout(function(){ t.className=""; u.style.display="none"; }, ms);
}
/* ── 확인 창 · 되돌릴 수 없는 일 · 20명 이상 · 부수 효과가 큰 일에만(L2) · onOk 가 없으면 안내 한 장 ── */
var DLG={ onOk:null, gate:null };
function dlgGate(){ var ok=el("dlgOk"), off=!!(DLG.gate&&!DLG.gate()); ok.classList.toggle("gated",off); ok.setAttribute("aria-disabled",off?"true":"false"); return !off; }
function dialog(o){
  DLG.onOk=o.onOk||null; DLG.gate=o.gate||null;
  el("dlgT").textContent=o.t||""; el("dlgS").innerHTML=o.s||"";
  el("dlgWho").innerHTML=o.who||""; el("dlgWho").style.display=o.who?"":"none";
  el("dlgX").innerHTML=o.x||"";
  el("dlgCard").className="ocard"+(o.wide?" wide":"");
  var ok=el("dlgOk"); ok.textContent=o.ok||"확인"; ok.disabled=false; ok.className="btn "+(o.danger?"danger fill":"pri");
  el("dlgCancel").style.display=o.onOk?"":"none";
  el("dlg").className="overlay on";
  dlgGate();
  setTimeout(function(){ var f=o.focus&&el(o.focus); (f||ok).focus(); },30);
}
function dlgBusy(){ return el("dlgOk").disabled; }
/* 처리 중에는 닫히지 않는다 · onOk 안에서 닫을 때는 dlgForce() */
function dlgClose(){ if(dlgBusy()) return; el("dlg").className="overlay"; DLG.onOk=null; if(SUPV.wait&&!SUPV.sp){ var w=SUPV.wait; SUPV.wait=[]; w.forEach(function(f){ f(false); }); } }
function dlgForce(){ el("dlgOk").disabled=false; dlgClose(); }
function dlgGo(){
  if(!DLG.onOk){ dlgClose(); return; }
  if(!dlgGate()) return;
  var ok=el("dlgOk"); ok.disabled=true; ok.innerHTML='<span class="spin" style="border-color:rgba(255,255,255,.4);border-top-color:#fff"></span>처리 중';
  var fn=DLG.onOk; DLG.onOk=null; fn();
}
el("dlg").addEventListener("click",function(e){ if(e.target===el("dlg")) dlgClose(); });
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape") return;
  if(el("dlg").className.indexOf("on")>=0) { dlgClose(); return; }
