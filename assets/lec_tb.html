<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Track B 소개 · AX Festival</title>
<style>
  /* 앱 상세 vhero(16:9)용 세션 소개 모션. design.md 다크 카드 규정.
     논리 좌표 1280x720. 20초 루프, 무음 전제(자막이 곧 메시지). */
  :root{
    --u: min(calc(100vw / 1280), calc(100vh / 720));
    --ink:#000000; --gold:#FF963E; --o100:#FF7E31; --dim:#B9BEC6;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ink);overflow:hidden;font-family:var(--font);color:#fff;word-break:keep-all}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  #stage{position:relative;width:calc(1280*var(--u));height:calc(720*var(--u));overflow:hidden;background:var(--ink)}

  /* 고정 아이덴티티 한 줄 (장식 아님 · 정보) */
  #ident{position:absolute;top:calc(30*var(--u));left:0;width:100%;text-align:center;
         font-size:calc(34*var(--u));font-weight:700;color:var(--dim);letter-spacing:.04em}
  #ident b{color:var(--o100);font-weight:900}

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
         text-align:center;padding:calc(52*var(--u)) calc(56*var(--u));
         opacity:0;visibility:hidden;transition:opacity .3s ease}
  .scene.on{opacity:1;visibility:visible}
  .scene:not(.on){transition:none}
  /* 등장은 @keyframes. 광고 리듬(빠르게 들어와 부드럽게 안착) */
  .up{opacity:0;transform:translateY(calc(22*var(--u)))}
  .scene.on .up{animation:rise .5s cubic-bezier(.16,.84,.3,1) var(--d,0s) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  /* 후킹 둘째 줄은 살짝 키워서 들어온다 */
  .hook .big{opacity:0;transform:translateY(calc(22*var(--u))) scale(.94)}
  .scene.on .hook .big{animation:riseBig .55s cubic-bezier(.16,.84,.3,1) var(--d,0s) forwards}
  @keyframes riseBig{to{opacity:1;transform:none}}
  /* CTA는 안착 후 한 번 숨 쉰다(과하지 않게) */
  .scene.on .cta{animation:rise .5s cubic-bezier(.16,.84,.3,1) var(--d,0s) forwards,
                 pulse 2.2s ease-in-out 1.2s infinite}
  @keyframes pulse{0%,100%{transform:none}50%{transform:scale(1.035)}}

  .hook{font-size:calc(88*var(--u));font-weight:800;line-height:1.26;letter-spacing:-.02em}
  .hook .big{display:block;margin-top:calc(6*var(--u));font-size:calc(104*var(--u));font-weight:900;color:var(--gold)}
  .lead{font-size:calc(40*var(--u));font-weight:800;color:var(--o100);letter-spacing:.05em}
  /* 제목 크기는 가장 긴 줄 길이에 따라 빌더가 정한다(넘침 방지) */
  .big2{margin-top:calc(14*var(--u));font-size:calc(92*var(--u));font-weight:900;line-height:1.26;letter-spacing:-.015em}
  .who{margin-top:calc(22*var(--u));font-size:calc(52*var(--u));font-weight:800;color:#fff}
  .who em{font-style:normal;color:var(--dim);font-weight:600}
  .meta{margin-top:calc(18*var(--u));font-size:calc(40*var(--u));font-weight:600;color:var(--dim)}
  .meta b{color:var(--gold);font-weight:800}
  .cta{margin-top:calc(24*var(--u));display:inline-block;padding:calc(18*var(--u)) calc(40*var(--u));
       border-radius:calc(14*var(--u));background:var(--o100);color:#fff;
       font-size:calc(42*var(--u));font-weight:800}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="ident"><b>AX</b> FESTIVAL ㆍ 10. 26 (월)</div>

  <section class="scene" data-t0="0" data-t1="3.0">
    <div class="hook">
      <span class="up" style="--d:.1s">법령·공시·뉴스,</span>
      <span class="up big" style="--d:.32s">아직 직접 찾으시나요</span>
    </div>
  </section>

  <section class="scene" data-t0="3.0" data-t1="9.0">
    <div class="up lead" style="--d:.1s">Track B</div>
    <div class="up big2" style="--d:.3s">외부 자료 리서치<br>자동화 실습</div>
    <div class="up meta" style="--d:.55s">내 소스 목록 그대로 실습 · 200분</div>
  </section>

  <section class="scene" data-t0="9.0" data-t1="14.5">
    <div class="up lead" style="--d:.1s">SPEAKER</div>
    <div class="up big2" style="--d:.3s">본사 프로그램</div>
    <div class="up meta" style="--d:.55s">외부 강사 2명</div>
  </section>

  <section class="scene" data-t0="14.5" data-t1="20.0">
    <div class="up meta" style="--d:.1s;font-size:calc(46*var(--u))"><b>13:10 ~ 16:30</b> ㆍ 10F Heart 1 · 7~8</div>
    <div class="up cta" style="--d:.4s">아래에서 바로 신청하세요</div>
  </section>
</div></div>

<script>
(function(){
  var TOTAL = 20.0;
  var scenes = [].slice.call(document.querySelectorAll('.scene')).map(function(el){
    return { el: el, t0: +el.dataset.t0, t1: +el.dataset.t1 };
  });
  var start = Date.now(), offset = 0;
  function tick(){
    var t = ((Date.now() - start) / 1000 + offset) % TOTAL;
    scenes.forEach(function(s){
      var on = t >= s.t0 && t < s.t1;
      if (on !== s.el.classList.contains('on')) s.el.classList.toggle('on', on);
    });
  }
  setInterval(tick, 50); tick();
  window.seek = function(t){ start = Date.now(); offset = t; tick(); };
  var q = new URLSearchParams(location.search).get('t');
  if (q !== null) window.seek(parseFloat(q) || 0);
})();
</script>
</body>
</html>
