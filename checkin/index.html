     데이터 = 서버 ckin_feed(등급코드 · 관리코드 토큰 · 읽기 · 이름 · 소속 · 선착순 순번만) 3초 폴링이 정본 + 소켓 tv 방 「ckin」 알림(내용 없음)이면 곧바로 읽기
     장면 = 체크인 환영(흰 축포 · 흰 글자) · 선착순 참여상 수령(주황 축포 · 순번 숫자만 주황) · 한 스캔에서 둘이면 선착순 한 장면
     줄 = 서버 순서(커서) 그대로 한 사람씩 · 대기가 길면 한 사람 시간만 줄인다(3초 · 10명 넘으면 1.5초 · 30명 넘으면 1초 · 최소 0.8초)
     커서 = 이 기기에 보여 준 마지막 줄(axfCkw.k) · 새로 열거나 끊겼다 붙으면 그 줄부터 이어서(10분 넘은 것은 서버가 건너뜀)
     주소 = ../assets/server.js(?srv= 로 workers.dev · localhost 만) · ?test=1 = 테스트 사번도 보임 · ?demo=1 = 서버 없이 가짜 이름(키 1 · 5 · 0 · f · c · d) · ?reset=1 = 이 기기 코드 지움 -->

    var n = a.createBufferSource(); n.buffer = buf; var bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = kind === "o" ? 1900 : 1400; bp.Q.value = 0.8;
    var gn = a.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(0.9, t + 0.008); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    n.connect(bp); bp.connect(gn); gn.connect(a.destination); n.start(t); n.stop(t + 0.36);
    var o = a.createOscillator(), og = a.createGain(); o.type = "triangle"; o.frequency.setValueAtTime(kind === "o" ? 880 : 620, t); o.frequency.exponentialRampToValueAtTime(kind === "o" ? 1320 : 180, t + 0.18);
    og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.35, t + 0.01); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(og); og.connect(a.destination); o.start(t); o.stop(t + 0.5);
    if (kind === "o") { var o2 = a.createOscillator(), g2 = a.createGain(); o2.type = "sine"; o2.frequency.setValueAtTime(1760, t + 0.12); g2.gain.setValueAtTime(0.0001, t + 0.12); g2.gain.exponentialRampToValueAtTime(0.18, t + 0.13); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.5); o2.connect(g2); g2.connect(a.destination); o2.start(t + 0.12); o2.stop(t + 0.52); }
  }
  function wake() { var a = acGet(); if (a && a.state !== "running") { try { var r = a.resume(); if (r && r.then) r.then(sndUi, sndUi); } catch (e) {} } sndUi(); }
  document.addEventListener("pointerdown", wake, true); document.addEventListener("keydown", wake, true);
  $("bSnd").addEventListener("click", function () { SND = !SND; lsSet(LS_SND, SND ? "1" : "0"); wake(); });

  /* ── 장면 줄 · 서버 순서 그대로 한 사람씩 ── */
  var SC = { q: [], cur: null, t: 0, d: 3, seen: {} };
  var sk = jget(LS_K), KSHOW = sk && sk.s === (SRV || "demo") ? Number(sk.k) || 0 : 0, KF = KSHOW;   /* KSHOW = 보여 준 마지막 줄(저장) · KF = 받아 온 마지막 줄 */
  function durFor(n) { var d = n > 30 ? 1.0 : n > 10 ? 1.5 : 3.0; return Math.max(0.8, d); }
  function enqueue(items) { items.forEach(function (x) { if (!x || !(x.c > KSHOW) || SC.seen[x.c]) return; SC.seen[x.c] = 1; SC.q.push(x); }); }
  function sceneHtml(x) {
    var fc = x.k === "fc", nm = esc(x.nm || "참가자"), h = "";
    if (fc) h += '<div class="w-top">' + (x.ck ? "체크인 환영 · " : "") + "축하드립니다</div>";
    else h += '<div class="w-top"><span class="me">ME to WE</span> 체크인을 환영합니다</div>';
    h += '<div class="w-nm" id="wNm">' + nm + "<small>님</small></div>";
    if (fc) h += '<div class="w-rk">' + (x.rk ? "선착순 <b>" + esc(x.rk) + "</b>번째" : "선착순 참여상") + "</div>";
    if (x.dept) h += '<div class="w-dp">' + esc(x.dept) + "</div>";
    if (x.tst) h += '<div class="w-tag">시험 사번</div>';
    return h;
  }
  function fitName() {
    var n = $("wNm"); if (!n) return;
    var land = W >= H, f = land ? Math.min(W * 0.13, H * 0.2) : Math.min(W * 0.17, H * 0.11);
    n.style.fontSize = f + "px";
    var max = W * 0.9; if (n.scrollWidth > max) n.style.fontSize = Math.floor(f * max / n.scrollWidth) + "px";
  }
  function nextUi() { var n = SC.q.length; $("next").textContent = n ? "다음 " + n + "명" : ""; $("next").classList.toggle("on", n > 0); }
  function show(x) {
    SC.cur = x; SC.t = 0; SC.d = durFor(SC.q.length);
    document.body.classList.add("on");
    var w = $("wIn"); w.classList.remove("show"); w.innerHTML = sceneHtml(x); fitName(); tzSet();
    void w.offsetWidth; w.classList.add("show");
    var r = w.getBoundingClientRect(), y = r.top + r.height * 0.45, kind = x.k === "fc" ? "o" : "w", big = SC.d >= 2 ? 1 : 0.6;
    burst(W / 2, y, kind, big);
    if (SC.d >= 1.5) { setTimeout(function () { burst(W * 0.2, y - H * 0.14, kind, big * 0.55); }, 130); setTimeout(function () { burst(W * 0.8, y - H * 0.1, kind, big * 0.55); }, 240); }
    pang(kind);
    if (x.k === "ck" || x.ck) setTimeout(comet, Math.min(500, SC.d * 300));
    KSHOW = Math.max(KSHOW, x.c); lsSet(LS_K, JSON.stringify({ s: SRV || "demo", k: KSHOW }));
    nextUi();
  }
  function stepScene(dt) {
    if (SC.cur) {
      SC.t += dt;
      if (SC.t >= SC.d) {
        if (SC.q.length) show(SC.q.shift());
        else if (SC.t >= SC.d) { SC.cur = null; TZ = null; $("wIn").classList.remove("show"); document.body.classList.remove("on"); nextUi(); }
      } else if (SC.t >= SC.d - 0.16 && $("wIn").classList.contains("show") && SC.q.length) $("wIn").classList.remove("show");
    } else if (SC.q.length) show(SC.q.shift());
  }

  /* ── 그리기 고리 ── */
  var last = 0;
  function frame(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx.fillStyle = "#000000"; cx.fillRect(0, 0, W, H);
    cx.drawImage(gridCv, 0, 0, W, H);
    drawRing(dt);
    stepScene(dt);
    stepComets(dt);
    stepP(dt); drawP();
    requestAnimationFrame(frame);
  }

  /* ── 서버 · JSONP 읽기 ── */
  function jsonp(params, done, ms) {
    if (!SRV) { done({ ok: false, reason: "noserver" }); return; }
    var name = "axckw" + Date.now().toString(36) + Math.floor(Math.random() * 1e6), sc = document.createElement("script"), fin = false;
    var qs = Object.keys(params).map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); }).join("&");
    var timer = setTimeout(function () { end({ ok: false, reason: "timeout" }); }, ms || 10000);
    function end(res) {
      if (fin) return; fin = true; clearTimeout(timer);
      window[name] = function () {}; setTimeout(function () { try { delete window[name]; } catch (e) { window[name] = undefined; } }, 30000);
      sc.onerror = sc.onload = null; if (sc.parentNode) sc.parentNode.removeChild(sc);
      done(res || { ok: false });
    }
    window[name] = function (res) { end(res); };
    sc.onerror = function () { end({ ok: false, reason: "network" }); };
    sc.onload = function () { setTimeout(function () { end({ ok: false, reason: "bad" }); }, 0); };
    sc.src = SRV + "?" + qs + "&callback=" + name + "&_=" + Date.now();
    document.head.appendChild(sc);
  }
  var NET = { busy: false, again: false, t: null, okAt: Date.now(), fails: 0 };
  function netUi() { $("net").classList.toggle("on", Date.now() - NET.okAt > 10000); }
  function pull() {
    if (NET.busy) { NET.again = true; return; }
    var tok = lsGet(LS_TOK); if (!tok) { gateOpen(""); return; }
    NET.busy = true; clearTimeout(NET.t);
    var p = { action: "ckin_feed", tok: tok }; if (KF > 0) p.k = String(KF); if (TEST) p.test = "1";
    jsonp(p, function (r) {
      NET.busy = false;
      if (r && r.ok) {
        NET.okAt = Date.now(); NET.fails = 0;
        enqueue((r.items || []).filter(function (x) { return x.ago == null || x.ago <= 600; }));
        if (typeof r.k === "number" && r.k >= 0) {
          KF = r.k;
          if (r.reset || KSHOW > r.k || (!SC.cur && !SC.q.length && KSHOW < r.k)) { KSHOW = r.k; lsSet(LS_K, JSON.stringify({ s: SRV, k: KSHOW })); }   /* 줄이 비었으면 받은 데까지 본 것(오래된 줄은 서버가 건너뜀) */
        }
        nextUi();
      } else if (r && (r.reason === "auth" || r.reason === "console")) { lsSet(LS_TOK, null); gateOpen("코드가 바뀌었습니다 · 다시 넣어 주세요"); return; }
      else NET.fails++;
      netUi();
      var wait = r && r.ok && r.more ? 300 : NET.fails ? Math.min(15000, 3000 * Math.pow(1.6, NET.fails - 1)) : 3000;
      if (NET.again) { NET.again = false; wait = Math.min(wait, 300); }
      NET.t = setTimeout(pull, wait);
    });
  }
  /* 소켓 · tv 방 · 「ckin」 알림이 오면 곧바로 읽는다(내용 없음 · 정본은 폴링) · 끊기면 1 · 2 · 4 … 30초 */
  var WSS = { ws: null, fails: 0, t: null, ping: null, pong: 0 };
  function sockOpen() {
    var url = /^https:\/\/[a-z0-9.-]+\.workers\.dev\/exec$/.test(SRV) ? SRV.replace(/^https:/, "wss:").replace(/\/exec$/, "/ws?r=tv") : "";
    if (!url || typeof WebSocket === "undefined") return;
    var ws; try { ws = new WebSocket(url); } catch (e) { sockRetry(); return; }
    WSS.ws = ws;
    ws.onopen = function () { try { ws.send(JSON.stringify({ t: "hello", v: "ckw261025" })); } catch (e) {} };
    ws.onmessage = function (e) {
      if (e.data === "o") { WSS.pong = Date.now(); return; }
      var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (!m) return;
      if (m.t === "ok") { WSS.fails = 0; WSS.pong = Date.now(); clearInterval(WSS.ping); WSS.ping = setInterval(function () { if (Date.now() - WSS.pong > 70000) { try { ws.close(); } catch (x) {} return; } try { ws.send("p"); } catch (x) {} }, 25000); pull(); return; }
      if (m.t === "ckin") pull();
    };
    ws.onclose = function () { if (WSS.ws !== ws) return; WSS.ws = null; clearInterval(WSS.ping); sockRetry(); };
    ws.onerror = function () {};
  }
  function sockRetry() { clearTimeout(WSS.t); WSS.fails++; WSS.t = setTimeout(sockOpen, Math.min(30000, 1000 * Math.pow(2, Math.min(5, WSS.fails - 1))) + Math.random() * 800); }
  window.addEventListener("online", function () { pull(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { pull(); wakeLock(); } });

  /* ── 처음 한 번 코드 · 관리코드 · 등급코드 → 기기 토큰만 저장(코드는 저장 · 표시하지 않음) ── */
  function gateOpen(msg) { $("gate").classList.add("on"); $("gErr").textContent = msg || ""; document.body.classList.remove("nocur"); setTimeout(function () { try { $("gCode").focus(); } catch (e) {} }, 50); }
  $("gForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var code = $("gCode").value.trim(); if (!code) return;
    if (!SRV) { $("gErr").textContent = "서버 주소가 없습니다"; return; }
    $("gGo").disabled = true; $("gErr").textContent = "";
    jsonp({ action: "admin_check", key: code }, function (r) {
      $("gGo").disabled = false; $("gCode").value = "";
      if (r && r.ok && r.tok && (r.role === "admin" || r.role === "grade")) { lsSet(LS_TOK, r.tok); $("gate").classList.remove("on"); document.body.classList.add("nocur"); wake(); pull(); if (!WSS.ws) sockOpen(); return; }
      $("gErr").textContent = r && r.reason === "locked" ? "잠시 뒤 다시 넣어 주세요" : r && r.reason === "network" ? "서버에 연결되지 않습니다" : "코드가 맞지 않습니다";
    });
  });

  /* ── 화면 꺼짐 방지 · 전체 화면 · 커서 ── */
  var WL = null;
  function wakeLock() { try { if (navigator.wakeLock && !WL && !document.hidden) navigator.wakeLock.request("screen").then(function (l) { WL = l; l.addEventListener("release", function () { WL = null; }); }, function () {}); } catch (e) {} }
  function fsUi() { var on = !!(document.fullscreenElement || document.webkitFullscreenElement); $("bFs").style.display = on ? "none" : ""; }
  $("bFs").addEventListener("click", function () { var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen; if (f) try { var r = f.call(d); if (r && r.catch) r.catch(function () {}); } catch (e) {} wakeLock(); });
  document.addEventListener("fullscreenchange", fsUi); document.addEventListener("webkitfullscreenchange", fsUi);
  var idleT = null; function poke() { document.body.classList.remove("hidectl"); clearTimeout(idleT); idleT = setTimeout(function () { document.body.classList.add("hidectl"); }, 4000); }
  document.addEventListener("pointermove", poke); document.addEventListener("pointerdown", poke);

  /* ── 가짜 피드(?demo=1) · 서버 없이 · 키 1 한 명 · 5 다섯 명 · 0 서른 명 · f 선착순 · c 체크인 + 선착순 · d 연결 끊김 표시 ── */
  var FAKE = ["김하늘", "이도윤", "박서연", "최지호", "정하린", "강민준", "조예린", "윤시우", "장서윤", "임건우", "한지민", "오태윤", "서다은", "신우진", "권나연", "황준서", "안소율", "송현우", "전채원", "홍길동"];
  var DEPTS = ["디지털전략부", "데이터사이언스파트", "인사총무본부 · 인재개발부", "자동차보험부", "장기보험부 · 상품개발파트", "고객지원부", "AX추진팀", "재무관리부"];
  var DEMO_C = 0, DEMO_RK = 7;
  function demoPush(n, kind) {
    var a = []; for (var i = 0; i < n; i++) { DEMO_C++; var o = { c: DEMO_C, k: kind === "fc" || kind === "both" ? "fc" : "ck", nm: FAKE[(DEMO_C * 7) % FAKE.length], dept: DEPTS[(DEMO_C * 3) % DEPTS.length], at: "", ago: 0 }; if (o.k === "fc") o.rk = ++DEMO_RK; if (kind === "both") o.ck = 1; a.push(o); }
    enqueue(a); nextUi();
  }
  window.CKW_DEMO = { push: demoPush, net: function (on) { NET.okAt = on ? Date.now() : 0; netUi(); }, state: function () { return { q: SC.q.length, cur: SC.cur ? SC.cur.c : 0, shown: KSHOW, dots: dots.n, pn: pn }; } };

  /* ── 시작 ── */
  window.addEventListener("resize", resize);
  resize(); fsUi(); sndUi(); poke(); wakeLock();
  requestAnimationFrame(frame);
  setInterval(netUi, 2000);
  if (DEMO) {
    KSHOW = 0; KF = 0; SC.seen = {};
    document.addEventListener("keydown", function (e) { var k = e.key; if (k === "1") demoPush(1, "ck"); else if (k === "5") demoPush(5, "ck"); else if (k === "0") demoPush(30, "ck"); else if (k === "f") demoPush(1, "fc"); else if (k === "c") demoPush(1, "both"); else if (k === "d") window.CKW_DEMO.net(Date.now() - NET.okAt < 10000 ? false : true); });
    if (Q.auto === "1") (function tick() { var r = Math.random(); demoPush(1, r < 0.15 ? "fc" : r < 0.22 ? "both" : "ck"); setTimeout(tick, 1500 + Math.random() * 6000); })();
  } else if (!SRV) gateOpen("서버 주소가 없습니다");
  else if (!lsGet(LS_TOK)) gateOpen("");
  else { pull(); sockOpen(); }
})();
