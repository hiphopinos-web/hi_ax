<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Outro 럭키드로우 시연</title>
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#191F28; --body:#4E5968; --muted:#6B7684;
  --brand:#FF7E31; --line:#E5E8EB;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{
  min-height:100vh; min-height:100dvh;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color:var(--ink); letter-spacing:0; -webkit-text-size-adjust:100%;
  display:flex; flex-direction:column;
}
main{flex:1; width:100%; max-width:480px; margin:0 auto; padding:32px 16px 24px}
.eyebrow{font-size:.875rem; line-height:1.25rem; font-weight:700; color:var(--brand)}
h1{font-size:1.625rem; line-height:2.125rem; font-weight:800; margin-top:4px}
.rule{height:3px; width:40px; background:var(--brand); margin:16px 0 20px; border-radius:2px}
.frame{background:#000; border-radius:16px; overflow:hidden; aspect-ratio:16/9}
video{display:block; width:100%; height:100%; background:#000}
.note{margin-top:16px; font-size:.9375rem; line-height:1.5rem; color:var(--body)}
footer{padding:16px 16px calc(24px + env(safe-area-inset-bottom)); text-align:center; font-size:.75rem; line-height:1.125rem; color:var(--muted)}
</style>
</head>
<body>
<main>
  <p class="eyebrow">AX Festival 2026</p>
  <h1>Outro 럭키드로우 시연</h1>
  <div class="rule"></div>
  <div class="frame">
    <video src="reel.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
  </div>
  <p class="note">17F 대형 화면에 띄우는 추첨 화면을 데모 모드로 녹화했습니다 · 체크인 → 앞뒤로 섞기 → 6시 문으로 한 개 → 공개 · 참가자는 가짜 데이터</p>
</main>
<footer>AX Festival 2026 · ME to WE</footer>
</body>
</html>
