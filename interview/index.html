<script>
/* 영상 열림 = 콘솔 스위치(사용자 결정 261024 · 서버 vid_pub 의 iv). 영상 주소는 이 파일에 두지 않는다(261024 미리 노출 막기 · 서버가 열린 영상만 주소 u.iv 를 준다).
   열 때 서버에 한 번 묻고 열림 + 주소가 오면 그 주소로 넘긴다 · 닫힘 · 주소 없음 · 실패 · 3초 안에 답이 없으면 준비 중 화면 · 열어 둔 화면은 30초마다 다시 묻는다.
   261027 (사용자 「영상은 열되 내가 원하는 시점에 닫을 수 있게」) 닫힘이 2026-10-26 18:00 KST(END_MS) 뒤면 준비 중 대신 앱과 같은 행사 종료 화면(챗봇 · 「AX Festival 2026이 종료되었습니다」 · 「내년에 다시 만나요」) · 열림 동작은 그대로. */
var END_MS = 1793005200000;   /* 2026-10-26 18:00 KST */
var SRV = typeof AXF_SERVER === "string" && /^https?:\/\/[^\s?#]+\/exec$/.test(AXF_SERVER) ? AXF_SERVER : "https://hi.axf2026.workers.dev/exec";
var CHK_MS = 3000, POLL_MS = 30000;
document.documentElement.className = "chk";   /* 묻는 동안(최대 3초) 준비 중 글자를 미리 보이지 않는다 */
function goVideo(u) {
  u = (typeof u === "string" ? u : "").replace(/^\s+|\s+$/g, "");
  if (!/^https:\/\/[^\s"<>]+$/i.test(u)) return false;
  document.documentElement.style.visibility = "hidden";
  try { var m = document.createElement("meta"); m.httpEquiv = "refresh"; m.content = "0;url=" + u; document.head.appendChild(m); } catch (e) {}
  location.replace(u);
  return true;
}
function showWait() { document.documentElement.className = Date.now() >= END_MS ? "end" : ""; }
function check() {
  var done = false, x = null, fin = function (u) {
    if (done) return;
    done = true;
    try { if (x && !u) x.abort(); } catch (e) {}
    if (u && goVideo(u)) return;
    showWait();
  };
  setTimeout(function () { fin(""); }, CHK_MS);
  try {
    x = new XMLHttpRequest();
    x.open("GET", SRV + "?action=vid_pub&_=" + Date.now(), true);
    x.onload = function () { var o = null; try { o = JSON.parse(x.responseText); } catch (e) {} fin(o && o.ok && o.v && o.v.iv === 1 && o.u && typeof o.u.iv === "string" ? o.u.iv : ""); };
    x.onerror = function () { fin(""); };
    x.send();
  } catch (e) { fin(""); }
}
check();
setInterval(function () { if (document.documentElement.className !== "chk") check(); }, POLL_MS);   /* 준비 중에 열어 둔 화면도 스위치가 열리면 넘어간다 */
</script>
<style>
:root{--bg:#FFFFFF;--tx:#1A1A1A;--sub:#6B6B6B;--line:#E6E6E6;--o100:#FF7E31;--o10:#FFEBE0;--o5:#FFF6F0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html.chk body{visibility:hidden}
body{background:var(--bg);color:var(--tx);font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}

.bar{width:40px;height:6px;border-radius:3px;background:var(--o100);margin-bottom:28px}

.st{align-self:flex-start;margin-top:28px;padding:6px 14px;border:1.5px solid var(--o100);border-radius:999px;font-size:15px;font-weight:700;color:#C24A00}
p{font-size:18px;color:var(--tx);margin-top:14px}
.ft{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--sub)}

/* 261027 행사 종료 화면 · 앱 종료 화면(app-src 010-css-main.css #endGate · v8.96)과 같은 그림 · 같은 움직임 · 값은 앱 토큰 그대로 옮김 */
.endv{display:none}
html.end body{background:#F2F4F6}
html.end .wrap{display:none}
html.end .endv{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 24px calc(64px + env(safe-area-inset-bottom,0px));text-align:center}
.endv .in{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:360px}
.endv .end-bot{position:relative;display:block;width:104px;height:104px;margin-bottom:4px;animation:endIn .6s cubic-bezier(.2,.8,.2,1) both}
.endv .end-sh{position:absolute;left:26px;top:78px;width:52px;height:8px;border-radius:50%;background:#FF7F32;opacity:.16;animation:endSh 1.8s linear 1.3s infinite}
.endv svg{position:relative;width:104px;height:104px;display:block;overflow:visible;transform-origin:50% 78%;animation:endHop 1.8s linear 1.3s infinite}
.endv .eye{transform-box:fill-box;transform-origin:center;animation:endEyeOff .2s ease-in 1s both}
.endv .sm{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:endSmOn .28s cubic-bezier(.2,.8,.2,1) 1.12s both}
.endv .sm path{fill:none;stroke:#191F28;stroke-width:5;stroke-linecap:round}
.endv .ant path{fill:none;stroke:#FF7F32;stroke-width:4.8;stroke-linecap:round;opacity:0;transform-box:view-box;transform-origin:100px 31.31px;animation:endPop 1.8s linear 1.62s infinite}
.endv .ant path:nth-child(2){animation-delay:1.7s}
.endv .ant path:nth-child(3){animation-delay:1.78s}
.endv h1{margin:0;font-size:26px;line-height:35px;font-weight:700;letter-spacing:normal;color:#191F28;animation:endIn .6s cubic-bezier(.2,.8,.2,1) .15s both}
.endv h1 span{display:block}
.endv p{margin:0;font-size:15px;line-height:22.5px;letter-spacing:normal;color:#4E5968;animation:endIn .6s cubic-bezier(.2,.8,.2,1) .3s both}
@keyframes endIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes endEyeOff{0%{transform:scaleY(1);opacity:1}60%{transform:scaleY(.15);opacity:1}100%{transform:scaleY(.1);opacity:0}}
@keyframes endSmOn{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:none}}
@keyframes endHop{0%{transform:translateY(0) scale(1,1);animation-timing-function:cubic-bezier(.3,0,.6,1)}8%{transform:translateY(0) scale(1.07,.92);animation-timing-function:cubic-bezier(.2,.6,.4,1)}14%{transform:translateY(-6px) scale(.96,1.05);animation-timing-function:cubic-bezier(.2,.6,.5,1)}32%{transform:translateY(-26px) scale(1,1);animation-timing-function:cubic-bezier(.5,0,.8,.5)}50%{transform:translateY(0) scale(.97,1.04);animation-timing-function:cubic-bezier(.2,.6,.4,1)}57%{transform:translateY(0) scale(1.09,.9);animation-timing-function:cubic-bezier(.3,.6,.4,1)}68%{transform:translateY(0) scale(.98,1.02)}76%,100%{transform:translateY(0) scale(1,1)}}
@keyframes endSh{0%,76%,100%{transform:scale(1);opacity:.16}8%{transform:scale(1.08);opacity:.18}32%{transform:scale(.55);opacity:.06}50%{transform:scale(.95);opacity:.15}57%{transform:scale(1.12);opacity:.2}}
@keyframes endPop{0%{opacity:0;transform:scale(.5);animation-timing-function:cubic-bezier(.2,.7,.3,1)}6%{opacity:1;transform:scale(.9);animation-timing-function:cubic-bezier(.2,.6,.4,1)}30%{opacity:0;transform:scale(1.5)}34%{opacity:0;transform:scale(.5);animation-timing-function:cubic-bezier(.2,.7,.3,1)}40%{opacity:.9;transform:scale(.9);animation-timing-function:cubic-bezier(.2,.6,.4,1)}64%,100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.endv .end-bot,.endv svg,.endv .end-sh,.endv .eye,.endv .sm,.endv .ant path,.endv h1,.endv p{animation:none}.endv .eye{opacity:0}.endv .sm{opacity:1}.endv .ant path{opacity:.3}}
</style>
