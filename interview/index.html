<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 활용 현장 인터뷰 · AX Festival 2026</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<script src="../assets/server.js"></script>
<script>
/* 영상 열림 = 콘솔 스위치(사용자 결정 261024 · 서버 vid_pub 의 iv). 영상 주소는 이 파일에 두지 않는다(261024 미리 노출 막기 · 서버가 열린 영상만 주소 u.iv 를 준다).
   열 때 서버에 한 번 묻고 열림 + 주소가 오면 그 주소로 넘긴다 · 닫힘 · 주소 없음 · 실패 · 3초 안에 답이 없으면 준비 중 화면 · 열어 둔 화면은 30초마다 다시 묻는다. */
var SRV = typeof AXF_SERVER === "string" && /^https?:\/\/[^\s?#]+\/exec$/.test(AXF_SERVER) ? AXF_SERVER : "https://hi.axf2026.workers.dev/exec";
var CHK_MS = 3000, POLL_MS = 30000;
document.documentElement.className = "chk";   /* 묻는 동안(최대 3초) 준비 중 글자를 미리 보이지 않는다 */
function goVideo(u) {
  u = (typeof u === "string" ? u : "").replace(/^\s+|\s+$/g, "");
  if (!/^https:\/\/[^\s"<>]+$/i.test(u)) return false;
  document.documentElement.style.visibility = "hidden";
  try { var m = document.createElement("meta"); m.httpEquiv = "refresh"; m.content = "0;url=" + u; document.head.appendChild(m); } catch (e) {}
  location.replace(u);
  return true;
}
function showWait() { document.documentElement.className = ""; }
function check() {
  var done = false, x = null, fin = function (u) {
    if (done) return;
    done = true;
    try { if (x && !u) x.abort(); } catch (e) {}
    if (u && goVideo(u)) return;
    showWait();
  };
  setTimeout(function () { fin(""); }, CHK_MS);
  try {
    x = new XMLHttpRequest();
    x.open("GET", SRV + "?action=vid_pub&_=" + Date.now(), true);
    x.onload = function () { var o = null; try { o = JSON.parse(x.responseText); } catch (e) {} fin(o && o.ok && o.v && o.v.iv === 1 && o.u && typeof o.u.iv === "string" ? o.u.iv : ""); };
    x.onerror = function () { fin(""); };
    x.send();
  } catch (e) { fin(""); }
}
check();
setInterval(function () { if (document.documentElement.className !== "chk") check(); }, POLL_MS);   /* 준비 중에 열어 둔 화면도 스위치가 열리면 넘어간다 */
</script>
<style>
:root{--bg:#FFFFFF;--tx:#1A1A1A;--sub:#6B6B6B;--line:#E6E6E6;--o100:#FF7E31;--o10:#FFEBE0;--o5:#FFF6F0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html.chk body{visibility:hidden}
body{background:var(--bg);color:var(--tx);font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:48px 24px;max-width:480px;margin:0 auto}
.bar{width:40px;height:6px;border-radius:3px;background:var(--o100);margin-bottom:28px}
.ev{font-size:14px;font-weight:600;color:var(--sub);letter-spacing:.02em}
h1{font-size:30px;line-height:1.3;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.st{align-self:flex-start;margin-top:28px;padding:6px 14px;border:1.5px solid var(--o100);border-radius:999px;font-size:15px;font-weight:700;color:#C24A00}
p{font-size:18px;color:var(--tx);margin-top:14px}
.ft{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--sub)}
.ft b{font-weight:700;color:var(--tx)}
</style>
</head>
<body>
<main class="wrap">
  <div class="bar" aria-hidden="true"></div>
  <div class="ev">AX Festival 2026</div>
  <h1>AI 활용 현장 인터뷰</h1>
  <span class="st">영상 준비 중</span>
  <p>영상은 행사 당일 공개됩니다.</p>
  <div class="ft"><b>ME to WE</b> : 나의 경험을 우리의 가능성으로</div>
</main>
</body>
</html>
