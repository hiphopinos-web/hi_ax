<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<style>

  #cp{position:absolute;top:0;right:0;bottom:0;width:380px;background:rgba(18,20,24,.96);color:#fff;font:14px/1.5 "Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;padding:16px 18px;overflow:auto;display:none;cursor:default;z-index:4;box-sizing:border-box}
  #cp h2{font-size:17px;margin:0 0 10px}#cp h3{font-size:14px;margin:16px 0 6px;color:#FF963E}
  #cp label{display:block;margin:6px 0 2px;color:#D9D9D9}
  #cp input[type=text],#cp input[type=password],#cp input[type=number],#cp select{width:100%;box-sizing:border-box;background:#2A2D33;border:1px solid #555;color:#fff;border-radius:6px;padding:6px 8px;font:inherit}
  #cp input[type=number]{width:70px}
  #cp button{background:#FF7E31;color:#fff;border:0;border-radius:6px;padding:6px 12px;font:600 14px "Malgun Gothic",sans-serif;cursor:pointer;margin:6px 6px 0 0}

<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<video id="cam" playsinline muted></video>
<div id="err"><h1 id="errT"></h1><p id="errP"></p><button id="errB">마우스로 해 보기</button></div>

  <label><input type="checkbox" id="cpOn"> 계수 켜기 (사람 수만 셈, 영상 저장·전송 없음 · 새로고침하면 꺼짐 · 혼잡도는 계수기에서 잡는다)</label>
  <label>위치 이름 (기기마다 다르게 · 예: 1F 로비)</label><input type="text" id="cpName" maxlength="12" placeholder="비우면 AX magic 1">
  <div class="st" id="cpFull"></div>
  <label>계수용 카메라</label><select id="cpDev"><option value="">메인 카메라 (게임과 같은 1대)</option></select>

  <label>타일 분할</label><select id="cpTiles"><option value="1">끔</option><option value="2">2x2 (느림)</option></select>
  <label>연산 (다음 실행부터)</label><select id="cpGpu"><option value="1">GPU 우선</option><option value="0">CPU만 (느림, GPU 충돌 시)</option></select>
  <label>사람 위치</label><select id="cpAnchor"><option value="center">상자 가운데</option><option value="foot">발(상자 아래)</option></select>

  <div id="cpSavedRow" hidden>등급코드 저장됨 <button class="g" id="cpCodeForget">지우기</button></div>
  <div class="st" id="cpSrvStat"></div>
  <div class="st">보낼 곳 · 등급코드 · 위치 이름 · 구역은 같은 브라우저의 혼잡도 계수기(주소 끝 /crowd/)와 함께 씁니다.</div>

  <div id="cpZones"></div>
  <h3>상태</h3><div class="st" id="cpStat"></div>
</div>
<script type="module">
/* AX magic 공용 엔진(../engine/ · 261004): 카메라 · 실행 주기 · 모델 로더 · 짝짓기 · 계수 · 전송 · 공용 설정 · 상태 점.
   혼잡도 계수기(../crowd/)와 같은 엔진이다. 게임 규칙 · 판정 · 연출은 이 파일에 그대로 둔다. */
import { openCamera, cycleCamera as engCycleCamera } from '../engine/camera.js';
import { FrameScheduler } from '../engine/scheduler.js';
import { createHandLandmarker, createFaceDetector } from '../engine/models.js';
import { greedyMatch, inPoly, zoneState } from '../engine/tracking.js';
import { PersonDetector } from '../engine/detector.js';
import { createTransport, SERVERS } from '../engine/transport.js';
import { getLoc, setLoc, camName as camFullName, loadZones, saveZones, onShared, migrateMagician } from '../engine/settings.js';
import { healthOf } from '../engine/health.js';
import { PointsFilter } from '../engine/filters.js';
const W = 1920, H = 1080;
const qs = new URLSearchParams(location.search);
let mouseMode = qs.get('mouse') === '1';
let debug = qs.get('debug') === '1';
let radiusScale = 1, swingBias = 0;   // swingBias: , . 키로 현장 튜닝 (초)
const FONT = '"Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif';
const ORANGE = '#FF7E31', ORANGE_L = '#FF963E', ORANGE_D = '#E5651A';
const ABSENT_SEC = 6;

const cv = document.getElementById('stage');
let ctx = cv.getContext('2d');   // let: 적 외곽선(outlined)이 잠깐 다른 캔버스로 바꿔 그린다
const video = document.getElementById('cam');
const errBox = document.getElementById('err');

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`;
  cv._s = s; cv._ox = (innerWidth - W * s) / 2; cv._oy = (innerHeight - H * s) / 2;
}
addEventListener('resize', fit); fit();

const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const pick = arr => arr[(Math.random() * arr.length) | 0];
let now = performance.now() / 1000;

/* ---------------- 효과음 (WebAudio 합성) ---------------- */
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (ac && ac.state === 'suspended') ac.resume().catch(() => { }); return ac; }
function tone(f, d, type = 'sine', vol = .16, slide = 0, delay = 0) {
  const a = audio(); if (!a) return; const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, vol = .2, f0 = 1500, f1 = 1500, q = .8, type = 'bandpass', delay = 0) {
  const a = audio(); if (!a) return; const t = a.currentTime + delay;
  const buf = a.createBuffer(1, Math.max(1, (a.sampleRate * d) | 0), a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
  const n = a.createBufferSource(); n.buffer = buf;
  const bp = a.createBiquadFilter(); bp.type = type; bp.Q.value = q; bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + d);
  const g = a.createGain(); g.gain.value = vol; n.connect(bp).connect(g).connect(a.destination); n.start(t);
}
const sfx = {
  tap() { tone(520, .09, 'square', .1); tone(880, .14, 'square', .1, 0, .07); },
  start() { tone(392, .12, 'triangle', .16); tone(523, .12, 'triangle', .16, 0, .1); tone(784, .22, 'triangle', .18, 0, .2); },
  tick(p) { tone(300 + p * 700, .08, 'triangle', .06); },
  orb() { tone(440, .3, 'triangle', .16); tone(660, .3, 'triangle', .14, 0, .08); tone(880, .5, 'triangle', .16, 0, .18); noise(.5, .1, 800, 4000, .6); },
  push() { noise(.6, .22, 400, 5000, .7); tone(200, .5, 'sawtooth', .08, 600); },
  fire() { noise(.5, .28, 2500, 500, .6); tone(140, .35, 'square', .1, -60); },
  heart() { [660, 880, 1100, 1320].forEach((f, i) => tone(f, .28, 'sine', .14, 0, i * .07)); },
  tele() { noise(.45, .2, 6000, 600, .5, 'bandpass'); tone(1000, .3, 'sine', .1, -700); },
  no() { tone(240, .28, 'sawtooth', .08, -120); },
  boom() { noise(.9, .35, 1200, 100, .4, 'lowpass'); tone(90, .6, 'sine', .3, -50); [523, 659, 784, 1047].forEach((f, i) => tone(f, .5, 'triangle', .16, 0, .25 + i * .12)); },
  hit() { noise(.3, .32, 2600, 220, .6); tone(160, .22, 'square', .12, -90); },
  hurt() { tone(180, .5, 'sawtooth', .16, -110); noise(.35, .25, 900, 200, .7, 'lowpass'); },
  tired() { tone(420, .7, 'triangle', .14, -300); tone(300, .6, 'triangle', .1, -200, .15); },
  curse() { tone(330, .4, 'sine', .07, -120); },
  boss() { tone(110, .9, 'sawtooth', .12, -40); noise(.8, .15, 400, 120, .6, 'lowpass'); },
  merge() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, .5, 'triangle', .15, 0, i * .06)); noise(.6, .15, 600, 5000, .6); },
  count(n) { tone(n === 1 ? 880 : 660, .18, 'square', .14); tone(n === 1 ? 1320 : 990, .12, 'triangle', .08, 0, .02); },
  go() { tone(392, .14, 'triangle', .2); tone(523, .14, 'triangle', .2, 0, .1); tone(659, .14, 'triangle', .2, 0, .2); tone(1047, .6, 'triangle', .22, 0, .3); noise(.5, .18, 600, 5000, .6, 'bandpass', .3); },
  end() { tone(523, .16, 'triangle', .2); tone(659, .16, 'triangle', .2, 0, .14); tone(784, .16, 'triangle', .2, 0, .28); tone(1047, .5, 'triangle', .22, 0, .42); },
};
addEventListener('pointerdown', audio); addEventListener('keydown', audio);
Object.assign(sfx, {
  tick() { tone(1900, .045, 'square', .07); tone(1200, .04, 'square', .05, 0, .015); },
  punch() { tone(120, .14, 'square', .14, -70); noise(.12, .3, 900, 200, .7, 'lowpass'); },
  glass(big) { noise(big ? .5 : .3, big ? .4 : .3, 7000, 2500, .5, 'highpass'); for (let i = 0; i < (big ? 9 : 6); i++) tone(rnd(2200, 5200), rnd(.06, .16), 'sine', .07, 0, rnd(0, big ? .35 : .22)); tone(90, .12, 'sine', .2, -40); },
  kill() { noise(.4, .34, 2400, 160, .6, 'lowpass'); tone(200, .3, 'square', .1, -120); tone(880, .18, 'triangle', .12, 0, .05); tone(1320, .2, 'triangle', .1, 0, .1); },
  wave() { tone(500, .28, 'sine', .14, 700); noise(.3, .16, 600, 4000, .8); },
  pop() { tone(700, .12, 'triangle', .14, -300); noise(.2, .22, 1800, 300, .7); },
  mtw() { tone(150, .7, 'sawtooth', .1, 500); noise(.8, .25, 300, 6000, .6); [392, 523, 659, 784].forEach((f, i) => tone(f, .6, 'triangle', .12, 0, .05 + i * .05)); },
  // 점 폭발(ME to WE 파 명중 · 합체 · 준비 완료): 럭키드로우 공개 순간 효과음(draw/assets/sfx.js P.hit) 구성 차용 · 손뼉 + 킥 150→40 + 저역 통과 노이즈 9000→600 + 장조 화음 + 종소리 상행
  dotHit() {
    noise(.09, .5, 1600, 1200, 1.2); tone(150, .6, 'sine', .4, -110); noise(.8, .3, 9000, 600, .7, 'lowpass');
    [0, 4, 7, 11, 14].forEach(s => tone(261.63 * Math.pow(2, s / 12), 2.2, 'triangle', .05, 0, .02));
    [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => { const f = 523.25 * Math.pow(2, s / 12); tone(f, 1.1, 'sine', .08, 0, .12 + i * .07); tone(f * 2.01, .5, 'sine', .025, 0, .12 + i * .07); });
  },
  // 적 공격 예고(「!」가 뜨는 순간): 짧은 경고음 두 번 · 보스는 낮고 길게
  warn(big) { const f = big ? 620 : 1250; tone(f, .1, 'square', .13); tone(f, .1, 'square', .13, 0, .15); if (big) tone(f * .5, .5, 'sawtooth', .08, 0, .3); },
  // 적이 서류·메일을 던진다
  toss(big) { noise(big ? .6 : .35, big ? .3 : .2, 500, 3500, .7); tone(big ? 160 : 260, big ? .5 : .25, 'triangle', .1, big ? 260 : 400); },
  // 피드백3: 날아오는 동안 바람 소리. 가까워질수록 커지고 높아진다(도착 순간 최고)
  wind(d, big) {
    const a = audio(); if (!a) return; const t = a.currentTime, n = Math.max(1, (a.sampleRate * (d + .15)) | 0), buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(); src.buffer = buf; const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(big ? 220 : 380, t); bp.frequency.exponentialRampToValueAtTime(big ? 1500 : 2800, t + d);
    const g = a.createGain(); g.gain.setValueAtTime(.004, t); g.gain.exponentialRampToValueAtTime(big ? .5 : .38, t + d); g.gain.exponentialRampToValueAtTime(.0001, t + d + .15);
    src.connect(bp).connect(g).connect(a.destination); src.start(t); src.stop(t + d + .16);
  },
  spawn() { tone(380, .12, 'triangle', .07, 300); noise(.12, .08, 1200, 3000, .8); },
  airPunch() { noise(.28, .22, 1800, 600, .7); tone(220, .16, 'triangle', .07, -80); },
  whoosh() { noise(.38, .4, 4200, 450, .7); tone(1200, .22, 'sine', .07, -800); tone(784, .12, 'triangle', .1, 0, .12); tone(1175, .2, 'triangle', .1, 0, .2); },
  thud() { tone(85, .3, 'sine', .45, -45); noise(.16, .5, 900, 140, .8, 'lowpass'); },
});

/* ---------------- 가상 손 모델 (21점, 손목=원점, 손바닥 길이 1) ---------------- */
const BONES = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [5, 9], [9, 10], [10, 11], [11, 12], [9, 13], [13, 14], [14, 15], [15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]];
const FING = [
  { b: [-.36, -.92], a: -1.70, l: [.46, .28, .22] }, { b: [0, -1], a: -1.5708, l: [.52, .31, .24] },
  { b: [.34, -.93], a: -1.45, l: [.47, .29, .22] }, { b: [.66, -.78], a: -1.30, l: [.36, .22, .19] }];
// cs: 손가락 4개 접힘 0(편)~1(주먹) 숫자 또는 배열, pinch: 엄지 끝을 검지 끝에 붙이는 정도
function handPose(cs, pinch = 0) {
  if (!Array.isArray(cs)) cs = [cs, cs, cs, cs];
  const P = new Array(21); P[0] = { x: 0, y: 0 };
  FING.forEach((f, i) => {
    const c = cs[i], dx = Math.cos(f.a), dy = Math.sin(f.a), base = 5 + i * 4; let cum = 0;
    P[base] = { x: f.b[0], y: f.b[1] };
    for (let j = 0; j < 3; j++) { cum += f.l[j]; const d = lerp(cum, [.28, .2, -.22][j] * (f.l[0] + f.l[1] + f.l[2]), c); P[base + 1 + j] = { x: f.b[0] + dx * d, y: f.b[1] + dy * d }; }
  });
  const tc = (cs[0] + cs[1] + cs[2] + cs[3]) / 4, b = { x: -.26, y: -.26 };
  const op = { x: b.x + Math.cos(-2.4) * .98, y: b.y + Math.sin(-2.4) * .98 }, cu = { x: -.1, y: -.6 };
  const T0 = { x: lerp(op.x, cu.x, tc), y: lerp(op.y, cu.y, tc) };
  const T = { x: lerp(T0.x, P[8].x, pinch), y: lerp(T0.y, P[8].y, pinch) };
  P[1] = b; P[2] = { x: lerp(b.x, T.x, .4), y: lerp(b.y, T.y, .4) }; P[3] = { x: lerp(b.x, T.x, .72), y: lerp(b.y, T.y, .72) }; P[4] = T;
  return P;
}
const PALM = (() => { const p = handPose(0); return { x: (p[0].x + p[5].x + p[9].x + p[13].x + p[17].x) / 5, y: (p[0].y + p[5].y + p[9].y + p[13].y + p[17].y) / 5 }; })();
const place = (pose, cx, cy, s) => pose.map(p => ({ x: cx + (p.x - PALM.x) * s, y: cy + (p.y - PALM.y) * s }));

/* ---------------- 손 입력: 카메라 / 마우스 시험 ---------------- */
const mouse = { x: 960, y: 640, last: -1e9, shift: false, pose: 0, ax: 740, ay: 640, dual: false, extra: [],   // pose 0 편 손 / 1 주먹, (ax,ay) 두 번째 손의 대칭 중심(마우스를 천천히 따라온다), dual 2인 거울
  face: { x: 960, y: 330, w: 190 }, faceOff: false, rdrag: false, keys: new Set(), vfaces: [] };   // 시험용 얼굴: 화살표 키로 움직이고 오른쪽 버튼을 누른 채 끌면 그 자리로 · H 숨김
addEventListener('mousemove', e => {
  const x = (e.clientX - cv._ox) / cv._s, y = (e.clientY - cv._oy) / cv._s;
  if (mouse.rdrag) { mouse.face.x = clamp(x, 40, W - 40); mouse.face.y = clamp(y, 40, H - 40); } else { mouse.x = x; mouse.y = y; }
  mouse.last = clk();
});
addEventListener('pointerdown', e => { if (mouseMode && e.button === 2) { mouse.rdrag = true; mouse.face.x = clamp((e.clientX - cv._ox) / cv._s, 40, W - 40); mouse.face.y = clamp((e.clientY - cv._oy) / cv._s, 40, H - 40); mouse.last = clk(); } });
addEventListener('pointerup', e => { if (e.button === 2) mouse.rdrag = false; });
addEventListener('contextmenu', e => { if (mouseMode) e.preventDefault(); });
const mh = { L: 100, Lt: 100, cs: [0, 0, 0, 0], pin: 0 };
addEventListener('wheel', e => { if (!mouseMode) return; mh.Lt = clamp(mh.Lt * (e.deltaY < 0 ? 1.13 : 1 / 1.13), 60, 280); mouse.last = clk(); }, { passive: true });
const POSES = [{ cs: [0, 0, 0, 0], pin: 0 }, { cs: [1, 1, 1, 1], pin: 0 }, { cs: [.45, 1, 1, 1], pin: 1 }, { cs: [.56, .56, .56, .56], pin: 0 }];   // 3 = 느슨한 주먹(시험 전용)

let hands = [], nextHid = 1;        // 추적 중인 손

async function crowdTick() {
  if (!crowd.on) return;
  if (!cr.det || cr.busy) { crSchedule(500); return; }
  const src = crSource();
  if (!src) { if (!cr.noSrc) cr.noSrc = Date.now(); if (Date.now() - cr.noSrc > 8000) { cr.err = '카메라 영상이 없습니다'; if (Date.now() - cr.noSrc > 20000) crCamRecover(); } crSchedule(500); return; }
  if (cr.noSrc) { cr.noSrc = 0; if (cr.err === '카메라 영상이 없습니다') cr.err = ''; }
  cr.busy = true; const t0 = performance.now();
  try {
    const dets = cr.det.detect(src.el, src.w, src.h, +crowd.tiles);
    const zc = {}; crowd.zones.forEach(z => zc[z.id] = 0);
    for (const d of dets) {
      const a = [(d.x + d.w / 2) / src.w, (crowd.anchor === 'foot' ? d.y + d.h : d.y + d.h / 2) / src.h];   // 카메라 영상 0~1(구역과 같은 좌표)
      d.zone = null;
      d.box = [crDisp(d.x / src.w, d.y / src.h, src.w, src.h), crDisp((d.x + d.w) / src.w, (d.y + d.h) / src.h, src.w, src.h)];
      for (const z of crowd.zones) if (inPoly(a, z.pts)) { zc[z.id]++; d.zone = z.id; }
    }

  } catch (e) { console.error(e); cr.err = '인식 오류'; cr.fails++; if (cr.fails >= 3 && cr.det) { try { cr.det.close && cr.det.close(); } catch (e2) { } cr.det = null; cr.loading = false; crRetryInit(); } }
  cr.busy = false; crRenderStat();

}

    c.globalAlpha = a * .5; c.fillStyle = 'rgba(10,12,16,.8)'; c.beginPath(); c.arc(p.x, p.y, r + 1.8, 0, 7); c.fill();
    c.globalAlpha = a; c.fillStyle = ORANGE; c.beginPath(); c.arc(p.x, p.y, r, 0, 7); c.fill();

function drawPalmGlow(h) {   // 편 손 = 손바닥 빛
  if (h.fistOn) return; const k = clamp((h.open - .45) / .3, 0, 1) * h.xs; if (k <= .01) return;
  glowCircle(h.c.x, h.c.y, h.L * 1.7, .55 * k, '255,236,205'); ring(h.c.x, h.c.y, h.L * 1.1, .5 * k, 3, '#fff');
}
function drawHintHand(h) {   // 힌트: 손바닥 옆(화면 가운데 쪽)에 흐린 손바닥 윤곽 · 나타날 때 조금 다가온다
  const pts0 = h.flm || h.lm, dir = h.c.x > W / 2 ? -1 : 1, k = easeOut(clamp(h.xhT / .7, 0, 1)), off = h.L * lerp(2.8, 2.15, k);

  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  // 밝은 로비 · 어두운 배경 어디서나 보이게: 옅은 그늘 몸통 + 흰 점선 윤곽(그림자) + 손끝 빈 동그라미
  c.globalAlpha = a * .5; c.strokeStyle = 'rgba(10,12,16,.38)'; c.lineWidth = L * .34; bonePath(c, pts); c.stroke();
  c.beginPath(); [0, 1, 5, 9, 13, 17].forEach((i, n) => n ? c.lineTo(pts[i].x, pts[i].y) : c.moveTo(pts[i].x, pts[i].y)); c.closePath(); c.fillStyle = 'rgba(10,12,16,.3)'; c.fill();
  c.globalAlpha = a * .8; c.shadowColor = 'rgba(0,0,0,.7)'; c.shadowBlur = 6; c.setLineDash([3, Math.max(9, L * .11)]); c.strokeStyle = '#fff'; c.lineWidth = Math.max(3, L * .045); bonePath(c, pts); c.stroke();
  c.setLineDash([]); c.lineWidth = Math.max(2.5, L * .03); c.strokeStyle = ORANGE_L; for (const i of TIPS) { c.beginPath(); c.arc(pts[i].x, pts[i].y, Math.max(5, L * .07), 0, 7); c.stroke(); }
  c.restore();
}
function drawBloom(b) {   // 절정: 원본 심볼 통째(logoDraw) · 커지며 피었다가 조금 더 커지며 사라진다
  const t = b.t, hh = bloomSize(b), a = clamp(t / .25, 0, 1) * (t > BLOOM_DUR - .8 ? 1 - (t - BLOOM_DUR + .8) / .8 : 1);
  const w = LOGO.ok ? LOGO.w / LOGO.h * hh : hh, x = clamp(b.x, w / 2 + 20, W - w / 2 - 20), y = clamp(b.y, hh / 2 + 20, H - hh / 2 - 20);

function drawFlameIcon(x, y, s) {   // 「게임 하기」 아이콘: 작은 불꽃(도형 · 불꽃 주먹을 닮게)
  const c = ctx, drop = (k, dy) => { c.beginPath(); c.moveTo(x, y - s * .95 * k + dy); c.bezierCurveTo(x + s * .62 * k, y - s * .3 * k + dy, x + s * .62 * k, y + s * .35 * k + dy, x, y + s * .62 * k + dy); c.bezierCurveTo(x - s * .62 * k, y + s * .35 * k + dy, x - s * .62 * k, y - s * .3 * k + dy, x, y - s * .95 * k + dy); c.closePath(); };
  c.save(); const g = c.createLinearGradient(0, y + s * .6, 0, y - s); g.addColorStop(0, ORANGE_D); g.addColorStop(1, ORANGE_L);

function drawGameBtn() {
  const B = XP.BTN, c = ctx, g = clamp(X.gauge, 0, 1), hot = X.dwell > 0, R = B.h / 2 - 18, ix = B.x - B.w / 2 + B.h / 2, iy = B.y;
  c.save();
  c.fillStyle = hot ? 'rgba(10,12,16,.72)' : 'rgba(10,12,16,.55)'; c.beginPath(); c.roundRect(B.x - B.w / 2, B.y - B.h / 2, B.w, B.h, B.h / 2); c.fill();
  if (g > 0) { c.save(); c.clip(); c.fillStyle = 'rgba(255,126,49,.78)'; c.fillRect(B.x - B.w / 2, B.y - B.h / 2, B.w * g, B.h); c.restore(); c.beginPath(); c.roundRect(B.x - B.w / 2, B.y - B.h / 2, B.w, B.h, B.h / 2); }   // 게이지: 버튼이 왼쪽부터 오렌지로 찬다
  c.lineWidth = 3; c.strokeStyle = hot ? ORANGE_L : 'rgba(255,255,255,.45)'; c.stroke();

function drawExp() {
  const lh = liveHands(), ea = lerp(.45, 1, X.msg);   // 불씨: 손이 잡혀 있으면 옅게
  for (const e of X.emb) {
    const x = e.x + Math.sin(X.t * .7 + e.ph) * e.sw, y = e.y, a = e.a * ea * clamp((H + 30 - y) / 160, 0, 1) * clamp((y + 40) / 220, 0, 1);
    glowCircle(x, y, e.r * 6, a * .45, '255,126,49'); ctx.save(); ctx.globalAlpha = a * .35; ctx.fillStyle = '#0A0C10'; ctx.beginPath(); ctx.arc(x, y, e.r + 2, 0, 7); ctx.fill();   // 밝은 로비에서도 보이게 얇은 그늘
    ctx.globalAlpha = a; ctx.fillStyle = ORANGE; ctx.beginPath(); ctx.arc(x, y, e.r, 0, 7); ctx.fill(); ctx.fillStyle = '#FFD0A8'; ctx.beginPath(); ctx.arc(x, y, e.r * .45, 0, 7); ctx.fill(); ctx.restore();
  }
  drawGameBtn();   // 버튼은 불씨 위 · 손 그림 아래(손을 대면 관절 점이 버튼 위에 보인다)
  for (const h of lh) if (h.xs > 0) drawPalmGlow(h);

  if (X.bloom) drawBloom(X.bloom);

    const m = X.small ? '조금 더 가까이' : '손을 펴 보세요'; c.save(); c.font = `900 100px ${FONT}`; const w = c.measureText(m).width + 150; c.restore();
    c.save(); c.globalAlpha = X.msg; pill(960, 870, w, 168, 'rgba(10,12,16,.55)'); txt(m, 960, 872, 100, '#fff', 'center', 900); c.restore();

/* ---------------- 입력 키 ----------------
   G 게임 모드 바로(체험 → ME/WE 선택, 스태프용 · 261004) · P 건너뛰기(연습 중 → 준비 화면, 준비 화면 → 카운트다운, 체험·선택이면 ME로 바로 카운트다운) · M ME 시작 · W WE 시작 · Esc 체험 화면으로

   피드백3 마우스 시험 얼굴: 화살표 키 = 얼굴 이동 · 오른쪽 버튼을 누른 채 끌기 = 얼굴을 그 자리로 · H 얼굴 숨김(가려짐) · 2인 거울(B)이면 얼굴도 거울 */
let fps = 60;
addEventListener('keyup', e => { if (e.key === 'Shift') mouse.shift = false; mouse.keys.delete(e.key); });

  if (/^Arrow/.test(e.key)) { if (mouseMode) { mouse.keys.add(e.key); e.preventDefault(); } return; }   // 시험: 화살표 = 얼굴 이동

/* ---------------- 메인 루프 ---------------- */
let prev = performance.now() / 1000;
let simT = null;   // 시험용 가상 시계(__ax.sim): 탭이 숨겨져도 한 프레임씩 직접 돌릴 수 있다
const clk = () => simT === null ? performance.now() / 1000 : simT;
function frame() { requestAnimationFrame(frame); if (simT === null) run(performance.now() / 1000); }

  now = t; const dt = Math.min(.05, now - prev); prev = now; fps = lerp(fps, 1 / Math.max(dt, .001), .05);

if (!mouseMode) initCamera();

  sim(on = true) { simT = on ? Math.max(performance.now() / 1000, simT || 0, now) : null; prev = clk(); },   // 가상 시계는 뒤로 가지 않는다
  step(n = 1, dt = 1 / 30) { for (let i = 0; i < n; i++) { simT += dt; run(simT); } },
  async runFor(secs, fn, dt = 1 / 30) { const n = Math.round(secs / dt); for (let i = 0; i < n; i++) { if (fn) fn(i * dt, i); simT += dt; run(simT); } },
  setMouse(x, y) { mouse.x = x; mouse.y = y; mouse.last = clk(); },
  anchor(x, y) { mouse.ax = x; mouse.ay = y; },
  hide() { mouse.last = -1e9; }, mouseOff(v = true) { mouse.off = !!v; },
  vhand(o) { const v = Object.assign({ x: 480, y: 600, pose: 0, L: 100, Lt: 100, cs: [0, 0, 0, 0], pin: 0, shift: false, ax: 480, ay: 600, off: false }, o); mouse.extra.push(v); return v; }, vclear() { mouse.extra.length = 0; mouse.vfaces.length = 0; },
  vface(o) { const f = Object.assign({ x: 960, y: 330, w: 190, off: false }, o); mouse.vfaces.push(f); return f; },   // 시험용 얼굴(봇의 고개)
  face: (i = 0) => ({ x: FS[i].x | 0, y: FS[i].y | 0, w: FS[i].w | 0, vis: faceVis(i), judge: !!faceFor(i) }), mface: mouse.face, faceKey(on) { mouse.faceOff = !on; },
  throwAt: e => throwAt(e), throwPractice: i => throwPractice(G.pl[i]), FS, perf,
  pose(n) { mouse.pose = n; mouse.last = clk(); }, circleKey(v) { mouse.circle = !!v; mouse.last = clk(); }, thrustKey() { mh.Lt = Math.max(mh.L, 100) * 1.7; mouse.last = clk(); }, shift(v) { if (v && !mouse.shift) { mouse.ax = mouse.x + (mouse.x > 960 ? -220 : 220); mouse.ay = mouse.y; } mouse.shift = !!v; }, dual(v) { mouse.dual = !!v; },
  wheel(n) { mh.Lt = clamp(mh.Lt * Math.pow(1.13, n), 60, 280); mouse.last = clk(); },
  state: () => ({ mode: S.mode, ph: G && G.ph, np: G && G.np, pi: G && G.pi, t: G && +G.t.toFixed(2), life: G && G.life, kills: G && G.kills, wave: G && G.wave, grade: G && G.grade, cleared: G && G.cleared, merge: !!(G && G.merge), sel: SEL && SEL.g.slice(),
    maxCombo: G && G.maxCombo, readyBy: G && G.readyBy, bossTired: G && G.bossTired, logo: LOGO.ok,
    pl: G ? G.pl.map(p => ({ en: +p.en.toFixed(1), ex: now < p.exUntil, done: p.done, hands: p.hands.length, circ: p.circ, circT: +p.circT.toFixed(2), ready: p.ready, muted: p.muted || 0, combo: p.combo })) : [],
    en: G ? G.en.map(e => ({ type: e.type, side: e.side, z: +e.z.toFixed(2), hp: e.hp, x: e.px | 0, y: e.py | 0, atk: e.atk || '', ak: +(e.ak || 0).toFixed(2) })) : [],
    hurtLog: G ? G.hurtLog.slice() : [], eshots: G ? G.eshots.length : 0, dodges: G && G.dodges, dodgeLog: G ? G.dodgeLog.slice() : [], st: G && JSON.parse(JSON.stringify(G.st)),
    hands: liveHands().map(h => ({ id: h.id, side: h.side, L: h.L | 0, open: +h.open.toFixed(2), thrR: +(h.thrR || 1).toFixed(2) })) }),
  G: () => G, now: () => now, casts: castLog, spawn: (type, side, o) => spawn(type, side, o), thr: () => thrLast.slice(), target: (i = 0) => { const t = G && G.pl[i] ? pickTarget(G.pl[i]) : null; return t ? t.id : null; }, LOGO,
  fx: () => ({ fire: FIRE.length, efx: EFX.length, fireLv: liveHands().map(h => +(h.fire || 0).toFixed(2)), dotb: DOTB.map(c => +c.t.toFixed(2)), eshots: G ? G.eshots.filter(s => !s.res).map(s => +(s.t / s.dur).toFixed(2)) : [], eres: G ? G.eshots.filter(s => s.res).map(s => s.res + ':' + s.kind + ':' + (+s.pt.toFixed(2))) : [], ekind: G ? G.eshots.filter(s => !s.res).map(s => s.kind) : [], tele: G ? G.en.filter(e => e.atk === 'tele').map(e => +(e.ak / ATK_TELE[e.type]).toFixed(2)) : [], cracks: CRACKS.length, marks: G ? G.marks.length : 0, merge: G && G.merge ? +G.merge.t.toFixed(2) : -1, shots: G ? G.shots.map(s => ({ k: s.k, p: +(s.t / s.dur).toFixed(2) })) : [] }),
  async backdrop(url) { if (!url) { testBg = null; return; } const im = new Image(); await new Promise((r, j) => { im.onload = r; im.onerror = j; im.src = url; }); testBg = im; },

  eyePts: () => liveHands().map(h => ({ id: h.id, raw: h.lm.map(p => [+p.x.toFixed(2), +p.y.toFixed(2)]), f: (h.flm || []).map(p => [+p.x.toFixed(2), +p.y.toFixed(2)]) })),
  jitter(n) { jit = +n || 0; }, xp: XP, skip() { if (G) setPh('b-intro'); }, setPh: ph => setPh(ph),

  async crowdImage(url) { const im = new Image(); await new Promise((r, j) => { im.onload = r; im.onerror = j; im.src = url; }); cr.testSrc = { el: im, w: im.naturalWidth, h: im.naturalHeight }; },
  async snap(name) { if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return 0;   // 시험 저장은 로컬 서버 전용
    const b = await new Promise(r => cv.toBlob(r, 'image/png')); await fetch('/save/' + encodeURIComponent(name), { method: 'POST', body: b }); return b.size; },
};
