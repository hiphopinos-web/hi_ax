<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AX 매지션</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;display:block;background:#000}
  #cam{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
  #err{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.88);color:#fff;font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;text-align:center;cursor:default;z-index:5}
  #err h1{font-size:64px;line-height:1.3;margin:0 0 20px;font-weight:700}
  #err p{font-size:34px;line-height:1.5;margin:0 0 48px;color:#D9D9D9;max-width:1400px}
  #err button{font:700 40px "Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;background:#FF7E31;color:#fff;border:0;border-radius:16px;padding:26px 64px;cursor:pointer}
  /* 설정 패널 (C 키, 숨김) */
  #cp{position:absolute;top:0;right:0;bottom:0;width:380px;background:rgba(18,20,24,.96);color:#fff;font:14px/1.5 "Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;padding:16px 18px;overflow:auto;display:none;cursor:default;z-index:4;box-sizing:border-box}
  #cp h2{font-size:17px;margin:0 0 10px}#cp h3{font-size:14px;margin:16px 0 6px;color:#FF963E}
  #cp label{display:block;margin:6px 0 2px;color:#D9D9D9}
  #cp input[type=text],#cp input[type=password],#cp input[type=number],#cp select{width:100%;box-sizing:border-box;background:#2A2D33;border:1px solid #555;color:#fff;border-radius:6px;padding:6px 8px;font:inherit}
  #cp input[type=number]{width:70px}
  #cp button{background:#FF7E31;color:#fff;border:0;border-radius:6px;padding:6px 12px;font:600 14px "Malgun Gothic",sans-serif;cursor:pointer;margin:6px 6px 0 0}
  #cp button.g{background:#444}
  #cp .st{margin-top:6px;color:#D9D9D9;word-break:break-all;white-space:pre-line}
  #cp .z{border:1px solid #444;border-radius:8px;padding:8px;margin-top:8px}
  #dot{position:fixed;right:0;bottom:66px;width:44px;height:44px;z-index:30;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
  #dot i{display:block;width:11px;height:11px;border-radius:50%;background:rgba(217,217,217,.2)}
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<video id="cam" playsinline muted></video>
<div id="err"><h1 id="errT"></h1><p id="errP"></p><button id="errB">마우스로 해 보기</button></div>

<div id="dot"><i></i></div>
<div id="cp">
  <h2>혼잡도 계수 설정 <span style="color:#888;font-weight:400">(C 닫기)</span></h2>
  <label><input type="checkbox" id="cpOn"> 계수 켜기 (사람 수만 셈, 영상 저장·전송 없음)</label>
  <label>카메라 이름 (여러 대면 서로 달라야 함)</label><input type="text" id="cpName" maxlength="20">
  <label>계수용 카메라</label><select id="cpDev"><option value="">메인 카메라 (게임과 같은 1대)</option></select>
  <label>주기</label><select id="cpInt"><option value="1000">1초</option><option value="2000">2초</option><option value="5000">5초</option></select>
  <label>타일 분할</label><select id="cpTiles"><option value="1">끔</option><option value="2">2x2 (느림)</option></select>
  <label>연산 (다음 실행부터)</label><select id="cpGpu"><option value="1">GPU 우선</option><option value="0">CPU만 (느림, GPU 충돌 시)</option></select>
  <label>사람 위치</label><select id="cpAnchor"><option value="center">상자 가운데</option><option value="foot">발(상자 아래)</option></select>
  <h3>서버 전송 (기본 꺼짐)</h3>
  <label>보낼 곳</label><select id="cpSrv"><option value="off">끔</option></select>
  <div id="cpCodeRow" hidden><label>등급코드</label><input type="password" id="cpCode" autocomplete="off"><button id="cpCodeSave">저장</button></div>
  <div id="cpSavedRow" hidden>등급코드 저장됨 <button class="g" id="cpCodeForget">지우기</button></div>
  <div class="st" id="cpSrvStat"></div>
  <h3>구역</h3>
  <button id="cpAdd">구역 그리기</button><button class="g" id="cpClose">닫기</button><button class="g" id="cpCancel">취소</button>
  <div class="st">화면을 클릭해 꼭짓점을 찍고 첫 점을 다시 누르거나 닫기(Enter). Esc 취소. 구역이 없으면 화면 전체 인원만 센다.</div>
  <div id="cpZones"></div>
  <h3>상태</h3><div class="st" id="cpStat"></div>
</div>
<script type="module">
const W = 1920, H = 1080;
const qs = new URLSearchParams(location.search);
let mouseMode = qs.get('mouse') === '1';
let debug = qs.get('debug') === '1';
let radiusScale = 1, swingBias = 0;   // swingBias: , . 키로 현장 튜닝 (초)
const FONT = '"Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif';
const ORANGE = '#FF7E31', ORANGE_L = '#FF963E', ORANGE_D = '#E5651A';
const ABSENT_SEC = 6;

const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const video = document.getElementById('cam');
const errBox = document.getElementById('err');

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`;
  cv._s = s; cv._ox = (innerWidth - W * s) / 2; cv._oy = (innerHeight - H * s) / 2;
}
addEventListener('resize', fit); fit();

const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const pick = arr => arr[(Math.random() * arr.length) | 0];
let now = performance.now() / 1000;

/* ---------------- 효과음 (WebAudio 합성) ---------------- */
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (ac && ac.state === 'suspended') ac.resume().catch(() => { }); return ac; }
function tone(f, d, type = 'sine', vol = .16, slide = 0, delay = 0) {
  const a = audio(); if (!a) return; const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, vol = .2, f0 = 1500, f1 = 1500, q = .8, type = 'bandpass', delay = 0) {
  const a = audio(); if (!a) return; const t = a.currentTime + delay;
  const buf = a.createBuffer(1, Math.max(1, (a.sampleRate * d) | 0), a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
  const n = a.createBufferSource(); n.buffer = buf;
  const bp = a.createBiquadFilter(); bp.type = type; bp.Q.value = q; bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + d);
  const g = a.createGain(); g.gain.value = vol; n.connect(bp).connect(g).connect(a.destination); n.start(t);
}
const sfx = {
  tap() { tone(520, .09, 'square', .1); tone(880, .14, 'square', .1, 0, .07); },
  start() { tone(392, .12, 'triangle', .16); tone(523, .12, 'triangle', .16, 0, .1); tone(784, .22, 'triangle', .18, 0, .2); },
  tick(p) { tone(300 + p * 700, .08, 'triangle', .06); },
  orb() { tone(440, .3, 'triangle', .16); tone(660, .3, 'triangle', .14, 0, .08); tone(880, .5, 'triangle', .16, 0, .18); noise(.5, .1, 800, 4000, .6); },
  push() { noise(.6, .22, 400, 5000, .7); tone(200, .5, 'sawtooth', .08, 600); },
  fire() { noise(.5, .28, 2500, 500, .6); tone(140, .35, 'square', .1, -60); },
  heart() { [660, 880, 1100, 1320].forEach((f, i) => tone(f, .28, 'sine', .14, 0, i * .07)); },
  tele() { noise(.45, .2, 6000, 600, .5, 'bandpass'); tone(1000, .3, 'sine', .1, -700); },
  no() { tone(240, .28, 'sawtooth', .08, -120); },
  boom() { noise(.9, .35, 1200, 100, .4, 'lowpass'); tone(90, .6, 'sine', .3, -50); [523, 659, 784, 1047].forEach((f, i) => tone(f, .5, 'triangle', .16, 0, .25 + i * .12)); },
  hit() { noise(.3, .32, 2600, 220, .6); tone(160, .22, 'square', .12, -90); },
  hurt() { tone(180, .5, 'sawtooth', .16, -110); noise(.35, .25, 900, 200, .7, 'lowpass'); },
  tired() { tone(420, .7, 'triangle', .14, -300); tone(300, .6, 'triangle', .1, -200, .15); },
  curse() { tone(330, .4, 'sine', .07, -120); },
  boss() { tone(110, .9, 'sawtooth', .12, -40); noise(.8, .15, 400, 120, .6, 'lowpass'); },
  merge() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, .5, 'triangle', .15, 0, i * .06)); noise(.6, .15, 600, 5000, .6); },
  end() { tone(523, .16, 'triangle', .2); tone(659, .16, 'triangle', .2, 0, .14); tone(784, .16, 'triangle', .2, 0, .28); tone(1047, .5, 'triangle', .22, 0, .42); },
};
addEventListener('pointerdown', audio); addEventListener('keydown', audio);

/* ---------------- 가상 손 모델 (21점, 손목=원점, 손바닥 길이 1) ---------------- */
const BONES = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [5, 9], [9, 10], [10, 11], [11, 12], [9, 13], [13, 14], [14, 15], [15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]];
const FING = [
  { b: [-.36, -.92], a: -1.70, l: [.46, .28, .22] }, { b: [0, -1], a: -1.5708, l: [.52, .31, .24] },
  { b: [.34, -.93], a: -1.45, l: [.47, .29, .22] }, { b: [.66, -.78], a: -1.30, l: [.36, .22, .19] }];
// cs: 손가락 4개 접힘 0(편)~1(주먹) 숫자 또는 배열, pinch: 엄지 끝을 검지 끝에 붙이는 정도
function handPose(cs, pinch = 0) {
  if (!Array.isArray(cs)) cs = [cs, cs, cs, cs];
  const P = new Array(21); P[0] = { x: 0, y: 0 };
  FING.forEach((f, i) => {
    const c = cs[i], dx = Math.cos(f.a), dy = Math.sin(f.a), base = 5 + i * 4; let cum = 0;
    P[base] = { x: f.b[0], y: f.b[1] };
    for (let j = 0; j < 3; j++) { cum += f.l[j]; const d = lerp(cum, [.28, .2, -.22][j] * (f.l[0] + f.l[1] + f.l[2]), c); P[base + 1 + j] = { x: f.b[0] + dx * d, y: f.b[1] + dy * d }; }
  });
  const tc = (cs[0] + cs[1] + cs[2] + cs[3]) / 4, b = { x: -.26, y: -.26 };
  const op = { x: b.x + Math.cos(-2.4) * .98, y: b.y + Math.sin(-2.4) * .98 }, cu = { x: -.1, y: -.6 };
  const T0 = { x: lerp(op.x, cu.x, tc), y: lerp(op.y, cu.y, tc) };
  const T = { x: lerp(T0.x, P[8].x, pinch), y: lerp(T0.y, P[8].y, pinch) };
  P[1] = b; P[2] = { x: lerp(b.x, T.x, .4), y: lerp(b.y, T.y, .4) }; P[3] = { x: lerp(b.x, T.x, .72), y: lerp(b.y, T.y, .72) }; P[4] = T;
  return P;
}
const PALM = (() => { const p = handPose(0); return { x: (p[0].x + p[5].x + p[9].x + p[13].x + p[17].x) / 5, y: (p[0].y + p[5].y + p[9].y + p[13].y + p[17].y) / 5 }; })();
const place = (pose, cx, cy, s) => pose.map(p => ({ x: cx + (p.x - PALM.x) * s, y: cy + (p.y - PALM.y) * s }));

/* ---------------- 손 입력: 카메라 / 마우스 시험 ---------------- */
const mouse = { x: 960, y: 640, last: -1e9, shift: false, pose: 0, ax: 740, ay: 640, dual: false, extra: [] };   // pose 0 편 손 / 1 주먹 / 2 하트, (ax,ay) 두 번째 손의 대칭 중심(마우스를 천천히 따라온다), dual 2인 거울
addEventListener('mousemove', e => { mouse.x = (e.clientX - cv._ox) / cv._s; mouse.y = (e.clientY - cv._oy) / cv._s; mouse.last = clk(); });
const mh = { L: 100, Lt: 100, cs: [0, 0, 0, 0], pin: 0 };
addEventListener('wheel', e => { if (!mouseMode) return; mh.Lt = clamp(mh.Lt * (e.deltaY < 0 ? 1.13 : 1 / 1.13), 60, 280); mouse.last = clk(); }, { passive: true });
const POSES = [{ cs: [0, 0, 0, 0], pin: 0 }, { cs: [1, 1, 1, 1], pin: 0 }, { cs: [.45, 1, 1, 1], pin: 1 }];

let hands = [], nextHid = 1;        // 추적 중인 손
let rawHands = null;                // 카메라 모드: {t, list:[pts]}
const cam = { ready: false, vw: 0, vh: 0 };
let hl = null, lastVT = -1, lastTs = 0;
const HAND_MIN = 70, HAND_NEAR = 45;   // 이 크기(손목~중지뿌리 px)보다 작으면 멀다

function metrics(lm) {
  const d = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y), L = Math.max(15, d(0, 9));
  const ext = [d(8, 0) / Math.max(1, d(5, 0)), d(12, 0) / Math.max(1, d(9, 0)), d(16, 0) / Math.max(1, d(13, 0)), d(20, 0) / Math.max(1, d(17, 0))];
  const mean = (ext[0] + ext[1] + ext[2] + ext[3]) / 4;
  return { L, ext, open: clamp((mean - 1.05) / .55, 0, 1), pinch: d(4, 8) / L, curled: ext[1] < 1.4 && ext[2] < 1.4 && ext[3] < 1.4,
    cx: (lm[0].x + lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 5, cy: (lm[0].y + lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 5 };
}
function applyHand(tr, pts) {
  const a = mouseMode ? 1 : .6;
  tr.lm = tr.lm ? tr.lm.map((p, i) => ({ x: lerp(p.x, pts[i].x, a), y: lerp(p.y, pts[i].y, a) })) : pts.map(p => ({ ...p }));
  const m = metrics(tr.lm); tr.m = m;
  tr.c = { x: m.cx, y: m.cy }; tr.L = tr.L ? lerp(tr.L, m.L, a) : m.L; tr.open = tr.open === undefined ? m.open : lerp(tr.open, m.open, mouseMode ? 1 : .6);
  tr.pinch = m.pinch; tr.curled = m.curled; tr.seen = now;
  tr.hist.push({ t: now, x: tr.c.x, y: tr.c.y, L: tr.L, open: tr.open }); while (tr.hist.length && now - tr.hist[0].t > 1.3) tr.hist.shift();
}
function updateInput(dt) {
  let list = [];
  if (mouseMode) {
    if (!mouse.off && now - mouse.last < ABSENT_SEC) {
      const pz = POSES[mouse.pose], k = 1 - Math.exp(-dt * 14);
      mh.L = lerp(mh.L, mh.Lt, k); mh.Lt += (100 - mh.Lt) * dt * .25;
      for (let i = 0; i < 4; i++) mh.cs[i] = lerp(mh.cs[i], pz.cs[i], mouse.pose === 1 || mh.cs[0] > pz.cs[0] ? 1 - Math.exp(-dt * 22) : 1 - Math.exp(-dt * 22));
      mh.pin = lerp(mh.pin, pz.pin, 1 - Math.exp(-dt * 22));
      const pose = handPose(mh.cs, mh.pin);
      list.push(place(pose, mouse.x, mouse.y, mh.L));
      const ka = 1 - Math.exp(-dt * .8); mouse.ax = lerp(mouse.ax, mouse.x, ka); mouse.ay = lerp(mouse.ay, mouse.y, ka);
      if (mouse.shift) list.push(place(pose, 2 * mouse.ax - mouse.x, 2 * mouse.ay - mouse.y, mh.L));
      if (mouse.dual) list.slice().forEach(p => list.push(p.map(q => ({ x: W - q.x, y: q.y }))));
    }
    for (const v of mouse.extra) {   // 시험용 가상 손(__ax.vhand): 자동 시험이 두 사람을 따로 움직인다
      if (v.off) continue; const pz = POSES[v.pose], k = 1 - Math.exp(-dt * 22);
      v.L = lerp(v.L, v.Lt, 1 - Math.exp(-dt * 14)); v.Lt += (100 - v.Lt) * dt * .25;
      for (let i = 0; i < 4; i++) v.cs[i] = lerp(v.cs[i], pz.cs[i], k); v.pin = lerp(v.pin, pz.pin, k);
      const pose = handPose(v.cs, v.pin); list.push(place(pose, v.x, v.y, v.L));
      if (v.shift) list.push(place(pose, 2 * v.ax - v.x, 2 * v.ay - v.y, v.L));
    }
  } else if (rawHands && now - rawHands.t < .35) list = rawHands.list.map(h => h.pts);
  for (const t of hands) t.matched = false;
  // 짝짓기: 모든 (새 손, 기존 손) 쌍을 거리순으로 묶는다(두 사람 손이 가운데서 가까워도 뒤바뀌지 않게, 직전 속도로 위치 예측)
  const cs = list.map(pts => { const m = metrics(pts); return { x: m.cx, y: m.cy }; }), pairs = [], used = new Array(list.length).fill(false);
  for (const t of hands) { const n = t.hist.length, pv = n >= 2 ? { x: t.c.x + (t.hist[n - 1].x - t.hist[n - 2].x), y: t.c.y + (t.hist[n - 1].y - t.hist[n - 2].y) } : t.c;
    cs.forEach((c, i) => { const d = dist(pv, c); if (d < Math.max(450, t.L * 5)) pairs.push([d, i, t]); }); }
  pairs.sort((a, b) => a[0] - b[0]);
  for (const [, i, t] of pairs) { if (used[i] || t.matched) continue; used[i] = true; t.matched = true; applyHand(t, list[i]); }
  for (let i = 0; i < list.length; i++) {
    if (used[i]) continue; const pts = list[i];
    { const t = { id: nextHid++, hist: [], matched: true, lm: null, seen: now, fire: { fd: 0, lastFist: -9 }, heart: 0, openT: 0, swapT: 0, pushR: 0, teleR: 0, fireP: 0, heartP: 0 }; applyHand(t, pts); t.side = t.c.x < 960 ? 0 : 1; hands.push(t); }
  }
  hands = hands.filter(t => now - t.seen < .6);
  for (const t of hands) {   // 2인: 손을 x 위치로 왼쪽/오른쪽 사람에 배정(가운데를 잠깐 넘어도 유지)
    const other = t.side === 0 ? t.c.x > 1080 : t.c.x < 840;
    t.swapT = other ? t.swapT + dt : 0; if (t.swapT > .6) { t.side = 1 - t.side; t.swapT = 0; }
  }
}
const liveHands = () => hands.filter(h => now - h.seen < .25).sort((a, b) => a.id - b.id);

/* ---------------- 카메라 / 손 모델 ---------------- */
function showErr(title, msg) {
  document.getElementById('errT').textContent = title;
  document.getElementById('errP').textContent = msg;
  errBox.style.display = 'flex';
}
document.getElementById('errB').onclick = () => { mouseMode = true; errBox.style.display = 'none'; audio(); };
async function exists(url) { try { const r = await fetch(url, { method: 'HEAD' }); return r.ok; } catch (e) { return false; } }

/* V 키: 게임 카메라를 다음 장치로 바꾼다(선택은 이 브라우저에 기억) */
const CAMK = 'axf_magician_cam';
function camToast(t) {
  let el = document.getElementById('camToast');
  if (!el) { el = document.createElement('div'); el.id = 'camToast'; el.style.cssText = 'position:fixed;left:50%;top:40px;transform:translateX(-50%);z-index:50;padding:14px 28px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font:600 28px Pretendard,sans-serif;pointer-events:none;transition:opacity .3s'; document.body.appendChild(el); }
  el.textContent = t; el.style.opacity = '1'; clearTimeout(camToast.t); camToast.t = setTimeout(() => { el.style.opacity = '0'; }, 2500);
}
async function cycleCamera() {
  if (!navigator.mediaDevices) return;
  const ds = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  if (ds.length < 2) { camToast('연결된 카메라가 1대뿐입니다'); return; }

  const i = ds.findIndex(d => d.deviceId === cur), next = ds[(i + 1) % ds.length];

    const s = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: next.deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    if (old) old.getTracks().forEach(t => t.stop());
    video.srcObject = s; await video.play(); cam.vw = video.videoWidth; cam.vh = video.videoHeight;
    try { localStorage.setItem(CAMK, next.deviceId); } catch (e) { }

}

  if (k === 'c' || k === 'C') { crPanel($('cp').style.display !== 'block'); return; }
  if (k === 'v' || k === 'V') { cycleCamera(); return; }
  if (k === 'd' || k === 'D') debug = !debug;
  else if (k === 'f' || k === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => { }); }
  else if (k === 'p' || k === 'P') { if (S.mode !== 'game') startGame(1, true); else if (G.ph[0] === 'p') setPh('b-intro'); }
  else if (k === 'm' || k === 'M') { if (S.mode !== 'game') startGame(1); }
  else if (k === 'w' || k === 'W') { if (S.mode !== 'game') startGame(2); }
  else if (k === 'b' || k === 'B') { if (mouseMode) { mouse.dual = !mouse.dual; mouse.last = clk(); } }
  else if (k === '1' || k === '2' || k === '3') { if (mouseMode) { mouse.pose = +k - 1; mouse.last = clk(); } }
  else if (k === 'Escape') toIdle();
});

/* ---------------- 메인 루프 ---------------- */
let prev = performance.now() / 1000;
let simT = null;   // 시험용 가상 시계(__ax.sim): 탭이 숨겨져도 한 프레임씩 직접 돌릴 수 있다
const clk = () => simT === null ? performance.now() / 1000 : simT;
function frame() { requestAnimationFrame(frame); if (simT === null) run(performance.now() / 1000); }
function run(t) {
  now = t; const dt = Math.min(.05, now - prev); prev = now; fps = lerp(fps, 1 / Math.max(dt, .001), .05);
  detect(); updateInput(dt);
  for (const h of liveHands()) handFeat(h, dt);
  if (S.mode === 'idle') stepIdle(dt); else if (S.mode === 'select') stepSelect(dt); else if (G) stepGame(dt);
  const wdt = G && G.slow > 0 ? dt * .25 : dt;
  updateP2(wdt); updateFx(wdt);
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 14, rnd(-1, 1) * shake * 14);
  drawBackdrop();
  if (S.mode === 'idle') drawIdle(); else if (S.mode === 'select') drawSelect(); else if (G) drawGame();
  drawP2(); drawFx();
  if (G) drawGameTop();
  if (G && G.ph === 'p-try') {
    const key = PRACTICE[G.pi], need = SP[key].need;
    if (NP() === 2) G.pl.forEach(pl => { if (!pl.done && pl.hands.length < need && G.t > .7) sideMsg(pl.i, `${SIDE[pl.i]}: ${need === 2 ? '두 손을' : '손을'} 보여 주세요`); });
    else { const pl = G.pl[0]; if (pl.hands.length < need && G.t > .7) drawGuideHand(need === 2 && pl.hands.length === 1 ? '두 손을 보여 주세요' : '손을 화면에 보여 주세요'); }
  }
  drawTele();
  ctx.restore();
  drawCrowd();
  if (debug) drawDebug();
  drawDot();
}
requestAnimationFrame(frame);
if (!mouseMode) initCamera();

// 시험용 훅 (캡처·자동 시험)
window.__ax = {
  sim(on = true) { simT = on ? Math.max(performance.now() / 1000, simT || 0, now) : null; prev = clk(); },   // 가상 시계는 뒤로 가지 않는다
  step(n = 1, dt = 1 / 30) { for (let i = 0; i < n; i++) { simT += dt; run(simT); } },
  async runFor(secs, fn, dt = 1 / 30) { const n = Math.round(secs / dt); for (let i = 0; i < n; i++) { if (fn) fn(i * dt, i); simT += dt; run(simT); } },
  setMouse(x, y) { mouse.x = x; mouse.y = y; mouse.last = clk(); },
  anchor(x, y) { mouse.ax = x; mouse.ay = y; },
  hide() { mouse.last = -1e9; }, mouseOff(v = true) { mouse.off = !!v; },
  vhand(o) { const v = Object.assign({ x: 480, y: 600, pose: 0, L: 100, Lt: 100, cs: [0, 0, 0, 0], pin: 0, shift: false, ax: 480, ay: 600, off: false }, o); mouse.extra.push(v); return v; }, vclear() { mouse.extra.length = 0; },
  pose(n) { mouse.pose = n; mouse.last = clk(); }, shift(v) { if (v && !mouse.shift) { mouse.ax = mouse.x + (mouse.x > 960 ? -220 : 220); mouse.ay = mouse.y; } mouse.shift = !!v; }, dual(v) { mouse.dual = !!v; },
  wheel(n) { mh.Lt = clamp(mh.Lt * Math.pow(1.13, n), 60, 280); mouse.last = clk(); },
  state: () => ({ mode: S.mode, ph: G && G.ph, np: G && G.np, pi: G && G.pi, t: G && +G.t.toFixed(2), life: G && G.life, kills: G && G.kills, wave: G && G.wave, grade: G && G.grade, cleared: G && G.cleared, merge: !!(G && G.merge), sel: SEL && SEL.g.slice(),
    pl: G ? G.pl.map(p => ({ en: +p.en.toFixed(1), ex: now < p.exUntil, done: p.done, hands: p.hands.length, orb: +p.orb.charge.toFixed(2), held: p.orb.held, posture: p.posture })) : [],
    en: G ? G.en.map(e => ({ type: e.type, side: e.side, x: e.x | 0, y: e.y | 0, t: +e.t.toFixed(2), hp: e.hp, back: e.back > 0, n: e.m ? e.m.filter(m => m.alive).length : undefined })) : [],
    hands: liveHands().map(h => ({ id: h.id, side: h.side, L: h.L | 0, open: +h.open.toFixed(2), pinch: +h.pinch.toFixed(2) })) }),
  G: () => G, now: () => now, casts: castLog,
  start: startGame, idle: toIdle, select: toSelect, skip() { if (G) setPh('b-intro'); }, setPh: ph => setPh(ph),
  crowd, cr, crowdSet, crowdTick, dotState: () => dotInfo(),
  async crowdImage(url) { const im = new Image(); await new Promise((r, j) => { im.onload = r; im.onerror = j; im.src = url; }); cr.testSrc = { el: im, w: im.naturalWidth, h: im.naturalHeight }; },
  async snap(name) { if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return 0;   // 시험 저장은 로컬 서버 전용
    const b = await new Promise(r => cv.toBlob(r, 'image/png')); await fetch('/save/' + encodeURIComponent(name), { method: 'POST', body: b }); return b.size; },
};
</script>
