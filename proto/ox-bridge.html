cv.addEventListener("pointerdown", function (e) { sw = { x: e.clientX, y: e.clientY, t: performance.now() }; });
cv.addEventListener("pointerup", function (e) {
  if (!sw) return; var dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)) { answer(dx < 0 ? 0 : 1); return; }
  if (Math.abs(dx) < 14 && Math.abs(dy) < 14) { var r = cv.getBoundingClientRect(); answer(e.clientX - r.left < r.width / 2 ? 0 : 1); }
});
cv.addEventListener("pointercancel", function () { sw = null; });
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowLeft" || e.key === "o" || e.key === "O") answer(0);
  else if (e.key === "ArrowRight" || e.key === "x" || e.key === "X") answer(1);
  else if (e.key === "ArrowDown" || e.key === " ") answer(2);
});
$("bStart").addEventListener("click", function () { unlockAudio(); newGame(); });
$("bAgain").addEventListener("click", function () { unlockAudio(); newGame(); });
function sndLabel() { $("snd").innerHTML = "소리<br>" + (sound ? "켬" : "끔"); $("snd").setAttribute("aria-pressed", sound ? "true" : "false"); }
$("snd").addEventListener("click", function () { sound = !sound; try { localStorage.setItem("oxb_snd", sound ? "1" : "0"); } catch (e) {} unlockAudio(); sndLabel(); });
sndLabel();
$("botA").src = BOT_URL; $("botB").src = BOT_URL;

/* 시작 화면 뒤 미리보기 판 */
G = null;
(function preview() {
  var qs = pickQs();
  G = { st: "ready", rows: mkRows(qs), row: 0, on: "deck", lives: R.lives, pts: 0, run: 0, fever: 0, passLeft: R.pass, tLeft: R.sec, ch: { x: 0, y: 0, z: 0, a: null } };
  hud();
})();
resize(); requestAnimationFrame(frame);

/* 테스트용 읽기 훅 (운영 편입 때 삭제) */
window.__bridge = {
  get st() { return G && G.st; }, get row() { return G && G.row; }, get lives() { return G && G.lives; }, get pts() { return G && G.pts; },
  get fever() { return G && G.fever; }, get run() { return G && G.run; }, get tLeft() { return G && G.tLeft; }, get passLeft() { return G && G.passLeft; }, get qShown() { return !!(G && G.qShown); }, get endWhy() { return G && G.endWhy; }, get ok() { return G && G.ok; },
  ans: function () { var r = G && G.rows[G.row + 1]; return r && r.q ? r.q[3] : null; },
  gold: function () { return G ? G.rows.filter(function (r) { return r.gold; }).map(function (r) { return r.i; }) : []; },
  get recs() { return G && G.recs; }
};
