<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>참가자 설문 · 검토용 미리보기</title>
<!-- 261014 (사용자 확정) 참가자 설문 검토용 미리보기 · 고정 주소(토큰 · 코드 없음)
     앱 index.html 을 미리보기 모드(?svreview=1)로 연다 · 화면 · 문항 · 전환은 앱 설문 코드 그대로(앱 설문을 고치면 여기도 그대로)
     폰 = 앱 주소로 바로 넘긴다(키보드 · 스크롤이 실제 폰과 같게) · PC = 폰 폭 390 틀을 가운데에 -->
<script>
(function () {
  var APP = "../index.html?svreview=1";
  var narrow = false;
  try { narrow = window.matchMedia("(max-width: 600px)").matches; } catch (e) {}
  if (narrow) location.replace(APP);
  else window.SVR_APP = APP;
})();
</script>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #EEECE9; color: #4A4744; font: 500 13px/1.4 "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  .cap { margin: 0; }
  iframe { display: block; width: 390px; height: min(844px, calc(100vh - 72px)); border: 0; border-radius: 28px; background: #fff; box-shadow: 0 0 0 10px #1F1F1F, 0 18px 48px rgba(0, 0, 0, 0.22); }
</style>
</head>
<body>
<p class="cap">참가자 설문 · 검토용 미리보기 · 폰 폭 390</p>
<iframe id="app" title="참가자 설문 검토용 미리보기"></iframe>
<script>
  if (window.SVR_APP) document.getElementById("app").src = window.SVR_APP;
</script>
</body>
</html>
