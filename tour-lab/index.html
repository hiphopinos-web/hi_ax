<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<title>1층 둘러보기 시험판</title>
<!-- 가상 1층 둘러보기 v3 시제품(261003) · 앱 본문(index.html)과 따로 · 모형 · 판 그림은 ../assets/tour/ 를 그대로 읽는다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="lab.css?v=lab13">
</head>
<body>
<div id="app">
  <header class="hd">
    <h1>1층 둘러보기 <span class="tag">시험판</span></h1>
    <button type="button" class="hb" id="bHelp">도움말</button>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="1층 로비 3D 모형"></canvas>
    <div class="pins" id="pins"></div>
    <div class="mags" id="mags"></div>
    <button type="button" class="mini" id="mini" aria-label="작은 지도 · 누르면 구역 목록과 큰 지도"></button>
    <div class="cap" id="cap" hidden></div>
    <div class="load" id="load">모형 불러오는 중</div>
    <div class="pad" id="pad" role="application" aria-label="움직이기 패드 · 밀면 그쪽으로 걸어요"><span class="knob" id="knob"></span></div>
    <div class="dest" id="dest" hidden></div>
    <div class="ctl" id="ctl" aria-label="시점 버튼">
      <button class="n" type="button" id="zIn" aria-label="가까이 보기"><span class="c"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="l">확대</span></button>
      <button class="w" type="button" id="rotL" aria-label="시점 왼쪽으로 90도 돌리기"><span class="c"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 3v4h4"/></svg></span><span class="l">좌로 돌기</span></button>
      <span class="dot" aria-hidden="true"></span>
      <button class="e" type="button" id="rotR" aria-label="시점 오른쪽으로 90도 돌리기"><span class="c"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 3v4h-4"/></svg></span><span class="l">우로 돌기</span></button>
      <button class="s" type="button" id="zOut" aria-label="멀리 보기"><span class="c"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></span><span class="l">축소</span></button>
    </div>
    <button type="button" class="gbub" id="gbub" hidden><span id="gbubT"></span><span class="go">판 보기 ▶</span></button>
    <div class="bubble" id="bubble" hidden>아이디어 한 줄을 내면 커피챗을 신청할 수 있어요</div>
    <div class="fps" id="fps" hidden></div>
    <p class="nogl" id="nogl" hidden></p>
  </main>
  <nav class="bar" id="bar">
    <div class="slot"><button type="button" class="cta" id="cta" hidden></button><p class="where" id="where">&nbsp;</p></div>
    <div class="row" id="navRow">
      <button type="button" class="nb" id="bPrev">◀ 이전 구역</button>
      <button type="button" class="nb pri" id="bNext">다음 구역 ▶</button>
    </div>
    <div class="row" id="cafeRow" hidden>
      <button type="button" class="nb pri wide" id="bBack1F">1층으로 돌아가기</button>
    </div>
  </nav>
</div>

<!-- 구역 판 보기 시트 -->
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="구역 판 보기" hidden>
  <header class="sh">
    <span class="sg" id="shSign"></span>
    <b id="shTitle"></b>
    <span class="cnt" id="shCount"></span>
    <button type="button" class="close" id="shClose">닫기</button>
  </header>
  <div class="track-wrap" id="trackWrap"><div class="track" id="track"></div></div>
  <footer class="sf">
    <button type="button" class="nb" id="pPrev">◀ 이전 판</button>
    <button type="button" class="nb" id="pZoom">크게</button>
    <button type="button" class="nb" id="pNext">다음 판 ▶</button>
  </footer>
</section>


<!-- 처음 안내 · 한 문장 -->
<section class="help" id="help" role="dialog" aria-modal="true" aria-label="처음 안내" hidden>
  <div class="hcard">
    <p class="h1t">왼쪽 동그라미로 걷고 오른쪽 버튼으로 돌리기 · 확대를 하며, 「다음 구역」을 누르면 알아서 걸어가요.</p>
    <div class="hdemo" aria-hidden="true"><span class="hbtn">다음 구역 ▶</span><span class="finger"></span></div>
    <label class="rmrow"><span class="t"><b>움직임 줄이기</b><span>어지러우면 켜세요</span></span><input type="checkbox" id="rmChk" role="switch"><span class="sw" aria-hidden="true"></span></label>
    <button type="button" class="nb pri wide" id="hOk">시작하기</button>
  </div>
</section>

<!-- 타자왕 홍보 영상 -->
<section class="vid" id="vid" role="dialog" aria-modal="true" aria-label="1F 타자왕 순위판" hidden>
  <header class="sh"><span class="sg">EVENT</span><b>1F 타자왕 순위판</b><button type="button" class="close" id="vClose">닫기</button></header>
  <div class="vbody" id="vbody"></div>
</section>

<!-- 입장 암전 · 처음부터 검은 화면 -->
<div class="black" id="black" aria-hidden="true"><p class="bt" id="blackT">불러오는 중</p></div>
<div class="fade" id="fade" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/tour/three.min.js"></script>
<script src="../assets/tour/meshopt_decoder.js"></script>
<script src="../assets/tour/GLTFLoader.js"></script>
<script src="../assets/tour/tour-data.js?v=v532a"></script>
<script src="../assets/tour/tour-scene.js?v=v532a"></script>
<script src="lab.js?v=lab14"></script>
</body>
</html>
