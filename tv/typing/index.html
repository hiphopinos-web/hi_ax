<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타자왕 순위판 · AX Festival 2026</title>
<meta name="robots" content="noindex">
<!-- 1F 타자왕 부스 오른쪽 스탠바이미(세로 1080×1920) 광고 루프 (261004 재구성 · 사용자 「타자왕 광고 여기서 진행해」)
     40초 루프 = 광고 18(후킹 2.6 · 실제 게임 몽타주 11.6 · 행동 3.8(참가 방법 = 노트북 화면 QR 찍기 · SPACE로 시작 · 떨어지는 단어 입력) · 장면 사이 = 위에서부터 벽돌이 와르르 무너지는 전환) · 상품 5 · 순위 17(끝 1.4초 무너짐) · 행사일(10/26) 17:00 뒤 = 최종 순위 17 · 상품 5 (261004 「정신 없다」 피드백 뒤 속도 조정)
     게임 몽타주 = 실제 게임 엔진(../../assets/rain-engine.js)의 그리기 함수로 그린다(구름 비 · 자동 터짐 · CLOUD CLEAR · 도트 전환 · BONUS STAGE · 문장 PERFECT)
     데이터 = 공개 순위 type_rank(mode site · n 10 · 읽기 전용 · 관리코드 없음) · 30초 폴링 · 실패 60 → 120초 · 화면이 가려지면 멈춤
     ?promo=1 = 참가자 앱 홍보 칸 · 광고 + 상품 23초 · 서버 호출 0 · ?promo=1&rank=1 = 앱 「타자 순위」 칸용 가벼운 판(광고 + 상품 + 순위 11초 · 60초 폴링 · 순위부터 = &t=23 · 가상 이름은 &fill=1 일 때만)
     promo 본문 서체 = 앱과 같은 CDN 부분 글꼴(1.7MB 자체 글꼴을 받지 않는다) · 주소 뒤 값은 assets/typing.js 맨 위 -->
<link rel="icon" href="../../icons/icon-192.png">
<script>
  if (/[?&]promo=1(&|$)/.test(location.search)) {   /* 홍보 칸 · 1.7MB 자체 글꼴 대신 앱이 이미 받은 CDN 부분 글꼴 */
    document.documentElement.className += " promo" + (/[?&]rank=1(&|$)/.test(location.search) ? " prank" : "");
    var axfL = document.createElement("link"); axfL.rel = "stylesheet"; axfL.href = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"; document.head.appendChild(axfL);
  }
</script>
<style>
  @font-face { font-family: "NeoDunggeunmo"; src: url("../../assets/neodgm.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "AXP"; src: url("../../draw/assets/PretendardVariable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
  :root {
    --night: #1B1712; --bark: #2A2118; --wood: #5E3218; --wood2: #7A3E1C; --tan: #D9A066; --tan2: #E3B884; --cream: #F3E7D8;
    --o100: #FF7E31; --o60: #FFA46E; --o30: #FFCFB0; --deep: #D64524; --btn: #351A0C; --dim: #8A817B; --ink: #000;
    --neo: "NeoDunggeunmo", "AXP", "Malgun Gothic", sans-serif; --pre: "AXP", "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif;
    --dot: 36px; --line4: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--night); }
  body { background: radial-gradient(circle, var(--wood) 0 calc(var(--dot) * .056), transparent calc(var(--dot) * .07)) 50% 50% / var(--dot) var(--dot), var(--night);
    font-family: var(--neo); color: var(--cream); cursor: none; word-break: keep-all; -webkit-font-smoothing: antialiased; }
  body.ptr { cursor: auto; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; margin: -960px 0 0 -540px; overflow: hidden; transform-origin: 50% 50%;
    background: radial-gradient(circle, var(--wood) 0 2px, transparent 2.5px) 0 0 / 36px 36px, var(--night); }
  .sc { position: absolute; inset: 0; display: none; }
  .sc.on { display: block; }
  .sc.gone { visibility: hidden; }   /* 루프 끝 무너짐 · 조각이 덮고 뒤는 빈 무대 */
  .abs { position: absolute; }
  #cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 5; visibility: hidden; pointer-events: none; }
  #cv.on { visibility: visible; }
  #fx { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 15; visibility: hidden; pointer-events: none; }   /* 와르르 전환 · 캔버스 한 장 · 머리(z 20) 아래 */
  #fx.on { visibility: visible; }
  /* 고정 머리 · 어느 3초를 봐도 무엇인지 */
  #top { position: absolute; left: 64px; right: 64px; top: 48px; height: 64px; display: flex; align-items: center; justify-content: space-between; z-index: 20; pointer-events: none; }
  #top b { font-weight: 400; font-size: 52px; line-height: 64px; color: var(--o100); text-shadow: 4px 4px 0 var(--ink); white-space: nowrap; }
  #top span { font-family: var(--pre); font-weight: 600; font-size: 30px; line-height: 40px; color: var(--tan); white-space: nowrap; }
  #net { position: absolute; right: 64px; top: 1860px; font-family: var(--pre); font-size: 26px; line-height: 32px; color: var(--dim); z-index: 20; display: none; }
  body.off #net { display: block; }
  #demoMark { position: absolute; left: 64px; top: 1860px; font-family: var(--pre); font-size: 26px; line-height: 32px; color: var(--dim); z-index: 20; display: none; }
  body.demo #demoMark { display: block; }

  .up { opacity: 0; transform: translateY(40px); transition: opacity .45s cubic-bezier(.2,.7,.2,1), transform .45s cubic-bezier(.2,.7,.2,1); }
  .up.in { opacity: 1; transform: translateY(0); }
  .pop { opacity: 0; transform: scale(.6); transition: opacity .3s cubic-bezier(.2,.7,.2,1), transform .38s cubic-bezier(.2,.9,.3,1.2); }
  .pop.in { opacity: 1; transform: scale(1); }
  .dg { display: block; }
  .dgd { opacity: 0; transform-box: fill-box; transform-origin: center; animation: dgOn .2s ease-out forwards; }
  @keyframes dgOn { 0% { opacity: 0; transform: scale(.3); } 70% { opacity: 1; transform: scale(1.14); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes blk { 0% { opacity: 1; } 50% { opacity: 0; } }

  /* 1 광고 · 후킹(0~2.6초) · 프롬프트 창에 질문이 쳐진다 */
  #hook { left: 64px; top: 720px; width: 952px; font-family: var(--pre); font-weight: 800; font-size: 132px; line-height: 176px; letter-spacing: -3px; color: #fff; display: none; }
  #hook.on { display: block; }
  /* 쳐지는 글자(후킹 질문 · 행동 한 줄) · 커서 = 글자 크기 비례(와르르 전환이 같은 비율로 다시 그린다) */
  .tp p { margin: 0; white-space: nowrap; }
  .tp i { font-style: normal; visibility: hidden; }
  .tp i.on { visibility: visible; }
  .tp i.o { color: var(--o100); }
  .tp i.cur:after { content: ""; display: inline-block; width: .42em; height: .85em; margin-left: .08em; vertical-align: -.09em; background: var(--o100); visibility: visible; }
  .tp.idle i.cur:after { animation: blk .5s steps(1) infinite; }
  .tp p.c0:before { content: ""; display: inline-block; width: .42em; height: .85em; vertical-align: -.09em; background: var(--o100); }
  #hook-k { left: 64px; top: 590px; font-size: 44px; line-height: 52px; color: var(--tan2); display: none; }
  #hook-k.on { display: block; }

  /* 1 광고 · 행동(14.2~18초) · 한 줄이 쳐진 뒤 참가 방법 세 줄(261006 사용자 · 새 진입) = 1 노트북 화면 QR 찍기 · 2 SPACE로 시작 · 3 떨어지는 단어 입력 */
  #act { position: absolute; inset: 0; display: none; }
  #act.on { display: block; }
  #act-h { left: 64px; top: 420px; width: 952px; font-family: var(--pre); font-weight: 800; font-size: 84px; line-height: 108px; letter-spacing: -2px; color: #fff; white-space: nowrap; }
  #act-h i.o { color: var(--o100); }
  .st { left: 64px; width: 952px; height: 232px; }
  #st1 { top: 600px; } #st2 { top: 900px; } #st3 { top: 1200px; }
  .st .bx { position: absolute; left: 0; top: 0; width: 300px; height: 232px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--bark); box-shadow: var(--line4), inset 0 0 0 4px var(--wood), inset 0 0 0 8px var(--tan); }
  .st .no { position: absolute; left: -24px; top: -24px; z-index: 2; width: 80px; height: 80px; background: var(--o100); color: var(--btn); font-size: 60px; line-height: 80px; text-align: center; box-shadow: var(--line4); }
  .st .lb { position: absolute; left: 344px; top: 76px; font-family: var(--pre); font-weight: 800; font-size: 64px; line-height: 80px; letter-spacing: -1px; color: var(--cream); white-space: nowrap; }
  .st .lb b { font-weight: 800; color: var(--o100); }
  /* 1 노트북 화면에 뜬 QR · 찍히면 오렌지 조준선 */
  .ntb { position: relative; width: 200px; height: 136px; margin-top: -28px; background: var(--night); box-shadow: 0 0 0 8px var(--tan2); display: flex; align-items: center; justify-content: center; }
  .ntb:after { content: ""; position: absolute; left: -30px; right: -30px; bottom: -40px; height: 20px; background: var(--tan2); }
  .ntb .scr { width: 104px; height: 104px; background: var(--cream); display: flex; align-items: center; justify-content: center; }
  .ntb svg { width: 88px; height: 88px; display: block; }
  .ntb .fd { position: absolute; left: 36px; top: 4px; width: 128px; height: 128px; visibility: hidden;
    background: linear-gradient(var(--o100), var(--o100)) 0 0 / 32px 8px, linear-gradient(var(--o100), var(--o100)) 0 0 / 8px 32px,
      linear-gradient(var(--o100), var(--o100)) 100% 0 / 32px 8px, linear-gradient(var(--o100), var(--o100)) 100% 0 / 8px 32px,
      linear-gradient(var(--o100), var(--o100)) 0 100% / 32px 8px, linear-gradient(var(--o100), var(--o100)) 0 100% / 8px 32px,
      linear-gradient(var(--o100), var(--o100)) 100% 100% / 32px 8px, linear-gradient(var(--o100), var(--o100)) 100% 100% / 8px 32px; background-repeat: no-repeat; }
  #act.seen .ntb .fd { visibility: visible; }
  /* 2 SPACE 키 · 눌림 */
  .key { width: 220px; height: 112px; margin-top: -12px; display: flex; align-items: center; justify-content: center; background: var(--cream); color: var(--btn); font-size: 44px; letter-spacing: 2px;
    box-shadow: 0 0 0 6px var(--ink), 0 16px 0 6px var(--wood2); transition: transform .08s, box-shadow .08s, background .08s; }
  #act.dn .key { transform: translateY(12px); box-shadow: 0 0 0 6px var(--ink), 0 4px 0 6px var(--wood2); background: var(--o100); }
  /* 3 떨어지는 단어 · 게임 이름표(엔진 rgWordDraw) 모양 · 쳐진 단어는 오렌지가 됐다가 터진다 */
  .wd { position: absolute; top: 0; padding: 0 14px; font-size: 36px; line-height: 52px; background: #FFEBE0; color: var(--btn); box-shadow: 0 0 0 3px var(--ink); white-space: nowrap; }
  .wd.hit { background: var(--o100); box-shadow: 0 0 0 3px var(--ink), 0 0 0 7px var(--cream); }
  .wd.out { visibility: hidden; }
  #wd1 { left: 36px; } #wd2 { left: 184px; }
  #act-s { left: 64px; top: 1530px; width: 952px; text-align: center; font-size: 96px; line-height: 110px; color: var(--o100); text-shadow: 6px 6px 0 var(--deep); }

  /* 2 상품 · 세 상품을 한 번에 · 같은 어두운 판 + 얇은 오렌지 선 하나 · 순위 숫자만 오렌지(1위만 밝게) */
  #pz-h { left: 64px; top: 168px; color: var(--o100); }
  .pz { left: 64px; width: 952px; height: 390px; display: flex; align-items: center; padding: 0 36px 0 30px; gap: 34px; background: var(--bark); box-shadow: inset 0 0 0 4px var(--o100); }
  .pz .no { flex: none; width: 100px; font-size: 160px; line-height: 160px; color: var(--deep); }
  .pz.p1 .no { color: var(--o100); text-shadow: 6px 6px 0 var(--ink); }
  .pz .im { flex: none; width: 310px; height: 310px; background: #fff; display: flex; align-items: center; justify-content: center; }
  .pz .im img { width: 270px; height: 270px; object-fit: contain; display: block; }
  .pz .tx { flex: 1; min-width: 0; font-family: var(--pre); font-weight: 800; font-size: 62px; line-height: 76px; color: var(--cream); letter-spacing: -1px; }
  .pz .tx small { display: block; margin-top: 8px; font-weight: 600; font-size: 42px; line-height: 54px; color: var(--tan2); letter-spacing: 0; }
  #pzs { position: absolute; inset: 0; opacity: 0; transform: translateY(60px); transition: opacity .5s cubic-bezier(.2,.7,.2,1), transform .55s cubic-bezier(.2,.7,.2,1); }
  #pzs.in { opacity: 1; transform: translateY(0); }
  #pz-f { left: 64px; top: 1640px; width: 952px; font-family: var(--pre); font-weight: 800; font-size: 60px; line-height: 76px; color: var(--cream); letter-spacing: -1px; white-space: nowrap; }
  #pz-f b { color: var(--o100); font-weight: 800; }
  #pz-x { left: 64px; top: 1740px; width: 952px; font-family: var(--pre); font-weight: 600; font-size: 40px; line-height: 50px; color: var(--o60); display: none; }

  /* 3 순위 · 앱 hsHtml 판 그대로(1~3위 줄 색 · 261003 사용자 승인) · 등수 · 점수가 위에서부터 펼쳐진 뒤 10위부터 위로 이름이 쳐지고 팡 터진다 */
  #hs-h { left: 64px; top: 150px; font-size: 140px; line-height: 150px; letter-spacing: 4px; white-space: nowrap; color: var(--o100); text-shadow: 6px 6px 0 var(--deep); }
  #hs-sub { left: 64px; top: 318px; font-size: 48px; line-height: 60px; color: var(--cream); white-space: nowrap; }
  #hs-sub.nr { color: var(--o100); }
  #hs-sub.em { color: var(--o60); }
  #hs-list { left: 64px; top: 410px; width: 952px; height: 1096px; background: var(--wood); box-shadow: var(--line4); }
  #hs-in { position: absolute; left: 8px; top: 8px; right: 8px; bottom: 8px; overflow: hidden; }
  .hr { position: absolute; left: 0; top: 0; width: 100%; height: 108px; display: flex; align-items: center; padding: 0 34px; background: var(--bark); font-size: 56px; line-height: 64px;
    transition: left .4s cubic-bezier(.2,.8,.2,1), opacity .3s; }
  .hr.e { background: var(--night); }
  .hr.nil .no { color: var(--dim); }
  .hr .no { flex: none; width: 116px; color: var(--tan); }
  .hr .nm { position: relative; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--cream); }
  .hr .nm.long { font-size: 44px; }
  .hr .nmv { font-weight: 400; }
  .hr .ty { display: none; font-style: normal; padding: 0 14px; background: #FFEBE0; color: var(--btn); box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--o100); }   /* 게임에서 치고 있는 단어 이름표(엔진 rgWordDraw 의 on) */
  .hr .ty:after { content: ""; display: inline-block; width: 6px; height: 46px; margin-left: 4px; vertical-align: -6px; background: var(--o100); animation: blk .5s steps(1) infinite; }
  .hr.w .nmv { visibility: hidden; }
  .hr.w .nm:before { content: ""; position: absolute; left: 0; bottom: 10px; width: 240px; height: 6px; background: currentColor; opacity: .3; }   /* 아직 안 친 이름 자리 */
  .hr.t .nm { overflow: visible; }
  .hr.t .nmv { display: none; }
  .hr.t .ty { display: inline-block; }
  .hr.win { z-index: 2; animation: hsWin 1.3s ease-out 1; }
  @keyframes hsWin { 0% { transform: scale(1); box-shadow: inset 0 0 0 0 transparent; } 12% { transform: scale(1.05); box-shadow: inset 0 0 0 12px var(--cream); } 40% { transform: scale(1.02); box-shadow: inset 0 0 0 6px var(--cream); } 100% { transform: scale(1); box-shadow: inset 0 0 0 0 transparent; } }
  #hs-list.shk { animation: hsShk .36s steps(3) 1; }
  @keyframes hsShk { 0% { transform: translate(0, 0); } 33% { transform: translate(-8px, 6px); } 66% { transform: translate(8px, -6px); } 100% { transform: translate(0, 0); } }
  .hr .sc2 { flex: none; margin-left: 24px; text-align: right; white-space: nowrap; color: var(--tan2); }
  .hr.r1 { background: var(--o100); } .hr.r2 { background: var(--o60); } .hr.r3 { background: var(--o30); }
  .hr.r1 .no, .hr.r1 .nm, .hr.r1 .sc2, .hr.r2 .no, .hr.r2 .nm, .hr.r2 .sc2, .hr.r3 .no, .hr.r3 .nm, .hr.r3 .sc2 { color: var(--btn); }
  .hr.hot { animation: hsNew .9s ease-out 2; }
  @keyframes hsNew { 0%, 100% { box-shadow: inset 0 0 0 0 transparent; } 30% { box-shadow: inset 0 0 0 8px var(--cream); } }
  .hr .tag { flex: none; margin-right: 18px; padding: 0 12px; background: var(--cream); color: var(--btn); font-size: 32px; line-height: 44px; display: none; }
  #hs-you { left: 64px; top: 1560px; width: 952px; font-family: var(--pre); font-weight: 800; font-size: 92px; line-height: 116px; color: var(--o100); letter-spacing: -2px; white-space: nowrap; }
  #hs-end { left: 64px; top: 1720px; font-size: 48px; line-height: 60px; color: var(--tan2); white-space: nowrap; }

  /* 캡처용(?cap=1) · 전환 없이 끝 상태 */
  body.cap *, body.cap .dgd { transition: none !important; animation: none !important; }
  body.cap .dgd { opacity: 1; }
  #ctl { position: fixed; left: 12px; top: 12px; z-index: 99; font: 13px/1.4 system-ui, "Malgun Gothic", sans-serif; color: #eee; background: rgba(0,0,0,.78); padding: 10px; border-radius: 6px; max-width: 260px; display: none; cursor: auto; }
  body.ctl #ctl { display: block; }
  #ctl button { font: inherit; margin: 2px; padding: 3px 7px; background: #333; color: #fff; border: 1px solid #666; cursor: pointer; }
  #ctl button.on { background: #FF7E31; color: #000; border-color: #FF7E31; }

  /* 홍보 칸(?promo=1) · 폰 폭 246~342 칸 = 배율 약 0.23~0.32 · 작은 글자를 키워 화면에서 읽히게 */
  html.promo { --neo: "NeoDunggeunmo", "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif; --pre: "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif; }
  html.promo body { cursor: auto; }
  html.promo #top b { font-size: 60px; }
  html.promo #top span { font-size: 40px; }
  html.promo .pz .tx small { font-size: 44px; line-height: 56px; letter-spacing: -1px; }
  html.promo #hs-end { font-size: 56px; }
  html.promo #demoMark, html.promo #net, html.promo #ctl { display: none !important; }
  html.promo:not(.prank) #s-rank { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="top"><b>AX 타자왕 · 1F</b><span>AX Festival 2026</span></div>
  <div id="demoMark">DEMO · 가짜 순위</div>
  <div id="net">연결 다시 시도 중 · 마지막 순위 표시</div>

  <div class="sc" id="s-ad">
    <div id="hook-k" class="abs">PROMPT &gt;</div>
    <div id="hook" class="abs tp"></div>
    <div id="act">
      <div id="act-h" class="abs tp"></div>
      <div id="st1" class="abs st pop" data-off="0.9"><div class="bx"><div class="ntb"><div class="scr" id="qr"></div><div class="fd"></div></div></div><div class="no">1</div><div class="lb">노트북 화면 <b>QR</b> 찍기</div></div>
      <div id="st2" class="abs st pop" data-off="1.2"><div class="bx"><div class="key">SPACE</div></div><div class="no">2</div><div class="lb"><b>SPACE</b>로 시작</div></div>
      <div id="st3" class="abs st pop" data-off="1.5"><div class="bx"><span id="wd1" class="wd">프롬프트</span><span id="wd2" class="wd">AI</span></div><div class="no">3</div><div class="lb">떨어지는 <b>단어</b> 입력</div></div>
      <div id="act-s" class="abs pop" data-off="2.3">START</div>
    </div>
